tions at any time, even late at night. This is very useful for students who cannot pay for a private <b>tutor</b>. AI can also check students' writing and show them their mistakes, so they can improve. Also, AI is now used in many jobs, so students need to learn how to use it. If schools ban it, students will not be ready for the future.","In my opinion, schools should not ban AI, but they should make clear rules. For example, students can use AI to understand a topic, but they must write their essays themselves. Teachers can also give more tests in class.","In conclusion, AI can be used for <b>cheating</b>, but it is also a useful tool. I believe students should be allowed to use it in a responsible way."]},{"label":"ADVANCED ESSAY (BAND 7)","words":282,"paras":["With the rapid spread of AI <b>chatbots</b>, schools and universities are divided over whether students should be allowed to use them. <b>Although AI tools can be misused for cheating, I believe students should be allowed to use them under clear rules, because they are powerful learning aids.</b>","Those who support a ban raise serious concerns. The most obvious is <b>academic integrity</b>: some students use AI to <b>submit work that is not their own</b>, which makes <b>assessment</b> meaningless. A deeper worry is that if AI <b>does the thinking for them</b>, students will not develop <b>critical thinking</b>, writing skills or the ability to solve problems independently. In addition, AI tools sometimes produce inaccurate information, and inexperienced students may not notice the errors.","However, I find the case for allowing AI more convincing. Firstly, AI can be an excellent <b>learning aid</b>. It can <b>explain difficult ideas</b> in simple language, answer questions <b>at any time of day</b> and provide <b>personalised feedback</b> on students' writing. For students who cannot afford a private <b>tutor</b>, which is common in many countries, this is a genuine opportunity. Secondly, AI is <b>here to stay</b>, and it is increasingly used in the workplace. Banning it would not <b>prepare students for the future</b>; instead, schools should teach them to <b>use it responsibly</b>, including how to <b>check the facts</b>. Finally, a ban would be almost impossible to enforce, since AI tools are available on every smartphone.","To reduce <b>cheating</b>, schools should set clear <b>guidelines</b> and change the way they assess students, using more <b>in-class writing</b> and oral presentations.","In conclusion, although AI poses real risks, I believe it should be embraced in education, provided that students are taught to use it honestly and critically."]},{"label":"BAND 9 ESSAY","words":357,"paras":["The emergence of powerful AI <b>chatbots</b> has confronted schools and universities with a difficult question: should these tools be welcomed as aids to learning or prohibited as instruments of <b>cheating</b>? <b>Although AI tools can be misused for cheating, I believe students should be allowed to use them under clear rules, because they are powerful learning aids.</b>","The arguments for a ban deserve serious attention. The most immediate threat is to <b>academic integrity</b>, since students can now generate entire essays in seconds and <b>submit work that is not their own</b>, rendering traditional homework almost meaningless as a form of <b>assessment</b>. A more fundamental concern is cognitive: education is not merely about producing correct answers but about developing the ability to reason, and if AI <b>does the thinking for them</b>, students may never acquire <b>critical thinking</b> or the capacity to construct an argument independently. Easy answers can also foster <b>intellectual laziness</b>. Moreover, current AI systems are prone to error and sometimes <b>hallucinate</b> facts and sources, which inexperienced learners may accept uncritically.","Nevertheless, I believe that prohibition would be both counterproductive and unrealistic. Used well, AI is a remarkable <b>learning aid</b>: it can <b>explain difficult ideas</b> in accessible language, respond patiently to questions <b>at any time of day</b> and provide <b>personalised feedback</b> on drafts. In countries such as Bangladesh, where private tuition is expensive and classes are large, this could narrow the gap between privileged and disadvantaged students. Furthermore, AI is clearly <b>here to stay</b>, and the ability to use it effectively and critically is rapidly becoming an essential workplace skill; schools that ban it would fail to <b>prepare students for the future</b>. Finally, a ban would be virtually <b>unenforceable</b> when these tools are available on every smartphone.","The sensible response, therefore, is regulation rather than prohibition. Schools should establish transparent <b>guidelines</b> on acceptable use, teach students to verify AI-generated information and change the way they assess learning, placing greater emphasis on <b>in-class writing</b>, oral examinations and project work.","In conclusion, although AI poses genuine risks to academic honesty and independent thinking, these are best addressed by teaching students to <b>use it responsibly</b>, not by pretending it does not exist."]}],"type":"Discuss both views and give your opinion","q":"Some people believe that students should be allowed to use artificial intelligence tools such as chatbots for their schoolwork, while others think these tools should be banned in education. Discuss both views and give your own opinion."},{"n":38,"title":"A cashless society","cat":"Latest Topics (2025–2026)","groups":[{"name":"Advantages","bn":"সুবিধা","items":[{"en":"Digital payments are fast and convenient.","bn":"ডিজিটাল পেমেন্ট দ্রুত ও সুবিধাজনক।"},{"en":"People do not need to carry cash, which reduces theft and robbery.","bn":"মানুষকে নগদ টাকা বহন করতে হয় না, যা চুরি ও ছিনতাই কমায়।"},{"en":"Mobile banking lets families send money to relatives instantly.","bn":"মোবাইল ব্যাংকিং পরিবারগুলোকে তাৎক্ষণিকভাবে আত্মীয়দের কাছে টাকা পাঠাতে দেয়।"},{"en":"Digital records make tax evasion and corruption more difficult.","bn":"ডিজিটাল রেকর্ড কর ফাঁকি ও দুর্নীতি আরও কঠিন করে।"},{"en":"Mobile financial services bring unbanked people into the financial system.","bn":"মোবাইল আর্থিক সেবা ব্যাংক হিসাববিহীন মানুষকে আর্থিক ব্যবস্থায় নিয়ে আসে।"}]},{"name":"Disadvantages","bn":"অসুবিধা","items":[{"en":"Elderly and poor people without smartphones may be excluded.","bn":"স্মার্টফোনবিহীন বয়স্ক ও দরিদ্র মানুষ বাদ পড়তে পারেন।"},{"en":"Online fraud and hacking can cause people to lose their savings.","bn":"অনলাইন প্রতারণা ও হ্যাকিংয়ে মানুষ তাদের সঞ্চয় হারাতে পারে।"},{"en":"Power cuts or network failures can stop all payments.","bn":"বিদ্যুৎ বিভ্রাট বা নেটওয়ার্ক বিকল হলে সব পেমেন্ট বন্ধ হয়ে যেতে পারে।"},{"en":"Card and phone payments make it easy to overspend.","bn":"কার্ড ও ফোনে পেমেন্ট অতিরিক্ত খরচ করা সহজ করে।"},{"en":"Every transaction is recorded, which raises concerns about privacy.","bn":"প্রতিটি লেনদেন রেকর্ড হয়, যা গোপনীয়তা নিয়ে উদ্বেগ তৈরি করে।"}]},{"name":"Evaluation: Which Side Is Stronger?","bn":"মূল্যায়ন — কোন দিক বেশি গুরুত্বপূর্ণ?","items":[{"en":"I believe the advantages of a cashless society, such as convenience, safety and transparency, outweigh its disadvantages.","bn":"আমি মনে করি নগদবিহীন সমাজের সুবিধা, যেমন সুবিধা, নিরাপত্তা ও স্বচ্ছতা, এর অসুবিধার চেয়ে বেশি।"},{"en":"Overall, I think a largely cashless society is positive, but cash should remain available for those who need it.","bn":"সামগ্রিকভাবে, আমার মনে হয় মূলত নগদবিহীন সমাজ ইতিবাচক, তবে যাদের প্রয়োজন তাদের জন্য নগদ অর্থ চালু রাখা উচিত।"}]}],"vocab":[["cashless society","নগদবিহীন সমাজ"],["digital payments","ডিজিটাল পেমেন্ট"],["mobile banking","মোবাইল ব্যাংকিং"],["convenience","সুবিধা"],["transactions","লেনদেন"],["tax evasion","কর ফাঁকি"],["corruption","দুর্নীতি"],["fraud","প্রতারণা"],["hacking","হ্যাকিং"],["privacy","গোপনীয়তা"],["elderly","বয়স্ক"],["internet access","ইন্টারনেট সংযোগ"],["financial inclusion","আর্থিক অন্তর্ভুক্তি"],["overspending","অতিরিক্ত খরচ"]],"phrases":[["at the tap of a phone","ফোনে এক ট্যাপে"],["carry large amounts of cash","বেশি নগদ টাকা বহন করা"],["leave a digital record","ডিজিটাল রেকর্ড রেখে যাওয়া"],["send money instantly","তাৎক্ষণিকভাবে টাকা পাঠানো"],["be left behind","পিছিয়ে পড়া"],["lose track of spending","খরচের হিসাব হারিয়ে ফেলা"],["in the event of a power cut","বিদ্যুৎ চলে গেলে"],["fall victim to","... এর শিকার হওয়া"],["keep cash as a backup","বিকল্প হিসেবে নগদ রাখা"],["a double-edged sword","দুদিকে ধারওয়ালা তলোয়ার"]],"sents":[{"en":"Digital payments allow people to pay at the tap of a phone.","bn":"ডিজিটাল পেমেন্ট মানুষকে ফোনে এক ট্যাপে টাকা দিতে দেয়।"},{"en":"People no longer need to carry large amounts of cash, which reduces theft.","bn":"মানুষকে আর বেশি নগদ টাকা বহন করতে হয় না, যা চুরি কমায়।"},{"en":"In Bangladesh, mobile banking allows families to send money instantly to relatives in villages.","bn":"বাংলাদেশে মোবাইল ব্যাংকিং পরিবারগুলোকে গ্রামের আত্মীয়দের কাছে তাৎক্ষণিকভাবে টাকা পাঠাতে দেয়।"},{"en":"Every digital payment leaves a digital record, which makes tax evasion and corruption harder.","bn":"প্রতিটি ডিজিটাল পেমেন্ট ডিজিটাল রেকর্ড রেখে যায়, যা কর ফাঁকি ও দুর্নীতি কঠিন করে।"},{"en":"However, elderly and poor people without smartphones may be left behind.","bn":"তবে স্মার্টফোনবিহীন বয়স্ক ও দরিদ্র মানুষ পিছিয়ে পড়তে পারেন।"},{"en":"Many people fall victim to online fraud and hacking.","bn":"অনেকে অনলাইন প্রতারণা ও হ্যাকিংয়ের শিকার হন।"},{"en":"When paying by card, it is easy to lose track of spending.","bn":"কার্ডে পেমেন্ট করার সময় খরচের হিসাব হারিয়ে ফেলা সহজ।"},{"en":"In the event of a power cut or network failure, digital payments stop working.","bn":"বিদ্যুৎ চলে গেলে বা নেটওয়ার্ক বিকল হলে ডিজিটাল পেমেন্ট কাজ করে না।"}],"xvocab":[["bKash","বিকাশ (মোবাইল আর্থিক সেবা)"],["surveillance","নজরদারি"],["unbanked","ব্যাংক হিসাববিহীন"],["cybersecurity","সাইবার নিরাপত্তা"],["shadow economy","ছায়া অর্থনীতি"],["contactless","স্পর্শবিহীন"],["system outage","সিস্টেম বিকল হওয়া"],["money laundering","অর্থ পাচার"]],"xsents":[{"en":"Services such as bKash have brought millions of unbanked people into the financial system.","bn":"বিকাশের মতো সেবা লাখ লাখ ব্যাংক হিসাববিহীন মানুষকে আর্থিক ব্যবস্থায় এনেছে।"},{"en":"A cashless economy shrinks the shadow economy and reduces money laundering.","bn":"নগদবিহীন অর্থনীতি ছায়া অর্থনীতি সংকুচিত করে এবং অর্থ পাচার কমায়।"},{"en":"Some people worry about government and corporate surveillance of their spending.","bn":"কেউ কেউ তাদের খরচের ওপর সরকার ও কোম্পানির নজরদারি নিয়ে চিন্তিত।"},{"en":"Strong cybersecurity is essential if cash disappears.","bn":"নগদ অর্থ হারিয়ে গেলে শক্তিশালী সাইবার নিরাপত্তা অপরিহার্য।"}],"essays":[{"label":"BASIC ESSAY (BAND 5–6)","words":263,"paras":["Nowadays, many people pay by card or mobile phone instead of using cash. <b>Overall, I think a largely cashless society is positive, but cash should remain available for those who need it.</b>","There are some disadvantages of a <b>cashless society</b>. Firstly, some people, especially old people and poor people in villages, do not have smartphones or bank accounts, or they do not know how to use them. If there is no cash, life will be very difficult for them. Secondly, digital money can be stolen by hackers, and many people are cheated by fake phone calls and messages. Thirdly, when there is no electricity or internet, people cannot pay. Also, some people spend too much money because paying by card or phone feels easy.","However, the advantages are greater. The first advantage is <b>convenience</b>. People can pay for things, pay bills and send money quickly with their phone. For example, in Bangladesh, many workers in Dhaka send money to their families in villages with <b>bKash</b> in a few seconds. The second advantage is safety. People do not need to carry a lot of cash, so there is less robbery. The third advantage is that <b>digital payments</b> are recorded, so it is harder for people to avoid paying tax or to take bribes.","However, the government should make sure that everyone can use <b>digital payments</b>, and it should keep some cash available.","In conclusion, a <b>cashless society</b> has some problems, like <b>fraud</b> and difficulties for old people. However, I believe the advantages, such as <b>convenience</b>, safety and less <b>corruption</b>, are greater than the disadvantages."]},{"label":"ADVANCED ESSAY (BAND 7)","words":279,"paras":["In many parts of the world, cash is gradually being replaced by card and mobile payments. <b>Overall, I think a largely cashless society is positive, but cash should remain available for those who need it.</b>","The disadvantages should not be ignored. The most serious is exclusion: <b>elderly</b> and poor people without smartphones, bank accounts or digital skills may <b>be left behind</b> if cash disappears. Security is another concern, as many people <b>fall victim to</b> online <b>fraud</b> and <b>hacking</b>, and scams via fake messages have become common. In addition, digital systems depend on electricity and networks, so <b>in the event of a power cut</b> or network failure, people may be unable to buy even basic goods. Finally, when paying by card, it is easy to <b>lose track of spending</b>, which can lead to debt.","Nevertheless, the advantages are more significant. <b>Digital payments</b> are extremely convenient, allowing people to pay bills, shop and transfer money <b>at the tap of a phone</b>. In Bangladesh, <b>mobile banking</b> services such as <b>bKash</b> have transformed the lives of millions, allowing families to <b>send money instantly</b> to relatives in villages and bringing many <b>unbanked</b> people into the financial system. Cashless payments are also safer, since people no longer need to <b>carry large amounts of cash</b>. Moreover, every transaction <b>leaves a digital record</b>, which makes <b>tax evasion</b> and <b>corruption</b> much harder and helps governments collect revenue.","The drawbacks can be reduced if governments invest in digital education and <b>cybersecurity</b>, and ensure that cash remains available as a backup.","In conclusion, although a <b>cashless society</b> carries some risks, I believe its benefits in terms of <b>convenience</b>, safety and transparency outweigh them, as long as no one is excluded."]},{"label":"BAND 9 ESSAY","words":358,"paras":["In many economies, from Sweden to China and increasingly Bangladesh, physical cash is steadily giving way to card and mobile payments. <b>Overall, I think a largely cashless society is positive, but cash should remain available for those who need it.</b>","The drawbacks of abandoning cash are real, and they fall most heavily on the vulnerable. <b>Elderly</b> people, the rural poor and those without smartphones or digital skills risk <b>being left behind</b> in a system designed for the connected majority. Security is a further concern: as money becomes digital, so does crime, and many people <b>fall victim to</b> online <b>fraud</b>, phishing and <b>hacking</b>. The resilience of the system itself is also questionable, since <b>in the event of a power cut</b>, network failure or cyberattack, people could find themselves unable to buy food or medicine. There are subtler costs as well. <b>Digital payments</b> make it easy to <b>lose track of spending</b>, encouraging <b>overspending</b>, and because every transaction is recorded, civil liberties campaigners warn of increasing <b>surveillance</b> of citizens' private lives by governments and corporations.","Nevertheless, I believe these risks are outweighed by the benefits. The <b>convenience</b> of paying <b>at the tap of a phone</b> is considerable, saving time for consumers and businesses alike. More importantly, in developing countries <b>digital payments</b> have driven <b>financial inclusion</b> on an unprecedented scale: in Bangladesh, mobile financial services such as <b>bKash</b> have brought millions of previously <b>unbanked</b> people into the formal economy, allowing migrant workers to <b>send money instantly</b> to their families and enabling small traders to receive payments securely. Cashless systems are also safer, since <b>carrying large amounts of cash</b> invites theft. Perhaps most significantly, because digital <b>transactions</b> leave a traceable record, they shrink the <b>shadow economy</b>, making <b>tax evasion</b>, bribery and <b>money laundering</b> considerably harder, which strengthens public finances and governance.","The key, therefore, is to manage the transition carefully by investing in <b>cybersecurity</b> and digital literacy and by ensuring that cash remains legal tender as a backup for those who depend on it.","In conclusion, while a <b>cashless society</b> poses genuine risks, its advantages in <b>convenience</b>, inclusion and transparency are, on balance, greater, provided that no one is excluded along the way."]}],"type":"Advantages and disadvantages","q":"In many countries, people are using cash less and less, and paying by card or mobile phone instead. Do the advantages of a cashless society outweigh the disadvantages?"},{"n":39,"title":"Social media for children under 16","cat":"Latest Topics (2025–2026)","groups":[{"name":"Reasons to Agree","bn":"একমত হওয়ার কারণ","items":[{"en":"Social media is designed to be addictive and harms children's sleep and studies.","bn":"সামাজিক মাধ্যম আসক্তিকর করে তৈরি এবং শিশুদের ঘুম ও পড়াশোনার ক্ষতি করে।"},{"en":"Constant comparison online damages teenagers' self-esteem.","bn":"অনলাইনে অবিরাম তুলনা কিশোরদের আত্মসম্মানের ক্ষতি করে।"},{"en":"Children are exposed to cyberbullying, harmful content and online predators.","bn":"শিশুরা অনলাইন হয়রানি, ক্ষতিকর বিষয়বস্তু ও অনলাইন অপরাধীদের সংস্পর্শে আসে।"},{"en":"A national law removes peer pressure, because no child is left out.","bn":"জাতীয় আইন সমবয়সীদের চাপ দূর করে, কারণ কোনো শিশু বাদ পড়ে না।"},{"en":"A legal age limit supports parents who want to set rules.","bn":"আইনি বয়সসীমা নিয়ম নির্ধারণ করতে চাওয়া বাবা-মাকে সহায়তা করে।"}]},{"name":"Reasons to Disagree","bn":"দ্বিমত পোষণের কারণ","items":[{"en":"Many children will simply lie about their age to get around the ban.","bn":"অনেক শিশু নিষেধাজ্ঞা এড়াতে সহজেই বয়স নিয়ে মিথ্যা বলবে।"},{"en":"Social media helps teenagers stay in touch with friends and family.","bn":"সামাজিক মাধ্যম কিশোরদের বন্ধু ও পরিবারের সঙ্গে যোগাযোগ রাখতে সাহায্য করে।"},{"en":"Young people can learn useful skills and information online.","bn":"তরুণরা অনলাইনে উপযোগী দক্ষতা ও তথ্য শিখতে পারে।"},{"en":"Parents, not governments, should decide what is right for their children.","bn":"সরকার নয়, বাবা-মায়েরই ঠিক করা উচিত তাদের সন্তানের জন্য কী ভালো।"},{"en":"Teaching digital literacy may be more effective than a complete ban.","bn":"সম্পূর্ণ নিষেধাজ্ঞার চেয়ে ডিজিটাল সাক্ষরতা শেখানো বেশি কার্যকর হতে পারে।"}]},{"name":"Evaluation: My Answer","bn":"মূল্যায়ন — আমার উত্তর","items":[{"en":"I largely agree that children under 16 should be banned from social media, because the risks to their mental health and safety are too great.","bn":"আমি মূলত একমত যে ১৬ বছরের কম বয়সী শিশুদের সামাজিক মাধ্যম ব্যবহার নিষিদ্ধ করা উচিত, কারণ তাদের মানসিক স্বাস্থ্য ও নিরাপত্তার ঝুঁকি অনেক বেশি।"},{"en":"I strongly agree with such a ban, since social media platforms are designed to be addictive and children cannot protect themselves.","bn":"আমি এমন নিষেধাজ্ঞার সঙ্গে দৃঢ়ভাবে একমত, কারণ সামাজিক মাধ্যম আসক্তিকর করে তৈরি এবং শিশুরা নিজেদের রক্ষা করতে পারে না।"}]}],"vocab":[["social media","সামাজিক মাধ্যম"],["age limit","বয়সসীমা"],["mental health","মানসিক স্বাস্থ্য"],["addictive","আসক্তিকর"],["cyberbullying","অনলাইন হয়রানি"],["body image","দেহ নিয়ে ধারণা"],["self-esteem","আত্মসম্মান"],["age verification","বয়স যাচাই"],["parental control","অভিভাবকীয় নিয়ন্ত্রণ"],["enforce","প্রয়োগ করা"],["tech companies","প্রযুক্তি কোম্পানি"],["harmful content","ক্ষতিকর বিষয়বস্তু"],["freedom","স্বাধীনতা"],["digital skills","ডিজিটাল দক্ষতা"]],"phrases":[["designed to be addictive","আসক্তিকর করে তৈরি"],["compare themselves to others","নিজেকে অন্যদের সঙ্গে তুলনা করা"],["at a vulnerable age","ঝুঁকিপূর্ণ বয়সে"],["find a way around","উপায় বের করে এড়িয়ে যাওয়া"],["lie about their age","বয়স নিয়ে মিথ্যা বলা"],["hold companies responsible","কোম্পানিগুলোকে দায়ী করা"],["stay in touch with friends","বন্ধুদের সঙ্গে যোগাযোগ রাখা"],["a clear message","স্পষ্ট বার্তা"],["take the pressure off parents","বাবা-মায়ের ওপর থেকে চাপ কমানো"],["learn to use it safely","নিরাপদে ব্যবহার করতে শেখা"]],"sents":[{"en":"Australia became one of the first countries to ban social media for children under 16.","bn":"অস্ট্রেলিয়া ১৬ বছরের কম বয়সীদের জন্য সামাজিক মাধ্যম নিষিদ্ধ করা প্রথম দেশগুলোর একটি।"},{"en":"Social media apps are designed to be addictive.","bn":"সামাজিক মাধ্যম অ্যাপগুলো আসক্তিকর করে তৈরি।"},{"en":"Teenagers often compare themselves to others online, which harms their self-esteem.","bn":"কিশোররা প্রায়ই অনলাইনে নিজেকে অন্যদের সঙ্গে তুলনা করে, যা তাদের আত্মসম্মানের ক্ষতি করে।"},{"en":"Children are exposed to cyberbullying and harmful content at a vulnerable age.","bn":"শিশুরা ঝুঁকিপূর্ণ বয়সে অনলাইন হয়রানি ও ক্ষতিকর বিষয়বস্তুর সংস্পর্শে আসে।"},{"en":"A legal age limit would take the pressure off parents.","bn":"আইনি বয়সসীমা বাবা-মায়ের ওপর থেকে চাপ কমাবে।"},{"en":"However, many children simply lie about their age to find a way around the rules.","bn":"তবে অনেক শিশু নিয়ম এড়াতে সহজেই বয়স নিয়ে মিথ্যা বলে।"},{"en":"Social media also helps teenagers stay in touch with friends and learn new things.","bn":"সামাজিক মাধ্যম কিশোরদের বন্ধুদের সঙ্গে যোগাযোগ রাখতে ও নতুন জিনিস শিখতেও সাহায্য করে।"},{"en":"Laws should hold tech companies responsible for checking users' ages.","bn":"আইনের উচিত ব্যবহারকারীর বয়স যাচাইয়ের জন্য প্রযুক্তি কোম্পানিগুলোকে দায়ী করা।"}],"xvocab":[["anxiety and depression","উদ্বেগ ও বিষণ্নতা"],["infinite scroll","অবিরাম স্ক্রল"],["peer pressure","সমবয়সীদের চাপ"],["loophole","ফাঁকফোকর"],["digital literacy","ডিজিটাল সাক্ষরতা"],["online predators","অনলাইন অপরাধী"],["collective action","সম্মিলিত পদক্ষেপ"],["developmental stage","বিকাশের পর্যায়"]],"xsents":[{"en":"Rates of anxiety and depression among teenagers have risen alongside smartphone use.","bn":"স্মার্টফোন ব্যবহারের পাশাপাশি কিশোরদের মধ্যে উদ্বেগ ও বিষণ্নতার হার বেড়েছে।"},{"en":"Features such as infinite scroll keep young users online for hours.","bn":"অবিরাম স্ক্রলের মতো ফিচার অল্পবয়সী ব্যবহারকারীদের ঘণ্টার পর ঘণ্টা অনলাইনে রাখে।"},{"en":"A national law solves the problem of peer pressure, because no child is left out.","bn":"জাতীয় আইন সমবয়সীদের চাপের সমস্যা সমাধান করে, কারণ কোনো শিশু বাদ পড়ে না।"},{"en":"Schools should still teach digital literacy before children join social media.","bn":"শিশুরা সামাজিক মাধ্যমে যুক্ত হওয়ার আগে স্কুলকে এখনো ডিজিটাল সাক্ষরতা শেখাতে হবে।"}],"essays":[{"label":"BASIC ESSAY (BAND 5–6)","words":266,"paras":["Some countries have made laws that do not allow children under 16 to use <b>social media</b>. <b>I largely agree that children under 16 should be banned from social media, because the risks to their mental health and safety are too great.</b>","The first reason is that <b>social media</b> can harm children's <b>mental health</b>. Apps like TikTok and Instagram are made to keep people using them for a long time. Many children spend hours every day on their phones, so they sleep less and study less. They also see photos of other people who look perfect and rich, and they feel bad about themselves. Doctors say that many teenagers feel sad and worried because of <b>social media</b>.","The second reason is safety. On <b>social media</b>, children can see violent or unsuitable content. Some children are bullied online, and this can be very painful. There are also dangerous adults who try to contact children. Children are too young to protect themselves from these dangers.","The third reason is that a law helps parents. Many parents do not want their children to use <b>social media</b>, but children say, \"All my friends use it.\" If there is a law, no child can use it, so children will not feel left out.","Some people say that children can <b>lie about their age</b>, so the law will not work. This is a problem, but companies should check the age of users more carefully.","In conclusion, I mostly agree that all countries should ban <b>social media</b> for children under 16. It will protect their <b>mental health</b> and safety, and it will help parents."]},{"label":"ADVANCED ESSAY (BAND 7)","words":282,"paras":["Several countries, including Australia, have recently introduced laws banning <b>social media</b> for children under 16, and there is debate about whether others should follow. <b>I largely agree that children under 16 should be banned from social media, because the risks to their mental health and safety are too great.</b>","The main reason for my view is the impact on <b>mental health</b>. <b>Social media</b> apps are <b>designed to be addictive</b>, using features such as endless feeds and notifications to keep users online for hours. As a result, many teenagers sleep less, concentrate less at school and spend less time with family and friends. Moreover, young people constantly <b>compare themselves to others</b> online, which can damage their <b>self-esteem</b> and <b>body image</b>. Many studies have linked heavy <b>social media</b> use to rising <b>anxiety and depression</b> among teenagers.","Secondly, children are exposed to serious risks <b>at a vulnerable age</b>, including <b>cyberbullying</b>, <b>harmful content</b> and contact with dangerous adults. Most children lack the maturity to recognise and deal with these dangers. A national law also helps parents: when <b>social media</b> is banned for everyone under 16, children no longer feel left out, which <b>takes the pressure off parents</b> who want to set limits.","Critics argue that such bans are difficult to <b>enforce</b>, since many children simply <b>lie about their age</b>, and that <b>social media</b> also helps teenagers <b>stay in touch with friends</b> and learn new skills. These points are valid, but they suggest that <b>tech companies</b> should be held responsible for <b>age verification</b>, not that children should be left unprotected.","In conclusion, although a ban will not be perfect, I believe all countries should introduce an <b>age limit</b> of 16 to protect children's <b>mental health</b> and safety."]},{"label":"BAND 9 ESSAY","words":371,"paras":["Following Australia's lead, a number of governments are now considering legislation to prevent children under 16 from using <b>social media</b>. I largely agree that children under 16 should be banned from <b>social media</b>, because the risks to their <b>mental health</b> and safety are too great, although such laws must be carefully designed.","The most compelling argument concerns <b>mental health</b>. <b>Social media</b> platforms are not neutral tools; they are <b>designed to be addictive</b>, employing techniques such as <b>infinite scroll</b>, algorithmic feeds and constant notifications to maximise the time users spend online. Adolescents, whose capacity for self-regulation is still developing, are particularly susceptible. The consequences are well documented: lost sleep, reduced concentration and, most worryingly, a marked rise in <b>anxiety and depression</b> that has coincided with the spread of smartphones. The culture of constant comparison, in which teenagers measure themselves against filtered and curated images, is especially damaging to <b>self-esteem</b> and <b>body image</b> at this sensitive <b>developmental stage</b>.","Secondly, <b>social media</b> exposes children to serious dangers <b>at a vulnerable age</b>. <b>Cyberbullying</b> can follow a child home and continue around the clock, <b>harmful content</b> promoting self-harm or extreme dieting is only a few clicks away, and <b>online predators</b> exploit the anonymity these platforms provide. Expecting young children to navigate these risks alone is unrealistic. A legal <b>age limit</b> also addresses a problem that individual families cannot solve: <b>peer pressure</b>. When \"everyone else\" is online, parents who refuse access risk isolating their child; a national law applies to all, so no child is left out, and it <b>takes the pressure off parents</b>.","Opponents object that such bans are easily circumvented, as children will <b>lie about their age</b>, and that <b>social media</b> offers genuine benefits, from maintaining friendships to accessing educational content. These objections are reasonable but not decisive. Imperfect enforcement is true of many laws, including age limits on alcohol, and the solution is to hold <b>tech companies</b> responsible for robust <b>age verification</b>. Meanwhile, schools should teach <b>digital literacy</b> so that teenagers are prepared when they do join.","In conclusion, I believe that the evidence of harm justifies a legal minimum age of 16 for <b>social media</b> in every country, provided that the burden of enforcement falls on the companies that profit from young users."]}],"type":"Opinion (Agree / Disagree)","q":"Some countries have introduced laws that ban children under the age of 16 from using social media. To what extent do you agree that all countries should do the same?"}],"ladder":[{"lv":"A1","name":"Beginner","about":"At A1, a learner can only produce very short, isolated sentences using memorised, everyday words. There is no real paragraphing and almost no linking language. This is far below the level needed for the real IELTS Writing Task 2 (which requires at least a B1 essay to score any marks), but it is a useful starting point for absolute beginners who are building the habit of forming an opinion in English.","grammar":["Simple present tense only (is, helps, think, use)","Basic connectors: and, but, because","Short, simple sentences (Subject + Verb + Object)","No complex clauses or passive voice"],"vocab":[["technology","machines and tools like phones and computers","Technology is part of my life."],["help","to make something easier for someone","My phone helps me every day."],["friends","people you like and talk to","I talk to my friends online."],["time","minutes and hours","This saves a lot of time."],["health","how well your body feels","This is bad for their health."],["good/bad","words to say if something is nice or not nice","I think technology is good."],["use","to do something with an object","I use my phone every day."],["think","to have an opinion","I think technology is helpful."]],"mistakes":["Writing only one sentence with no reason (\"Technology is good.\") — always add \"First,\" and a reason.","Forgetting the word \"I\" before \"think\" (\"think technology is good\") — the subject cannot be missing in English.","Mixing up \"good\" and \"well\" — use \"good\" after \"is\" (technology is good), not \"well\".","Forgetting the final period at the end of every sentence.","Starting the conclusion without the fixed phrase \"In conclusion\" — this signal word is very important at A1."],"examiner":["Task Response: at A1 an examiner is not yet scoring the answer, but a clear, direct opinion is always the first skill to build.","Coherence & Cohesion: using \"First\", \"For example\" and \"In conclusion\" in the right place is more important than long sentences.","Lexical Resource: a small number of correctly used words (phone, friends, help) is better than one long word used incorrectly.","Grammatical Range & Accuracy: simple present tense sentences that are grammatically correct are the priority — do not attempt past or future tense yet."],"sents":[{"n":1,"role":"Introduce the topic","purpose":"Open the essay by naming the topic in the simplest possible way, so the reader immediately knows what the essay is about.","pattern":"[Topic] + is/are + [simple describing word].","sample":"Technology is a big part of our lives today."},{"n":2,"role":"Give your opinion","purpose":"State your opinion clearly and simply using the fixed phrase \"I think\". At A1 there is no need to hedge or soften the opinion.","pattern":"I think + [topic] + is + [adjective].","sample":"I think technology is good for us."},{"n":3,"role":"Give your first reason","purpose":"Give one simple reason for your opinion, introduced with the word \"First\".","pattern":"First, + [topic] + helps us + to + [verb].","sample":"First, technology helps us to talk to friends."},{"n":4,"role":"Give an example","purpose":"Support the reason with one short, personal example.","pattern":"For example, + [simple sentence about yourself].","sample":"For example, I use my phone every day."},{"n":5,"role":"Mention a different idea","purpose":"Show basic balance by giving one small problem, introduced with the simple connector \"But\".","pattern":"But + [short problem sentence].","sample":"But some people spend too much time on their phones."},{"n":6,"role":"Explain the problem","purpose":"Add one very short sentence that explains why the problem in Sentence 5 matters.","pattern":"This is not good for + [noun].","sample":"This is not good for their health."},{"n":7,"role":"Finish the essay","purpose":"Close the essay by repeating your opinion, introduced with the fixed phrase \"In conclusion\".","pattern":"In conclusion, I think + [topic] + is + [adjective].","sample":"In conclusion, I think technology is very helpful."}],"alt":["Original: Technology is a big part of our lives today.","Alternative 1: Technology is important in our lives now.","Alternative 2: We use technology every day.","At A1, alternatives simply swap one basic word for another (big → important) or restate the idea with a different simple verb (is a part of → use). Do not try to add new grammar here."],"q":"Is technology good or bad for your life? Give your opinion.","qnote":"A real IELTS question is always longer and more formal than this. This simplified version keeps the same topic (technology and daily life) but uses only basic words and a direct question, which is appropriate for what an A1 learner can understand and respond to.","essay":"Technology is a big part of our lives today. I think technology is good for us. First, technology helps us to talk to friends. For example, I use my phone every day. But some people spend too much time on their phones. This is not good for their health. In conclusion, I think technology is very helpful.","try":"Is the internet good or bad for students? Give your opinion.","check":["Sentence 1: Introduce the topic (The internet is... ).","Sentence 2: Give your opinion (I think... ).","Sentence 3–4: One reason + one example.","Sentence 5–6: One different idea + explanation.","Sentence 7: In conclusion, I think..."]},{"lv":"A2","name":"Elementary","about":"At A2, a learner can link simple sentences with basic connectors (however, for example, one reason) and can describe two sides of a simple topic. Sentences are still short and mostly in the present tense, but the essay now has a recognisable shape: an introduction, two short body ideas, and a conclusion. This is still below the minimum needed for a scored IELTS Task 2 answer, but it is a clear step toward paragraph-level writing.","grammar":["Present simple with time markers (nowadays)","Simple linking words: however, for example, for instance","Modal verb \"can\" to talk about ability/possibility","Basic cause-effect with \"this + verb\""],"vocab":[["communicate","to share information or talk with someone","Technology helps people communicate quickly."],["quickly","in a short time","We can send messages quickly."],["addicted","unable to stop doing something","People can become addicted to their phones."],["relationship","the connection between people","This can affect their relationships."],["problem","something difficult or bad","Technology can cause problems."],["benefit","a good result or advantage","The benefits are greater than the problems."],["convenient","easy to use or do","Online shopping is very convenient."],["nowadays","at the present time, in contrast to the past","Nowadays, everyone uses a smartphone."]],"mistakes":["Overusing \"and\" to join every idea instead of using \"however\" or \"for example\" to show the relationship between ideas.","Writing \"Nowadays\" but then using past tense — after \"nowadays\", use present tenses.","Forgetting to give an example after a reason — \"one reason is that...\" needs support, not just a bare claim.","Confusing \"can\" (ability/possibility) with \"can't\" — check the meaning matches the sentence.","Ending the essay abruptly without \"In conclusion\" to signal the final opinion."],"examiner":["Task Response: two clear ideas (one for each side) with a personal opinion begins to satisfy the basic task requirement.","Coherence & Cohesion: linking words such as \"however\", \"for example\" and \"for instance\" should appear naturally, not be repeated too often.","Lexical Resource: a slightly wider range of everyday vocabulary (addicted, relationships, benefits) shows more control than at A1.","Grammatical Range & Accuracy: the modal verb \"can\" and simple present tense should be used accurately and consistently."],"sents":[{"n":1,"role":"Introduce the topic","purpose":"Open with a simple time expression to sound more natural than a bare statement.","pattern":"Nowadays, + [topic] + is + [adjective] + in our + [noun phrase].","sample":"Nowadays, technology is very important in our daily lives."},{"n":2,"role":"Give your opinion","purpose":"State your opinion using the slightly more formal fixed phrase \"In my opinion\".","pattern":"In my opinion, + [topic] + [verb phrase].","sample":"In my opinion, technology makes life easier."},{"n":3,"role":"Topic sentence for reason 1","purpose":"Start the first body idea with a clear topic sentence using \"One reason is that\".","pattern":"One reason is that + [clause].","sample":"One reason is that technology helps people communicate quickly."},{"n":4,"role":"Give an example","purpose":"Support the reason with a concrete example using \"For instance\".","pattern":"For instance, + [clause].","sample":"For instance, we can send messages in seconds."},{"n":5,"role":"Add a result","purpose":"Add a short result sentence that shows the effect of the example.","pattern":"This + [verb, e.g. saves/helps] + [noun].","sample":"This saves a lot of time."},{"n":6,"role":"Topic sentence for the other side","purpose":"Introduce the second, opposing idea with the connector \"However\" and the reporting phrase \"some people think that\".","pattern":"However, some people think that + [clause].","sample":"However, some people think that technology causes problems."},{"n":7,"role":"Give an example","purpose":"Support the opposing idea with a concrete example.","pattern":"For example, + [clause].","sample":"For example, people can become addicted to their phones."},{"n":8,"role":"Add a result","purpose":"Show a simple negative consequence using the modal verb \"can\".","pattern":"This can + [verb] + [noun phrase].","sample":"This can affect their relationships with family."},{"n":9,"role":"Finish the essay","purpose":"Close by weighing the two sides and giving a final opinion.","pattern":"In conclusion, I believe that + [clause].","sample":"In conclusion, I believe that the benefits of technology are greater than the problems."}],"alt":["Original: Nowadays, technology is very important in our daily lives.","Alternative 1: Today, technology plays a big role in our everyday lives.","Alternative 2: In modern life, we depend on technology a lot.","At A2, alternatives change the time word (nowadays → today/in modern life) and the main verb (is important → plays a big role / depend on), while keeping the sentence short and simple."],"q":"Some people say technology makes life easy. Other people say technology makes life difficult. What do you think?","qnote":"This version introduces the two-sided \"some people... other people...\" pattern that all real IELTS discussion questions use, but keeps the vocabulary and sentence length very simple.","essay":"Nowadays, technology is very important in our daily lives. In my opinion, technology makes life easier. One reason is that technology helps people communicate quickly. For instance, we can send messages in seconds. This saves a lot of time. However, some people think that technology causes problems. For example, people can become addicted to their phones. This can affect their relationships with family. In conclusion, I believe that the benefits of technology are greater than the problems.","try":"Some people think social media is good for young people. Other people disagree. What do you think?","check":["Sentence 1–2: Introduce the topic + give your opinion (Nowadays.../In my opinion...).","Sentence 3–5: One reason, one example, one result.","Sentence 6–8: The other side, one example, one result.","Sentence 9: In conclusion, I believe that..."]},{"lv":"B1","name":"Intermediate","about":"B1 is the lowest level at which a real IELTS Task 2 essay can score reasonably (roughly Band 4–5). The learner can paraphrase the question, state a clear position, organise ideas into two body paragraphs with a topic sentence, example and result in each, and write a two-part conclusion. Linking words become more varied (firstly, as a result, on the other hand) and sentences may contain one subordinate clause.","grammar":["Present perfect (has made, has changed)","Concession clauses with \"although\"","A wider range of linkers: firstly, as a result, on the other hand, for instance","One subordinate clause per sentence is manageable"],"vocab":[["convenient","easy and useful, without extra effort","Technology has made communication more convenient."],["communication","the exchange of information between people","Communication is faster than before."],["video call","a phone or internet call where you can see the other person","People use video calls to see family abroad."],["work-life balance","a healthy amount of time given to both work and personal life","This can lead to a poor work-life balance."],["pressured","made to feel that you must do something","Employees feel pressured to check email at night."],["drawback","a disadvantage or negative point","Every solution has some drawbacks."],["outweigh","to be greater in importance than something else","The benefits outweigh the disadvantages."],["stay in touch","to continue communicating with someone","It is easier to stay in touch with family now."]],"mistakes":["Copying the question word-for-word in Sentence 1 instead of paraphrasing it — examiners want different words, same meaning.","Giving a reason without a specific example — \"technology helps communication\" needs a concrete example like video calls.","Using \"firstly\" but then forgetting a matching \"secondly\" or \"on the other hand\" later in the essay.","Writing a one-sided essay when the question asks to \"discuss both views\" — both sides must be developed, not just the writer's own opinion.","Repeating the exact words from the introduction in the conclusion instead of paraphrasing them."],"examiner":["Task Response: both views must be discussed in reasonable depth, with a clear personal opinion — this is the minimum for a Band 5 Task Response score.","Coherence & Cohesion: each body paragraph should have one central idea, introduced with a clear topic sentence, to avoid the paragraph drifting.","Lexical Resource: topic-specific vocabulary (drawbacks, outweigh, work-life balance) should replace repeated basic words like \"good\" and \"bad\".","Grammatical Range & Accuracy: present perfect (has made) and concession clauses (although) should be used, even if not always perfectly."],"sents":[{"n":1,"role":"Paraphrase the question","purpose":"Open by restating the general topic of the question in different words, rather than copying it directly.","pattern":"It is often said that + [clause].","sample":"It is often said that modern technology has changed the way people live."},{"n":2,"role":"State your thesis","purpose":"Give your overall position in one sentence, using \"although\" to briefly acknowledge the other side before stating your main view.","pattern":"In my opinion, although + [concession clause], + [main opinion clause].","sample":"In my opinion, although technology has some drawbacks, it has mostly made life easier."},{"n":3,"role":"Topic sentence, Body 1","purpose":"Open the first body paragraph with a clear claim introduced by \"Firstly\".","pattern":"Firstly, + [subject] + has + [past participle] + [object].","sample":"Firstly, technology has made communication much faster and more convenient."},{"n":4,"role":"Supporting example","purpose":"Give a specific, real-world example that illustrates the claim in Sentence 3.","pattern":"For example, + [clause].","sample":"For example, people can use video calls to speak to family members who live in other countries."},{"n":5,"role":"Result","purpose":"Explain the positive result of the example, using \"As a result\".","pattern":"As a result, + [clause].","sample":"As a result, staying in touch with loved ones is no longer difficult."},{"n":6,"role":"Topic sentence, Body 2","purpose":"Open the second body paragraph with the opposing view, clearly signalled by \"On the other hand\".","pattern":"On the other hand, some people argue that + [clause].","sample":"On the other hand, some people argue that technology has made life more stressful."},{"n":7,"role":"Supporting example","purpose":"Give a specific example that supports the opposing view.","pattern":"For instance, + [clause].","sample":"For instance, many employees feel pressured to check emails outside working hours."},{"n":8,"role":"Result","purpose":"Explain the negative consequence of the example.","pattern":"This can lead to + [noun phrase].","sample":"This can lead to a poor work-life balance."},{"n":9,"role":"Concluding restatement","purpose":"Begin the conclusion by briefly weighing both sides again, using a concession clause.","pattern":"In conclusion, while + [concession], + [main clause].","sample":"In conclusion, while technology can create some stress, its benefits outweigh its disadvantages."},{"n":10,"role":"Final opinion","purpose":"Close with one direct final sentence stating your overall position.","pattern":"Therefore, I believe that + [clause].","sample":"Therefore, I believe technology has had a mostly positive effect on our lives."}],"alt":["Original: It is often said that modern technology has changed the way people live.","Alternative 1: Many people believe that modern technology has transformed everyday life.","Alternative 2: It is widely believed that new technology has altered how we live.","At B1, paraphrasing uses synonyms (changed → transformed/altered) and swaps the passive reporting phrase (it is often said → many people believe / it is widely believed) while keeping the sentence a similar length."],"q":"Some people believe that technology has made life easier. Other people believe it has made life more difficult. Discuss both opinions and give your own opinion.","qnote":"This is close to the real IELTS wording. \"Discuss both views and give your opinion\" is one of the four standard IELTS Task 2 question types, so B1 learners should start practising with the authentic instruction language.","essay":"It is often said that modern technology has changed the way people live. In my opinion, although technology has some drawbacks, it has mostly made life easier. Firstly, technology has made communication much faster and more convenient. For example, people can use video calls to speak to family members who live in other countries. As a result, staying in touch with loved ones is no longer difficult. On the other hand, some people argue that technology has made life more stressful. For instance, many employees feel pressured to check emails outside working hours. This can lead to a poor work-life balance. In conclusion, while technology can create some stress, its benefits outweigh its disadvantages. Therefore, I believe technology has had a mostly positive effect on our lives.","try":"Some people believe that social media has made communication between people easier. Others believe it has made real communication more difficult. Discuss both views and give your opinion.","check":["Sentence 1–2: Paraphrase the question + give a thesis with a concession (although...).","Sentence 3–5: Body 1 — topic sentence, example, result.","Sentence 6–8: Body 2 — opposing topic sentence, example, result.","Sentence 9–10: Conclusion — restate with concession + final opinion."]},{"lv":"B2","name":"Upper-Intermediate","about":"B2 corresponds roughly to IELTS Band 5.5–6.5. The learner can write a three-sentence introduction that includes background, both views and a clear thesis, develop each body paragraph with a topic sentence plus two supporting points, and write a two-sentence conclusion that both summarises and gives a final, slightly more nuanced opinion (\"when used responsibly\"). Sentences begin to combine two clauses more naturally, and a wider academic linking vocabulary appears (undeniably, moreover, similarly).","grammar":["Present perfect passive (has become embedded)","Two-clause sentences joined with while / others","Academic linkers: moreover, similarly, on one hand / on the other hand","Present participle clauses (feeling anxious)"],"vocab":[["embedded","firmly and deeply established as part of something","Technology has become deeply embedded in daily life."],["convenience","the quality of being easy to use with little effort","Online banking is valued for its convenience."],["notification","an alert or message sent by an app or device","Constant notifications can overwhelm people."],["overwhelm","to affect someone with too much of something at once","The volume of information can overwhelm users."],["responsibly","in a sensible, careful way","Technology is beneficial when used responsibly."],["complexity","the state of having many connected, complicated parts","Technology has added new complexity to daily routines."],["instant access","the ability to get something immediately","Smartphones give instant access to information."],["undeniably","in a way that cannot be argued against","Technology has undeniably made tasks more convenient."]],"mistakes":["Writing a three-sentence introduction that only paraphrases the question without adding a clear thesis sentence.","Using \"moreover\" and \"furthermore\" in the same paragraph without variety — vary the linking words used.","Giving two examples that are too similar (e.g. two banking examples) instead of choosing examples from different areas of life.","Writing body paragraphs of very different lengths — aim for roughly balanced paragraphs.","Adding a new idea in the conclusion that was never mentioned in the body paragraphs."],"examiner":["Task Response: a fully extended response to both parts of the question, with a clear position maintained throughout, is expected for Band 6+.","Coherence & Cohesion: paragraphing should be logical, with a clear central topic per paragraph and a range of cohesive devices used flexibly.","Lexical Resource: less common vocabulary (embedded, convenience, overwhelm) used with some flexibility and only occasional inaccuracy is expected.","Grammatical Range & Accuracy: a mix of simple and complex sentence structures, with good control, though minor errors are still acceptable."],"sents":[{"n":1,"role":"Background statement","purpose":"Open with a general statement about the role of technology in modern life.","pattern":"In the modern era, + [subject] + has become + [adjective phrase].","sample":"In the modern era, technology has become deeply embedded in almost every aspect of daily life."},{"n":2,"role":"Present both views","purpose":"Summarise both sides of the debate in a single balanced sentence.","pattern":"While some people argue that + [clause], others believe that + [clause].","sample":"While some people argue that this has simplified everyday tasks, others believe it has introduced new complications."},{"n":3,"role":"Thesis / essay outline","purpose":"Tell the reader exactly how the essay will be organised before the opinion is given in full.","pattern":"This essay will discuss both viewpoints before presenting my own opinion.","sample":"This essay will discuss both viewpoints before presenting my own opinion."},{"n":4,"role":"Topic sentence, Body 1","purpose":"Open the first body paragraph with the pro-technology view, using \"On one hand\".","pattern":"On one hand, + [subject] + has undeniably + [past participle] + [object].","sample":"On one hand, technology has undeniably made many daily tasks more convenient."},{"n":5,"role":"Specific example 1","purpose":"Give the first concrete example, with the example noun fronted for emphasis.","pattern":"[Noun], for example, + [verb phrase].","sample":"Online banking, for example, allows people to manage their finances without visiting a bank in person."},{"n":6,"role":"Specific example 2","purpose":"Add a second, parallel example using \"Similarly\".","pattern":"Similarly, + [clause].","sample":"Similarly, smartphones give instant access to information, maps, and services."},{"n":7,"role":"Paragraph summary","purpose":"Close the paragraph by stating the overall benefit the examples demonstrate.","pattern":"These + [noun] + [verb] + [object].","sample":"These advances save both time and effort for the average person."},{"n":8,"role":"Topic sentence, Body 2","purpose":"Open the second body paragraph with the opposing view, using \"On the other hand\".","pattern":"On the other hand, + [subject] + has also + [past participle] + [object].","sample":"On the other hand, technology has also created new sources of complexity and stress."},{"n":9,"role":"Specific example 1","purpose":"Give a concrete example with a gerund (-ing) phrase as the subject.","pattern":"[Gerund phrase] can + [verb] + [object].","sample":"Constant notifications and the expectation of being always available can overwhelm people."},{"n":10,"role":"Specific example 2","purpose":"Add a second example using the linker \"Moreover\".","pattern":"Moreover, + [clause].","sample":"Moreover, the rapid pace of technological change means people must continually learn new skills."},{"n":11,"role":"Consequence","purpose":"Explain the emotional effect on people, using a present participle clause.","pattern":"This can leave + [object] + feeling + [adjective].","sample":"This can leave some individuals feeling anxious or left behind."},{"n":12,"role":"Balanced conclusion","purpose":"Summarise both sides in one sentence at the start of the conclusion.","pattern":"In conclusion, + [subject] + brings both + [noun] and + [noun] + to + [noun phrase].","sample":"In conclusion, technology brings both convenience and complications to modern life."},{"n":13,"role":"Personal opinion with condition","purpose":"Close with a final, slightly nuanced opinion that includes a condition.","pattern":"In my view, however, + [main clause] + when + [condition clause].","sample":"In my view, however, the advantages of technology still outweigh its drawbacks when it is used responsibly."}],"alt":["Original: In the modern era, technology has become deeply embedded in almost every aspect of daily life.","Alternative 1: In today's world, technology plays an integral role in nearly all areas of everyday life.","Alternative 2: Contemporary society has come to rely heavily on technology in almost every walk of life.","At B2, paraphrasing restructures the whole sentence rather than swapping single words: the subject can change (technology → society), and fixed collocations (deeply embedded, integral role, rely heavily) show a wider range of academic phrasing."],"q":"Some people think that modern technology has made everyday life easier. Others believe it has made life more complicated. Discuss both views and give your opinion.","qnote":"This is essentially the authentic IELTS question. From B2 upward the question wording stays close to the real exam; what changes across levels is the sophistication of the response, not the question itself.","essay":"In the modern era, technology has become deeply embedded in almost every aspect of daily life. While some people argue that this has simplified everyday tasks, others believe it has introduced new complications. This essay will discuss both viewpoints before presenting my own opinion. On one hand, technology has undeniably made many daily tasks more convenient. Online banking, for example, allows people to manage their finances without visiting a bank in person. Similarly, smartphones give instant access to information, maps, and services. These advances save both time and effort for the average person. On the other hand, technology has also created new sources of complexity and stress. Constant notifications and the expectation of being always available can overwhelm people. Moreover, the rapid pace of technological change means people must continually learn new skills. This can leave some individuals feeling anxious or left behind. In conclusion, technology brings both convenience and complications to modern life. In my view, however, the advantages of technology still outweigh its drawbacks when it is used responsibly.","try":"Some people think that governments should invest more in public transport instead of building new roads. Others believe building new roads is more important. Discuss both views and give your opinion.","check":["Sentence 1–3: Background statement + both views + clear thesis.","Sentence 4–7: Body 1 — topic sentence + two examples + summary.","Sentence 8–11: Body 2 — topic sentence + two examples + consequence.","Sentence 12–13: Balanced summary + final opinion with a condition."]},{"lv":"C1","name":"Advanced","about":"C1 corresponds roughly to IELTS Band 7–8. The learner can use formal, academic register throughout (it is widely acknowledged, proponents, conversely), build longer sentences with multiple clauses, and develop each body paragraph with a topic sentence, two extended supporting points and a concluding sentence. The conclusion restates the argument with a concession structure and adds a conditional final opinion.","grammar":["Formal impersonal structures (it is widely acknowledged that)","Complex noun phrases (the expectation of constant availability)","A wide range of cohesive devices: whereas, furthermore, consequently, conversely","Passive voice used for objectivity (can now be completed)"],"vocab":[["proponent","a person who supports an idea or cause","Proponents of technology point to its convenience."],["engender","to cause or give rise to a feeling or situation","These changes have engendered additional stress."],["cognitive overload","a state in which the mind receives more information than it can process","The volume of data can lead to cognitive overload."],["judiciously","with careful, sensible judgement","Technology should be used judiciously."],["blur the boundary","to make a distinction between two things unclear","This blurs the boundary between work and home life."],["on balance","considering everything, when all factors are weighed together","On balance, the benefits outweigh the costs."],["critic","a person who points out the faults or problems in something","Critics argue that technology increases stress."],["facet","one particular aspect or part of something","Technology touches every facet of modern life."]],"mistakes":["Overloading a sentence with too many subordinate clauses until the main idea becomes unclear — complexity should aid clarity, not replace it.","Using formal linkers (whereas, notwithstanding) incorrectly or in the wrong position in the sentence.","Relying on the passive voice so heavily that the writing feels impersonal throughout — vary active and passive constructions.","Choosing an impressive but slightly inaccurate word over a simpler, correct one — precision matters more than sounding advanced.","Writing a conclusion that simply repeats the introduction word-for-word instead of synthesising the argument."],"examiner":["Task Response: a well-developed response with fully extended and supported ideas, and a position that is clear from the introduction onward, targets Band 7+.","Coherence & Cohesion: cohesive devices should be used flexibly and appropriately, without the mechanical overuse typical of lower bands.","Lexical Resource: less common and idiomatic vocabulary (engendered, on balance, blurs the boundary) used naturally and precisely is rewarded highly.","Grammatical Range & Accuracy: a wide range of structures, including complex sentences, should be used with good control and only rare, non-systematic errors."],"sents":[{"n":1,"role":"Formal opening","purpose":"Open with an impersonal, formal statement that frames the topic as generally accepted.","pattern":"It is widely acknowledged that + [clause].","sample":"It is widely acknowledged that technological innovation has transformed virtually every facet of contemporary life."},{"n":2,"role":"Present contrasting views","purpose":"Summarise both sides using the more formal contrastive linker \"Whereas\".","pattern":"Whereas some contend that + [clause], others maintain that + [clause].","sample":"Whereas some contend that these developments have simplified daily routines, others maintain that they have engendered additional stress and complexity."},{"n":3,"role":"Thesis / essay outline","purpose":"State the essay's structure and signal that a personal view will follow.","pattern":"This essay will examine both perspectives before articulating my own view.","sample":"This essay will examine both perspectives before articulating my own view."},{"n":4,"role":"Topic sentence, Body 1","purpose":"Open the first body paragraph by attributing the view to a named group (\"Proponents\").","pattern":"Proponents of + [noun] + point to + [noun phrase].","sample":"Proponents of technology point to the remarkable convenience it has brought to everyday activities."},{"n":5,"role":"Extended example","purpose":"Develop the claim with a longer sentence contrasting past effort with present ease.","pattern":"[Noun phrase] that once required + [noun], such as + [examples], can now be + [past participle] + within + [time phrase].","sample":"Tasks that once required considerable time and effort, such as banking or shopping, can now be completed within minutes via a smartphone."},{"n":6,"role":"Additional point","purpose":"Add a second, related point using the formal linker \"Furthermore\".","pattern":"Furthermore, + [clause].","sample":"Furthermore, advances in communication technology enable people to maintain relationships across vast distances with ease."},{"n":7,"role":"Illustrative example","purpose":"Give a vivid, specific illustration of the point in Sentence 6.","pattern":"[Noun], for instance, + [verb phrase].","sample":"Video calling platforms, for instance, allow families separated by continents to interact as though they were in the same room."},{"n":8,"role":"Paragraph conclusion","purpose":"Close the paragraph with a confident summarising statement.","pattern":"Such developments have undoubtedly + [past participle] + [object].","sample":"Such developments have undoubtedly enhanced efficiency and connectivity in modern society."},{"n":9,"role":"Topic sentence, Body 2","purpose":"Open the second body paragraph with the opposing view, attributed to \"critics\".","pattern":"Conversely, critics argue that + [clause].","sample":"Conversely, critics argue that this same technology has introduced new forms of pressure and complication."},{"n":10,"role":"Explain the cause","purpose":"Explain the mechanism behind the problem using a complex noun phrase as the subject.","pattern":"The + [noun phrase], fostered by + [cause], blurs the boundary between + [noun] and + [noun].","sample":"The expectation of constant availability, fostered by smartphones and email, blurs the boundary between work and personal life."},{"n":11,"role":"Additional point","purpose":"Add a second cause using the formal linker \"In addition\".","pattern":"In addition, + [clause].","sample":"In addition, the sheer volume of information generated daily can lead to cognitive overload."},{"n":12,"role":"Consequence","purpose":"State the result of the two causes above using \"Consequently\".","pattern":"Consequently, + [clause].","sample":"Consequently, many individuals report heightened levels of anxiety and difficulty disconnecting from digital devices."},{"n":13,"role":"Paragraph conclusion","purpose":"Close the paragraph with a reflective summarising statement.","pattern":"These drawbacks suggest that + [clause].","sample":"These drawbacks suggest that technological progress is not without significant costs."},{"n":14,"role":"Balanced conclusion","purpose":"Open the conclusion with a concession structure that weighs both sides.","pattern":"In conclusion, although + [concession], + [main clause] + on balance.","sample":"In conclusion, although technology has introduced certain complications, it has, on balance, simplified daily life considerably."},{"n":15,"role":"Final opinion with condition","purpose":"Close with a personal opinion that includes a condition, showing nuanced judgement.","pattern":"I therefore believe that + [clause], provided + [condition].","sample":"I therefore believe that its benefits outweigh its disadvantages, provided individuals learn to manage its use judiciously."}],"alt":["Original: It is widely acknowledged that technological innovation has transformed virtually every facet of contemporary life.","Alternative 1: Few would dispute that advances in technology have reshaped nearly every dimension of modern existence.","Alternative 2: There is broad consensus that technological progress has fundamentally altered almost all areas of present-day life.","At C1, alternatives use different rhetorical framings of agreement (it is widely acknowledged → few would dispute / there is broad consensus) and precise near-synonyms (transformed → reshaped / altered) without changing the underlying claim."],"q":"Some people think that modern technology has made life easier and more convenient, while others believe it has made life more complicated and stressful. Discuss both these views and give your own opinion.","qnote":"This is the full, authentic IELTS wording, taken word-for-word from a real past paper style. From this level on, the challenge lies entirely in the sophistication of the response.","essay":"It is widely acknowledged that technological innovation has transformed virtually every facet of contemporary life. Whereas some contend that these developments have simplified daily routines, others maintain that they have engendered additional stress and complexity. This essay will examine both perspectives before articulating my own view. Proponents of technology point to the remarkable convenience it has brought to everyday activities. Tasks that once required considerable time and effort, such as banking or shopping, can now be completed within minutes via a smartphone. Furthermore, advances in communication technology enable people to maintain relationships across vast distances with ease. Video calling platforms, for instance, allow families separated by continents to interact as though they were in the same room. Such developments have undoubtedly enhanced efficiency and connectivity in modern society. Conversely, critics argue that this same technology has introduced new forms of pressure and complication. The expectation of constant availability, fostered by smartphones and email, blurs the boundary between work and personal life. In addition, the sheer volume of information generated daily can lead to cognitive overload. Consequently, many individuals report heightened levels of anxiety and difficulty disconnecting from digital devices. These drawbacks suggest that technological progress is not without significant costs. In conclusion, although technology has introduced certain complications, it has, on balance, simplified daily life considerably. I therefore believe that its benefits outweigh its disadvantages, provided individuals learn to manage its use judiciously.","try":"Some people argue that the increasing use of artificial intelligence in the workplace will benefit society, while others believe it poses a serious threat to employment. Discuss both these views and give your own opinion.","check":["Sentence 1–3: Formal opening + contrasting views with \"whereas\" + thesis outline.","Sentence 4–8: Body 1 — attributed topic sentence, extended example, additional point, illustration, conclusion.","Sentence 9–13: Body 2 — attributed opposing topic sentence, cause, additional point, consequence, conclusion.","Sentence 14–15: Balanced conclusion + conditional final opinion."]},{"lv":"C2","name":"Mastery","about":"C2 corresponds to IELTS Band 8.5–9. The question and overall structure are the same as at C1, but the language shows full command: precise and sometimes idiomatic vocabulary, varied and flexible sentence structures (appositives, em-dashes, fronted clauses), a wider range of cohesive devices used naturally rather than mechanically, and a conclusion that closes with a broader, more reflective final statement rather than a simple restatement.","grammar":["Appositive and parenthetical clauses (a feat unimaginable a generation ago)","Em-dash constructions for emphasis","Precise, low-frequency academic vocabulary (incontrovertible, insidious, tacit)","Fully natural, varied cohesion rather than formulaic linkers"],"vocab":[["incontrovertible","impossible to deny or question","It is an incontrovertible fact that technology has changed society."],["permeate","to spread through and become part of every part of something","Technology has permeated nearly every dimension of life."],["insidious","harmful in a gradual and not immediately obvious way","Technology has spawned insidious forms of pressure."],["tacit expectation","an assumption that is understood without being directly stated","There is a tacit expectation of constant availability."],["erode","to gradually wear away or destroy something over time","This has eroded the boundary between work and home."],["cognitive fatigue","mental tiredness caused by prolonged effort or information overload","Excess information can precipitate cognitive fatigue."],["mindfully","in a deliberate, aware and controlled manner","People should engage with technology mindfully."],["notwithstanding","in spite of; despite","Notwithstanding its benefits, technology carries real costs."]],"mistakes":["Using rare, ornate vocabulary purely for effect, without regard for whether it is the most precise word available — precision, not decoration, is the C2 goal.","Overusing em-dash and appositive constructions until the writing feels stylistically repetitive rather than genuinely varied.","Losing natural rhythm by making every single sentence maximally complex — the strongest C2 writing still varies sentence length for effect.","Adopting an idiom or collocation slightly incorrectly (e.g. wrong preposition) — native-like accuracy is expected at this level.","Ending on a generic restatement rather than a genuinely reflective closing idea that extends the argument."],"examiner":["Task Response: fully developed, well-argued responses with ideas that are relevant, extended and supported, and a fully clear position, are required for Band 8.5–9.","Coherence & Cohesion: cohesion should be handled skilfully and almost invisibly — the writing should read as naturally organised rather than mechanically linked.","Lexical Resource: a wide range of vocabulary is used with full flexibility and precision, including natural, idiomatic and less common items, with rare or no errors.","Grammatical Range & Accuracy: a wide range of structures is used with full flexibility and control, and the vast majority of sentences are error-free."],"sents":[{"n":1,"role":"Sophisticated opening","purpose":"Open with an emphatic, formal claim using a precise adjective (\"incontrovertible\").","pattern":"It is an incontrovertible fact that + [clause].","sample":"It is an incontrovertible fact that technological advancement has permeated nearly every dimension of modern existence."},{"n":2,"role":"Nuanced contrast","purpose":"Present both views with a parenthetical adverb (\"paradoxically\") that adds interpretive nuance.","pattern":"While some assert that + [clause], others contend that + [clause], paradoxically.","sample":"While some assert that this pervasive integration has streamlined daily life, others contend that it has, paradoxically, engendered unprecedented levels of stress and complexity."},{"n":3,"role":"Thesis / essay outline","purpose":"State the essay's aim using a more precise verb (\"interrogate\") than the standard \"discuss\".","pattern":"This essay will interrogate both positions before advancing a personal assessment.","sample":"This essay will interrogate both positions before advancing a personal assessment."},{"n":4,"role":"Topic sentence, Body 1","purpose":"Open the first body paragraph, crediting the view with an evaluative adverb (\"rightly\").","pattern":"Advocates of + [noun] + rightly emphasise + [noun phrase].","sample":"Advocates of technological progress rightly emphasise the extraordinary convenience it affords."},{"n":5,"role":"Complex example with em-dash","purpose":"Use an em-dash aside to list examples fluidly within a single complex sentence.","pattern":"[Noun phrase]—[list of examples]—can now be + [past participle] + within + [time phrase].","sample":"Activities that once demanded substantial time and exertion—banking, shopping, or research—can now be accomplished within moments through a single handheld device."},{"n":6,"role":"Additional point","purpose":"Add a further point with precise, formal vocabulary (\"dissolved geographical barriers\").","pattern":"Moreover, + [clause].","sample":"Moreover, telecommunications innovations have effectively dissolved geographical barriers to human connection."},{"n":7,"role":"Illustration with appositive","purpose":"Add an appositive phrase at the end of the sentence to comment on the example just given.","pattern":"[Noun phrase] can now + [verb phrase], a feat + [adjective phrase].","sample":"Families scattered across continents can now sustain intimate relationships via real-time video communication, a feat unimaginable a generation ago."},{"n":8,"role":"Paragraph conclusion","purpose":"Close the paragraph with a confident, wide-scope summarising claim.","pattern":"Such transformations have unquestionably + [past participle] + [object].","sample":"Such transformations have unquestionably enhanced both efficiency and interpersonal connectivity on a global scale."},{"n":9,"role":"Topic sentence, Body 2","purpose":"Open the second body paragraph, crediting the opposing view with an evaluative adverb (\"persuasively\").","pattern":"Nevertheless, detractors persuasively argue that + [clause].","sample":"Nevertheless, detractors persuasively argue that this same technology has spawned novel and insidious forms of pressure."},{"n":10,"role":"Explain the cause precisely","purpose":"Explain the underlying cause using precise, low-frequency vocabulary (\"tacit expectation\", \"eroded\").","pattern":"The tacit expectation of + [noun], reinforced by + [cause], has eroded + [noun phrase].","sample":"The tacit expectation of perpetual availability, reinforced by smartphones and instant messaging, has eroded the once-clear demarcation between professional and personal spheres."},{"n":11,"role":"Additional point","purpose":"Add a further cause with precise vocabulary (\"cognitive fatigue\").","pattern":"Furthermore, + [clause].","sample":"Furthermore, the relentless influx of information can precipitate cognitive fatigue and diminished attentional capacity."},{"n":12,"role":"Consequence citing evidence","purpose":"State a consequence while hedging appropriately with reference to research (\"a growing body of research\").","pattern":"Consequently, a growing body of research links + [cause] + to + [effect].","sample":"Consequently, a growing body of research links habitual device use to heightened anxiety and an impaired ability to disengage."},{"n":13,"role":"Paragraph conclusion","purpose":"Close the paragraph with a concessive summarising claim (\"for all its merits\").","pattern":"These considerations reveal that + [clause], for all its merits.","sample":"These considerations reveal that technological progress, for all its merits, carries non-negligible psychological costs."},{"n":14,"role":"Balanced conclusion","purpose":"Open the conclusion with a concession structure that weighs both sides in elevated register.","pattern":"In conclusion, while + [concession], + [main clause], on balance.","sample":"In conclusion, while technology has undeniably introduced certain complications into contemporary life, its capacity to simplify and enrich daily existence remains, on balance, more pronounced."},{"n":15,"role":"Final opinion with condition","purpose":"State a personal opinion with a precise conditional clause (\"cultivate the discipline\").","pattern":"I therefore contend that + [clause], provided + [condition].","sample":"I therefore contend that its advantages outweigh its disadvantages, provided individuals cultivate the discipline to regulate their engagement with it mindfully."},{"n":16,"role":"Broader closing reflection","purpose":"End with a generalising reflection that goes beyond the essay's specific topic, giving a memorable final impression.","pattern":"Ultimately, + [broad generalising clause].","sample":"Ultimately, the manner in which society harnesses technology, rather than the technology itself, will determine whether it liberates or burdens the human experience."}],"alt":["Original: It is an incontrovertible fact that technological advancement has permeated nearly every dimension of modern existence.","Alternative 1: That technology now pervades almost every facet of modern life is beyond serious dispute.","Alternative 2: Scarcely any sphere of contemporary existence remains untouched by the march of technological progress.","At C2, alternatives go beyond synonym substitution to include fronted clauses (\"That technology now pervades... is beyond dispute\") and figurative, idiomatic phrasing (\"the march of technological progress\"), showing full stylistic flexibility."],"q":"Some people think that modern technology has made life easier and more convenient, while others believe it has made life more complicated and stressful. Discuss both these views and give your own opinion.","qnote":"The question does not change from C1 to C2 — real IELTS questions do not get grammatically harder. What distinguishes a C2 answer is entirely the precision, range and naturalness of the language used to respond to exactly the same prompt.","essay":"It is an incontrovertible fact that technological advancement has permeated nearly every dimension of modern existence. While some assert that this pervasive integration has streamlined daily life, others contend that it has, paradoxically, engendered unprecedented levels of stress and complexity. This essay will interrogate both positions before advancing a personal assessment. Advocates of technological progress rightly emphasise the extraordinary convenience it affords. Activities that once demanded substantial time and exertion—banking, shopping, or research—can now be accomplished within moments through a single handheld device. Moreover, telecommunications innovations have effectively dissolved geographical barriers to human connection. Families scattered across continents can now sustain intimate relationships vi
