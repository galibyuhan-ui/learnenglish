omplacency among individuals.","bn":"শুধু কর্পোরেশনকে দোষ দিলে ব্যক্তিদের মধ্যে আত্মতুষ্টি তৈরি হতে পারে।"},{"en":"Climate change is a systemic problem that requires systemic solutions.","bn":"জলবায়ু পরিবর্তন একটি ব্যবস্থাগত সমস্যা যার জন্য ব্যবস্থাগত সমাধান প্রয়োজন।"}],"essays":[{"label":"BASIC ESSAY (BAND 5–6)","words":260,"paras":["Some people think that only governments and big companies can protect the environment, but other people think that individuals are also important. <b>Although governments and large companies have the greatest power, I believe individuals also have an important role to play in protecting the environment.</b>","On the one hand, governments and companies have a lot of power. Governments can make laws to stop factories from polluting rivers and the air. They can also build metro rails and solar power stations. Big companies produce a lot of <b>pollution</b>, so if they change the way they work, the effect is very big. Some people think that one person cannot change anything, because the problem is too large.","On the other hand, I think individuals are also important. If millions of people make small changes, the result can be big. For example, people can use buses and trains instead of cars, save electricity at home and use less plastic. Also, people can choose products from companies that do not harm the environment. Then companies will change because they want customers. People can also vote for politicians who care about the environment and tell the government to do more. Children can learn good habits from their parents, too.","In my opinion, both groups need to <b>work together</b>. Governments and companies should make big changes, but individuals should also do their part in daily life.","In conclusion, governments and companies have the most power to protect the environment, but individuals can also make a difference. I believe everyone must <b>work together</b> to solve this problem."]},{"label":"ADVANCED ESSAY (BAND 7)","words":265,"paras":["There is disagreement about who is responsible for tackling environmental problems. Some argue that only governments and large <b>corporations</b> can bring about real change, while others believe ordinary people also have an important role. <b>Although governments and large companies have the greatest power, I believe individuals also have an important role to play in protecting the environment.</b>","Those who emphasise the role of governments and businesses make a strong case. Governments can pass <b>legislation</b> that reduces <b>pollution</b> <b>on a large scale</b>, for example by banning single-use plastics or investing in <b>renewable energy</b>. Similarly, a small number of large companies are responsible for a large share of global <b>carbon emissions</b>, so changes in their practices have a far greater impact than any individual action. From this perspective, asking people to <b>recycle</b> or turn off lights seems like <b>a drop in the ocean</b>.","However, I believe this view underestimates the power of individuals. Firstly, when millions of people change their habits, <b>small changes add up</b>; if every household reduced its energy use and more people used <b>public transport</b>, emissions would fall significantly. Secondly, consumers can <b>vote with their wallets</b>. When people choose <b>sustainable</b> products, companies are forced to respond to changing <b>consumer demand</b>. Finally, citizens can <b>put pressure on</b> politicians through voting and campaigning, and many environmental laws exist today because ordinary people demanded them. Individuals who live sustainably also <b>set an example</b> for others, especially children.","In conclusion, while governments and <b>corporations</b> must <b>take the lead</b>, individuals are not powerless. The best results will come when governments, businesses and individuals <b>work together</b> to protect the environment."]},{"label":"BAND 9 ESSAY","words":332,"paras":["Opinions differ as to where responsibility for environmental protection primarily lies: some contend that meaningful progress depends solely on governments and large <b>corporations</b>, whereas others insist that ordinary citizens have a vital part to play. <b>Although governments and large companies have the greatest power, I believe individuals also have an important role to play in protecting the environment.</b>","The argument for prioritising institutions is compelling. <b>Climate change</b> is a <b>systemic</b> problem that requires <b>systemic</b> solutions, and only governments possess the authority to enact <b>legislation</b> on the necessary scale, whether by introducing a <b>carbon tax</b>, phasing out <b>fossil fuels</b> or funding <b>renewable energy</b> infrastructure. <b>Corporations</b>, too, wield disproportionate influence; it is frequently noted that a relatively small number of companies are responsible for a large share of global <b>carbon emissions</b>. Measured against these figures, an individual's decision to <b>recycle</b> a bottle or skip a car journey can indeed appear to be <b>a drop in the ocean</b>, and some even suggest that emphasising personal responsibility conveniently allows powerful actors to <b>shift the blame</b>.","Nevertheless, dismissing individual action altogether is, in my view, a mistake. Firstly, <b>behavioural change</b> is cumulative: <b>small changes add up</b> when adopted by millions, and shifts in how households travel, eat and consume energy have a measurable effect on national emissions. Secondly, individuals collectively shape the market. When consumers <b>vote with their wallets</b> by favouring <b>sustainable</b> products, businesses have a clear financial incentive to adapt. Thirdly, and perhaps most importantly, the actions of governments are themselves a response to public pressure. Many landmark environmental policies originated in grassroots movements, and politicians act decisively only when citizens demand <b>accountability</b>. Finally, placing all responsibility on institutions risks breeding <b>complacency</b> among individuals, who may conclude that their own choices are irrelevant.","In conclusion, governments and <b>corporations</b> must undoubtedly <b>take the lead</b>, but they will do so only in a society where individuals care enough to change their own behaviour and hold those in power to account. Genuine progress requires all three to <b>work together</b>."]}],"type":"Discuss both views and give your opinion","q":"Some people believe that individuals can do little to improve the environment and that only governments and large companies can make a real difference. Others think individuals have an important role to play. Discuss both views and give your own opinion."},{"n":11,"title":"Banning single-use plastics","cat":"Environment","groups":[{"name":"Reasons to Agree","bn":"একমত হওয়ার কারণ","items":[{"en":"Single-use plastics take hundreds of years to break down and pollute land and water.","bn":"একবার ব্যবহারযোগ্য প্লাস্টিক পচতে শত শত বছর লাগে এবং মাটি ও পানি দূষিত করে।"},{"en":"Millions of tonnes of plastic enter the oceans every year and kill marine animals.","bn":"প্রতি বছর লাখ লাখ টন প্লাস্টিক সমুদ্রে প্রবেশ করে সামুদ্রিক প্রাণী মেরে ফেলে।"},{"en":"In cities such as Dhaka, plastic bags block drains and cause flooding.","bn":"ঢাকার মতো শহরে প্লাস্টিকের ব্যাগ নালা বন্ধ করে জলাবদ্ধতা সৃষ্টি করে।"},{"en":"Microplastics have entered the food chain and may harm human health.","bn":"মাইক্রোপ্লাস্টিক খাদ্যশৃঙ্খলে প্রবেশ করেছে এবং মানুষের স্বাস্থ্যের ক্ষতি করতে পারে।"},{"en":"Cheap alternatives such as jute, cloth and paper bags are already available.","bn":"পাট, কাপড় ও কাগজের ব্যাগের মতো সস্তা বিকল্প ইতোমধ্যে পাওয়া যায়।"}]},{"name":"Reasons to Disagree","bn":"দ্বিমত পোষণের কারণ","items":[{"en":"Plastic is cheap, light and convenient, especially for poorer consumers.","bn":"প্লাস্টিক সস্তা, হালকা ও সুবিধাজনক, বিশেষত দরিদ্র ভোক্তাদের জন্য।"},{"en":"Some plastic items are essential for medical care and food hygiene.","bn":"কিছু প্লাস্টিক পণ্য চিকিৎসা ও খাদ্য স্বাস্থ্যবিধির জন্য অপরিহার্য।"},{"en":"A sudden ban could cause job losses in factories that make plastic products.","bn":"হঠাৎ নিষেধাজ্ঞা প্লাস্টিক পণ্য তৈরির কারখানায় চাকরি হারানোর কারণ হতে পারে।"},{"en":"Bans are difficult to enforce, as Bangladesh's experience since 2002 shows.","bn":"নিষেধাজ্ঞা প্রয়োগ করা কঠিন, যেমন ২০০২ সাল থেকে বাংলাদেশের অভিজ্ঞতা দেখায়।"},{"en":"Taxes and better recycling might reduce plastic waste without banning it completely.","bn":"কর ও উন্নত পুনর্চক্রায়ন সম্পূর্ণ নিষেধাজ্ঞা ছাড়াই প্লাস্টিক বর্জ্য কমাতে পারে।"}]},{"name":"Evaluation: My Answer","bn":"মূল্যায়ন — আমার উত্তর","items":[{"en":"I strongly agree that single-use plastics should be banned, because the environmental damage they cause far outweighs their convenience.","bn":"আমি দৃঢ়ভাবে একমত যে একবার ব্যবহারযোগ্য প্লাস্টিক নিষিদ্ধ করা উচিত, কারণ এগুলোর পরিবেশগত ক্ষতি এর সুবিধার চেয়ে অনেক বেশি।"},{"en":"I largely agree with a ban, although some exceptions should be made for medical and hygiene products.","bn":"আমি নিষেধাজ্ঞার সঙ্গে মূলত একমত, যদিও চিকিৎসা ও স্বাস্থ্যবিধি-সংক্রান্ত পণ্যের ক্ষেত্রে কিছু ব্যতিক্রম রাখা উচিত।"}]}],"vocab":[["single-use plastic","একবার ব্যবহারযোগ্য প্লাস্টিক"],["ban","নিষেধাজ্ঞা / নিষিদ্ধ করা"],["plastic waste","প্লাস্টিক বর্জ্য"],["biodegradable","জৈবভাবে পচনশীল"],["landfill","ভাগাড়"],["marine life","সামুদ্রিক জীবন"],["drainage","পয়ঃনিষ্কাশন"],["alternatives","বিকল্প"],["jute bags","পাটের ব্যাগ"],["enforcement","প্রয়োগ"],["microplastics","মাইক্রোপ্লাস্টিক"],["recycling","পুনর্চক্রায়ন"],["manufacturers","উৎপাদনকারী"],["hygiene","স্বাস্থ্যবিধি"]],"phrases":[["take hundreds of years to break down","পচতে শত শত বছর লাগা"],["end up in the ocean","শেষ পর্যন্ত সমুদ্রে যাওয়া"],["block drains","নালা বন্ধ করে দেওয়া"],["cause flooding","জলাবদ্ধতা/বন্যা সৃষ্টি করা"],["enter the food chain","খাদ্যশৃঙ্খলে প্রবেশ করা"],["change people's habits","মানুষের অভ্যাস বদলানো"],["a cheap and convenient","সস্তা ও সুবিধাজনক"],["phase out","ধীরে ধীরে বন্ধ করা"],["strict enforcement","কঠোর প্রয়োগ"],["set an example for","... এর জন্য দৃষ্টান্ত স্থাপন করা"]],"sents":[{"en":"Plastic bags can take hundreds of years to break down.","bn":"প্লাস্টিকের ব্যাগ পচতে শত শত বছর লাগতে পারে।"},{"en":"Millions of tonnes of plastic end up in the ocean every year.","bn":"প্রতি বছর লাখ লাখ টন প্লাস্টিক শেষ পর্যন্ত সমুদ্রে যায়।"},{"en":"In cities like Dhaka, plastic bags block drains and cause flooding.","bn":"ঢাকার মতো শহরে প্লাস্টিকের ব্যাগ নালা বন্ধ করে জলাবদ্ধতা সৃষ্টি করে।"},{"en":"Microplastics can enter the food chain and harm human health.","bn":"মাইক্রোপ্লাস্টিক খাদ্যশৃঙ্খলে প্রবেশ করে মানুষের স্বাস্থ্যের ক্ষতি করতে পারে।"},{"en":"Voluntary campaigns have not been enough to change people's habits.","bn":"মানুষের অভ্যাস বদলাতে স্বেচ্ছামূলক প্রচারণা যথেষ্ট হয়নি।"},{"en":"Jute and cloth bags are practical alternatives to plastic.","bn":"পাট ও কাপড়ের ব্যাগ প্লাস্টিকের ব্যবহারিক বিকল্প।"},{"en":"However, a ban only works if there is strict enforcement.","bn":"তবে কঠোর প্রয়োগ থাকলেই কেবল নিষেধাজ্ঞা কাজ করে।"},{"en":"Some plastic products are still essential for medical hygiene.","bn":"কিছু প্লাস্টিক পণ্য চিকিৎসা স্বাস্থ্যবিধির জন্য এখনো অপরিহার্য।"}],"xvocab":[["non-biodegradable","অপচনশীল"],["ecosystem","বাস্তুতন্ত্র"],["throwaway culture","ব্যবহার করে ফেলে দেওয়ার সংস্কৃতি"],["levy","শুল্ক / কর"],["circular economy","চক্রাকার অর্থনীতি"],["loophole","ফাঁকফোকর"],["transition period","রূপান্তরকাল"],["environmental cost","পরিবেশগত মূল্য"]],"xsents":[{"en":"Bangladesh was one of the first countries to ban plastic bags, in 2002.","bn":"২০০২ সালে প্লাস্টিক ব্যাগ নিষিদ্ধ করা প্রথম দেশগুলোর একটি ছিল বাংলাদেশ।"},{"en":"Weak enforcement created loopholes, and plastic bags soon returned.","bn":"দুর্বল প্রয়োগ ফাঁকফোকর তৈরি করেছিল, এবং প্লাস্টিক ব্যাগ দ্রুত ফিরে আসে।"},{"en":"A small levy on plastic bags cut their use dramatically in several countries.","bn":"প্লাস্টিক ব্যাগের ওপর ছোট শুল্ক কয়েকটি দেশে এর ব্যবহার নাটকীয়ভাবে কমিয়েছে।"},{"en":"A ban must be combined with a transition period for manufacturers.","bn":"নিষেধাজ্ঞার সঙ্গে উৎপাদনকারীদের জন্য একটি রূপান্তরকাল রাখতে হবে।"}],"essays":[{"label":"BASIC ESSAY (BAND 5–6)","words":251,"paras":["Some people think that the government should <b>ban</b> all plastic products that we use only once, like plastic bags and bottles. <b>I strongly agree that single-use plastics should be banned, because the environmental damage they cause far outweighs their convenience.</b>","The first reason is that plastic is very bad for the environment. Plastic bags and bottles <b>take hundreds of years to break down</b>. They stay in the soil and in rivers for a very long time. A lot of plastic goes into the sea, and fish and birds eat it and die. Also, small pieces of plastic can go into our food and water, which is bad for our health.","The second reason is that plastic causes problems in cities. In Dhaka, for example, plastic bags block the drains. When it rains heavily, the water cannot go away, so the streets flood. This is a big problem every rainy season.","Some people say that plastic is cheap and convenient, and a <b>ban</b> will be difficult for shops and customers. This is true, but there are good <b>alternatives</b>. People can use <b>jute bags</b>, cloth bags and glass or steel bottles. Bangladesh produces a lot of jute, so <b>jute bags</b> can also help our farmers and the economy. However, the government must make sure that people really follow the law.","In conclusion, I believe <b>single-use plastic</b> should be banned. It damages nature, harms animals and <b>causes flooding</b> in cities. There are good <b>alternatives</b>, so a <b>ban</b> is the right decision for our future."]},{"label":"ADVANCED ESSAY (BAND 7)","words":261,"paras":["Many people argue that governments should prohibit disposable plastic items such as bags, straws and bottles. <b>I strongly agree that single-use plastics should be banned, because the environmental damage they cause far outweighs their convenience.</b>","The most important reason for a <b>ban</b> is the scale of environmental harm. Plastic bags can <b>take hundreds of years to break down</b>, and millions of tonnes of plastic <b>end up in the ocean</b> every year, where they kill fish, turtles and seabirds. Even worse, plastic gradually breaks into tiny particles known as <b>microplastics</b>, which <b>enter the food chain</b> and have now been found in drinking water and even human blood. <b>Recycling</b> alone cannot solve this problem, since only a small percentage of plastic is ever recycled.","<b>Plastic waste</b> also causes serious problems in cities, especially in developing countries. In Dhaka, for example, plastic bags <b>block drains</b> and <b>cause flooding</b> during the monsoon, damaging homes and spreading disease. Voluntary campaigns asking people to use fewer bags have clearly not been enough to <b>change people's habits</b>, which suggests that only a legal <b>ban</b> will be effective. Moreover, practical <b>alternatives</b> already exist: jute and cloth bags, paper packaging and reusable bottles. For a country like Bangladesh, promoting jute would also support local farmers.","Admittedly, a <b>ban</b> must be carefully designed. Some plastic products are still essential for medical <b>hygiene</b>, and <b>strict enforcement</b> is necessary; Bangladesh banned plastic bags in 2002, but weak <b>enforcement</b> allowed them to return.","In conclusion, I firmly believe that single-use plastics should be banned, provided that governments enforce the law and support affordable <b>alternatives</b>."]},{"label":"BAND 9 ESSAY","words":342,"paras":["It has been proposed that governments should outlaw all <b>single-use plastic</b> products, from carrier bags to disposable bottles. I strongly agree that single-use plastics should be banned, because the environmental damage they cause far outweighs their convenience, although such a <b>ban</b> must be carefully designed and rigorously enforced.","The primary justification is the sheer scale and persistence of the harm. Being <b>non-biodegradable</b>, a plastic bag used for a matter of minutes can <b>take hundreds of years to break down</b>, and an estimated eight million tonnes of plastic <b>end up in the ocean</b> annually, devastating <b>marine life</b> and disrupting entire <b>ecosystems</b>. The problem does not stop there: as plastic degrades it fragments into <b>microplastics</b>, which <b>enter the food chain</b> and have been detected in drinking water, seafood and even human tissue, with long-term health consequences that are still poorly understood. <b>Recycling</b>, often presented as the answer, has proved inadequate, since only a small fraction of plastic produced is ever recycled.","In developing countries, the consequences are also immediate and visible. In Dhaka, discarded polythene routinely <b>blocks drains</b>, causing waterlogging and flooding during the monsoon, which in turn damages property and spreads waterborne disease. Crucially, decades of voluntary campaigns have failed to <b>change people's habits</b> in any meaningful way, suggesting that only legislation can break our <b>throwaway culture</b>. Viable <b>alternatives</b>, moreover, are readily available: jute, cloth and paper bags, as well as reusable containers. For Bangladesh, a world leader in jute production, the shift would carry an economic bonus by revitalising a traditional industry.","That said, the experience of Bangladesh itself, which banned polythene bags as early as 2002, demonstrates that a <b>ban</b> on paper is worthless without <b>strict enforcement</b>; <b>loopholes</b> and lax policing allowed plastic bags to return within a few years. Exemptions for medical and <b>hygiene</b> products and a <b>transition period</b> for <b>manufacturers</b> would also be essential.","In conclusion, I am convinced that a <b>ban</b> on single-use plastics is both necessary and achievable. If it is accompanied by affordable <b>alternatives</b> and consistent <b>enforcement</b>, its environmental benefits will far outweigh the inconvenience involved."]}],"type":"Opinion (Agree / Disagree)","q":"Some people think that governments should ban all single-use plastic products, such as plastic bags and bottles. To what extent do you agree or disagree?"},{"n":12,"title":"Traffic congestion in cities","cat":"Environment","groups":[{"name":"Causes","bn":"কারণ","items":[{"en":"Rapid migration to cities has increased the population faster than roads can be built.","bn":"শহরে দ্রুত অভিবাসন রাস্তা নির্মাণের চেয়ে দ্রুত জনসংখ্যা বাড়িয়েছে।"},{"en":"Rising incomes mean that more families now own cars and motorbikes.","bn":"আয় বাড়ায় এখন আরও পরিবার গাড়ি ও মোটরসাইকেলের মালিক।"},{"en":"Poor and unreliable public transport pushes people to use private vehicles.","bn":"দুর্বল ও অনির্ভরযোগ্য গণপরিবহন মানুষকে ব্যক্তিগত যানবাহন ব্যবহারে বাধ্য করে।"},{"en":"Offices, schools and hospitals are concentrated in a few central areas.","bn":"অফিস, স্কুল ও হাসপাতাল কয়েকটি কেন্দ্রীয় এলাকায় কেন্দ্রীভূত।"},{"en":"Weak enforcement of traffic rules leads to illegal parking and chaotic driving.","bn":"ট্রাফিক আইনের দুর্বল প্রয়োগ অবৈধ পার্কিং ও বিশৃঙ্খল গাড়ি চালানোর কারণ হয়।"}]},{"name":"Solutions","bn":"সমাধান","items":[{"en":"Governments should invest in fast, affordable public transport such as metro rail.","bn":"সরকারের উচিত মেট্রোরেলের মতো দ্রুত ও সাশ্রয়ী গণপরিবহনে বিনিয়োগ করা।"},{"en":"Congestion charges and higher parking fees would discourage unnecessary driving.","bn":"যানজট শুল্ক ও বেশি পার্কিং ফি অপ্রয়োজনীয় গাড়ি চালানো নিরুৎসাহিত করবে।"},{"en":"Moving offices and institutions to other cities would reduce pressure on the capital.","bn":"অফিস ও প্রতিষ্ঠান অন্য শহরে সরালে রাজধানীর ওপর চাপ কমবে।"},{"en":"Flexible and staggered working hours would reduce rush-hour traffic.","bn":"নমনীয় ও ভিন্ন ভিন্ন কর্মঘণ্টা ব্যস্ত সময়ের যানজট কমাবে।"},{"en":"Strict enforcement of traffic laws would make roads more efficient.","bn":"ট্রাফিক আইনের কঠোর প্রয়োগ রাস্তাকে আরও কার্যকর করবে।"}]},{"name":"Overall Answer","bn":"সার্বিক উত্তর","items":[{"en":"Traffic congestion is mainly caused by rapid population growth and poor public transport, but it can be reduced by investing in mass transit and discouraging private car use.","bn":"যানজটের প্রধান কারণ দ্রুত জনসংখ্যা বৃদ্ধি ও দুর্বল গণপরিবহন, তবে গণপরিবহনে বিনিয়োগ ও ব্যক্তিগত গাড়ি ব্যবহারে নিরুৎসাহিত করে এটি কমানো যায়।"},{"en":"The main causes of congestion are the growing number of private vehicles and poor urban planning, and the best solutions are better public transport and decentralisation.","bn":"যানজটের প্রধান কারণ ব্যক্তিগত গাড়ির সংখ্যা বৃদ্ধি ও দুর্বল নগর পরিকল্পনা, এবং সেরা সমাধান হলো উন্নত গণপরিবহন ও বিকেন্দ্রীকরণ।"}]}],"vocab":[["traffic congestion","যানজট"],["urbanisation","নগরায়ণ"],["private vehicles","ব্যক্তিগত যানবাহন"],["public transport","গণপরিবহন"],["infrastructure","অবকাঠামো"],["urban planning","নগর পরিকল্পনা"],["commuters","যাত্রী"],["metro rail","মেট্রোরেল"],["congestion charge","যানজট শুল্ক"],["rush hour","ব্যস্ত সময়"],["decentralise","বিকেন্দ্রীকরণ করা"],["traffic rules","ট্রাফিক আইন"],["flexible working hours","নমনীয় কর্মঘণ্টা"],["road capacity","সড়কের ধারণক্ষমতা"]],"phrases":[["move to cities in search of work","কাজের খোঁজে শহরে আসা"],["a status symbol","মর্যাদার প্রতীক"],["grind to a halt","পুরোপুরি থেমে যাওয়া"],["waste hours every day","প্রতিদিন কয়েক ঘণ্টা নষ্ট করা"],["invest heavily in","... এ ব্যাপকভাবে বিনিয়োগ করা"],["a reliable alternative","নির্ভরযোগ্য বিকল্প"],["discourage people from driving","মানুষকে গাড়ি চালাতে নিরুৎসাহিত করা"],["spread out economic activity","অর্থনৈতিক কার্যক্রম ছড়িয়ে দেওয়া"],["enforce traffic laws","ট্রাফিক আইন প্রয়োগ করা"],["in the long term","দীর্ঘমেয়াদে"]],"sents":[{"en":"Millions of people move to cities in search of work, which puts enormous pressure on roads.","bn":"লাখ লাখ মানুষ কাজের খোঁজে শহরে আসে, যা রাস্তার ওপর বিশাল চাপ সৃষ্টি করে।"},{"en":"For many families, owning a car has become a status symbol.","bn":"অনেক পরিবারের কাছে গাড়ির মালিকানা মর্যাদার প্রতীক হয়ে উঠেছে।"},{"en":"When public transport is unreliable, people prefer to use private vehicles.","bn":"গণপরিবহন অনির্ভরযোগ্য হলে মানুষ ব্যক্তিগত যানবাহন পছন্দ করে।"},{"en":"In Dhaka, most offices, universities and hospitals are concentrated in a few areas.","bn":"ঢাকায় বেশিরভাগ অফিস, বিশ্ববিদ্যালয় ও হাসপাতাল কয়েকটি এলাকায় কেন্দ্রীভূত।"},{"en":"During rush hour, traffic can grind to a halt for hours.","bn":"ব্যস্ত সময়ে যানজট কয়েক ঘণ্টা পুরোপুরি থেমে যেতে পারে।"},{"en":"Governments should invest heavily in metro rail and bus networks.","bn":"সরকারের উচিত মেট্রোরেল ও বাস নেটওয়ার্কে ব্যাপকভাবে বিনিয়োগ করা।"},{"en":"A congestion charge can discourage people from driving into the city centre.","bn":"যানজট শুল্ক মানুষকে শহরের কেন্দ্রে গাড়ি চালিয়ে যেতে নিরুৎসাহিত করতে পারে।"},{"en":"Flexible working hours would reduce the number of commuters at rush hour.","bn":"নমনীয় কর্মঘণ্টা ব্যস্ত সময়ে যাত্রীর সংখ্যা কমাবে।"}],"xvocab":[["gridlock","সম্পূর্ণ অচল যানজট"],["bottleneck","সংকীর্ণ পথ / বাধা"],["induced demand","নতুন রাস্তায় আরও গাড়ি আসার প্রবণতা"],["bus rapid transit","দ্রুত বাস পরিবহন ব্যবস্থা"],["satellite towns","উপশহর"],["productivity loss","উৎপাদনশীলতার ক্ষতি"],["car-sharing","গাড়ি ভাগাভাগি"],["pedestrian-friendly","পথচারীবান্ধব"]],"xsents":[{"en":"Building more roads often creates induced demand and even more traffic.","bn":"আরও রাস্তা তৈরি প্রায়ই নতুন চাহিদা তৈরি করে এবং আরও যানজট ঘটায়।"},{"en":"Traffic in Dhaka causes a huge productivity loss every year.","bn":"ঢাকার যানজট প্রতি বছর বিশাল উৎপাদনশীলতার ক্ষতি ঘটায়।"},{"en":"Developing satellite towns can reduce pressure on the capital.","bn":"উপশহর গড়ে তোলা রাজধানীর ওপর চাপ কমাতে পারে।"},{"en":"Pedestrian-friendly streets encourage people to walk short distances.","bn":"পথচারীবান্ধব রাস্তা মানুষকে অল্প দূরত্বে হাঁটতে উৎসাহিত করে।"}],"essays":[{"label":"BASIC ESSAY (BAND 5–6)","words":271,"paras":["Traffic jams are a big problem in many cities today, including Dhaka. <b>Traffic congestion is mainly caused by rapid population growth and poor public transport, but it can be reduced by investing in mass transit and discouraging private car use.</b>","There are several causes of <b>traffic congestion</b>. The first cause is that too many people live in cities. Every year, many people move from villages to cities to find jobs, so there are more people and more vehicles on the roads. The second cause is that <b>public transport</b> is often bad. Buses are crowded, dirty and slow, so people who have money prefer to use their own cars or motorbikes. The third cause is poor planning. In Dhaka, most offices, schools and hospitals are in a few areas, so everyone travels to the same places at the same time. Also, many drivers do not follow <b>traffic rules</b>.","There are some solutions to this problem. Firstly, the government should build better <b>public transport</b>, such as <b>metro rail</b> and good buses. If <b>public transport</b> is fast, cheap and comfortable, many people will stop using cars. The new <b>metro rail</b> in Dhaka is a good example. Secondly, the government can make driving more expensive, for example with higher parking fees. Thirdly, offices and schools can start at different times, so not everyone is on the road at the same time. The police should also make sure drivers follow the rules.","In conclusion, traffic jams are caused by too many people, bad <b>public transport</b> and poor planning. The government can solve this problem by improving <b>public transport</b>, making driving more expensive and planning cities better."]},{"label":"ADVANCED ESSAY (BAND 7)","words":293,"paras":["<b>Traffic congestion</b> has become one of the most pressing problems facing cities worldwide, and few places illustrate this better than Dhaka. <b>Traffic congestion is mainly caused by rapid population growth and poor public transport, but it can be reduced by investing in mass transit and discouraging private car use.</b>","The root cause of congestion is rapid <b>urbanisation</b>. Every year, millions of people <b>move to cities in search of work</b>, and road <b>infrastructure</b> simply cannot keep up. This is made worse by the growing number of <b>private vehicles</b>; as incomes rise, owning a car has become <b>a status symbol</b> for many families. At the same time, <b>public transport</b> is often crowded and unreliable, so anyone who can afford to drive usually does. Poor <b>urban planning</b> adds to the problem: in Dhaka, most offices, universities and hospitals are concentrated in a few central areas, which means that millions of <b>commuters</b> travel in the same direction at <b>rush hour</b>, and traffic can <b>grind to a halt</b> for hours.","Several measures could ease this situation. The most effective would be to <b>invest heavily in</b> <b>metro rail</b> and modern bus networks, so that <b>public transport</b> becomes <b>a reliable alternative</b> to driving. Dhaka's new metro line has already shown how much time <b>commuters</b> can save. Secondly, governments could <b>discourage people from driving</b> through congestion charges and higher parking fees, as cities such as London and Singapore have done successfully. Finally, <b>in the long term</b>, <b>decentralising</b> offices and services to other cities, together with <b>flexible working hours</b>, would <b>spread out economic activity</b> and reduce pressure at peak times.","In conclusion, congestion is driven by <b>urbanisation</b>, rising car ownership and poor planning. A combination of better <b>public transport</b>, pricing measures and smarter <b>urban planning</b> offers the best chance of solving it."]},{"label":"BAND 9 ESSAY","words":353,"paras":["<b>Traffic congestion</b> has become a defining feature of urban life in much of the world, and in megacities such as Dhaka it costs millions of working hours every day. <b>Traffic congestion is mainly caused by rapid population growth and poor public transport, but it can be reduced by investing in mass transit and discouraging private car use.</b>","The underlying cause is rapid <b>urbanisation</b>. Rural migrants continually <b>move to cities in search of work</b>, and in many developing countries road <b>infrastructure</b> has expanded far more slowly than the population it serves. This pressure is compounded by the growing number of <b>private vehicles</b>: as the middle class expands, owning a car has become <b>a status symbol</b> as much as a means of transport. Crucially, the inadequacy of <b>public transport</b> pushes people into cars. When buses are overcrowded, unsafe and unpredictable, anyone who can afford an alternative will take it. Poor <b>urban planning</b> intensifies all of these problems. In Dhaka, the concentration of government offices, universities and hospitals in a handful of districts means that <b>commuters</b> converge on the same <b>bottlenecks</b> at <b>rush hour</b>, turning ordinary congestion into <b>gridlock</b>.","Addressing this requires action on several fronts. The priority should be to <b>invest heavily in</b> high-capacity mass transit, including <b>metro rail</b> and <b>bus rapid transit</b> systems, so that <b>public transport</b> becomes a genuinely reliable alternative to driving; the early success of Dhaka's metro line suggests that <b>commuters</b> will switch when the service is fast and dependable. Simply building more roads, by contrast, tends to generate <b>induced demand</b> and ultimately more traffic. Secondly, pricing mechanisms such as congestion charges, successfully adopted in London and Singapore, can <b>discourage people from driving</b> into city centres while raising revenue for transport. Finally, a longer-term solution lies in decentralisation: developing <b>satellite towns</b> and relocating institutions away from the capital would <b>spread out economic activity</b>, while staggered or <b>flexible working hours</b> could flatten peak demand.","In conclusion, urban congestion stems from rapid population growth, rising car ownership and poor planning. No single measure will suffice, but a coordinated strategy combining mass transit, pricing and decentralisation could make cities far more efficient and liveable."]}],"type":"Causes and solutions","q":"Traffic congestion is becoming a serious problem in many cities around the world. What are the causes of this problem, and what measures could be taken to solve it?"},{"n":13,"title":"Protecting endangered species","cat":"Environment","groups":[{"name":"Reasons to Agree","bn":"একমত হওয়ার কারণ","items":[{"en":"Many people still lack food, clean water and healthcare, which are more urgent needs.","bn":"অনেক মানুষ এখনো খাদ্য, বিশুদ্ধ পানি ও স্বাস্থ্যসেবা থেকে বঞ্চিত, যা আরও জরুরি চাহিদা।"},{"en":"Governments have limited budgets and must prioritise human welfare.","bn":"সরকারের বাজেট সীমিত এবং তাকে মানবকল্যাণকে অগ্রাধিকার দিতে হবে।"},{"en":"Extinction is a natural process that has happened throughout history.","bn":"বিলুপ্তি একটি প্রাকৃতিক প্রক্রিয়া যা ইতিহাস জুড়ে ঘটেছে।"},{"en":"Some conservation projects are expensive and produce few visible results.","bn":"কিছু সংরক্ষণ প্রকল্প ব্যয়বহুল এবং এর দৃশ্যমান ফলাফল কম।"},{"en":"In poor countries, protecting wildlife can conflict with farmers' need for land.","bn":"দরিদ্র দেশে বন্যপ্রাণী রক্ষা কৃষকদের জমির প্রয়োজনের সঙ্গে সংঘাত সৃষ্টি করতে পারে।"}]},{"name":"Reasons to Disagree","bn":"দ্বিমত পোষণের কারণ","items":[{"en":"Every species plays a role in the ecosystem, and losing one can affect many others.","bn":"প্রতিটি প্রজাতি বাস্তুতন্ত্রে ভূমিকা রাখে, এবং একটি হারালে অনেকগুলো প্রভাবিত হতে পারে।"},{"en":"Humans depend on healthy ecosystems for food, clean water and medicine.","bn":"মানুষ খাদ্য, বিশুদ্ধ পানি ও ওষুধের জন্য সুস্থ বাস্তুতন্ত্রের ওপর নির্ভরশীল।"},{"en":"Protecting the Bengal tiger also protects the Sundarbans, which shields people from cyclones.","bn":"বাংলার বাঘ রক্ষা সুন্দরবনকেও রক্ষা করে, যা মানুষকে ঘূর্ণিঝড় থেকে বাঁচায়।"},{"en":"Most species are endangered because of human activity, so we have a duty to protect them.","bn":"বেশিরভাগ প্রজাতি মানুষের কার্যকলাপের কারণে বিপন্ন, তাই তাদের রক্ষা করা আমাদের কর্তব্য।"},{"en":"Eco-tourism can create jobs and income for local communities.","bn":"পরিবেশ পর্যটন স্থানীয় জনগোষ্ঠীর জন্য কর্মসংস্থান ও আয় তৈরি করতে পারে।"}]},{"name":"Evaluation: My Answer","bn":"মূল্যায়ন — আমার উত্তর","items":[{"en":"I disagree with this view, because protecting endangered species is essential for healthy ecosystems, which humans also depend on.","bn":"আমি এই মতের সঙ্গে একমত নই, কারণ বিপন্ন প্রজাতি রক্ষা সুস্থ বাস্তুতন্ত্রের জন্য অপরিহার্য, যার ওপর মানুষও নির্ভরশীল।"},{"en":"Although human needs are urgent, I strongly disagree that spending money on wildlife protection is a waste.","bn":"মানুষের প্রয়োজন জরুরি হলেও, বন্যপ্রাণী রক্ষায় অর্থ ব্যয় করা অপচয় — এই মতের সঙ্গে আমি একেবারেই একমত নই।"}]}],"vocab":[["endangered species","বিপন্ন প্রজাতি"],["extinction","বিলুপ্তি"],["biodiversity","জীববৈচিত্র্য"],["ecosystem","বাস্তুতন্ত্র"],["habitat","বাসস্থান"],["conservation","সংরক্ষণ"],["poaching","চোরাশিকার"],["deforestation","বন উজাড়"],["pollination","পরাগায়ন"],["eco-tourism","পরিবেশ পর্যটন"],["future generations","ভবিষ্যৎ প্রজন্ম"],["moral responsibility","নৈতিক দায়িত্ব"],["priority","অগ্রাধিকার"],["poverty","দারিদ্র্য"]],"phrases":[["disappear forever","চিরতরে হারিয়ে যাওয়া"],["the balance of nature","প্রকৃতির ভারসাম্য"],["a chain reaction","শৃঙ্খলিত প্রতিক্রিয়া"],["depend on nature for","... এর জন্য প্রকৃতির ওপর নির্ভর করা"],["human activity","মানুষের কার্যকলাপ"],["basic needs","মৌলিক চাহিদা"],["a tiny fraction of","... এর খুব সামান্য অংশ"],["bring in income","আয় নিয়ে আসা"],["not a question of either/or","এটা হয়-এটা-নয়-ওটা প্রশ্ন নয়"],["once a species is gone","কোনো প্রজাতি একবার হারিয়ে গেলে"]],"sents":[{"en":"Once a species is gone, it disappears forever.","bn":"কোনো প্রজাতি একবার হারিয়ে গেলে তা চিরতরে হারিয়ে যায়।"},{"en":"Every species plays a role in the balance of nature.","bn":"প্রতিটি প্রজাতি প্রকৃতির ভারসাম্যে ভূমিকা রাখে।"},{"en":"The loss of one species can cause a chain reaction in the ecosystem.","bn":"একটি প্রজাতির বিলুপ্তি বাস্তুতন্ত্রে শৃঙ্খলিত প্রতিক্রিয়া সৃষ্টি করতে পারে।"},{"en":"Humans depend on nature for food, clean water and medicine.","bn":"মানুষ খাদ্য, বিশুদ্ধ পানি ও ওষুধের জন্য প্রকৃতির ওপর নির্ভর করে।"},{"en":"Most species are endangered because of human activity such as deforestation and poaching.","bn":"বেশিরভাগ প্রজাতি বন উজাড় ও চোরাশিকারের মতো মানুষের কার্যকলাপের কারণে বিপন্ন।"},{"en":"Conservation spending is only a tiny fraction of government budgets.","bn":"সংরক্ষণ ব্যয় সরকারি বাজেটের খুব সামান্য অংশ মাত্র।"},{"en":"Eco-tourism can bring in income for local communities.","bn":"পরিবেশ পর্যটন স্থানীয় জনগোষ্ঠীর জন্য আয় নিয়ে আসতে পারে।"},{"en":"However, in poor countries many people still lack basic needs such as food and healthcare.","bn":"তবে দরিদ্র দেশে অনেক মানুষ এখনো খাদ্য ও স্বাস্থ্যসেবার মতো মৌলিক চাহিদা থেকে বঞ্চিত।"}],"xvocab":[["irreversible","অপরিবর্তনীয়"],["keystone species","মূল প্রজাতি (বাস্তুতন্ত্রের ভিত্তি)"],["mangrove","ম্যানগ্রোভ বন"],["natural barrier","প্রাকৃতিক প্রতিরক্ষা"],["stewardship","রক্ষণাবেক্ষণের দায়িত্ব"],["false choice","মিথ্যা বিকল্প"],["livelihoods","জীবিকা"],["sustainable development","টেকসই উন্নয়ন"]],"xsents":[{"en":"The Bengal tiger is a keystone species in the Sundarbans.","bn":"বাংলার বাঘ সুন্দরবনের একটি মূল প্রজাতি।"},{"en":"The Sundarbans mangrove forest acts as a natural barrier against cyclones.","bn":"সুন্দরবন ম্যানগ্রোভ বন ঘূর্ণিঝড়ের বিরুদ্ধে প্রাকৃতিক প্রতিরক্ষা হিসেবে কাজ করে।"},{"en":"Extinction is irreversible, whereas poverty can be reduced over time.","bn":"বিলুপ্তি অপরিবর্তনীয়, অথচ দারিদ্র্য সময়ের সঙ্গে কমানো যায়।"},{"en":"Choosing between wildlife and people is often a false choice.","bn":"বন্যপ্রাণী ও মানুষের মধ্যে বেছে নেওয়া প্রায়ই একটি মিথ্যা বিকল্প।"}],"essays":[{"label":"BASIC ESSAY (BAND 5–6)","words":255,"paras":["Some people think that spending a lot of money to protect animals in danger is a waste, and the money should be used for people. <b>I disagree with this view, because protecting endangered species is essential for healthy ecosystems, which humans also depend on.</b>","It is true that many people in the world are poor. They need food, clean water, schools and hospitals. In countries like Bangladesh, many families still do not have these <b>basic needs</b>. So some people feel that the government should help people first and animals later.","However, I believe protecting animals is not a waste of money. Firstly, every animal is important for nature. If one animal disappears, other plants and animals can also be affected. For example, bees help plants to grow, and without them we would have less food. Secondly, humans need nature. We get food, medicine and clean water from nature. The Sundarbans forest in Bangladesh protects millions of people from cyclones, and it is also the home of the Bengal tiger. If we protect the tiger, we also protect the forest. Thirdly, animals are in danger because of humans, so it is our responsibility to save them. When an animal becomes extinct, it is gone forever, and our children will never see it.","Also, the money spent on animals is small compared to other government spending.","In conclusion, I do not agree that protecting endangered animals is a waste of money. Nature and people are connected, so saving animals also helps humans now and in the future."]},{"label":"ADVANCED ESSAY (BAND 7)","words":263,"paras":["It is sometimes argued that the large sums spent on saving endangered animals would be better used to meet human needs. <b>Although human needs are urgent, I strongly disagree that spending money on wildlife protection is a waste.</b>","Admittedly, the argument has some emotional appeal. Millions of people still lack <b>basic needs</b> such as food, clean water and healthcare, and in poorer countries it can seem hard to justify spending money on tigers or elephants while children go hungry.","However, I believe this view is mistaken for several reasons. Firstly, every species plays a role in <b>the balance of nature</b>, and the loss of one species can cause <b>a chain reaction</b> in the <b>ecosystem</b>. Bees, for example, are responsible for pollinating a large proportion of the crops we eat. Secondly, humans <b>depend on nature for</b> food, clean water and medicine, so protecting wildlife is also protecting ourselves. A clear example is the Sundarbans: by protecting the Bengal tiger, Bangladesh also protects the <b>mangrove</b> forest, which acts as a <b>natural barrier</b> against cyclones for millions of people. Thirdly, most species are endangered because of <b>human activity</b> such as <b>deforestation</b> and <b>poaching</b>, so we have a <b>moral responsibility</b> to repair the damage. <b>Once a species is gone</b>, it <b>disappears forever</b>, whereas <b>poverty</b> can be reduced over time. Finally, <b>conservation</b> spending is only <b>a tiny fraction of</b> government budgets, and <b>eco-tourism</b> can even <b>bring in income</b> for local communities.","In conclusion, protecting <b>endangered species</b> is not a waste of money. Since human wellbeing depends on healthy <b>ecosystems</b>, investing in <b>conservation</b> is also an investment in people."]},{"label":"BAND 9 ESSAY","words":337,"paras":["It is occasionally claimed that the substantial funds devoted to protecting <b>endangered species</b> represent a misallocation of resources that could otherwise address pressing human needs. Although human needs are urgent, I strongly disagree that spending money on wildlife protection is a waste, since human welfare and <b>biodiversity</b> are far more closely intertwined than this argument assumes.","The opposing view is not without moral force. Hundreds of millions of people still lack <b>basic needs</b> such as adequate food, sanitation and healthcare, and in countries grappling with widespread <b>poverty</b>, lavish expenditure on rare animals may appear difficult to defend. Governments, after all, operate with finite budgets and must set <b>priorities</b>.","Nevertheless, this reasoning rests on a <b>false choice</b> between people and nature. Every species occupies a niche within its <b>ecosystem</b>, and the disappearance of a <b>keystone species</b> can trigger <b>a chain reaction</b> with severe consequences for humans. The decline of pollinating insects, for instance, directly threatens food security, as a significant proportion of global crops depend on them. More broadly, humans <b>depend on nature for</b> food, clean water and medicine; many modern drugs are derived from plants and animals, and countless others may be lost before they are ever discovered. The Sundarbans offers a compelling local illustration: conserving the Bengal tiger requires preserving the <b>mangrove</b> forest it inhabits, and that forest in turn acts as a <b>natural barrier</b> protecting millions of coastal residents from cyclones and storm surges. Furthermore, since most species are endangered as a direct result of <b>human activity</b>, including <b>deforestation</b>, pollution and <b>poaching</b>, we arguably bear a <b>moral responsibility</b> of <b>stewardship</b> to reverse the damage. Unlike <b>poverty</b>, <b>extinction</b> is <b>irreversible</b>. It is also worth noting that <b>conservation</b> typically accounts for <b>a tiny fraction of</b> public spending, and well-managed <b>eco-tourism</b> can <b>bring in income</b> and create <b>livelihoods</b> for local communities.","In conclusion, protecting <b>endangered species</b> is not an indulgence at the expense of human welfare but an integral part of <b>sustainable development</b>. Investing in the natural world is, ultimately, an investment in ourselves and in <b>future generations</b>."]}],"type":"Opinion (Agree / Disagree)","q":"Some people say that spending large sums of money to protect endangered animals is a waste, and that the money should be spent on human needs instead. To what extent do you agree or disagree?"},{"n":14,"title":"Taxing unhealthy food and sugary drinks","cat":"Health","groups":[{"name":"Reasons to Agree","bn":"একমত হওয়ার কারণ","items":[{"en":"Higher prices discourage people from buying unhealthy food and drinks.","bn":"বেশি দাম মানুষকে অস্বাস্থ্যকর খাবার ও পানীয় কিনতে নিরুৎসাহিত করে।"},{"en":"Obesity and diabetes are rising rapidly and cost health systems huge sums.","bn":"স্থূলতা ও ডায়াবেটিস দ্রুত বাড়ছে এবং স্বাস্থ্যব্যবস্থার বিপুল খরচ হচ্ছে।"},{"en":"Sugar taxes encourage manufacturers to reduce the sugar in their products.","bn":"চিনি কর উৎপাদনকারীদের পণ্যে চিনি কমাতে উৎসাহিত করে।"},{"en":"Tax revenue can be used to make fruit and vegetables cheaper.","bn":"কর রাজস্ব ফলমূল ও শাকসবজি সস্তা করতে ব্যবহার করা যায়।"},{"en":"Taxes on tobacco have already proved that higher prices reduce consumption.","bn":"তামাক কর ইতোমধ্যে প্রমাণ করেছে যে বেশি দাম ব্যবহার কমায়।"}]},{"name":"Reasons to Disagree","bn":"দ্বিমত পোষণের কারণ","items":[{"en":"Such taxes hit poor families hardest, as they spend more of their income on food.","bn":"এমন কর দরিদ্র পরিবারকে সবচেয়ে বেশি আঘাত করে, কারণ তারা আয়ের বেশি অংশ খাবারে ব্যয় করে।"},{"en":"Adults should have the freedom to choose what they eat and drink.","bn":"প্রাপ্তবয়স্কদের কী খাবে ও পান করবে তা বেছে নেওয়ার স্বাধীনতা থাকা উচিত।"},{"en":"People may simply switch to other cheap unhealthy products.","bn":"মানুষ হয়তো অন্য সস্তা অস্বাস্থ্যকর পণ্যে চলে যাবে।"},{"en":"Education about nutrition may change habits more effectively than taxation.","bn":"পুষ্টি বিষয়ক শিক্ষা কর আরোপের চেয়ে বেশি কার্যকরভাবে অভ্যাস বদলাতে পারে।"},{"en":"Small shops and food businesses could lose income.","bn":"ছোট দোকান ও খাদ্য ব্যবসার আয় কমে যেতে পারে।"}]},{"name":"Evaluation: My Answer","bn":"মূল্যায়ন — আমার উত্তর","items":[{"en":"I agree that taxing unhealthy food and sugary drinks is an effective way to improve public health, especially if the money is used to support healthier choices.","bn":"আমি একমত যে অস্বাস্থ্যকর খাবার ও চিনিযুক্ত পানীয়ের ওপর কর জনস্বাস্থ্য উন্নয়নের কার্যকর উপায়, বিশেষ করে যদি অর্থটি স্বাস্থ্যকর বিকল্পে ব্যয় হয়।"},{"en":"I largely agree with such a tax, although it should be combined with education about healthy eating.","bn":"আমি এমন করের সঙ্গে মূলত একমত, তবে এর সঙ্গে স্বাস্থ্যকর খাদ্যাভ্যাস সম্পর্কে শিক্ষাও দেওয়া উচিত।"}]}],"vocab":[["public health","জনস্বাস্থ্য"],["obesity","স্থূলতা"],["diabetes","ডায়াবেটিস"],["sugar tax","চিনি কর"],["junk food","অস্বাস্থ্যকর খাবার"],["consumption","ব্যবহার / ভোগ"],["healthcare costs","স্বাস্থ্যসেবার খরচ"],["manufacturers","উৎপাদনকারী"],["reformulate","উপাদান পরিবর্তন করা"],["revenue","রাজস্ব"],["low-income","নিম্ন আয়ের"],["personal freedom","ব্যক্তিস্বাধীনতা"],["awareness","সচেতনতা"],["subsidise","ভর্তুকি দেওয়া"]],"phrases":[["discourage people from buying","মানুষকে কিনতে নিরুৎসাহিত করা"],["put a strain on","... এর ওপর চাপ সৃষ্টি করা"],["at an alarming rate","উদ্বেগজনক হারে"],["make healthy food more affordable","স্বাস্থ্যকর খাবারকে আরও সাশ্রয়ী করা"],["the nanny state","মানুষের জীবনে অতিরিক্ত নাক গলানো সরকার"],["hit the poor hardest","দরিদ্রদের সবচেয়ে বেশি আঘাত করা"],["change eating habits","খাদ্যাভ্যাস বদলানো"],["pay for itself","নিজের খরচ নিজে তুলে নেওয়া"],["prevention is better than cure","প্রতিকারের চেয়ে প্রতিরোধ ভালো"],["send a clear message","স্পষ্ট বার্তা দেওয়া"]],"sents":[{"en":"Obesity and diabetes are rising at an alarming rate in many countries.","bn":"অনেক দেশে স্থূলতা ও ডায়াবেটিস উদ্বেগজনক হারে বাড়ছে।"},{"en":"These diseases put a strain on public healthcare systems.","bn":"এসব রোগ সরকারি স্বাস্থ্যব্যবস্থার ওপর চাপ সৃষ্টি করে।"},{"en":"A higher price would discourage people from buying sugary drinks.","bn":"বেশি দাম মানুষকে চিনিযুক্ত পানীয় কিনতে নিরুৎসাহিত করবে।"},{"en":"After the UK introduced a sugar tax, many manufacturers reduced the sugar in their drinks.","bn":"যুক্তরাজ্য চিনি কর চালুর পর অনেক উৎপাদনকারী তাদের পানীয়তে চিনি কমিয়েছে।"},{"en":"The revenue could be used to make healthy food more affordable.","bn":"রাজস্ব স্বাস্থ্যকর খাবারকে আরও সাশ্রয়ী করতে ব্যবহার করা যায়।"},{"en":"Critics argue that such taxes hit the poor hardest.","bn":"সমালোচকরা বলেন এমন কর দরিদ্রদের সবচেয়ে বেশি আঘাত করে।"},{"en":"Some people see food taxes as an example of the nanny state.","bn":"কেউ কেউ খাদ্য করকে অতিরিক্ত নাক গলানো সরকারের উদাহরণ মনে করেন।"},{"en":"A tax alone will not change eating habits without education.","bn":"শিক্ষা ছাড়া শুধু কর খাদ্যাভ্যাস বদলাবে না।"}],"xvocab":[["price-sensitive","দামের প্রতি সংবেদনশীল"],["preventable diseases","প্রতিরোধযোগ্য রোগ"],["regressive tax","দরিদ্রদের ওপর বেশি বোঝা চাপায় এমন কর"],["behavioural change","আচরণগত পরিবর্তন"],["tobacco tax","তামাক কর"],["food labelling","খাদ্যের লেবেলিং"],["long-term savings","দীর্ঘমেয়াদি সাশ্রয়"],["paternalistic","অভিভাবকসুলভ / নিয়ন্ত্রণমূলক"]],"xsents":[{"en":"Taxes on tobacco have already shown that higher prices reduce consumption.","bn":"তামাক কর ইতোমধ্যে দেখিয়েছে যে বেশি দাম ব্যবহার কমায়।"},{"en":"Young people are particularly price-sensitive consumers.","bn":"তরুণরা বিশেষভাবে দামের প্রতি সংবেদনশীল ভোক্তা।"},{"en":"Clear food labelling helps people make informed choices.","bn":"স্পষ্ট খাদ্য লেবেলিং মানুষকে জেনেবুঝে সিদ্ধান্ত নিতে সাহায্য করে।"},{"en":"Preventing disease leads to long-term savings for the health system.","bn":"রোগ প্রতিরোধ স্বাস্থ্যব্যবস্থার দীর্ঘমেয়াদি সাশ্রয় ঘটায়।"}],"essays":[{"label":"BASIC ESSAY (BAND 5–6)","words":258,"paras":["Some people think the government should put a tax on unhealthy food and sugary drinks to make people healthier. <b>I agree that taxing unhealthy food and sugary drinks is an effective way to improve public health, especially if the money is used to support healthier choices.</b>","The first reason is that unhealthy food is causing serious health problems. Many people eat too much fast food and drink too many soft drinks. As a result, <b>obesity</b> and <b>diabetes</b> are increasing in many countries, including Bangladesh. These diseases are expensive to treat, and hospitals become very busy.","The second reason is that a tax can change people's behaviour. If sugary drinks become more expensive, people will buy fewer of them. This happened with cigarettes: when the government made them more expensive, many people smoked less. Also, companies may put less sugar in their drinks so that they do not have to pay the tax. For example, in the UK, many drink companies reduced sugar after the <b>sugar tax</b>.","The third reason is that the government can use the tax money in a good way. It can make fruit and vegetables cheaper, build sports facilities or teach children about healthy food in schools.","Some people say this tax is unfair for poor people, because they will pay more. However, if the money is used to make healthy food cheaper, poor people will also benefit.","In conclusion, I believe a tax on unhealthy food and sugary drinks is a good idea. It can reduce health problems and help people make healthier choices."]},{"label":"ADVANCED ESSAY (BAND 7)","words":276,"paras":["It has been suggested that governments should tax <b>junk food</b> and sugary drinks in order to improve <b>public health</b>. <b>I agree that taxing unhealthy food and sugary drinks is an effective way to improve public health, especially if the money is used to support healthier choices.</b>","The main reason for my view is the scale of the health crisis. <b>Obesity</b> and <b>diabetes</b> are rising <b>at an alarming rate</b>, even in developing countries such as Bangladesh, where diets are changing rapidly. These largely <b>preventable diseases</b> <b>put a strain on</b> public healthcare systems and reduce people's quality of life. Since education campaigns alone have not reversed this trend, stronger action is clearly needed.","Secondly, evidence shows that such taxes work. Higher prices <b>discourage people from buying</b> unhealthy products, as taxes on tobacco have already demonstrated. When the UK introduced a <b>sugar tax</b> on soft drinks, many <b>manufacturers</b> responded by reducing the sugar in their products, so consumers benefited even without changing their habits. Furthermore, the <b>revenue</b> could be used to <b>make healthy food more affordable</b>, fund sports facilities or provide nutrition education in schools. In this way, the tax would <b>pay for itself</b> by reducing future <b>healthcare costs</b>.","Admittedly, critics argue that such taxes <b>hit the poor hardest</b>, because <b>low-income</b> families spend a larger share of their income on food, and some see them as an example of <b>the nanny state</b>. However, if the <b>revenue</b> is used to <b>subsidise</b> fruit and vegetables, poorer families would benefit most from the policy.","In conclusion, I believe that taxing unhealthy food and drinks is a justified and effective measure, provided that it is combined with education and support for healthier alternatives."]},{"label":"BAND 9 ESSAY","words":356,"paras":["There is growing support for the idea that governments should levy taxes on unhealthy food and sugary drinks as a means of improving <b>public health</b>. <b>I agree that taxing unhealthy food and sugary drinks is an effective way to improve public health, especially if the money is used to support healthier choices.</b>","The case rests first on the severity of the problem. <b>Obesity</b>, type 2 <b>diabetes</b> and heart disease are rising <b>at an alarming rate</b> worldwide, and developing nations are no exception; in Bangladesh, the rapid spread of fast food and soft drinks has been accompanied by a sharp increase in <b>diabetes</b>. These <b>preventable diseases</b> put an immense strain on healthcare systems and impose enormous costs on families and economies alike. Decades of <b>awareness</b> campaigns have evidently proved insufficient on their own to <b>change eating habits</b>, which suggests that more decisive intervention is warranted.","Secondly, the evidence indicates that such taxes are effective. Consumers, particularly young people, are highly <b>price-sensitive</b>, and experience with tobacco taxes has shown that higher prices reliably reduce <b>consumption</b>. The sugar levy introduced in the United Kingdom offers a particularly instructive example: faced with the tax, many <b>manufacturers</b> chose to <b>reformulate</b> their products, significantly reducing sugar content before the policy even took effect. The <b>revenue</b> generated can then be reinvested to <b>make healthy food more affordable</b>, fund school nutrition programmes or build community sports facilities, creating a virtuous circle and delivering <b>long-term savings</b> for the health system.","It must be acknowledged that critics raise legitimate concerns. Such measures can be regressive, since <b>low-income</b> households spend a greater proportion of their income on food, and some regard them as <b>paternalistic</b> intrusions on <b>personal freedom</b>. However, these objections can largely be addressed through policy design: if <b>revenue</b> is used to <b>subsidise</b> fruit and vegetables, the poorest families stand to gain most, and the state already regulates many products in the interest of public welfare.","In conclusion, I am convinced that taxing unhealthy food and sugary drinks is a justified and effective <b>public health</b> measure, provided that it forms part of a broader strategy that includes education, clear <b>food labelling</b> and support for healthier choices."]}],"type":"Opinion (Agree / Disagree)","q":"Some people believe that governments should impose a tax on unhealthy food and sugary drinks to improve public health. To what extent do you agree or disagree?"},{"n":15,"title":"Rising obesity: causes and solutions","cat":"Health","groups":[{"name":"Causes","bn":"কারণ","items":[{"en":"Processed and fast food high in sugar and fat has become cheap and widely available.","bn":"চিনি ও চর্বিযুক্ত প্রক্রিয়াজাত ও ফাস্ট ফুড সস্তা ও সহজলভ্য হয়ে উঠেছে।"},{"en":"Many people have desk jobs and spend most of the day sitting.","bn":"অনেক মানুষ ডেস্কের চাকরি করেন এবং দিনের বেশিরভাগ সময় বসে কাটান।"},{"en":"Children spend their free time on screens instead of playing outside.","bn":"শিশুরা বাইরে খেলার বদলে অবসর সময় পর্দায় কাটায়।"},{"en":"Busy families have little time to cook healthy meals at home.","bn":"ব্যস্ত পরিবারগুলোর বাড়িতে স্বাস্থ্যকর খাবার রান্নার সময় কম।"},{"en":"Crowded cities have few parks and safe places for exercise.","bn":"জনাকীর্ণ শহরে পার্ক ও ব্যায়ামের নিরাপদ জায়গা কম।"}]},{"name":"Solutions","bn":"সমাধান","items":[{"en":"Schools should teach nutrition and provide daily physical education.","bn":"স্কুলের উচিত পুষ্টি শেখানো এবং প্রতিদিন শারীরিক শিক্ষা দেওয়া।"},{"en":"Governments should restrict junk food advertising aimed at children.","bn":"সরকারের উচিত শিশুদের লক্ষ্য করে অস্বাস্থ্যকর খাবারের বিজ্ঞাপন সীমিত করা।"},{"en":"Taxes on sugary drinks could fund cheaper fruit and vegetables.","bn":"চিনিযুক্ত পানীয়ের কর সস্তা ফলমূল ও শাকসবজির অর্থায়ন করতে পারে।"},{"en":"Cities should build parks, pavements and cycle lanes to encourage activity.","bn":"শহরগুলোর উচিত সক্রিয়তা বাড়াতে পার্ক, ফুটপাত ও সাইকেল লেন তৈরি করা।"},{"en":"Individuals should take responsibility by eating balanced meals and exercising regularly.","bn":"ব্যক্তিদের উচিত সুষম খাবার খেয়ে ও নিয়মিত ব্যায়াম করে দায়িত্ব নেওয়া।"}]},{"name":"Overall Answer","bn":"সার্বিক উত্তর","items":[{"en":"The rise in obesity is mainly caused by unhealthy diets and inactive lifestyles, and it can be tackled through education, better food policies and more opportunities for exercise.","bn":"স্থূলতা বৃদ্ধির প্রধান কারণ অস্বাস্থ্যকর খাদ্যাভ্যাস ও নিষ্ক্রিয় জীবনযাপন, এবং শিক্ষা, উন্নত খাদ্যনীতি ও ব্যায়ামের আরও সুযোগের মাধ্যমে এটি মোকাবিলা করা যায়।"},{"en":"People are becoming overweight mainly because of processed food and sedentary jobs, so governments and individuals must both take action.","bn":"মানুষ মূলত প্রক্রিয়াজাত খাবার ও বসে থাকার কাজের কারণে অতিরিক্ত ওজনের হচ্ছে, তাই সরকার ও ব্যক্তি উভয়কেই পদক্ষেপ নিতে হবে।"}]}],"vocab":[["overweight","অতিরিক্ত ওজন"],["obesity","স্থূলতা"],["processed food","প্রক্রিয়াজাত খাবার"],["sedentary","বসে থাকার / নিষ্ক্রিয়"],["physical activity","শারীরিক কার্যকলাপ"],["calories","ক্যালরি"],["fast food","ফাস্ট ফুড"],["portion size","খাবারের পরিমাণ"],["nutrition","পুষ্টি"],["advertising","বিজ্ঞাপন"],["urbanisation","নগরায়ণ"],["playgrounds","খেলার মাঠ"],["food delivery apps","খাবার সরবরাহ অ্যাপ"],["heart disease","হৃদরোগ"]],"phrases":[["high in sugar and fat","চিনি ও চর্বিতে ভরপুর"],["spend hours sitting","ঘণ্টার পর ঘণ্টা বসে থাকা"],["lack of time","সময়ের অভাব"],["cheap and convenient","সস্তা ও সুবিধাজনক"],["take regular exercise","নিয়মিত ব্যায়াম করা"],["encourage healthy eating","স্বাস্থ্যকর খাদ্যাভ্যাসে উৎসাহিত করা"],["from a young age","ছোটবেলা থেকেই"],["open spaces","খোলা জায়গা"],["lead an active lifestyle","সক্রিয় জীবনযাপন করা"],["take responsibility for","... এর দায়িত্ব নেওয়া"]],"sents":[{"en":"Processed food and fast food are high in sugar and fat.","bn":"প্রক্রিয়াজাত খাবার ও ফাস্ট ফুড চিনি ও চর্বিতে ভরপুর।"},{"en":"Many people spend hours sitting at a desk or in front of a screen.","bn":"অনেকে ডেস্কে বা পর্দার সামনে ঘণ্টার পর ঘণ্টা বসে থাকেন।"},{"en":"Because of lack of time, busy families often rely on fast food.","bn":"সময়ের অভাবে ব্যস্ত পরিবারগুলো প্রায়ই ফাস্ট ফুডের ওপর নির্ভর করে।"},{"en":"Food delivery apps have made unhealthy meals even more convenient.","bn":"খাবার সরবরাহ অ্যাপ অস্বাস্থ্যকর খাবারকে আরও সুবিধাজনক করেছে।"},{"en":"In crowded cities, there are few open spaces or playgrounds for children.","bn":"জনাকীর্ণ শহরে শিশুদের জন্য খোলা জায়গা বা খেলার মাঠ খুব কম।"},{"en":"Schools should teach children about nutrition from a young age.","bn":"স্কুলের উচিত ছোটবেলা থেকেই শিশুদের পুষ্টি সম্পর্কে শেখানো।"},{"en":"Governments could limit the advertising of junk food to children.","bn":"সরকার শিশুদের কাছে অস্বাস্থ্যকর খাবারের বিজ্ঞাপন সীমিত করতে পারে।"},{"en":"Individuals must also take responsibility for their own health.","bn":"ব্যক্তিদেরও নিজের স্বাস্থ্যের দায়িত্ব নিতে হবে।"}],"xvocab":[["calorie-dense","ক্যালরিবহুল"],["epidemic","মহামারি"],["urban planning","নগর পরিকল্পনা"],["cycle lanes","সাইকেল লেন"],["canteen","ক্যান্টিন"],["workplace wellness","কর্মস্থলে সুস্থতা কর্মসূচি"],["marketing","বিপণন"],["lifestyle diseases","জীবনযাপনজনিত রোগ"]],"xsents":[{"en":"Some experts describe obesity as a global epidemic.","bn":"কিছু বিশেষজ্ঞ স্থূলতাকে বৈশ্বিক মহামারি হিসেবে বর্ণনা করেন।"},{"en":"Calorie-dense snacks are aggressively marketed to children.","bn":"ক্যালরিবহুল নাশতা শিশুদের কাছে আক্রমণাত্মকভাবে বিপণন করা হয়।"},{"en":"School canteens should offer healthy, affordable meals.","bn":"স্কুল ক্যান্টিনে স্বাস্থ্যকর, সাশ্রয়ী খাবার থাকা উচিত।"},{"en":"Better urban planning, with parks and cycle lanes, encourages physical activity.","bn":"পার্ক ও সাইকেল লেনসহ ভালো নগর পরিকল্পনা শারীরিক কার্যকলাপকে উৎসাহিত করে।"}],"essays":[{"label":"BASIC ESSAY (BAND 5–6)","words":259,"paras":["Nowadays, more and more people in many countries are <b>overweight</b>. <b>The rise in obesity is mainly caused by unhealthy diets and inactive lifestyles, and it can be tackled through education, better food policies and more opportunities for exercise.</b>","There are two main causes of this problem. The first cause is unhealthy food. <b>Fast food</b> and snacks are cheap, tasty and easy to buy, but they have a lot of sugar and fat. Many people are busy, so they do not have time to cook healthy meals at home. Also, <b>food delivery apps</b> make it very easy to order burgers and pizza. The second cause is lack of exercise. Many people sit all day at work, and in the evening they watch TV or use their phones. Children also play video games instead of playing outside, and in big cities like Dhaka there are not many <b>playgrounds</b>.","There are several solutions to this problem. Firstly, schools should teach children about healthy food and give them more time for sports. If children learn good habits when they are young, they will keep them when they grow up. Secondly, the government can make unhealthy food more expensive and stop advertisements for junk food on children's TV programmes. Thirdly, cities should build more parks and <b>playgrounds</b>, so people can exercise easily. Finally, people should <b>take responsibility for</b> their own health by eating more vegetables and walking more.","In conclusion, people are becoming <b>overweight</b> because of unhealthy food and lack of exercise. Schools, governments and individuals must all work together to solve this problem."]},{"label":"ADVANCED ESSAY (BAND 7)","words":276,"paras":["The proportion of people who are <b>overweight</b> has risen sharply in many countries in recent decades. <b>The rise in obesity is mainly caused by unhealthy diets and inactive lifestyles, and it can be tackled through education, better food policies and more opportunities for exercise.</b>","The first major cause is diet. <b>Processed food</b> and <b>fast food</b>, which are <b>high in sugar and fat</b>, have become <b>cheap and convenient</b>, and aggressive <b>advertising</b> makes them especially attractive to children. At the same time, busy working families often lack time to cook, so they increasingly rely on ready meals and <b>food delivery apps</b>. The second cause is a lack of <b>physical activity</b>. Many adults now have <b>sedentary</b> jobs and <b>spend hours sitting</b> at a desk, while children spend their free time in front of screens. <b>Urbanisation</b> has made this worse; in crowded cities such as Dhaka, there are few <b>open spaces</b> or <b>playgrounds</b> where people can exercise safely.","To tackle this problem, action is needed at several levels. Schools should teach children about <b>nutrition</b> <b>from a young age</b>, provide healthy <b>canteen</b> meals and ensure daily physical education. Governments, meanwhile, could restrict the <b>advertising</b> of junk food to children and introduce taxes on sugary drinks, using the revenue to make healthy food more affordable. Urban planners should also create parks, sports facilities and <b>cycle lanes</b> so that <b>leading an active lifestyle</b> becomes easier. Finally, individuals must <b>take responsibility for</b> their own health by choosing balanced meals and <b>taking regular exercise</b>.","In conclusion, <b>obesity</b> is largely the result of modern diets and <b>sedentary</b> lifestyles. A combination of education, government policy and personal responsibility is the most effective way to reverse this trend."]},{"label":"BAND 9 ESSAY","words":344,"paras":["Rising rates of <b>obesity</b> have become one of the most serious public health challenges of the twenty-first century, affecting wealthy and developing nations alike. <b>The rise in obesity is mainly caused by unhealthy diets and inactive lifestyles, and it can be tackled through education, better food policies and more opportunities for exercise.</b>","The most significant cause is a profound change in eating habits. Processed and <b>fast food</b>, typically high in sugar, salt and fat, has become cheap, convenient and ubiquitous, and it is marketed relentlessly, often directly to children. Modern working patterns compound the problem: with long hours and long commutes, many families lack time to cook from scratch and increasingly depend on <b>calorie-dense</b> ready meals, while <b>food delivery apps</b> now make unhealthy food available at the tap of a screen. Alongside poor diet, <b>physical activity</b> has declined dramatically. A growing proportion of the workforce holds <b>sedentary</b> jobs, <b>spending hours sitting</b> at desks, and leisure time is dominated by screens rather than sport. Rapid <b>urbanisation</b> has exacerbated this, as crowded cities such as Dhaka offer few safe <b>open spaces</b>, parks or <b>playgrounds</b> in which to exercise.","Reversing this trend requires coordinated action. Education is the logical starting point: schools should teach <b>nutrition</b> <b>from a young age</b>, replace unhealthy snacks in <b>canteens</b> with affordable balanced meals, and guarantee daily physical education. Governments must also address the food environment itself, for example by restricting the <b>marketing</b> of junk food to children, requiring clear food labelling and taxing sugary drinks, with the proceeds used to subsidise fresh produce. <b>Urban planning</b> has a role to play too, since cities designed with parks, pavements and <b>cycle lanes</b> make an active lifestyle the easy choice rather than the difficult one. Employers can contribute through <b>workplace wellness</b> schemes. Ultimately, however, individuals must also <b>take responsibility for</b> their own health, as no policy can succeed without personal commitment.","In conclusion, the <b>obesity</b> <b>epidemic</b> is a product of modern diets and <b>sedentary</b> lifestyles. Tackling it will require schools, governments, businesses and individuals to share responsibility for making healthy living both accessible and attractive."]}],"type":"Causes and solutions","q":"In many countries, the number of people who are overweight is increasing. What are the causes of this problem, and what can be done to solve it?"},{"n":16,"title":"An ageing population","cat":"Health","groups":[{"name":"Advantages","bn":"সুবিধা","items":[{"en":"Longer life expectancy shows that healthcare and living standards have improved.","bn":"দীর্ঘ গড় আয়ু দেখায় স্বাস্থ্যসেবা ও জীবনযাত্রার মান উন্নত হয়েছে।"},{"en":"Older people can share their knowledge and experience with younger generations.","bn":"বয়স্করা তাদের জ্ঞান ও অভিজ্ঞতা তরুণ প্রজন্মের সঙ্গে ভাগ করতে পারেন।"},{"en":"Grandparents often provide free childcare, allowing parents to work.","bn":"দাদা-দাদি প্রায়ই বিনা খরচে শিশুদের দেখাশোনা করেন, যা বাবা-মাকে কাজ করতে দেয়।"},{"en":"Many healthy retirees contribute through volunteering and part-time work.","bn":"অনেক সুস্থ অবসরপ্রাপ্ত মানুষ স্বেচ্ছাসেবা ও খণ্ডকালীন কাজের মাধ্যমে অবদান রাখেন।"},{"en":"The needs of older people create new business opportunities.","bn":"বয়স্কদের চাহিদা নতুন ব্যবসার সুযোগ তৈরি করে।"}]},{"name":"Disadvantages","bn":"অসুবিধা","items":[{"en":"Governments must pay pensions to more people for a longer period.","bn":"সরকারকে আরও বেশি মানুষকে দীর্ঘ সময় পেনশন দিতে হয়।"},{"en":"Older people need more medical care, which increases healthcare costs.","bn":"বয়স্কদের বেশি চিকিৎসা প্রয়োজন, যা স্বাস্থ্যসেবার ব্যয় বাড়ায়।"},{"en":"A shrinking workforce must support a growing number of retirees through taxes.","bn":"সংকুচিত কর্মশক্তিকে কর দিয়ে ক্রমবর্ধমান অবসরপ্রাপ্তদের সহায়তা করতে হয়।"},{"en":"Some countries face a serious shortage of workers.","bn":"কিছু দেশ গুরুতর কর্মীর ঘাটতির মুখোমুখি।"},{"en":"Families may struggle to care for elderly relatives with long-term illnesses.","bn":"দীর্ঘস্থায়ী রোগে আক্রান্ত বয়স্ক আত্মীয়দের সেবা করতে পরিবারগুলো হিমশিম খেতে পারে।"}]},{"name":"Evaluation: Which Side Is Stronger?","bn":"মূল্যায়ন — কোন দিক বেশি গুরুত্বপূর্ণ?","items":[{"en":"I believe an ageing population brings serious challenges, but these can be managed and do not outweigh the benefits of longer, healthier lives.","bn":"আমি মনে করি বার্ধক্যপ্রবণ জনসংখ্যা গুরুতর চ্যালেঞ্জ নিয়ে আসে, তবে এগুলো সামলানো যায় এবং দীর্ঘ, সুস্থ জীবনের সুবিধার চেয়ে বেশি নয়।"},{"en":"Longer life expectancy is a positive development, as long as societies adapt their pension and healthcare systems.","bn":"গড় আয়ু বৃদ্ধি একটি ইতিবাচক পরিবর্তন, যদি সমাজ তার পেনশন ও স্বাস্থ্যসেবা ব্যবস্থাকে সেই অনুযায়ী মানিয়ে নেয়।"}]}],"vocab":[["life expectancy","গড় আয়ু"],["ageing population","বার্ধক্যপ্রবণ জনসংখ্যা"],["pension","পেনশন"],["healthcare","স্বাস্থ্যসেবা"],["retirement","অবসর"],["workforce","কর্মশক্তি"],["taxpayers","করদাতারা"],["experience","অভিজ্ঞতা"],["wisdom","প্রজ্ঞা"],["volunteer","স্বেচ্ছাসেবা করা"],["medical advances","চিকিৎসার অগ্রগতি"],["birth rate","জন্মহার"],["care homes","বয়স্ক সেবাকেন্দ্র"],["dependency","নির্ভরশীলতা"]],"phrases":[["live longer and healthier lives","দীর্ঘ ও সুস্থ জীবনযাপন করা"],["a sign of progress","অগ্রগতির লক্ষণ"],["put pressure on","... এর ওপর চাপ সৃষ্টি করা"],["fewer workers supporting more retirees","অধিক অবসরপ্রাপ্তদের সহায়তায় কম কর্মী"],["raise the retirement age","অবসরের বয়স বাড়ানো"],["pass on their knowledge","জ্ঞান অন্যদের দিয়ে যাওয়া"],["look after their grandchildren","নাতি-নাতনির দেখাশোনা করা"],["a valuable resource","মূল্যবান সম্পদ"],["plan ahead","আগে থেকে পরিকল্পনা করা"],["a shortage of workers","কর্মীর ঘাটতি"]],"sents":[{"en":"Medical advances mean that people now live longer and healthier lives.","bn":"চিকিৎসার অগ্রগতির ফলে মানুষ এখন দীর্ঘ ও সুস্থ জীবনযাপন করে।"},{"en":"Longer life expectancy is a sign of progress in healthcare and living standards.","bn":"দীর্ঘ গড় আয়ু স্বাস্থ্যসেবা ও জীবনযাত্রার মানের অগ্রগতির লক্ষণ।"},{"en":"Older people can pass on their knowledge and experience to younger generations.","bn":"বয়স্করা তাদের জ্ঞান ও অভিজ্ঞতা তরুণ প্রজন্মকে দিয়ে যেতে পারেন।"},{"en":"Many grandparents look after their grandchildren while parents work.","bn":"বাবা-মা কাজে থাকলে অনেক দাদা-দাদি নাতি-নাতনির দেখাশোনা করেন।"},{"en":"However, an ageing population puts pressure on pension and healthcare systems.","bn":"তবে বার্ধক্যপ্রবণ জনসংখ্যা পেনশন ও স্বাস্থ্যব্যবস্থার ওপর চাপ সৃষ্টি করে।"},{"en":"In the future, fewer workers will be supporting more retirees.","bn":"ভবিষ্যতে কম কর্মী অধিক অবসরপ্রাপ্তদের সহায়তা করবে।"},{"en":"Some countries are already facing a shortage of workers.","bn":"কিছু দেশ ইতোমধ্যে কর্মীর ঘাটতির মুখোমুখি।"},{"en":"Governments may need to raise the retirement age.","bn":"সরকারকে হয়তো অবসরের বয়স বাড়াতে হবে।"}],"xvocab":[["demographic shift","জনতাত্ত্বিক পরিবর্তন"],["silver economy","বয়স্কদের চাহিদাভিত্তিক অর্থনীতি"],["chronic illness","দীর্ঘস্থায়ী রোগ"],["tax burden","করের বোঝা"],["immigration","অভিবাসন"],["active ageing","সক্রিয় বার্ধক্য"],["caregivers","সেবাদানকারী"],["unsustainable","টেকসই নয় এমন"]],"xsents":[{"en":"Japan is a clear example of a rapid demographic shift.","bn":"জাপান দ্রুত জনতাত্ত্বিক পরিবর্তনের একটি স্পষ্ট উদাহরণ।"},{"en":"Older people often suffer from chronic illnesses that require long-term care.","bn":"বয়স্করা প্রায়ই দীর্ঘস্থায়ী রোগে ভোগেন যার জন্য দীর্ঘমেয়াদি সেবা প্রয়োজন।"},{"en":"The silver economy creates new business opportunities.","bn":"বয়স্কদের চাহিদাভিত্তিক অর্থনীতি নতুন ব্যবসার সুযোগ তৈরি করে।"},{"en":"Without reform, current pension systems may become unsustainable.","bn":"সংস্কার ছাড়া বর্তমান পেনশন ব্যবস্থা টেকসই না-ও থাকতে পারে।"}],"essays":[{"label":"BASIC ESSAY (BAND 5–6)","words":262,"paras":["In many countries today, people live longer, so there are more old people in the population. <b>Longer life expectancy is a positive development, as long as societies adapt their pension and healthcare systems.</b>","There are some disadvantages of this trend. Firstly, older people need more medical care, so hospitals become busier and the government has to spend more money on <b>healthcare</b>. Secondly, the government has to pay <b>pensions</b> to more people for a longer time. At the same time, there are fewer young people working and paying tax, so it can be difficult for the government to find enough money. Thirdly, some countries do not have enough workers, and companies find it hard to hire staff.","However, there are also many advantages. The most important advantage is that people can enjoy a longer life with their families. This shows that medicine and living standards have improved. Also, older people have a lot of <b>experience</b> and knowledge. They can teach young people and give good advice. Many grandparents <b>look after their grandchildren</b>, so parents can go to work. In addition, many older people are still healthy, so they can continue working or do <b>volunteer</b> work in their community.","In my opinion, the problems can be solved. For example, governments can <b>raise the retirement age</b> so that healthy people work for a few more years.","In conclusion, an <b>ageing population</b> brings some problems, especially with money for <b>pensions</b> and <b>healthcare</b>. However, I believe the advantages are greater, because older people are valuable for families and society, and a long life is a good thing."]},{"label":"ADVANCED ESSAY (BAND 7)","words":270,"paras":["Thanks to improvements in <b>healthcare</b> and living standards, people in many countries are living longer, and older people make up a growing share of the population. <b>I believe an ageing population brings serious challenges, but these can be managed and do not outweigh the benefits of longer, healthier lives.</b>","The disadvantages are mainly economic. As more people reach <b>retirement</b>, an <b>ageing population</b> <b>puts pressure on</b> <b>pension</b> and <b>healthcare</b> systems, because older people are more likely to suffer from chronic illnesses that require long-term treatment. At the same time, birth rates are falling in many countries, so fewer workers will be supporting more retirees through their taxes. Countries such as Japan are already facing <b>a shortage of workers</b> in sectors like <b>healthcare</b> and construction.","Nevertheless, the advantages are significant. First and foremost, longer <b>life expectancy</b> is <b>a sign of progress</b> and means that people can enjoy more years with their families. Moreover, older people are <b>a valuable resource</b> for society. They can <b>pass on their knowledge</b> and <b>experience</b> at work and in the community, and many grandparents <b>look after their grandchildren</b>, allowing parents to work. Healthy older people also contribute by <b>volunteering</b> or continuing to work part-time. In addition, the needs of older people create new business opportunities in areas such as health products and travel.","Furthermore, the economic challenges can be addressed through sensible policies, such as gradually <b>raising the retirement age</b>, encouraging <b>immigration</b> and promoting healthy, <b>active ageing</b>.","In conclusion, although an <b>ageing population</b> creates financial pressures, I believe these can be managed through careful planning, and the benefits of people living longer, healthier lives clearly outweigh the drawbacks."]},{"label":"BAND 9 ESSAY","words":332,"paras":["Across much of the world, advances in medicine and rising living standards have extended <b>life expectancy</b> considerably, while falling birth rates mean that older people now form an ever larger share of the population. <b>I believe an ageing population brings serious challenges, but these can be managed and do not outweigh the benefits of longer, healthier lives.</b>","The drawbacks of this <b>demographic shift</b> are predominantly economic. Most obviously, an <b>ageing population</b> <b>puts pressure on</b> <b>pension</b> and <b>healthcare</b> systems. Older citizens are more likely to suffer from chronic illnesses that require costly, long-term treatment, and they draw <b>pensions</b> for far longer than systems designed in the mid-twentieth century ever anticipated. Simultaneously, as birth rates decline, fewer workers will be supporting more retirees, raising the <b>tax burden</b> on the working-age population. Japan, where almost a third of citizens are over sixty-five, illustrates the consequences vividly, with a chronic shortage of workers and <b>caregivers</b> and a <b>pension</b> system under considerable strain.","Nevertheless, these difficulties must be weighed against substantial benefits. It should not be forgotten that longer life is, in itself, a remarkable sign of progress, granting millions of people additional years with their families. Older people are also <b>a valuable resource</b>. They <b>pass on their knowledge</b> and <b>experience</b> in workplaces and communities, and in many societies, including our own, grandparents <b>look after their grandchildren</b>, providing free childcare that enables parents to work. Increasingly, healthy retirees contribute through <b>volunteering</b> or part-time employment, and their spending sustains a growing \"<b>silver economy</b>\" in sectors such as <b>healthcare</b> technology, leisure and travel.","Crucially, the economic challenges, though real, are not insurmountable. Gradually <b>raising the retirement age</b> in line with <b>life expectancy</b>, encouraging managed <b>immigration</b> and investing in preventive <b>healthcare</b> to promote <b>active ageing</b> would all help to keep <b>pension</b> systems from becoming <b>unsustainable</b>.","In conclusion, an <b>ageing population</b> undoubtedly presents financial challenges, but with foresight and reform these can be managed. On balance, the advantages of people living longer, healthier and more productive lives clearly outweigh the disadvantages."]}],"type":"Advantages and disadvantages","q":"In many countries, people are living longer and the proportion of older people in the population is increasing. Do the advantages of this trend outweigh the disadvantages?"},{"n":17,"title":"Preventing illness or treating it?","cat":"Health","groups":[{"name":"Reasons Supporting the First View","bn":"প্রথম মতের পক্ষে কারণ","items":[{"en":"Preventing illness is usually much cheaper than treating it later.","bn":"রোগ প্রতিরোধ সাধারণত পরে চিকিৎসার চেয়ে অনেক সস্তা।"},{"en":"Vaccination, clean water and sanitation have saved millions of lives at low cost.","bn":"টিকাদান, বিশুদ্ধ পানি ও পয়ঃনিষ্কাশন কম খরচে লাখ লাখ জীবন বাঁচিয়েছে।"},{"en":"Health education can reduce lifestyle diseases such as diabetes and heart disease.","bn":"স্বাস্থ্যশিক্ষা ডায়াবেটিস ও হৃদরোগের মতো জীবনধারাজনিত রোগ কমাতে পারে।"},{"en":"Regular screening detects diseases early, when they are easier to treat.","bn":"নিয়মিত পরীক্ষা রোগ প্রাথমিক পর্যায়ে শনাক্ত করে, যখন চিকিৎসা সহজ।"},{"en":"Fewer sick people means less pressure on overcrowded hospitals.","bn":"কম অসুস্থ মানুষ মানে জনাকীর্ণ হাসপাতালের ওপর কম চাপ।"}]},{"name":"Reasons Supporting the Second View","bn":"দ্বিতীয় মতের পক্ষে কারণ","items":[{"en":"Governments have a moral duty to help people who are suffering now.","bn":"এখন যারা কষ্ট পাচ্ছে তাদের সাহায্য করা সরকারের নৈতিক কর্তব্য।"},{"en":"Many hospitals lack doctors, beds and equipment and urgently need funding.","bn":"অনেক হাসপাতালে চিকিৎসক, শয্যা ও সরঞ্জামের অভাব এবং জরুরি অর্থায়ন প্রয়োজন।"},{"en":"Some diseases cannot be prevented and always require treatment.","bn":"কিছু রোগ প্রতিরোধ করা যায় না এবং সবসময় চিকিৎসা প্রয়োজন।"},{"en":"The benefits of prevention campaigns take many years to appear.","bn":"প্রতিরোধ কর্মসূচির সুফল দেখা দিতে অনেক বছর লাগে।"},{"en":"Emergency care saves lives immediately and cannot be delayed.","bn":"জরুরি চিকিৎসা তাৎক্ষণিকভাবে জীবন বাঁচায় এবং তা বিলম্ব করা যায় না।"}]},{"name":"Evaluation: My Opinion","bn":"মূল্যায়ন — আমার মতামত","items":[{"en":"Although treating the sick is essential, I believe governments should prioritise preventing illness, as it saves both lives and money in the long run.","bn":"যদিও অসুস্থদের চিকিৎসা অপরিহার্য, আমি বিশ্বাস করি সরকারের উচিত রোগ প্রতিরোধকে অগ্রাধিকার দেওয়া, কারণ এটি দীর্ঘমেয়াদে জীবন ও অর্থ দুটোই বাঁচায়।"},{"en":"In my opinion, both prevention and treatment are vital, but more investment in prevention would reduce the need for expensive treatment later.","bn":"আমার মতে, প্রতিরোধ ও চিকিৎসা দুটোই জরুরি, তবে প্রতিরোধে বেশি বিনিয়োগ করলে পরে ব্যয়বহুল চিকিৎসার প্রয়োজন কমবে।"}]}],"vocab":[["prevention","প্রতিরোধ"],["treatment","চিকিৎসা"],["vaccination","টিকাদান"
