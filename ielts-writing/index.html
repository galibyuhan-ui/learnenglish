a real-time video communication, a feat unimaginable a generation ago. Such transformations have unquestionably enhanced both efficiency and interpersonal connectivity on a global scale. Nevertheless, detractors persuasively argue that this same technology has spawned novel and insidious forms of pressure. The tacit expectation of perpetual availability, reinforced by smartphones and instant messaging, has eroded the once-clear demarcation between professional and personal spheres. Furthermore, the relentless influx of information can precipitate cognitive fatigue and diminished attentional capacity. Consequently, a growing body of research links habitual device use to heightened anxiety and an impaired ability to disengage. These considerations reveal that technological progress, for all its merits, carries non-negligible psychological costs. In conclusion, while technology has undeniably introduced certain complications into contemporary life, its capacity to simplify and enrich daily existence remains, on balance, more pronounced. I therefore contend that its advantages outweigh its disadvantages, provided individuals cultivate the discipline to regulate their engagement with it mindfully. Ultimately, the manner in which society harnesses technology, rather than the technology itself, will determine whether it liberates or burdens the human experience.","try":"Some people contend that space exploration is a worthwhile use of public funds, whereas others believe such resources would be better directed toward pressing problems on Earth. Discuss both these views and give your own opinion.","check":["Sentence 1–3: Emphatic opening + nuanced contrast + sophisticated thesis.","Sentence 4–8: Body 1 — evaluative topic sentence, complex example, additional point, appositive illustration, confident conclusion.","Sentence 9–13: Body 2 — evaluative opposing topic sentence, precise cause, additional point, evidence-based consequence, concessive conclusion.","Sentence 14–16: Balanced conclusion + conditional opinion + broader reflective closing statement."]}],"struct":[{"lv":"A1","kind":"main","band":"Below the range normally tested by IELTS (roughly Band 1–2). Included here purely as a foundation-building step, so that learners can see how an essay grows, sentence by sentence, before they reach real IELTS levels.","about":"At A1, a learner can only produce very short, simple sentences using the present simple tense and a small range of everyday vocabulary. A full 250-word IELTS essay is not realistic at this stage, so this level uses a short, ten-sentence 'mini-essay' to introduce the basic shape of an opinion essay: introduction, two reasons, and a conclusion.","look":[["Task Response","Answer the question and give one clear, simple opinion."],["Coherence & Cohesion","Put your ideas in order using simple words like and, but, because."],["Lexical Resource","Use a small number of common words, spelled correctly."],["Grammatical Range","Write correct, simple present-tense sentences (Subject + Verb + Object)."]],"para":["Big city or small town — which do you like?","Where do you want to live: a city or a town?","City life or town life — what is your choice?","Do you want to live in a city or a town?"],"rows":[["1","Introduction – say what people think","Some people + like/prefer + object.","Some people like big cities."],["2","Introduction – give your opinion","I + like/prefer + object.","I like small towns."],["3","Reason 1 – topic","Subject + be + adjective.","Small towns are quiet."],["4","Reason 1 – explain","I + can + verb.","I can sleep well at night."],["5","Reason 1 – example","For example, + clause.","For example, there is no traffic noise."],["6","Reason 2 – topic","Also, + subject + be + adjective.","Also, small towns are safe."],["7","Reason 2 – explain","Subject + verb + object.","Everyone knows each other."],["8","Reason 2 – example","For example, + clause.","For example, children can play outside."],["9","Conclusion – restate opinion","In conclusion, I + like/prefer + object.","In conclusion, I like small towns."],["10","Conclusion – final reason","Because + adjective + and + adjective.","Because they are quiet and safe."]],"essay":[["Introduction","Some people like big cities. I like small towns."],["Body Paragraph 1","Small towns are quiet. I can sleep well at night. For example, there is no traffic noise."],["Body Paragraph 2","Also, small towns are safe. Everyone knows each other. For example, children can play outside."],["Conclusion","In conclusion, I like small towns. Because they are quiet and safe."]],"vocab":[["city","a very large town","I live in a big city."],["town","a small place where people live","My town has one school."],["quiet","not noisy","My street is quiet at night."],["noisy","with a lot of sound","Big cities are noisy."],["safe","not dangerous","This town is safe for children."],["neighbour","a person who lives near you","My neighbour is friendly."],["prefer","to like one thing more than another","I prefer tea to coffee."],["because","used to give a reason","I like it because it is quiet."],["also","used to add another idea","Also, it is cheap."],["for example","used to give an example","For example, I can walk to school."],["family","your parents, brothers, sisters, etc.","I love my family."],["alone","without other people","She lives alone."],["help","to support someone","My family helps me."],["fun","enjoyable, giving pleasure","We have fun together."],["talk","to speak with someone","We talk every evening."],["laugh","to make a sound showing you are happy","We laugh a lot."],["food","things people eat","My mother cooks good food."],["night","the dark part of the day","We watch movies at night."]],"link":[["Addition","and, also","I like it. Also, it is safe."],["Contrast","but","It is small, but it is nice."],["Reason","because","I like it because it is quiet."],["Example","for example","For example, it is safe."],["Sequence","first, then, finally","First, it is quiet. Finally, I like it."]],"grammar":["Present simple for facts and opinions: I like, I live, it is.","Simple adjectives placed before the noun: a quiet town, a big city.","Basic linking words: and, because, but, also.","Simple sentence order: Subject + Verb + Object (I like small towns).","Capital letters at the start of every sentence, and a full stop at the end."],"mistakes":["Forgetting the verb 'be' (e.g. writing 'Town quiet' instead of 'The town is quiet').","Wrong word order (e.g. 'Like I small towns' instead of 'I like small towns').","Forgetting the final 's' with he/she/it (e.g. 'She like' instead of 'She likes').","Joining two full sentences with a comma instead of 'and' or 'because'.","Writing only one long idea instead of short, clear sentences."],"feedback":"This essay is written entirely in the present simple with very short, correct sentences. It answers the question with one clear opinion and two simple reasons, each supported by an example. To improve further, the writer could begin joining short sentences with 'and' or 'because' to make the writing sound less repetitive.","fbrows":[["Task Response","Gives one clear opinion with two supporting reasons — appropriate for this level."],["Coherence","Ideas follow a simple, logical order (opinion, reason 1, reason 2, conclusion)."],["Vocabulary","Small but accurate range of everyday words; no obvious spelling errors."],["Grammar","Present simple used correctly throughout; sentences are short but grammatically sound."]],"errors":[["Town very quiet.","The town is very quiet."],["Small towns I like.","I like small towns."],["She like the city.","She likes the city."],["It is quiet, it is safe.","It is quiet, and it is safe."],["i live in a small town","I live in a small town."]],"q":"Do you like living in a big city or a small town? Why?"},{"lv":"A1","kind":"second","band":"This second, fully-worked example uses the practice question from the previous section, so you can compare your own attempt against a complete model answer at the same level.","about":"","look":[],"para":[],"rows":[["1","Introduction – general idea","Some people + like + object.","Some people like to live alone."],["2","Introduction – opinion","I + like + object.","I like to live with my family."],["3","Reason 1 – topic","Subject + be + adjective.","My family is helpful."],["4","Reason 1 – explain","Subject + verb + object.","They help me with my problems."],["5","Reason 1 – example","For example, + clause.","For example, my mother cooks food for me."],["6","Reason 2 – topic","Also, + subject + be + adjective.","Also, my family is fun."],["7","Reason 2 – explain","Subject + verb + together.","We talk and laugh together."],["8","Reason 2 – example","For example, + clause.","For example, we watch movies at night."],["9","Conclusion – restate","In conclusion, I + like + object.","In conclusion, I like to live with my family."],["10","Conclusion – final reason","Because + adjective + and + adjective.","Because they are helpful and fun."]],"essay":[["Introduction","Some people like to live alone. I like to live with my family."],["Body Paragraph 1","My family is helpful. They help me with my problems. For example, my mother cooks food for me."],["Body Paragraph 2","Also, my family is fun. We talk and laugh together. For example, we watch movies at night."],["Conclusion","In conclusion, I like to live with my family. Because they are helpful and fun."]],"vocab":[],"link":[],"grammar":[],"mistakes":[],"feedback":"","fbrows":[],"errors":[],"q":"Do you like living with your family or alone? Why?","trytext":["Cover the sample essay above and rebuild it from the sentence-role table alone, then choose a new topic of your own — such as working from home versus working in an office, or reading books versus watching films — and repeat the full ten-sentence process at this level."]},{"lv":"A2","kind":"main","band":"Roughly comparable to IELTS Band 3–3.5. Essays are still short and simple, but learners can now link two or three ideas together and give a basic example.","about":"At A2, learners can join simple ideas with linking words such as 'firstly', 'secondly' and 'for example', and can use comparative adjectives. The essay grows to a short but complete four-paragraph structure: introduction, two supported reasons, and a conclusion.","look":[["Task Response","Give a clear opinion and support it with two reasons."],["Coherence & Cohesion","Organise your essay into short paragraphs using firstly, secondly and finally."],["Lexical Resource","Use everyday vocabulary plus a few topic words like 'traffic' or 'pollution'."],["Grammatical Range","Use comparative adjectives and simple linking words accurately."]],"para":["Which is better for you: living in a city or a town?","Some people like big cities, others like small towns. What about you?","Would you rather live in a big city or a small town?","Do you prefer city life or town life? Explain your answer."],"rows":[["1","Introduction – background","Nowadays, many people + must/have to + verb.","Nowadays, many people must choose between city life and town life."],["2","Introduction – opinion","In my opinion, + clause + because + reason.","In my opinion, living in a small town is better because it is calmer and friendlier."],["3","Reason 1 – topic sentence","Firstly, + subject + be + comparative adjective.","Firstly, small towns are more peaceful than big cities."],["4","Reason 1 – support","There is/are + less/fewer + noun, so + result.","There is less traffic, so the streets are not noisy."],["5","Reason 1 – example","For instance, + clause.","For instance, I can hear birds singing in the morning instead of car horns."],["6","Reason 2 – topic sentence","Secondly, + subject + be + adjective.","Secondly, people in small towns are usually friendlier."],["7","Reason 2 – support","Subject + often + verb + each other.","Neighbours often know each other and help one another."],["8","Reason 2 – example","For example, + clause.","For example, my neighbour always waters my plants when I am away."],["9","Conclusion – restate opinion","In conclusion, I prefer + noun + to + noun.","In conclusion, I prefer small towns to big cities."],["10","Conclusion – final reason","This is because + clause.","This is because they offer a calmer and more caring lifestyle."]],"essay":[["Introduction","Nowadays, many people must choose between city life and town life. In my opinion, living in a small town is better because it is calmer and friendlier."],["Body Paragraph 1","Firstly, small towns are more peaceful than big cities. There is less traffic, so the streets are not noisy. For instance, I can hear birds singing in the morning instead of car horns."],["Body Paragraph 2","Secondly, people in small towns are usually friendlier. Neighbours often know each other and help one another. For example, my neighbour always waters my plants when I am away."],["Conclusion","In conclusion, I prefer small towns to big cities. This is because they offer a calmer and more caring lifestyle."]],"vocab":[["peaceful","calm and quiet","The countryside is very peaceful."],["traffic","cars and vehicles on the road","There is a lot of traffic in the city."],["neighbour","a person who lives next to you","My neighbour is kind."],["opportunity","a chance to do something","Cities offer more job opportunities."],["crowded","full of people","The bus was very crowded."],["community","a group of people living in the same area","Our community is friendly."],["convenient","easy or useful","Living near the shops is convenient."],["compare","to look at differences between things","Let's compare the two cities."],["firstly / secondly","used to list reasons in order","Firstly, it is cheap. Secondly, it is safe."],["for instance","used to give an example","For instance, rent is much cheaper here."],["environment","the natural world around us","Buses are better for the environment."],["afford","to have enough money for something","Not everyone can afford a car."],["pollution","harmful substances in the air, water, etc.","Traffic causes a lot of pollution."],["journey","a trip from one place to another","My journey to work takes an hour."],["expensive","costing a lot of money","Owning a car can be expensive."],["cheap","costing little money","Bus tickets are cheap."],["replace","to take the place of something","One train can replace many cars."],["reduce","to make something smaller or less","Public transport can reduce pollution."]],"link":[["Addition","also, in addition","It is cheap. Also, it is fast."],["Sequencing","firstly, secondly, finally","Firstly, it is cheap. Secondly, it is safe."],["Contrast","however, but","It is slower; however, it is cheaper."],["Example","for example, for instance","For instance, buses are very cheap."],["Reason/Result","because, so","It is crowded, so I take the train instead."]],"grammar":["Comparative adjectives: busier, quieter, more peaceful, more expensive.","Linking words for ordering ideas: firstly, secondly, finally.","Linking words for examples and reasons: for example, for instance, because, so.","Present simple for general truths and habits: neighbours often help each other.","Simple time expressions: nowadays, usually, always, sometimes."],"mistakes":["Overusing the word 'very' instead of a stronger adjective (e.g. 'very big' instead of 'huge').","Forgetting a linking word between two ideas, making the writing feel disconnected.","Making comparative adjective errors (e.g. 'more quiet' instead of 'quieter').","Writing two ideas as one long run-on sentence without a conjunction.","Giving a reason without a specific example to support it."],"feedback":"This essay clearly states an opinion in the introduction and organises two reasons using 'firstly' and 'secondly'. Comparative adjectives (more peaceful, more expensive) are used accurately. To move toward B1, the writer should start linking ideas across sentences rather than only within them, and try producing one longer, joined sentence per paragraph.","fbrows":[["Task Response","Clear opinion with two developed reasons, each with an example — good for this level."],["Coherence","Firstly/secondly structure makes the organisation easy to follow."],["Vocabulary","Everyday vocabulary plus a few topic words (traffic, community, convenient)."],["Grammar","Comparatives and basic linking words used correctly, with occasional minor slips expected."]],"errors":[["The town is very very quiet.","The town is extremely quiet."],["It is cheap. It is safe.","It is cheap, and it is also safe."],["This town is more quiet than the city.","This town is quieter than the city."],["I like small towns they are calm.","I like small towns because they are calm."],["Small towns are nice for example.","Small towns are nice; for example, the streets are clean."]],"q":"Some people prefer to live in a big city. Other people prefer to live in a small town. Which place do you prefer, and why?"},{"lv":"A2","kind":"second","band":"This second, fully-worked example uses the practice question from the previous section, so you can compare your own attempt against a complete model answer at the same level.","about":"","look":[],"para":[],"rows":[["1","Introduction – background","Nowadays, people can + verb + option A + or + option B.","Nowadays, people can travel by car or by public transport."],["2","Introduction – opinion","In my opinion, + option + is better because + reason.","In my opinion, public transport is better because it is cheaper and better for the environment."],["3","Reason 1 – topic","Firstly, + option + is more + adjective + than + option.","Firstly, public transport is more affordable than driving a car."],["4","Reason 1 – support","You do not need to pay for + list.","You do not need to pay for petrol, parking, or repairs."],["5","Reason 1 – example","For instance, + comparison.","For instance, a monthly bus pass often costs much less than running a car."],["6","Reason 2 – topic","Secondly, + option + is better for + noun.","Secondly, public transport is better for the environment."],["7","Reason 2 – support","Subject + carry many people at once, so + result.","Buses and trains carry many people at once, so they produce less pollution per person."],["8","Reason 2 – example","For example, + comparison.","For example, one full train can replace hundreds of cars on the road."],["9","Conclusion – restate","In conclusion, I prefer + option + to + option.","In conclusion, I prefer public transport to travelling by car."],["10","Conclusion – final reason","This is because + reason.","This is because it saves money and helps protect the environment."]],"essay":[["Introduction","Nowadays, people can travel by car or by public transport. In my opinion, public transport is better because it is cheaper and better for the environment."],["Body Paragraph 1","Firstly, public transport is more affordable than driving a car. You do not need to pay for petrol, parking, or repairs. For instance, a monthly bus pass often costs much less than running a car."],["Body Paragraph 2","Secondly, public transport is better for the environment. Buses and trains carry many people at once, so they produce less pollution per person. For example, one full train can replace hundreds of cars on the road."],["Conclusion","In conclusion, I prefer public transport to travelling by car. This is because it saves money and helps protect the environment."]],"vocab":[],"link":[],"grammar":[],"mistakes":[],"feedback":"","fbrows":[],"errors":[],"q":"Some people like to travel by car. Other people like to travel by public transport. Which do you prefer, and why?","trytext":["Cover the sample essay above and rebuild it from the sentence-role table alone, then choose a new topic of your own — such as working from home versus working in an office, or reading books versus watching films — and repeat the full ten-sentence process at this level."]},{"lv":"B1","kind":"main","band":"Roughly comparable to IELTS Band 4–5. This is close to where many real IELTS candidates start, and is the first level at which the full 'discuss both views and give your opinion' question type is realistic.","about":"At B1, learners can handle a two-sided 'discuss both views' question, using clear topic sentences, supporting details, and one example per paragraph. The introduction now signals both sides of the argument before the writer states a personal opinion.","look":[["Task Response","Address every part of the question, including both views, and give a clear personal opinion."],["Coherence & Cohesion","Use one paragraph per view with a clear topic sentence at the start of each."],["Lexical Resource","Use some less common vocabulary and topic-specific collocations, e.g. 'traffic congestion'."],["Grammatical Range","Mix simple and complex sentences; occasional errors are acceptable if meaning stays clear."]],"para":["Is it better to live in a big city or a small town? Discuss both sides and say what you think.","Some people say city life is better than town life; others disagree. Discuss both views and give your opinion.","Big cities and small towns both have advantages. Discuss both and give your opinion.","Do the benefits of city life outweigh those of small-town life? Discuss both views."],"rows":[["1","Introduction – background","Whether + clause + is a topic that people often debate.","Whether it is better to live in a large city or a small town is a topic that people often debate."],["2","Introduction – thesis (outline both sides + opinion)","While + view A, I believe + view B.","While city life offers more opportunities, I believe small towns provide a better overall quality of life."],["3","Body 1 – topic sentence (view A)","On one hand, + view A + because of + reason.","On one hand, big cities are often seen as better places to live because of the opportunities they provide."],["4","Body 1 – support","Subject + usually + have + list of benefits.","Cities usually have more job openings, higher salaries, and better public services such as hospitals and universities."],["5","Body 1 – example","For example, + specific case.","For example, someone looking for work in finance or technology is far more likely to find a suitable job in a large city than in a small town."],["6","Body 2 – topic sentence (view B)","On the other hand, + view B + because of + reason.","On the other hand, small towns are often considered better because of the quality of life they offer."],["7","Body 2 – support","Life in + place + tends to + be + list of qualities.","Life in a small town tends to be less stressful, with lower living costs, cleaner air, and a stronger sense of community."],["8","Body 2 – example","For instance, + specific case.","For instance, residents of small towns often know their neighbours personally and can rely on them for support."],["9","Conclusion – restate both sides","In conclusion, although + view A, + view B.","In conclusion, although big cities offer greater career opportunities, small towns generally provide a calmer and more supportive environment."],["10","Conclusion – personal opinion","Therefore, I would choose + option.","Therefore, I would choose to live in a small town rather than a big city."]],"essay":[["Introduction","Whether it is better to live in a large city or a small town is a topic that people often debate. While city life offers more opportunities, I believe small towns provide a better overall quality of life."],["Body Paragraph 1","On one hand, big cities are often seen as better places to live because of the opportunities they provide. Cities usually have more job openings, higher salaries, and better public services such as hospitals and universities. For example, someone looking for work in finance or technology is far more likely to find a suitable job in a large city than in a small town."],["Body Paragraph 2","On the other hand, small towns are often considered better because of the quality of life they offer. Life in a small town tends to be less stressful, with lower living costs, cleaner air, and a stronger sense of community. For instance, residents of small towns often know their neighbours personally and can rely on them for support."],["Conclusion","In conclusion, although big cities offer greater career opportunities, small towns generally provide a calmer and more supportive environment. Therefore, I would choose to live in a small town rather than a big city."]],"vocab":[["opportunity","a chance for success or advancement","The city offers many career opportunities."],["quality of life","how comfortable and happy someone's life is","Small towns often have a higher quality of life."],["stressful","causing worry or pressure","City life can be very stressful."],["affordable","not too expensive","Housing here is more affordable."],["public services","services provided by the government, e.g. hospitals, schools","Cities usually have better public services."],["debate","a discussion of an issue with different opinions","This is a topic that people often debate."],["overall","considering everything, in general","Overall, I think small towns are better."],["rely on","to depend on someone or something","You can rely on your neighbours for help."],["sense of community","a feeling of belonging to a group of people","Small towns have a strong sense of community."],["tend to","to usually do or be something","Small towns tend to be quieter."],["burden","a heavy load or responsibility","Free transport would be a financial burden."],["congestion","overcrowding, especially of traffic","Traffic congestion is a major problem in cities."],["subsidise","to help pay the cost of something","The government could subsidise bus fares."],["fund","to provide money for something","It is hard to fund free transport for everyone."],["income","money that a person earns","Low-income families would benefit most."],["maintain","to keep something in good condition","Trains are expensive to maintain."],["benefit","an advantage or helpful effect","Free transport has several benefits."],["drawback","a disadvantage","Cost is the main drawback of this policy."]],"link":[["Contrast","on the one hand / on the other hand, however","On the one hand, it is cheaper; on the other hand, it is slower."],["Concession","although, while","Although it is costly, it reduces pollution."],["Result","therefore, as a result","Fares are low; as a result, more people use the bus."],["Example","for instance, for example","For instance, several cities have tried this policy."],["Addition","in addition, moreover","In addition, it helps lower-income families."],["Summarising","overall, in conclusion","Overall, the benefits seem to outweigh the costs."]],"grammar":["The 'discuss both views' structure: one body paragraph per view, with your opinion woven in from the introduction.","Contrast linkers: while, although, on the one hand / on the other hand, however.","Relative clauses to add detail: hospitals and universities, which are usually better in cities.","Present simple and 'tend to' for general truths: small towns tend to be quieter.","Modal verbs for opinion and possibility: I would choose, this could be because."],"mistakes":["Discussing only one side of the argument instead of both, as the question requires.","Hiding your opinion completely until the conclusion instead of hinting at it in the introduction.","Weak or missing topic sentences, so the reader cannot see the main idea of each paragraph.","Repeating the same linking word (e.g. 'also') too many times instead of varying vocabulary.","Giving a general reason with no specific, concrete example to support it."],"feedback":"This essay successfully discusses both views before giving a personal opinion, with one clearly organised paragraph for each side. Topic sentences are strong, and both examples are specific. To move toward B2, the writer could hint at their own opinion earlier in the introduction and reduce repetition of linking phrases by using synonyms such as 'conversely' or 'in contrast'.","fbrows":[["Task Response","Both views are discussed in balanced detail, and a clear personal opinion is given."],["Coherence","One paragraph per view, each with a topic sentence, support, and an example."],["Vocabulary","Some less common vocabulary and useful collocations (quality of life, sense of community)."],["Grammar","A mix of simple and complex sentences; contrast linkers used accurately."]],"errors":[["Big cities are good because jobs.","Big cities are good because they offer more job opportunities."],["The essay only discusses cities, not towns.","Dedicate one full, balanced paragraph to each side of the argument."],["On the other hand, on the other hand, towns are calm.","On the other hand, small towns tend to be calmer."],["Small towns are nice.","Small towns are nice; for instance, neighbours often know each other personally."],["The conclusion states an opinion never hinted at earlier.","Hint at your opinion in the introduction as well as stating it in the conclusion."]],"q":"Some people believe that living in a big city is better than living in a small town, while others disagree. Discuss both views and give your opinion."},{"lv":"B1","kind":"second","band":"This second, fully-worked example uses the practice question from the previous section, so you can compare your own attempt against a complete model answer at the same level.","about":"","look":[],"para":[],"rows":[["1","Introduction – background","Whether + issue + is a question that + wider group + are currently discussing.","Whether public transport should be free for everyone is a question that many governments are currently discussing."],["2","Introduction – thesis","While + view A, I believe + view B.","While free transport could help many people, I believe it would be difficult for governments to fund properly."],["3","Body 1 – topic (view A)","On one hand, + view A + would bring + result.","On one hand, making public transport free would bring several benefits to society."],["4","Body 1 – support","It would + verb, + verb, and + verb.","It would reduce traffic congestion, lower pollution levels, and make travel easier for people on low incomes."],["5","Body 1 – example","For example, + specific case.","For example, cities that have trialled free public transport have often seen a noticeable drop in the number of private cars on the road."],["6","Body 2 – topic (view B)","On the other hand, + view B + would cause + problem.","On the other hand, providing free transport for everyone would place a heavy financial burden on the government."],["7","Body 2 – support","Subject + be + expensive to + verb, and someone must pay for + list.","Public transport systems are expensive to run and maintain, and someone must pay for fuel, staff, and vehicles."],["8","Body 2 – example","For instance, if + condition, the government would need to + result.","For instance, if fares were removed completely, the government would need to raise taxes or cut funding for other public services."],["9","Conclusion – restate both","In conclusion, although + view A, + view B.","In conclusion, although free public transport could reduce pollution and support poorer citizens, it would be very costly to provide."],["10","Conclusion – opinion","Therefore, I believe + final position.","Therefore, I believe transport should be heavily subsidised rather than completely free."]],"essay":[["Introduction","Whether public transport should be free for everyone is a question that many governments are currently discussing. While free transport could help many people, I believe it would be difficult for governments to fund properly."],["Body Paragraph 1","On one hand, making public transport free would bring several benefits to society. It would reduce traffic congestion, lower pollution levels, and make travel easier for people on low incomes. For example, cities that have trialled free public transport have often seen a noticeable drop in the number of private cars on the road."],["Body Paragraph 2","On the other hand, providing free transport for everyone would place a heavy financial burden on the government. Public transport systems are expensive to run and maintain, and someone must pay for fuel, staff, and vehicles. For instance, if fares were removed completely, the government would need to raise taxes or cut funding for other public services."],["Conclusion","In conclusion, although free public transport could reduce pollution and support poorer citizens, it would be very costly to provide. Therefore, I believe transport should be heavily subsidised rather than completely free."]],"vocab":[],"link":[],"grammar":[],"mistakes":[],"feedback":"","fbrows":[],"errors":[],"q":"Some people think the government should provide free public transport for everyone. Others disagree. Discuss both views and give your opinion.","trytext":["Cover the sample essay above and rebuild it from the sentence-role table alone, then choose a new topic of your own — such as working from home versus working in an office, or reading books versus watching films — and repeat the full ten-sentence process at this level."]},{"lv":"B2","kind":"main","band":"Roughly comparable to IELTS Band 5.5–6.5, the range most test centres consider a good general pass for study or work purposes.","about":"At B2, learners can handle 'to what extent do you agree' questions, take a clear position early, and use hedging language (arguably, to some extent) to sound balanced rather than absolute. Paragraphs are more tightly linked, and vocabulary becomes more precise and less repetitive.","look":[["Task Response","Develop a clear position throughout the whole essay, not only in the conclusion."],["Coherence & Cohesion","Use a logical progression of ideas with a range of cohesive devices, avoiding repetition."],["Lexical Resource","Use precise, less common vocabulary and be aware of style; avoid informal words."],["Grammatical Range","Use a mix of simple and complex structures with good control and few errors."]],"para":["To what extent do you agree that cities offer more advantages than small towns?","Some claim urban life is superior to life in smaller towns. Do you agree or disagree?","Is it accurate to say that city living is generally more advantageous than small-town living?","How far do you agree with the view that cities offer a better life than small towns?"],"rows":[["1","Introduction – paraphrase the question","It has become increasingly common to hear the claim that + paraphrased statement.","It has become increasingly common to hear the claim that urban living is inherently superior to life in smaller communities."],["2","Introduction – clear thesis","Although + concession, I would argue that + counter-position.","Although cities undoubtedly offer certain economic and cultural advantages, I would argue that this view oversimplifies the issue, as small towns also provide significant benefits that cities cannot easily replicate."],["3","Body 1 – topic sentence","It is true that + concession point.","It is true that cities tend to provide greater economic and educational opportunities than smaller towns."],["4","Body 1 – support","The concentration of + list creates + result.","The concentration of businesses, universities, and cultural institutions in urban centres creates a wider range of career paths and access to specialised services."],["5","Body 1 – example","For instance, + specific professional case.","For instance, a graduate seeking a career in medicine or engineering will typically find far more opportunities in a metropolitan area than in a rural setting."],["6","Body 2 – topic sentence (turn)","Nevertheless, this advantage often comes at the expense of + counterpoint.","Nevertheless, this economic advantage often comes at the expense of quality of life, which is where small towns tend to excel."],["7","Body 2 – support","Residents of + place + generally benefit from + list, contributing to + result.","Residents of smaller communities generally benefit from lower costs of living, reduced pollution, and stronger social cohesion, all of which contribute to greater overall wellbeing."],["8","Body 2 – example (research-based)","Research has consistently shown that + finding.","Research has consistently shown that people in smaller communities report higher levels of life satisfaction, partly because of closer relationships with neighbours and less time spent commuting."],["9","Conclusion – balanced restatement","In conclusion, while + concession, they are not unambiguously + claim.","In conclusion, while cities offer clear economic advantages, they are not unambiguously superior to small towns once quality of life is taken into account."],["10","Conclusion – final nuance","Ultimately, + conditional statement.","Ultimately, the best choice depends on whether an individual prioritises career opportunities or personal wellbeing."]],"essay":[["Introduction","It has become increasingly common to hear the claim that urban living is inherently superior to life in smaller communities. Although cities undoubtedly offer certain economic and cultural advantages, I would argue that this view oversimplifies the issue, as small towns also provide significant benefits that cities cannot easily replicate."],["Body Paragraph 1","It is true that cities tend to provide greater economic and educational opportunities than smaller towns. The concentration of businesses, universities, and cultural institutions in urban centres creates a wider range of career paths and access to specialised services. For instance, a graduate seeking a career in medicine or engineering will typically find far more opportunities in a metropolitan area than in a rural setting."],["Body Paragraph 2","Nevertheless, this economic advantage often comes at the expense of quality of life, which is where small towns tend to excel. Residents of smaller communities generally benefit from lower costs of living, reduced pollution, and stronger social cohesion, all of which contribute to greater overall wellbeing. Research has consistently shown that people in smaller communities report higher levels of life satisfaction, partly because of closer relationships with neighbours and less time spent commuting."],["Conclusion","In conclusion, while cities offer clear economic advantages, they are not unambiguously superior to small towns once quality of life is taken into account. Ultimately, the best choice depends on whether an individual prioritises career opportunities or personal wellbeing."]],"vocab":[["inherently","in a basic or permanent way","Cities are not inherently better than small towns."],["replicate","to copy or reproduce something exactly","Small towns offer benefits that cities cannot easily replicate."],["concentration","a large amount gathered in one place","There is a high concentration of businesses in cities."],["cohesion","the state of forming a united whole","Social cohesion is stronger in small communities."],["wellbeing","the state of being comfortable, healthy and happy","Quality of life affects overall wellbeing."],["commute","to travel regularly between home and work","City workers often spend hours commuting."],["oversimplify","to make something seem simpler than it really is","This view oversimplifies a complex issue."],["unambiguously","in a way that has only one clear meaning","The data does not unambiguously support this claim."],["at the expense of","causing harm to something else in order to achieve something","Growth often comes at the expense of the environment."],["contribute to","to help cause or bring about a result","Lower costs contribute to a higher quality of life."],["convenience","the quality of being easy to use or access","Online shopping offers great convenience."],["disconnect","to stop being connected","It is hard to disconnect from work emails."],["anxiety","a feeling of worry or nervousness","Constant notifications can cause anxiety."],["confident","feeling sure about one's abilities","Not everyone feels confident using new apps."],["transform","to change completely","Technology has transformed daily communication."],["simplify","to make something easier","Apps simplify many everyday tasks."],["overlook","to fail to notice or consider","The downsides of technology are often overlooked."],["genuinely","truly, really","Some problems are genuinely caused by overuse of devices."]],"link":[["Contrast","whereas, in contrast, nevertheless","Cities offer jobs, whereas towns offer calm."],["Concession","although, while, it is true that","While cities are convenient, they can be stressful."],["Result","consequently, as a result of","Consequently, stress levels can rise."],["Hedging","arguably, to some extent, tends to","This view is, to some extent, an oversimplification."],["Emphasis","in particular, notably","Notably, research supports this pattern."],["Addition","moreover, furthermore","Moreover, costs of living are usually lower."]],"grammar":["Clear thesis statements with hedging: I would argue that, to some extent, arguably.","Concession-and-counter structures: It is true that X; nevertheless, Y.","Passive voice for objectivity: Research has been conducted; it is often argued that.","Complex sentences with subordinate clauses: which is where small towns tend to excel.","Cohesive devices linking whole paragraphs, not just sentences: this advantage, this view, this claim."],"mistakes":["Stating a position that is too extreme or too vague, instead of a clear, moderate stance.","Failing to paraphrase the question in the introduction and simply copying it.","Overgeneralising with words like 'always' or 'everyone' instead of more accurate, hedged language.","Weak transitions between paragraphs, so the essay reads as a list rather than an argument.","Using informal vocabulary (e.g. 'a lot of', 'good') where more precise academic words are expected."],"feedback":"This essay states a clear, hedged position in the introduction and maintains it throughout, rather than only revealing an opinion in the conclusion. Vocabulary is precise (inherently, replicate, cohesion) and cohesive devices link ideas across paragraphs, not just within them. To move toward C1, the writer could vary sentence openings further and integrate more specific data or research references.","fbrows":[["Task Response","A clear, hedged position is developed and sustained throughout the whole essay."],["Coherence","Cohesive devices connect whole paragraphs (this advantage, this claim), not just sentences."],["Vocabulary","Precise, less common academic vocabulary used appropriately and mostly accurately."],["Grammar","Complex sentences with subordinate clauses and passive voice used with good control."]],"errors":[["Everyone thinks cities are better.","Many people believe that cities are generally more advantageous."],["The introduction copies the question directly.","Paraphrase the question using different vocabulary and structure."],["It is a lot of good things about cities.","Cities offer a considerable number of advantages."],["Body 2 starts with no link to Body 1.","Nevertheless, this economic advantage often comes at a cost."],["Cities are good but towns are also good.","While cities offer clear economic advantages, small towns provide a superior quality of life in several respects."]],"q":"It is often argued that city life offers more advantages than life in a small town. To what extent do you agree or disagree with this statement?"},{"lv":"B2","kind":"second","band":"This second, fully-worked example uses the practice question from the previous section, so you can compare your own attempt against a complete model answer at the same level.","about":"","look":[],"para":[],"rows":[["1","Introduction – paraphrase","It is often suggested that + claim.","It is often suggested that modern technology has fundamentally transformed everyday life for the better."],["2","Introduction – thesis","While I accept + concession, I would argue that + counter-position.","While I accept that technology has brought considerable convenience, I would argue that it has simultaneously introduced new forms of complexity that should not be overlooked."],["3","Body 1 – topic","It is certainly true that + concession point.","It is certainly true that technology has simplified many everyday tasks."],["4","Body 1 – support","Devices + now allow people to + list, without + past problem.","Smartphones and apps now allow people to shop, bank, and communicate instantly, without the delays that such tasks once involved."],["5","Body 1 – example","For instance, + specific process + a process that previously required + past process.","For instance, online banking enables users to transfer money or pay bills within seconds, a process that previously required a visit to a physical branch."],["6","Body 2 – topic (turn)","Nevertheless, this convenience has been accompanied by + counterpoint.","Nevertheless, this convenience has been accompanied by new challenges that many people find genuinely complicated."],["7","Body 2 – support","The sheer number of + list that must be managed can create + result.","The sheer number of devices, passwords, and updates that must be managed can create stress, particularly for those who are less technologically confident."],["8","Body 2 – example","Research has shown that + finding.","Research has shown that constant connectivity through smartphones and social media is linked to increased anxiety and difficulty disconnecting from work."],["9","Conclusion – balanced restatement","In conclusion, while + concession, it has also + counterpoint.","In conclusion, while technology has undeniably made many practical tasks more convenient, it has also added new layers of complexity to daily life."],["10","Conclusion – final nuance","Ultimately, + conditional statement.","Ultimately, whether technology feels helpful or overwhelming often depends on how well an individual manages its use."]],"essay":[["Introduction","It is often suggested that modern technology has fundamentally transformed everyday life for the better. While I accept that technology has brought considerable convenience, I would argue that it has simultaneously introduced new forms of complexity that should not be overlooked."],["Body Paragraph 1","It is certainly true that technology has simplified many everyday tasks. Smartphones and apps now allow people to shop, bank, and communicate instantly, without the delays that such tasks once involved. For instance, online banking enables users to transfer money or pay bills within seconds, a process that previously required a visit to a physical branch."],["Body Paragraph 2","Nevertheless, this convenience has been accompanied by new challenges that many people find genuinely complicated. The sheer number of devices, passwords, and updates that must be managed can create stress, particularly for those who are less technologically confident. Research has shown that constant connectivity through smartphones and social media is linked to increased anxiety and difficulty disconnecting from work."],["Conclusion","In conclusion, while technology has undeniably made many practical tasks more convenient, it has also added new layers of complexity to daily life. Ultimately, whether technology feels helpful or overwhelming often depends on how well an individual manages its use."]],"vocab":[],"link":[],"grammar":[],"mistakes":[],"feedback":"","fbrows":[],"errors":[],"q":"Some people believe that technology has made life more convenient, while others think it has made life more complicated. To what extent do you agree with this statement?","trytext":["Cover the sample essay above and rebuild it from the sentence-role table alone, then choose a new topic of your own — such as working from home versus working in an office, or reading books versus watching films — and repeat the full ten-sentence process at this level."]},{"lv":"C1","kind":"main","band":"Roughly comparable to IELTS Band 7–8, the range typically required for competitive university admission or skilled professional migration.","about":"At C1, learners can handle long, multi-clause questions and produce essays with sophisticated signposting, varied sentence structures, and precise academic vocabulary. The essay below explicitly previews its own structure in the introduction, a technique examiners associate with higher bands.","look":[["Task Response","Fully address all parts of the task with well-developed, extended supporting ideas."],["Coherence & Cohesion","Manage paragraphing skilfully and use a wide range of linking devices flexibly."],["Lexical Resource","Use a wide vocabulary resource flexibly and precisely, with rare errors in word choice or spelling."],["Grammatical Range","Use a wide range of complex structures, with the majority of sentences error-free."]],"para":["To what extent does urban living offer superior opportunities compared with life in smaller communities, and at what social and environmental cost?","Some contend that the opportunities cities provide outweigh the social and environmental costs of urbanisation, whereas others disagree. Discuss both views.","Weigh the opportunities of urban living against its social and environmental costs, and present your own view.","Does the growth of cities represent unambiguous progress, or does it come at a significant social and environmental price?"],"rows":[["1","Introduction – wider background","The rapid expansion of + phenomenon + has fuelled an ongoing debate as to whether + question.","The rapid expansion of urban centres over the past century has fuelled an ongoing debate as to whether city living genuinely represents an improvement on life in smaller, rural communities."],["2","Introduction – thesis with essay preview","This essay will examine + point A + and + point B, before concluding that + final position.","This essay will examine both the opportunities that cities generate and the social and environmental costs they impose, before concluding that a balanced approach, rather than an outright preference for either lifestyle, is most appropriate."],["3","Body 1 – topic sentence","Proponents of + position + point primarily to + main factor.","Proponents of urban living point primarily to the sheer breadth of economic and professional opportunities that cities afford."],["4","Body 1 – support with cause-effect","Because + cause, city dwellers typically enjoy + list of results.","Because businesses, financial institutions, and specialised industries tend to cluster in metropolitan areas, city dwellers typically enjoy access to a far wider array of career paths, higher average salaries, and cutting-edge educational and healthcare facilities."],["5","Body 1 – example (sector-specific)","The + sector, for example, is heavily concentrated in + place, meaning that + consequence.","The technology sector, for example, is heavily concentrated in a handful of global cities, meaning that professionals in that field often have little choice but to relocate to urban hubs in order to advance their careers."],["6","Body 2 – topic sentence (turn)","Critics, however, contend that these benefits are offset by + counterpoint.","Critics, however, contend that these economic benefits are offset by considerable social and environmental drawbacks."],["7","Body 2 – support (list of issues)","Issue A, issue B, and issue C are frequently cited as consequences of + cause, all of which can diminish + result.","Overcrowding, air pollution, rising property prices, and the erosion of close-knit community ties are frequently cited as consequences of rapid urbanisation, all of which can diminish residents' overall quality of life."],["8","Body 2 – example (research-based)","Studies of + topic, for instance, have linked + cause to + effect, problems that are far less pronounced in + comparison.","Studies of urban stress, for instance, have linked high population density and long commuting times to elevated rates of anxiety and social isolation, problems that are far less pronounced in smaller towns."],["9","Conclusion – balanced synthesis","In conclusion, whilst + concession, this advantage is frequently accompanied by + counterweight.","In conclusion, whilst cities undeniably offer superior professional and economic prospects, this advantage is frequently accompanied by tangible social and environmental costs that rural and small-town life largely avoids."],["10","Conclusion – reasoned opinion","In my view, therefore, the ideal solution lies not in X, but in Y.","In my view, therefore, the ideal solution lies not in favouring one setting over the other, but in urban planning that seeks to combine the opportunities of city life with the liveability traditionally associated with smaller communities."]],"essay":[["Introduction","The rapid expansion of urban centres over the past century has fuelled an ongoing debate as to whether city living genuinely represents an improvement on life in smaller, rural communities. This essay will examine both the opportunities that cities generate and the social and environmental costs they impose, before concluding that a balanced approach, rather than an outright preference for either lifestyle, is most appropriate."],["Body Paragraph 1","Proponents of urban living point primarily to the sheer breadth of economic and professional opportunities that cities afford. Because businesses, financial institutions, and specialised industries tend to cluster in metropolitan areas, city dwellers typically enjoy access to a far wider array of career paths, higher average salaries, and cutting-edge educational and healthcare facilities. The technology sector, for example, is heavily concentrated in a handful of global cities, meaning that professionals in that field often have little choice but to relocate to urban hubs in order to advance their careers."],["Body Paragraph 2","Critics, however, contend that these economic benefits are offset by considerable social and environmental drawbacks. Overcrowding, air pollution, rising property prices, and the erosion of close-knit community ties are frequently cited as consequences of rapid urbanisation, all of which can diminish residents' overall quality of life. Studies of urban stress, for instance, have linked high population density and long commuting times to elevated rates of anxiety and social isolation, problems that are far less pronounced in smaller towns."],["Conclusion","In conclusion, whilst cities undeniably offer superior professional and economic prospects, this advantage is frequently accompanied by tangible social and environmental costs that rural and small-town life largely avoids. In my view, therefore, the ideal solution lies not in favouring one setting over the other, but in urban planning that seeks to combine the opportunities of city life with the liveability traditionally associated with smaller communities."]],"vocab":[["proponents","people who support an idea or plan","Proponents of urban living cite economic growth."],["offset","to balance out or counteract something","The benefits are offset by significant drawbacks."],["erosion","the gradual wearing away or destruction of something","The erosion of community ties is a common concern."],["cutting-edge","most advanced or up to date","Cities offer cutting-edge medical facilities."],["disproportionate","too large or small in relation to something else","Cities receive a disproportionate share of investment."],["tangible","clear and definite; able to be perceived","The costs of urbanisation are tangible, not merely theoretical."],["liveability","the degree to which a place is pleasant to live in","Urban planners increasingly focus on liveability."],["urbanisation","the process by which more people come to live in cities","Rapid urbanisation has strained public infrastructure."],["agglomeration","the clustering of related activity in one place","Agglomeration effects boost productivity in cities."],["underpinned by","supported or given a basis by","The argument is underpinned by strong economic data."],["offshoring","moving business operations to another country","Offshoring has reduced costs for many firms."],["exploit","to use something, sometimes unfairly, for benefit","Corporations can exploit weaker regulations abroad."],["disproportionately","in a way that is too large or small compared to something else","Benefits have accrued disproportionately to large firms."],["counterargument","an argument opposing another argument","A strong counterargument exists on the other side."],["uneven","not equally distributed","The gains from globalisation have been uneven."],["distribution","the way something is shared out","The distribution of wealth has become a major concern."],["poverty","the state of being extremely poor","Export growth has lifted many out of poverty."],["competitiveness","the ability to compete successfully","Lower costs improve a firm's competitiveness."]],"link":[["Contrast","whilst, by contrast, conversely","Whilst cities generate wealth, they also generate inequality."],["Cause/Effect","this is largely attributable to, consequently","This is largely attributable to weaker labour regulations abroad."],["Concession","it would be inaccurate to claim that, admittedly","Admittedly, some workers have benefited considerably."],["Signposting","this essay will consider, it is worth noting that","This essay will consider both sides before concluding."],["Emphasis","not least because, particularly","This matters, not least because inequality is rising."],["Synthesis","in my view, therefore, on balance","On balance, the picture is considerably more mixed."]],"grammar":["Essay-preview thesis statements that map out the structure to come.","Nominalisation for a more academic register: the erosion of ties (not: ties are eroded).","Varied sentence openings: Because..., Critics, however,..., Studies of... .","Precise cause-effect and concession linking: this comes at the expense of, offset by, whilst.","Complex noun phrases: cutting-edge educational and healthcare facilities."],"mistakes":["Sentences that grow so long and layered that the main point becomes unclear.","Insufficient signposting between paragraphs, leaving the argument's structure implicit rather than explicit.","An imbalance between the two sides of the discussion, with one view argued in far more depth than the other.","Vague topic sentences that do not clearly state the paragraph's main claim.","Overuse of the passive voice, which can make writing feel indirect or evasive."],"feedback":"This essay previews its own structure in the introduction, a technique associated with higher-band writing, and each body paragraph is supported with a specific, well-chosen example. Vocabulary is wide and precise (proponents, offset, erosion). To move toward C2, the writer could interrogate the question itself more critically, rather than only answering it, and use a wider variety of complex clause structures.","fbrows":[["Task Response","All parts of the task are addressed with well-developed, extended supporting ideas."],["Coherence","Skilful paragraphing, with the introduction previewing the essay's own structure."],["Vocabulary","A wide resource used flexibly and precisely, with rare inaccuracies."],["Grammar","A wide range of complex structures, with the large majority of sentences error-free."]],"errors":[["Cities which have many businesses and also universities and hospitals which are good and cities are places where because of this many people who want good jobs go to live there and this is why cities are seen as better by many people.","Because cities concentrate businesses, universities, and hospitals in one place, they attract people seeking better job opportunities, which is why many consider urban life superior."],["The introduction does not preview the essay's structure.","Add a sentence such as: 'This essay will examine both perspectives before reaching a conclusion.'"],["Body 1 is far longer and more detailed than Body 2.","Balance both body paragraphs at a similar length and depth of development."],["Cities are discussed in this paragraph.","Proponents of urban living point primarily to the breadth of economic opportunity that cities generate."],["It is argued by many that cities are being chosen by workers.","Many workers are choosing cities for their careers."]],"q":"The growth of large cities has led some to argue that urban living provides superior opportunities compared with rural or small-town life, while others contend that this comes at a significant social and environmental cost. Discuss both perspectives and provide your own opinion."},{"lv":"C1","kind":"second","band":"This second, fully-worked example uses the practice question from the previous section, so you can compare your own attempt against a complete model answer at the same level.","about":"","look":[],"para":[],"rows":[["1","Introduction – background","The accelerating pace of + phenomenon + has prompted considerable debate as to + question.","The accelerating pace of globalisation over recent decades has prompted considerable debate as to who its principal beneficiaries actually are."],["2","Introduction – thesis with preview","This essay will consider + view A + and + view B, before concluding that + final position.","This essay will consider both the argument that large corporations have gained disproportionately from globalisation and the counterargument that ordinary citizens have also benefited, before concluding that the distribution of benefits has, in practice, been highly uneven."],["3","Body 1 – topic","Those who argue + view A point primarily to + main factor.","Those who argue that corporations have benefited most point primarily to the ability of multinational companies to exploit global markets and labour."],["4","Body 1 – support (cause-effect)","Because + cause, large firms are able to + result far more easily than + comparison.","Because large firms can relocate production to countries with lower labour costs and weaker regulations, they are able to reduce expenses and increase profits far more easily than smaller, domestically-based businesses."],["5","Body 1 – example","The practice of + practice, for example, has allowed + result while + consequence.","The practice of offshoring manufacturing, for example, has allowed numerous corporations to cut costs substantially while workers in higher-wage economies have frequently faced job losses as a direct result."],["6","Body 2 – topic (turn)","Others, however, contend that + view B, particularly as + role.","Others, however, contend that ordinary citizens have gained considerably from globalisation as well, particularly as consumers."],["7","Body 2 – support","Increased X have generally driven down + result, while + second benefit.","Increased international trade and competition have generally driven down the prices of consumer goods, while access to global markets has created new employment opportunities in many developing economies."],["8","Body 2 – example","For instance, the growth of + trend has + positive outcome, even as it has simultaneously + second outcome.","For instance, the growth of export-oriented manufacturing in parts of Asia has lifted millions of workers out of poverty over the past three decades, even as it has simultaneously benefited the corporations that employ them."],["9","Conclusion – synthesis","In conclusion, whilst + concession, it would be inaccurate to claim + overstatement.","In conclusion, whilst large corporations have clearly captured a substantial share of the gains from globalisation, it would be inaccurate to claim that ordinary citizens have not benefited at all."],["10","Conclusion – reasoned opinion","In my view, therefore, the central issue is not X, but Y.","In my view, therefore, the central issue is not whether globalisation has produced any benefit for citizens, but whether that benefit has been distributed as fairly as it should be."]],"essay":[["Introduction","The accelerating pace of globalisation over recent decades has prompted considerable debate as to who its principal beneficiaries actually are. This essay will consider both the argument that large corporations have gained disproportionately from globalisation and the counterargument that ordinary citizens have also benefited, before concluding that the distribution of benefits has, in practice, been highly uneven."],["Body Paragraph 1","Those who argue that corporations have benefited most point primarily to the ability of multinational companies to exploit global markets and labour. Because large firms can relocate production to countries with lower labour costs and weaker regulations, they are able to reduce expenses and increase profits far more easily than smaller, domestically-based businesses. The practice of offshoring manufacturing, for example, has allowed numerous corporations to cut costs substantially while workers in higher-wage economies have frequently faced job losses as a direct result."],["Body Paragraph 2","Others, however, contend that ordinary citizens have gained considerably from globalisation as well, particularly as consumers. Increased international trade and competition have generally driven down the prices of consumer goods, while access to global markets has created new employment opportunities in many developing economies. For instance, the growth of export-oriented manufacturing in parts of Asia has lifted millions of workers out of poverty over the past three decades, even as it has simultaneously benefited the corporations that employ them."],["Conclusion","In conclusion, whilst large corporations have clearly captured a substantial share of the gains from globalisation, it would be inaccurate to claim that ordinary citizens have not benefited at all. In my view, therefore, the central issue is not whether globalisation has produced any benefit for citizens, but whether that benefit has been distributed as fairly as it should be."]],"vocab":[],"link":[],"grammar":[],"mistakes":[],"feedback":"","fbrows":[],"errors":[],"q":"Some people argue that globalisation has primarily benefited large corporations rather than ordinary citizens. Discuss both perspectives and give your opinion.","trytext":["Cover the sample essay above and rebuild it from the sentence-role table alone, then choose a new topic of your own — such as working from home versus working in an office, or reading books versus watching films — and repeat the full ten-sentence process at this level."]},{"lv":"C2","kind":"main","band":"Roughly comparable to IELTS Band 8.5–9, the highest range, associated with near-native command of academic English.","about":"At C2, learners produce essays with genuine rhetorical sophistication: abstract, nominalised argumentation, precise academic collocations, and carefully calibrated hedging that avoids both overstatement and vagueness. The sample below models the kind of essay that would be used as a Band 9 benchmark.","look":[["Task Response","Fully and appropriately address all parts with a fully developed, consistently relevant position."],["Coherence & Cohesion","Use cohesion so skilfully that it attracts no attention, with seamless paragraphing."],["Lexical Resource","Use a wide range of vocabulary with full flexibility, precision, and natural, sophisticated control."],["Grammatical Range","Use a full range of structures naturally and accurately, with only rare, non-systematic slips."]],"para":["How justified is the tendency to equate metropolitan life with progress and to dismiss rural communities as stagnant?","Assess the validity of framing urban life as inherently progressive and rural life as inherently parochial.","Is the characterisation of cities as unequivocally progressive, and rural areas as economically stagnant, an accurate reflection of reality?","Critically evaluate the dichotomy commonly drawn between dynamic urban centres and supposedly stagnant rural communities."],"rows":[["1","Introduction – critical framing of the debate","Contemporary discourse surrounding + topic is often underpinned by an implicit assumption that + claim.","Contemporary discourse surrounding urbanisation is often underpinned by an implicit, and arguably unexamined, assumption that metropolitan life constitutes the pinnacle of modern progress, while rural existence is relegated to the status of an anachronism."],["2","Introduction – nuanced thesis","This essay contends that such a dichotomy, though rhetorically persuasive, fails to withstand close scrutiny, since + reasoning.","This essay contends that such a dichotomy, though rhetorically persuasive, fails to withstand close scrutiny, since the presumed superiority of urban life is neither universally experienced nor free of substantial, often underreported, costs."],["3","Body 1 – concessive topic sentence","Admittedly, the case for + claim rests on genuinely compelling foundations.","Admittedly, the case for the economic primacy of cities rests on genuinely compelling foundations."],["4","Body 1 – support with technical concept","Concept X, whereby + explanation, has been extensively documented in field Y, lending empirical credibility to + claim.","Agglomeration effects, whereby the co-location of firms, talent, and capital generates productivity gains unattainable in dispersed rural economies, have been extensively documented in urban economics, lending empirical credibility to claims of the city's economic dynamism."],["5","Body 1 – example (data-driven)","The disproportionate concentration of + list within + place illustrates the extent to which + trend.","The disproportionate concentration of venture capital, patent filings, and high-value employment within a small number of global cities illustrates the extent to which innovation has become geographically clustered rather than evenly distributed."],["6","Body 2 – sophisticated turn","Nevertheless, this narrative of + claim obscures a range of externalities that complicate + assumption.","Nevertheless, this narrative of unambiguous urban ascendancy obscures a range of externalities that complicate any straightforward equation of city living with human flourishing."],["7","Body 2 – support (abstract listing)","Issue A, issue B, and issue C collectively suggest that + nuanced conclusion.","Chronic housing unaffordability, entrenched spatial inequality, and the well-documented psychological toll of high-density living collectively suggest that the benefits of urbanisation are neither evenly shared nor without significant, sometimes irreversible, social cost."],["8","Body 2 – example (research framing)","Longitudinal studies correlating X with Y, for instance, cast doubt on any simplistic conflation of + claim.","Longitudinal studies correlating urban residency with elevated incidences of certain mental health conditions, for instance, cast doubt on any simplistic conflation of metropolitan life with enhanced wellbeing."],["9","Conclusion – critical synthesis","In conclusion, the prevailing dichotomy between X and Y is, at best, a reductive heuristic that flattens + nuance.","In conclusion, the prevailing dichotomy between a progressive urban sphere and a stagnant rural one is, at best, a reductive heuristic that flattens considerable heterogeneity within both settings."],["10","Conclusion – final, qualified position","A more defensible position would recognise that + conditional, nuanced claim.","A more defensible position would recognise that the desirability of either environment is contingent upon individual circumstance, policy context, and a far broader conception of prosperity than economic output alone."]],"essay":[["Introduction","Contemporary discourse surrounding urbanisation is often underpinned by an implicit, and arguably unexamined, assumption that metropolitan life constitutes the pinnacle of modern progress, while rural existence is relegated to the status of an anachronism. This essay contends that such a dichotomy, though rhetorically persuasive, fails to withstand close scrutiny, since the presumed superiority of urban life is neither universally experienced nor free of substantial, often underreported, costs."],["Body Paragraph 1","Admittedly, the case for the economic primacy of cities rests on genuinely compelling foundations. Agglomeration effects, whereby the co-location of firms, talent, and capital generates productivity gains unattainable in dispersed rural economies, have been extensively documented in urban economics, lending empirical credibility to claims of the city's economic dynamism. The disproportionate concentration of venture capital, patent filings, and high-value employment within a small number of global cities illustrates the extent to which innovation has become geographically clustered rather than evenly distributed."],["Body Paragraph 2","Nevertheless, this narrative of unambiguous urban ascendancy obscures a range of externalities that complicate any straightforward equation of city living with human flourishing. Chronic housing unaffordability, entrenched spatial inequality, and the well-documented psychological toll of high-density living collectively suggest that the benefits of urbanisation are neither evenly shared nor without significant, sometimes irreversible, social cost. Longitudinal studies correlating urban residency with elevated incidences of certain mental health conditions, for instance, cast doubt on any simplistic conflation of metropolitan life with enhanced wellbeing."],["Conclusion","In conclusion, the prevailing dichotomy between a progressive urban sphere and a stagnant rural one is, at best, a reductive heuristic that flattens considerable heterogeneity within both settings. A more defensible position would recognise that the desirability of either environment is contingent upon individual circumstance, policy context, and a far broader conception of prosperity than economic output alone."]],"vocab":[["dichotomy","a division between two sharply contrasting things","The urban–rural dichotomy is often overstated."],["heuristic","a simplified rule or approach used to make judgements","This is a useful heuristic, but a reductive one."],["externalities","indirect costs or benefits affecting third parties","Urbanisation generates significant negative externalities."],["contingent upon","dependent on something else for its existence","Wellbeing is contingent upon far more than income."],["flourishing","the state of thriving or developing successfully","Human flourishing cannot be reduced to GDP growth."],["entrenched","firmly established and difficult to change","Spatial inequality remains deeply entrenched."],["reductive","presenting something in an oversimplified way","This dichotomy is a reductive account of reality."],["empirical","based on observation or experiment rather than theory","The claim is supported by strong empirical evidence."],["discourse","written or spoken communication or debate","Public discourse often favours simple narratives."],["conflation","the act of combining two things into one, often mistakenly","This is a conflation of correlation with causation."],["obsolescence","the state of being no longer used or needed","Critics warn of the obsolescence of many professions."],["disingenuous","not sincere, especially in a subtly dishonest way","It would be disingenuous to deny the technology's power."],["elide","to omit or leave out, often glossing over something","This narrative tends to elide important nuances."],["algorithmic","relating to a precise set of computational rules","Algorithmic trading now dominates many markets."],["displacement","the process of being forced out of a role or place","Automation raises fears of widespread job displacement."],["autonomous","acting independently, without human control","Fully autonomous decision-making remains rare in practice."],["ambiguity","the quality of being unclear or open to interpretation","Ethical ambiguity is common in end-of-life care."],["amenable","open or responsive to something","Some tasks are simply not amenable to automation."]],"link":[["Contrast","notwithstanding, by the same token","Notwithstanding these gains, significant costs remain."],["Concession","it would be disingenuous to deny that, admittedly","It would be disingenuous to deny the scale of the shift."],["Qualification","insofar as, to the extent that","This holds true insofar as tasks are highly structured."],["Synthesis","all things considered, on balance","All things considered, the claim is only partially valid."],["Signalling critique","this is not to say that, nor does this imply","This is not to say that no disruption will occur."],["Final positioning","a more defensible position would hold that","A more defensible position would hold that expertise is being reconfigured, not eliminated."]],"grammar":["Sophisticated hedging and stance-taking: arguably, admittedly, at best, contingent upon.","Dense, nominalised abstract argumentation: the erosion of community ties, the conflation of X with Y.","Complex clause embedding with multiple layers of subordination.","Precise academic collocations: lending empirical credibility, cast doubt on, rests on compelling foundations.","Rhetorical framing devices that critique the question itself before answering it."],"mistakes":["Sacrificing clarity for complexity, producing sentences that are impressive but hard to follow.","Overusing abstract nouns to the point that claims become vague rather than precise.","Making sweeping claims without sufficiently specific supporting evidence.","Inconsistent register, mixing highly formal phrasing with casual expressions.","Relying on formulaic 'high-level' phrases without genuine, independent argumentation behind them."],"feedback":"This essay opens by critically reframing the question itself before answering it, a genuinely advanced technique. Argumentation is nominalised and precise ('a reductive heuristic', 'contingent upon'), and hedging is used with real control rather than as decoration. The main risk at this level is over-complexity: even at Band 9, clarity must never be sacrificed for sophistication, so the writer should keep checking that every long sentence remains fully parseable on a single read.","fbrows":[["Task Response","A fully developed, consistently relevant position is maintained and critically framed throughout."],["Coherence","Cohesion is handled so skilfully it attracts no attention; paragraphing is seamless."],["Vocabulary","A wide range used with full flexibility, precision, and natural, sophisticated control."],["Grammar","A full range of structures used naturally and accurately, with only rare, non-systematic slips."]],"errors":[["The multifaceted and manifold complexities inherent within the urban-rural paradigmatic dichotomy render any reductive characterisation thereof fundamentally problematic in ways too numerous to adequately enumerate within the confines of the present discursive analysis.","The urban–rural divide is too complex to be captured by a simple, one-sided characterisation."],["Cities are basically just better, obviously.","Cities offer certain well-documented economic advantages, though these are neither universal nor unqualified."],["Rural life is clearly worse for everyone.","Rural life presents distinct disadvantages for some, though not all, residents, depending on local economic conditions."],["The empirical data unequivocally demonstrates, like, a huge difference.","The empirical data demonstrates a substantial and statistically significant difference."],["In today's modern society, it is often said that things have changed a lot.","Replace vague generalisations with a specific, evidenced claim relevant to the question."]],"q":"It has become fashionable to characte
