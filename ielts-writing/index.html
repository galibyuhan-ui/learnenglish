urbanisation is inevitable, city authorities must plan for it proactively, investing in mass transit, <b>sanitation</b> and <b>affordable housing</b> rather than allowing unplanned <b>urban sprawl</b>.","In conclusion, <b>rural-urban migration</b> places severe strain on cities and weakens rural communities alike. A combination of rural investment, <b>decentralisation</b> and forward-looking urban planning offers the most effective response."]}],"type":"Problem and solution","q":"In many developing countries, large numbers of people are moving from rural areas to cities. What problems does this cause, and what can be done to solve them?"},{"n":24,"title":"Living alone","cat":"Society & Family","groups":[{"name":"Question 1: Reasons","bn":"প্রশ্ন ১ — কারণ","items":[{"en":"Many young people move to cities for work and study, far from their families.","bn":"অনেক তরুণ কাজ ও পড়াশোনার জন্য পরিবার থেকে দূরে শহরে যায়।"},{"en":"People are getting married later than in previous generations.","bn":"মানুষ আগের প্রজন্মের চেয়ে দেরিতে বিয়ে করছে।"},{"en":"Higher incomes allow more people to afford their own homes.","bn":"বেশি আয় আরও মানুষকে নিজের বাড়ির খরচ বহন করতে সক্ষম করে।"},{"en":"Many people value independence and privacy more than before.","bn":"অনেক মানুষ আগের চেয়ে স্বাধীনতা ও গোপনীয়তাকে বেশি মূল্য দেয়।"},{"en":"Longer life expectancy means that many elderly people live alone after losing a partner.","bn":"দীর্ঘ গড় আয়ুর অর্থ অনেক বয়স্ক মানুষ সঙ্গী হারানোর পর একা থাকেন।"}]},{"name":"Question 2: Positive and Negative Points","bn":"প্রশ্ন ২ — ইতিবাচক ও নেতিবাচক দিক","items":[{"en":"On the positive side, living alone gives people freedom and privacy.","bn":"ইতিবাচক দিকে, একা থাকা মানুষকে স্বাধীনতা ও গোপনীয়তা দেয়।"},{"en":"It helps young adults become responsible and self-reliant.","bn":"এটি তরুণদের দায়িত্বশীল ও আত্মনির্ভর হতে সাহায্য করে।"},{"en":"However, people who live alone, especially the elderly, may suffer from loneliness.","bn":"তবে একা থাকা মানুষ, বিশেষত বয়স্করা, একাকীত্বে ভুগতে পারেন।"},{"en":"There may be no one to help in an emergency such as sudden illness.","bn":"হঠাৎ অসুস্থতার মতো জরুরি অবস্থায় সাহায্য করার কেউ না-ও থাকতে পারে।"},{"en":"More single-person households increase housing demand and push up rents.","bn":"বেশি একক-ব্যক্তির পরিবার আবাসনের চাহিদা বাড়ায় এবং ভাড়া বাড়িয়ে দেয়।"}]},{"name":"Evaluation: My Answer","bn":"মূল্যায়ন — আমার উত্তর","items":[{"en":"More people live alone because of rising incomes, later marriage and a desire for independence, and I believe this is a largely positive development.","bn":"আয় বৃদ্ধি, দেরিতে বিয়ে ও স্বাধীনতার আকাঙ্ক্ষার কারণে বেশি মানুষ একা থাকছে, এবং আমি মনে করি এটি মূলত ইতিবাচক প্রবণতা।"},{"en":"People are living alone for economic and social reasons, and in my view this is positive for individuals but creates challenges for society.","bn":"মানুষ অর্থনৈতিক ও সামাজিক কারণে একা থাকছে; আমার মতে এটি ব্যক্তির জন্য ইতিবাচক, তবে সমাজের জন্য নানা চ্যালেঞ্জ তৈরি করে।"}]}],"vocab":[["independence","স্বাধীনতা"],["privacy","গোপনীয়তা"],["loneliness","একাকীত্ব"],["isolation","বিচ্ছিন্নতা"],["single-person household","একক ব্যক্তির পরিবার"],["financial independence","আর্থিক স্বাধীনতা"],["urbanisation","নগরায়ণ"],["divorce","বিবাহবিচ্ছেদ"],["life expectancy","গড় আয়ু"],["housing demand","আবাসনের চাহিদা"],["personal growth","ব্যক্তিগত বিকাশ"],["mental health","মানসিক স্বাস্থ্য"],["self-reliant","আত্মনির্ভর"],["widowed","বিধবা / বিপত্নীক"]],"phrases":[["get married later","দেরিতে বিয়ে করা"],["move to a city for work","কাজের জন্য শহরে যাওয়া"],["afford their own home","নিজের বাড়ির খরচ বহন করতে পারা"],["live life on their own terms","নিজের শর্তে জীবনযাপন করা"],["have nobody to turn to","কারো কাছে যাওয়ার না থাকা"],["put pressure on the housing market","আবাসন বাজারে চাপ সৃষ্টি করা"],["a sign of social change","সামাজিক পরিবর্তনের লক্ষণ"],["learn to manage their own lives","নিজের জীবন পরিচালনা করতে শেখা"],["keep in touch with","... এর সঙ্গে যোগাযোগ রাখা"],["for better or worse","ভালো হোক বা মন্দ"]],"sents":[{"en":"Many young people move to a city for work and live alone.","bn":"অনেক তরুণ কাজের জন্য শহরে গিয়ে একা থাকেন।"},{"en":"People are getting married later than in the past.","bn":"মানুষ আগের চেয়ে দেরিতে বিয়ে করছে।"},{"en":"Higher incomes allow more people to afford their own home.","bn":"বেশি আয় আরও মানুষকে নিজের বাড়ির খরচ বহন করতে সক্ষম করে।"},{"en":"Because people live longer, many elderly widows and widowers live alone.","bn":"মানুষ দীর্ঘজীবী হওয়ায় অনেক বয়স্ক বিধবা ও বিপত্নীক একা থাকেন।"},{"en":"Living alone allows people to live life on their own terms.","bn":"একা থাকা মানুষকে নিজের শর্তে জীবনযাপন করতে দেয়।"},{"en":"It also helps young people become self-reliant.","bn":"এটি তরুণদের আত্মনির্ভর হতেও সাহায্য করে।"},{"en":"However, people who live alone may have nobody to turn to in an emergency.","bn":"তবে একা থাকা মানুষের জরুরি অবস্থায় কারো কাছে যাওয়ার না থাকতে পারে।"},{"en":"The growing number of single-person households puts pressure on the housing market.","bn":"একক ব্যক্তির পরিবারের ক্রমবর্ধমান সংখ্যা আবাসন বাজারে চাপ সৃষ্টি করে।"}],"xvocab":[["individualism","ব্যক্তিস্বাতন্ত্র্যবাদ"],["autonomy","স্বাধীনভাবে সিদ্ধান্ত নেওয়ার ক্ষমতা"],["social isolation","সামাজিক বিচ্ছিন্নতা"],["public health concern","জনস্বাস্থ্য উদ্বেগ"],["resource-intensive","সম্পদ বেশি খরচ হয় এমন"],["co-living","সহ-বাসস্থান"],["support network","সহায়তা নেটওয়ার্ক"],["rite of passage","জীবনের এক ধাপ পেরোনোর প্রতীক"]],"xsents":[{"en":"Growing individualism has changed attitudes towards family life.","bn":"ক্রমবর্ধমান ব্যক্তিস্বাতন্ত্র্যবাদ পারিবারিক জীবনের প্রতি দৃষ্টিভঙ্গি বদলেছে।"},{"en":"Some governments now treat loneliness as a public health concern.","bn":"কিছু সরকার এখন একাকীত্বকে জনস্বাস্থ্য উদ্বেগ হিসেবে দেখে।"},{"en":"Single-person households are more resource-intensive per person.","bn":"একক ব্যক্তির পরিবারে মাথাপিছু সম্পদ বেশি খরচ হয়।"},{"en":"A strong support network of friends can prevent social isolation.","bn":"বন্ধুদের শক্তিশালী সহায়তা নেটওয়ার্ক সামাজিক বিচ্ছিন্নতা রোধ করতে পারে।"}],"essays":[{"label":"BASIC ESSAY (BAND 5–6)","words":262,"paras":["Nowadays, more people in many countries live alone. <b>More people live alone because of rising incomes, later marriage and a desire for independence, and I believe this is a largely positive development.</b>","There are several reasons for this trend. Firstly, many young people move to big cities to study or work, so they live alone far from their families. Secondly, people <b>get married later</b> than in the past, so they live alone for some years. Thirdly, people earn more money now, so they can pay for their own flat. Finally, people live longer, so many old people live alone after their husband or wife dies.","I think this is mostly a positive development. People who live alone have more freedom and <b>privacy</b>. They can decide what to eat, when to sleep and how to decorate their home. Living alone also helps young people to become independent. They learn to cook, clean, pay bills and solve problems by themselves, and these skills are useful for their whole life.","However, there are some problems. Some people who live alone feel lonely, especially old people. If they are sick, there is nobody to help them. Also, if many people live alone, cities need more houses and flats, so houses become more expensive. People who live alone should visit their family and friends often, and neighbours should check on old people.","In conclusion, people live alone because of work, later marriage and higher incomes. I believe this is mainly positive, because it gives people freedom and <b>independence</b>, but people must be careful not to become lonely."]},{"label":"ADVANCED ESSAY (BAND 7)","words":262,"paras":["The number of people living on their own has risen sharply in many countries in recent decades. <b>People are living alone for economic and social reasons, and in my view this is positive for individuals but creates challenges for society.</b>","Several factors explain this trend. Economic growth means that more people can <b>afford their own home</b>, while <b>urbanisation</b> leads many young people to <b>move to a city for work</b>, far from their families. Social attitudes have also changed: people are <b>getting married later</b>, <b>divorce</b> is more common, and many value <b>independence</b> and <b>privacy</b> more than previous generations did. Finally, because <b>life expectancy</b> has increased, many elderly widows and widowers now live alone for many years.","For individuals, living alone has clear benefits. It allows people to <b>live life on their own terms</b>, making decisions about their daily routine without compromise. It also helps young adults become <b>self-reliant</b>, as they learn to manage their own finances and household. For many, this period is an important stage of <b>personal growth</b>.","However, the trend also creates problems. The most serious is <b>loneliness</b>, particularly among elderly people, who may <b>have nobody to turn to</b> in an emergency; <b>loneliness</b> has been linked to depression and poor physical health. In addition, the growing number of single-person households <b>puts pressure on the housing market</b>, pushing up prices, and uses more energy per person than shared homes.","In conclusion, living alone is increasing because of economic, social and demographic changes. It offers individuals valuable freedom and <b>independence</b>, but governments and communities must address the risks of <b>loneliness</b> and housing shortages."]},{"label":"BAND 9 ESSAY","words":335,"paras":["One of the most striking social changes of recent decades has been the steady rise in the number of people living on their own, a trend visible from Stockholm to Tokyo and increasingly in the cities of South Asia. <b>People are living alone for economic and social reasons, and in my view this is positive for individuals but creates challenges for society.</b>","The causes are a combination of economic, cultural and demographic shifts. Rising incomes have enabled more people to <b>afford their own home</b>, while <b>urbanisation</b> draws young people to <b>move to a city for work</b>, often hundreds of miles from their families. Cultural attitudes have evolved as well: growing <b>individualism</b>, the tendency to marry later and more widespread <b>divorce</b> mean that many adults now spend long periods outside a family household by choice. Demographic change adds a further dimension, since longer <b>life expectancy</b> leaves many elderly people <b>widowed</b> and living alone for years.","For individuals, the benefits are considerable. Living alone offers a degree of <b>autonomy</b> and <b>privacy</b> that shared households rarely allow, enabling people to <b>live life on their own terms</b>. For young adults especially, it can serve as something of a <b>rite of passage</b>, fostering self-reliance as they learn to manage finances, run a household and solve problems independently, all of which contribute to <b>personal growth</b>.","At a societal level, however, the picture is more concerning. The most serious risk is <b>social isolation</b>, particularly among the elderly; <b>loneliness</b> is now recognised by several governments as a <b>public health concern</b>, associated with depression, cognitive decline and even premature death. There are material costs too: single-person households are more <b>resource-intensive</b> per person and <b>put pressure on the housing market</b>, contributing to rising rents in already crowded cities.","In conclusion, the growth of solo living reflects rising prosperity and changing values, and it brings genuine benefits of <b>independence</b>. Nevertheless, to prevent it becoming a source of <b>isolation</b>, societies must invest in community spaces, support networks for the elderly and new housing models such as <b>co-living</b>."]}],"type":"Two-part question","q":"In many countries, more and more people are choosing to live alone. Why is this happening? Is this a positive or negative development?"},{"n":25,"title":"Should parents or schools teach children good behaviour?","cat":"Society & Family","groups":[{"name":"Reasons to Agree","bn":"একমত হওয়ার কারণ","items":[{"en":"Parents are a child's first teachers, and early lessons shape character for life.","bn":"বাবা-মা শিশুর প্রথম শিক্ষক, এবং প্রথম দিকের শিক্ষা আজীবন চরিত্র গড়ে তোলে।"},{"en":"Children learn behaviour mainly by copying their parents.","bn":"শিশুরা মূলত বাবা-মাকে অনুকরণ করে আচরণ শেখে।"},{"en":"Values such as honesty and respect for elders are taught mainly at home.","bn":"সততা ও বড়দের প্রতি শ্রদ্ধার মতো মূল্যবোধ মূলত বাড়িতেই শেখানো হয়।"},{"en":"Parents know their own children better than any teacher.","bn":"বাবা-মা যেকোনো শিক্ষকের চেয়ে নিজের সন্তানকে বেশি চেনেন।"},{"en":"Teachers have large classes and must focus on academic subjects.","bn":"শিক্ষকদের ক্লাস বড় এবং তাদের একাডেমিক বিষয়ে মনোযোগ দিতে হয়।"}]},{"name":"Reasons to Disagree","bn":"দ্বিমত পোষণের কারণ","items":[{"en":"Children spend many hours every day at school, where teachers influence their behaviour.","bn":"শিশুরা প্রতিদিন স্কুলে অনেক ঘণ্টা কাটায়, যেখানে শিক্ষকরা তাদের আচরণে প্রভাব ফেলেন।"},{"en":"At school, children learn to cooperate and get along with people from different backgrounds.","bn":"স্কুলে শিশুরা ভিন্ন প্রেক্ষাপটের মানুষের সঙ্গে সহযোগিতা ও মিলেমিশে চলতে শেখে।"},{"en":"Schools can teach civic values such as respecting the law and protecting the environment.","bn":"স্কুল আইনের প্রতি শ্রদ্ধা ও পরিবেশ রক্ষার মতো নাগরিক মূল্যবোধ শেখাতে পারে।"},{"en":"Some children do not receive good guidance at home.","bn":"কিছু শিশু বাড়িতে ভালো দিকনির্দেশনা পায় না।"},{"en":"Teachers can act as positive role models, especially for children from difficult families.","bn":"শিক্ষকরা ইতিবাচক আদর্শ হতে পারেন, বিশেষত কঠিন পারিবারিক পরিস্থিতির শিশুদের জন্য।"}]},{"name":"Evaluation: My Answer","bn":"মূল্যায়ন — আমার উত্তর","items":[{"en":"I largely agree that parents have the main responsibility for teaching good behaviour, although schools also play an important supporting role.","bn":"আমি মূলত একমত যে ভালো আচরণ শেখানোর প্রধান দায়িত্ব বাবা-মায়ের, যদিও স্কুলও একটি গুরুত্বপূর্ণ সহায়ক ভূমিকা পালন করে।"},{"en":"I partly agree: parents should lay the foundation, but schools must continue to teach children how to behave in society.","bn":"আমি আংশিক একমত: বাবা-মায়ের উচিত ভিত্তি গড়ে দেওয়া, তবে সমাজে কীভাবে আচরণ করতে হয় তা শেখানো স্কুলকেও চালিয়ে যেতে হবে।"}]}],"vocab":[["behaviour","আচরণ"],["values","মূল্যবোধ"],["manners","আদবকায়দা"],["discipline","শৃঙ্খলা"],["role model","আদর্শ ব্যক্তি"],["upbringing","লালনপালন"],["citizenship","নাগরিকত্ব / নাগরিক দায়িত্ব"],["respect","শ্রদ্ধা"],["honesty","সততা"],["cooperation","সহযোগিতা"],["peers","সমবয়সীরা"],["consistency","ধারাবাহিকতা"],["moral education","নৈতিক শিক্ষা"],["responsibility","দায়িত্ব"]],"phrases":[["from an early age","ছোটবেলা থেকেই"],["lead by example","নিজে দৃষ্টান্ত হয়ে শেখানো"],["right from wrong","ন্যায়-অন্যায়"],["spend a large part of their day","দিনের বড় একটা অংশ কাটানো"],["get along with others","অন্যদের সঙ্গে মিলেমিশে চলা"],["reinforce what they learn at home","বাড়িতে যা শেখে তা দৃঢ় করা"],["a shared responsibility","যৌথ দায়িত্ব"],["the first teachers","প্রথম শিক্ষক"],["work hand in hand","একসঙ্গে কাজ করা"],["shape a child's character","শিশুর চরিত্র গঠন করা"]],"sents":[{"en":"Parents are a child's first teachers.","bn":"বাবা-মা শিশুর প্রথম শিক্ষক।"},{"en":"Children learn values such as honesty and respect from an early age at home.","bn":"শিশুরা ছোটবেলা থেকেই বাড়িতে সততা ও শ্রদ্ধার মতো মূল্যবোধ শেখে।"},{"en":"Parents can lead by example, because children copy what they see.","bn":"বাবা-মা নিজে দৃষ্টান্ত হয়ে শেখাতে পারেন, কারণ শিশুরা যা দেখে তা অনুকরণ করে।"},{"en":"However, children spend a large part of their day at school.","bn":"তবে শিশুরা দিনের বড় একটা অংশ স্কুলে কাটায়।"},{"en":"At school, children learn to get along with others from different backgrounds.","bn":"স্কুলে শিশুরা ভিন্ন প্রেক্ষাপটের মানুষের সঙ্গে মিলেমিশে চলতে শেখে।"},{"en":"Teachers can reinforce what children learn at home.","bn":"শিক্ষকরা শিশুরা বাড়িতে যা শেখে তা দৃঢ় করতে পারেন।"},{"en":"Not all children receive good guidance at home.","bn":"সব শিশু বাড়িতে ভালো দিকনির্দেশনা পায় না।"},{"en":"Parents and schools should work hand in hand.","bn":"বাবা-মা ও স্কুলের একসঙ্গে কাজ করা উচিত।"}],"xvocab":[["formative years","গঠনের বছরগুলো"],["social skills","সামাজিক দক্ষতা"],["conflict resolution","বিরোধ মীমাংসা"],["civic values","নাগরিক মূল্যবোধ"],["neglect","অবহেলা"],["contradictory messages","পরস্পরবিরোধী বার্তা"],["emotional intelligence","আবেগীয় বুদ্ধিমত্তা"],["safety net","নিরাপত্তা বেষ্টনী"]],"xsents":[{"en":"The formative years before school have a lasting effect on character.","bn":"স্কুলের আগের গঠনের বছরগুলো চরিত্রে স্থায়ী প্রভাব ফেলে।"},{"en":"Group work at school teaches conflict resolution and cooperation.","bn":"স্কুলে দলগত কাজ বিরোধ মীমাংসা ও সহযোগিতা শেখায়।"},{"en":"For children who experience neglect at home, school can be a safety net.","bn":"বাড়িতে অবহেলিত শিশুদের জন্য স্কুল একটি নিরাপত্তা বেষ্টনী হতে পারে।"},{"en":"Children become confused when home and school send contradictory messages.","bn":"বাড়ি ও স্কুল পরস্পরবিরোধী বার্তা দিলে শিশুরা বিভ্রান্ত হয়।"}],"essays":[{"label":"BASIC ESSAY (BAND 5–6)","words":262,"paras":["Some people think that parents, not schools, should teach children how to behave well. <b>I largely agree that parents have the main responsibility for teaching good behaviour, although schools also play an important supporting role.</b>","Firstly, parents are <b>the first teachers</b> of a child. Children spend their first years at home with their family, and they learn many things during this time. They learn how to talk, how to share and how to <b>respect</b> older people. For example, in Bangladesh, children learn from their parents to greet guests and <b>respect</b> their grandparents. Secondly, children copy what their parents do. If parents are honest and kind, their children will usually be honest and kind too. If parents shout and lie, children will do the same. So parents must set a good example.","However, schools are also important. Children spend many hours every day at school. There, they learn to follow rules, wait for their turn and work in groups with other children. Teachers can also teach them about being good citizens, for example by keeping the environment clean and helping others. Also, some children do not get good guidance at home, because their parents are too busy or have problems. For these children, school is very important.","I think parents and schools should work together. If parents and teachers teach the same <b>values</b>, children will learn them better.","In conclusion, I mostly agree that parents are responsible for teaching children good <b>behaviour</b>, because they are their first teachers and role models. However, schools also have an important role to help and support parents."]},{"label":"ADVANCED ESSAY (BAND 7)","words":271,"paras":["It is often argued that teaching children to behave well is the duty of parents rather than schools. <b>I largely agree that parents have the main responsibility for teaching good behaviour, although schools also play an important supporting role.</b>","The main reason I hold this view is that parents are a child's first teachers. During the <b>formative years</b> before school, children learn basic <b>values</b> such as <b>honesty</b>, <b>respect</b> and kindness from their families, and these early lessons <b>shape a child's character</b> for life. Moreover, parents influence children most powerfully by <b>leading by example</b>: children copy what they see, so a parent who treats others with <b>respect</b> is far more effective than any lesson in a classroom. In many cultures, including our own, <b>manners</b> such as <b>respecting</b> elders are passed on almost entirely at home.","However, schools cannot be excluded from this <b>responsibility</b>. Children <b>spend a large part of their day</b> at school, where they learn to <b>get along with others</b> from different backgrounds, follow rules and resolve conflicts. Teachers can also teach <b>civic values</b>, such as caring for the environment and <b>respecting</b> the law, which children may not learn at home. Furthermore, not all children receive good guidance at home; for those whose parents are absent or struggling, school may be the only place where they learn how to behave well.","Ideally, parents and schools should <b>work hand in hand</b>, sending consistent messages so that school can reinforce what children learn at home.","In conclusion, while schools make an important contribution, I believe parents bear the main <b>responsibility</b> for teaching children good <b>behaviour</b>, since their influence begins earliest and runs deepest."]},{"label":"BAND 9 ESSAY","words":326,"paras":["There is a widely held view that instilling good <b>behaviour</b> and civic <b>responsibility</b> in children is a task for parents, not schools. <b>I largely agree that parents have the main responsibility for teaching good behaviour, although schools also play an important supporting role.</b>","The primacy of parents rests on two considerations. Firstly, parents are a child's first teachers, and their influence begins long before formal education. The <b>formative years</b> of early childhood, when children absorb <b>values</b> such as <b>honesty</b>, empathy and <b>respect</b>, occur almost entirely within the family, and research consistently shows that these early experiences <b>shape a child's character</b> well into adulthood. Secondly, children learn <b>behaviour</b> less through instruction than through imitation. Parents who <b>lead by example</b>, treating others courteously, keeping promises and controlling their temper, teach these qualities far more effectively than any lesson could. In societies such as Bangladesh, deeply rooted customs of <b>respect</b> for elders and hospitality are transmitted primarily at home.","That said, it would be unrealistic to absolve schools of <b>responsibility</b>. Children <b>spend a large part of their day</b> at school, and it is there that they learn to <b>get along with others</b> from different backgrounds, cooperate in groups and practise <b>conflict resolution</b> with their <b>peers</b>, developing <b>social skills</b> and <b>emotional intelligence</b> that the family alone cannot provide. Schools are also well placed to teach <b>civic values</b>, from <b>respecting</b> shared spaces to understanding the rights and <b>responsibilities</b> of citizens. Moreover, not every child is fortunate enough to receive good guidance at home; for children who experience <b>neglect</b> or instability, school may serve as a crucial <b>safety net</b> and a source of positive role models.","The most effective approach, therefore, is one in which parents and schools <b>work hand in hand</b>, since <b>contradictory messages</b> at home and in the classroom only confuse children.","In conclusion, although schools make a valuable contribution, I believe the principal <b>responsibility</b> for teaching children good <b>behaviour</b> lies with parents, whose influence starts earliest and endures longest."]}],"type":"Opinion (Agree / Disagree)","q":"Some people believe that parents, not schools, are responsible for teaching children how to behave well and be good members of society. To what extent do you agree or disagree?"},{"n":26,"title":"Prison or rehabilitation?","cat":"Society & Family","groups":[{"name":"Reasons Supporting the First View","bn":"প্রথম মতের পক্ষে কারণ","items":[{"en":"Long sentences deter people from committing crimes.","bn":"দীর্ঘ কারাদণ্ড মানুষকে অপরাধ করা থেকে নিরুৎসাহিত করে।"},{"en":"Prison keeps dangerous criminals away from the public.","bn":"কারাগার বিপজ্জনক অপরাধীদের জনগণ থেকে দূরে রাখে।"},{"en":"Victims and their families feel that justice has been done.","bn":"ভুক্তভোগী ও তাদের পরিবার মনে করেন ন্যায়বিচার হয়েছে।"},{"en":"Strict punishment sends a clear message that crime will not be tolerated.","bn":"কঠোর শাস্তি স্পষ্ট বার্তা দেয় যে অপরাধ সহ্য করা হবে না।"},{"en":"Serious violent crimes deserve serious punishment.","bn":"গুরুতর সহিংস অপরাধের গুরুতর শাস্তি প্রাপ্য।"}]},{"name":"Reasons Supporting the Second View","bn":"দ্বিতীয় মতের পক্ষে কারণ","items":[{"en":"Many prisoners commit crimes again soon after they are released.","bn":"অনেক বন্দি মুক্তির অল্প পরেই আবার অপরাধ করে।"},{"en":"Education and job training in prison help offenders build an honest life.","bn":"কারাগারে শিক্ষা ও কাজের প্রশিক্ষণ অপরাধীদের সৎ জীবন গড়তে সাহায্য করে।"},{"en":"Tackling poverty and unemployment addresses the root causes of crime.","bn":"দারিদ্র্য ও বেকারত্ব মোকাবিলা অপরাধের মূল কারণ দূর করে।"},{"en":"Community service is cheaper and more useful for minor crimes.","bn":"ছোট অপরাধের জন্য সমাজসেবামূলক শাস্তি সস্তা ও বেশি উপযোগী।"},{"en":"Overcrowded prisons can turn minor offenders into hardened criminals.","bn":"অতিরিক্ত ভিড়পূর্ণ কারাগার ছোট অপরাধীদের পাকা অপরাধীতে পরিণত করতে পারে।"}]},{"name":"Evaluation: My Opinion","bn":"মূল্যায়ন — আমার মতামত","items":[{"en":"Although prison is necessary for dangerous criminals, I believe education and rehabilitation are more effective ways to reduce crime.","bn":"যদিও বিপজ্জনক অপরাধীদের জন্য কারাগার প্রয়োজন, আমি বিশ্বাস করি শিক্ষা ও পুনর্বাসন অপরাধ কমানোর বেশি কার্যকর উপায়।"},{"en":"In my opinion, longer prison sentences alone cannot reduce crime; tackling its root causes is far more effective.","bn":"আমার মতে, শুধু দীর্ঘ কারাদণ্ড অপরাধ কমাতে পারে না; এর মূল কারণগুলো মোকাবিলা করা অনেক বেশি কার্যকর।"}]}],"vocab":[["prison sentence","কারাদণ্ড"],["deterrent","প্রতিরোধক / নিরুৎসাহক"],["rehabilitation","পুনর্বাসন"],["reoffend","পুনরায় অপরাধ করা"],["offenders","অপরাধী"],["punishment","শাস্তি"],["root causes","মূল কারণ"],["poverty","দারিদ্র্য"],["vocational training","বৃত্তিমূলক প্রশিক্ষণ"],["community service","সমাজসেবামূলক শাস্তি"],["reintegrate","সমাজে পুনরায় অন্তর্ভুক্ত করা"],["overcrowded","অতিরিক্ত ভিড়পূর্ণ"],["taxpayers","করদাতারা"],["violent crime","সহিংস অপরাধ"]],"phrases":[["think twice before","... এর আগে দুবার ভাবা"],["keep dangerous people off the streets","বিপজ্জনক ব্যক্তিদের রাস্তা থেকে দূরে রাখা"],["a school of crime","অপরাধের পাঠশালা"],["tackle the root causes","মূল কারণ মোকাবিলা করা"],["a second chance","দ্বিতীয় সুযোগ"],["find a job after release","মুক্তির পর চাকরি খুঁজে পাওয়া"],["break the cycle of crime","অপরাধের চক্র ভাঙা"],["at great cost to","... এর বিশাল ব্যয়ে"],["prevention is better than cure","প্রতিকারের চেয়ে প্রতিরোধ ভালো"],["petty crime","ছোটখাটো অপরাধ"]],"sents":[{"en":"Supporters argue that longer sentences make people think twice before committing a crime.","bn":"সমর্থকরা বলেন দীর্ঘ কারাদণ্ড মানুষকে অপরাধ করার আগে দুবার ভাবতে বাধ্য করে।"},{"en":"Prison keeps dangerous people off the streets and protects the public.","bn":"কারাগার বিপজ্জনক ব্যক্তিদের রাস্তা থেকে দূরে রাখে এবং জনগণকে রক্ষা করে।"},{"en":"However, many prisoners reoffend soon after they are released.","bn":"তবে অনেক বন্দি মুক্তির অল্প পরেই আবার অপরাধ করে।"},{"en":"Overcrowded prisons can become a school of crime.","bn":"অতিরিক্ত ভিড়পূর্ণ কারাগার অপরাধের পাঠশালা হয়ে উঠতে পারে।"},{"en":"Education and vocational training help prisoners find a job after release.","bn":"শিক্ষা ও বৃত্তিমূলক প্রশিক্ষণ বন্দিদের মুক্তির পর চাকরি খুঁজে পেতে সাহায্য করে।"},{"en":"Community service is a better punishment for petty crime.","bn":"ছোটখাটো অপরাধের জন্য সমাজসেবামূলক শাস্তি ভালো শাস্তি।"},{"en":"To reduce crime, governments must tackle the root causes, such as poverty and unemployment.","bn":"অপরাধ কমাতে সরকারকে দারিদ্র্য ও বেকারত্বের মতো মূল কারণ মোকাবিলা করতে হবে।"},{"en":"Keeping people in prison for many years comes at great cost to taxpayers.","bn":"বছরের পর বছর মানুষকে কারাগারে রাখা করদাতাদের বিশাল ব্যয়ে হয়।"}],"xvocab":[["recidivism","পুনরায় অপরাধপ্রবণতা"],["harsh sentencing","কঠোর দণ্ড"],["restorative justice","পুনরুদ্ধারমূলক বিচার"],["stigma","কলঙ্ক"],["youth programmes","তরুণদের জন্য কর্মসূচি"],["law-abiding","আইন মান্যকারী"],["hardened criminals","পাকা অপরাধী"],["impulsive","আবেগপ্রবণ / হঠকারী"]],"xsents":[{"en":"Norway has one of the lowest recidivism rates in the world because it focuses on rehabilitation.","bn":"নরওয়ে পুনর্বাসনে জোর দেওয়ায় বিশ্বের সর্বনিম্ন পুনরায় অপরাধপ্রবণতার হারগুলোর একটি।"},{"en":"Many crimes are impulsive, so offenders rarely consider the length of the sentence.","bn":"অনেক অপরাধ হঠকারী, তাই অপরাধীরা কদাচিৎ দণ্ডের দৈর্ঘ্য বিবেচনা করে।"},{"en":"Young offenders can become hardened criminals after years in prison.","bn":"তরুণ অপরাধীরা বছরের পর বছর কারাগারে থেকে পাকা অপরাধী হয়ে উঠতে পারে।"},{"en":"Youth programmes keep teenagers away from gangs.","bn":"তরুণদের কর্মসূচি কিশোরদের গ্যাং থেকে দূরে রাখে।"}],"essays":[{"label":"BASIC ESSAY (BAND 5–6)","words":252,"paras":["Some people think that giving criminals longer prison sentences is the best way to reduce crime, but other people think there are better ways. <b>Although prison is necessary for dangerous criminals, I believe education and rehabilitation are more effective ways to reduce crime.</b>","On the one hand, longer prison sentences have some benefits. Firstly, when criminals are in prison, they cannot harm other people, so society is safer. This is especially important for dangerous criminals, such as murderers. Secondly, if <b>punishments</b> are very strong, some people will be afraid to break the law. They will think carefully before they steal or hurt someone.","On the other hand, I believe there are better ways to reduce crime. Firstly, many prisoners commit crimes again after they leave prison. In prison, they meet other criminals and learn new ways to break the law. If prisoners get education and job training in prison, they can find a job when they leave, so they will not need to commit crimes again. Secondly, many people commit crimes because they are poor or have no job. If the government reduces <b>poverty</b> and creates jobs, there will be less crime. Thirdly, for small crimes, like stealing a phone, <b>community service</b> is better than prison. For example, the criminal can clean parks or help in hospitals. Also, prisons are very expensive for the government.","In conclusion, prison is necessary for dangerous criminals, but I believe education, job training and reducing <b>poverty</b> are better ways to reduce crime in the long run."]},{"label":"ADVANCED ESSAY (BAND 7)","words":269,"paras":["There is ongoing debate about whether harsher prison sentences are the most effective way to cut crime or whether alternative approaches work better. <b>Although prison is necessary for dangerous criminals, I believe education and rehabilitation are more effective ways to reduce crime.</b>","Supporters of longer sentences make two main arguments. Firstly, harsh <b>punishment</b> acts as a <b>deterrent</b>, making potential <b>offenders</b> <b>think twice before</b> committing a crime. Secondly, prison <b>keeps dangerous people off the streets</b>, so the public is protected for as long as <b>offenders</b> remain behind bars. For violent criminals who pose a serious threat, long sentences are clearly justified.","However, I believe that for most crimes, other approaches are more effective. The main problem with relying on prison is that many prisoners <b>reoffend</b> soon after they are released. <b>Overcrowded</b> prisons can become <b>a school of crime</b>, where minor <b>offenders</b> learn from <b>hardened criminals</b>, and ex-prisoners often struggle to <b>find a job after release</b> because of the <b>stigma</b> attached to a criminal record. <b>Rehabilitation</b>, by contrast, addresses this problem directly: education and <b>vocational training</b> give prisoners the skills to earn a living honestly, which helps them <b>break the cycle of crime</b>. Norway, which focuses on <b>rehabilitation</b>, has one of the lowest <b>reoffending</b> rates in the world. In addition, <b>community service</b> is a more sensible <b>punishment</b> for <b>petty crime</b>, and it costs far less than imprisonment. Most importantly, governments must <b>tackle the root causes</b> of crime, such as <b>poverty</b>, unemployment and drug addiction.","In conclusion, while long sentences are necessary for dangerous <b>offenders</b>, I believe that <b>rehabilitation</b> and crime prevention are more effective in reducing crime in the long run."]},{"label":"BAND 9 ESSAY","words":359,"paras":["Opinions are sharply divided over how societies should respond to crime: some advocate longer prison terms, while others maintain that more constructive approaches are more effective. <b>Although prison is necessary for dangerous criminals, I believe education and rehabilitation are more effective ways to reduce crime.</b>","Proponents of <b>harsh sentencing</b> advance two principal arguments. The first is deterrence: the prospect of a long sentence, they contend, will make potential <b>offenders</b> <b>think twice before</b> breaking the law. The second is incapacitation, since <b>offenders</b> who are imprisoned cannot harm the public, and <b>keeping dangerous people off the streets</b> is the most basic duty of the justice system. In the case of <b>violent crime</b> and <b>hardened criminals</b> who pose a continuing threat, these arguments are persuasive, and lengthy sentences are entirely justified.","Nevertheless, as a general strategy for reducing crime, imprisonment has significant limitations. The <b>deterrent</b> effect appears weaker than commonly assumed, because many crimes are <b>impulsive</b> or committed under the influence of drugs, and <b>offenders</b> rarely calculate the length of the sentence they might receive. More tellingly, <b>recidivism</b> rates in countries that rely heavily on prison remain stubbornly high: many prisoners <b>reoffend</b> soon after they are released. <b>Overcrowded</b> prisons can function as <b>a school of crime</b>, in which young <b>offenders</b> absorb the attitudes and contacts of career criminals, and the <b>stigma</b> of a criminal record makes it extremely difficult to <b>find a job after release</b>. <b>Rehabilitation</b>, by contrast, addresses these problems at their source. Education, <b>vocational training</b> and treatment for addiction equip <b>offenders</b> to <b>reintegrate</b> into society, and Norway, whose system is built around this principle, has one of the lowest <b>reoffending</b> rates in the world. For <b>petty crime</b>, <b>community service</b> and <b>restorative justice</b> are both cheaper and more constructive than imprisonment, which comes <b>at great cost to</b> <b>taxpayers</b>. Ultimately, however, the most effective strategy is prevention: <b>tackling the root causes</b> of crime, including <b>poverty</b>, unemployment and a lack of opportunities for young people.","In conclusion, prison remains essential for protecting the public from dangerous <b>offenders</b>, but longer sentences alone will not make societies safer. A combination of <b>rehabilitation</b> and prevention offers a far more effective and sustainable way to reduce crime."]}],"type":"Discuss both views and give your opinion","q":"Some people think that the best way to reduce crime is to give longer prison sentences. Others believe there are better ways to reduce crime. Discuss both views and give your own opinion."},{"n":27,"title":"Compulsory community service for young people","cat":"Society & Family","groups":[{"name":"Reasons to Agree","bn":"একমত হওয়ার কারণ","items":[{"en":"Community service teaches young people responsibility and empathy.","bn":"সমাজসেবা তরুণদের দায়িত্ববোধ ও সহমর্মিতা শেখায়।"},{"en":"Young people learn practical skills such as teamwork and communication.","bn":"তরুণরা দলগত কাজ ও যোগাযোগের মতো ব্যবহারিক দক্ষতা শেখে।"},{"en":"Hospitals, schools and charities benefit from extra help.","bn":"হাসপাতাল, স্কুল ও দাতব্য সংস্থা বাড়তি সাহায্যে উপকৃত হয়।"},{"en":"Working with people from different backgrounds strengthens communities.","bn":"ভিন্ন প্রেক্ষাপটের মানুষের সঙ্গে কাজ সম্প্রদায়কে শক্তিশালী করে।"},{"en":"The experience can improve young people's CVs and job prospects.","bn":"এই অভিজ্ঞতা তরুণদের জীবনবৃত্তান্ত ও চাকরির সম্ভাবনা উন্নত করতে পারে।"}]},{"name":"Reasons to Disagree","bn":"দ্বিমত পোষণের কারণ","items":[{"en":"Forcing people to work without pay may create resentment rather than kindness.","bn":"বিনা পারিশ্রমিকে কাজে বাধ্য করা দয়ার বদলে ক্ষোভ তৈরি করতে পারে।"},{"en":"Compulsory service could take time away from studies and exam preparation.","bn":"বাধ্যতামূলক সেবা পড়াশোনা ও পরীক্ষার প্রস্তুতি থেকে সময় কেড়ে নিতে পারে।"},{"en":"Young people from poor families may need that time to earn money.","bn":"দরিদ্র পরিবারের তরুণদের ওই সময়ে টাকা আয় করার প্রয়োজন হতে পারে।"},{"en":"Poorly organised schemes may become meaningless and waste public money.","bn":"দুর্বলভাবে সংগঠিত প্রকল্প অর্থহীন হয়ে সরকারি অর্থের অপচয় করতে পারে।"},{"en":"Volunteering has greater value when people choose to do it freely.","bn":"মানুষ স্বেচ্ছায় বেছে নিলে স্বেচ্ছাসেবার মূল্য বেশি হয়।"}]},{"name":"Evaluation: My Answer","bn":"মূল্যায়ন — আমার উত্তর","items":[{"en":"I largely agree that young people should do community service, because it builds responsibility and benefits society, although it should be flexible.","bn":"আমি মূলত একমত যে তরুণদের সমাজসেবা করা উচিত, কারণ এটি দায়িত্ববোধ গড়ে তোলে ও সমাজের উপকার করে, যদিও এটি নমনীয় হওয়া উচিত।"},{"en":"I strongly agree with compulsory community service, as it teaches young people skills and values that school cannot.","bn":"আমি বাধ্যতামূলক সমাজসেবার সঙ্গে দৃঢ়ভাবে একমত, কারণ এটি তরুণদের এমন দক্ষতা ও মূল্যবোধ শেখায় যা স্কুল শেখাতে পারে না।"}]}],"vocab":[["community service","সমাজসেবা"],["volunteer","স্বেচ্ছাসেবী"],["unpaid","বিনা পারিশ্রমিকে"],["compulsory","বাধ্যতামূলক"],["responsibility","দায়িত্ববোধ"],["empathy","সহমর্মিতা"],["teamwork","দলগত কাজ"],["citizenship","নাগরিক দায়িত্ব"],["work experience","কাজের অভিজ্ঞতা"],["resentment","বিরক্তি / ক্ষোভ"],["studies","পড়াশোনা"],["elderly","বয়স্ক"],["environment","পরিবেশ"],["motivation","অনুপ্রেরণা"]],"phrases":[["give something back to","কিছু ফিরিয়ে দেওয়া"],["see how others live","অন্যরা কীভাবে বাঁচে তা দেখা"],["step outside their comfort zone","স্বস্তির গণ্ডির বাইরে যাওয়া"],["a sense of responsibility","দায়িত্ববোধ"],["take time away from","... থেকে সময় কেড়ে নেওয়া"],["forced labour","জোরপূর্বক শ্রম"],["on a voluntary basis","স্বেচ্ছার ভিত্তিতে"],["look good on a CV","জীবনবৃত্তান্তে ভালো দেখানো"],["bring people together","মানুষকে একত্র করা"],["for a few hours a week","সপ্তাহে কয়েক ঘণ্টা"]],"sents":[{"en":"Community service allows young people to give something back to society.","bn":"সমাজসেবা তরুণদের সমাজকে কিছু ফিরিয়ে দেওয়ার সুযোগ দেয়।"},{"en":"Helping in hospitals or shelters helps them see how others live.","bn":"হাসপাতাল বা আশ্রয়কেন্দ্রে সাহায্য করা তাদের অন্যরা কীভাবে বাঁচে তা দেখতে সাহায্য করে।"},{"en":"It develops a sense of responsibility and empathy.","bn":"এটি দায়িত্ববোধ ও সহমর্মিতা গড়ে তোলে।"},{"en":"Young people also learn teamwork and gain work experience.","bn":"তরুণরা দলগত কাজও শেখে এবং কাজের অভিজ্ঞতা অর্জন করে।"},{"en":"Such experience can look good on a CV.","bn":"এমন অভিজ্ঞতা জীবনবৃত্তান্তে ভালো দেখাতে পারে।"},{"en":"However, compulsory service may take time away from studies.","bn":"তবে বাধ্যতামূলক সেবা পড়াশোনা থেকে সময় কেড়ে নিতে পারে।"},{"en":"If people are forced to help, they may feel resentment.","bn":"মানুষকে সাহায্য করতে বাধ্য করলে তারা বিরক্তি অনুভব করতে পারে।"},{"en":"A flexible scheme of a few hours a week would be more realistic.","bn":"সপ্তাহে কয়েক ঘণ্টার একটি নমনীয় প্রকল্প বেশি বাস্তবসম্মত হবে।"}],"xvocab":[["civic duty","নাগরিক কর্তব্য"],["social cohesion","সামাজিক সংহতি"],["character-building","চরিত্র গঠনমূলক"],["disaster relief","দুর্যোগ ত্রাণ"],["counterproductive","উল্টো ফলদায়ক"],["tokenistic","নামমাত্র / লোক দেখানো"],["underprivileged","সুবিধাবঞ্চিত"],["intrinsic value","অন্তর্নিহিত মূল্য"]],"xsents":[{"en":"Many Bangladeshi students volunteer during floods and cyclones as part of disaster relief.","bn":"অনেক বাংলাদেশি শিক্ষার্থী বন্যা ও ঘূর্ণিঝড়ের সময় দুর্যোগ ত্রাণের অংশ হিসেবে স্বেচ্ছাসেবা করে।"},{"en":"Working alongside people from different backgrounds strengthens social cohesion.","bn":"বিভিন্ন প্রেক্ষাপটের মানুষের সঙ্গে কাজ সামাজিক সংহতি শক্তিশালী করে।"},{"en":"If poorly organised, compulsory service can become tokenistic.","bn":"দুর্বলভাবে সংগঠিত হলে বাধ্যতামূলক সেবা নামমাত্র হয়ে যেতে পারে।"},{"en":"Forcing people to volunteer can be counterproductive.","bn":"মানুষকে স্বেচ্ছাসেবায় বাধ্য করা উল্টো ফলদায়ক হতে পারে।"}],"essays":[{"label":"BASIC ESSAY (BAND 5–6)","words":263,"paras":["Some people think that all young people should do <b>unpaid</b> work in their community for some time, for example in hospitals or cleaning parks. <b>I largely agree that young people should do community service, because it builds responsibility and benefits society, although it should be flexible.</b>","The first reason is that <b>community service</b> helps young people to grow. When they help sick people in hospitals or old people in care homes, they learn to understand other people's problems. They become kinder and more responsible. Many young people today spend a lot of time on their phones, so this experience can help them see real life.","The second reason is that <b>community service</b> teaches useful skills. Young people learn to work in a team, talk to different people and solve problems. These skills are useful for their future jobs, and the experience also <b>looks good on a CV</b>.","The third reason is that society benefits. Hospitals, schools and cleaning projects need more help, and young people have a lot of energy. For example, in Bangladesh, many students help people during floods, and this is very useful.","However, <b>community service</b> should not take too much time from students' <b>studies</b>. Also, if young people feel forced, they may not work well. So the government should let them choose the type of work and do it <b>for a few hours a week</b>.","In conclusion, I mostly agree that young people should do <b>community service</b>, because it helps them become better people and helps society. However, it should be flexible so that it does not harm their education."]},{"label":"ADVANCED ESSAY (BAND 7)","words":282,"paras":["It has been suggested that every young person should complete a period of <b>unpaid</b> <b>community service</b>, for example in hospitals or public spaces. <b>I largely agree that young people should do community service, because it builds responsibility and benefits society, although it should be flexible.</b>","The main benefit is personal development. Helping in hospitals, shelters or care homes allows young people to <b>see how others live</b>, which develops <b>a sense of responsibility</b> and <b>empathy</b> that is difficult to teach in a classroom. For young people who spend much of their time online, stepping outside their comfort zone in this way can be genuinely eye-opening. In addition, <b>community service</b> teaches practical skills such as <b>teamwork</b> and communication, and provides <b>work experience</b> that can <b>look good on a CV</b>.","Society also benefits considerably. Public services such as hospitals and schools are often short of staff, and young <b>volunteers</b> can provide valuable support. In Bangladesh, students have long played an important role in <b>disaster relief</b> during floods and cyclones, which shows how much young people can contribute. Furthermore, when young people from different backgrounds work together, it helps to <b>bring people together</b> and strengthen communities.","Admittedly, there are concerns. <b>Compulsory</b> service may <b>take time away from</b> <b>studies</b> or part-time jobs that some young people need, and if people are forced to help, they may feel <b>resentment</b> rather than pride. However, these problems can be reduced by offering a flexible scheme, requiring only a few hours a week and allowing young people to choose the type of service.","In conclusion, I believe a well-designed programme of <b>community service</b> would benefit both young people and society, provided that it is flexible and does not disrupt their education."]},{"label":"BAND 9 ESSAY","words":351,"paras":["The idea that all young people should undertake a period of <b>unpaid</b> <b>community service</b>, whether in hospitals, schools or environmental projects, has attracted growing interest. <b>I largely agree that young people should do community service, because it builds responsibility and benefits society, although it should be flexible.</b>","The most persuasive argument concerns character. Working in hospitals, shelters or care homes allows young people to <b>see how others live</b>, confronting them with illness, poverty and old age in a way that no textbook can. Such experiences tend to foster <b>empathy</b> and <b>a sense of responsibility</b>, qualities that are arguably as important to a good education as academic achievement. At a time when many adolescents spend much of their lives in the virtual world, the opportunity to <b>step outside their comfort zone</b> and make a tangible difference can be genuinely transformative. <b>Community service</b> also develops practical competencies, including <b>teamwork</b>, communication and problem-solving, and provides <b>work experience</b> that employers value.","The benefits to society are equally significant. Many public services are chronically understaffed, and young <b>volunteers</b> could provide meaningful support, from assisting in clinics to tutoring <b>underprivileged</b> children. Bangladesh offers a striking illustration of this potential: in times of <b>disaster relief</b> following floods and cyclones, student <b>volunteers</b> have repeatedly played a vital role. Moreover, when young people from different social and economic backgrounds work side by side, the experience can strengthen <b>social cohesion</b> and a shared sense of <b>civic duty</b>.","Nevertheless, the word \"<b>compulsory</b>\" raises legitimate concerns. For students from low-income families, <b>unpaid</b> service may <b>take time away from</b> <b>studies</b> or paid work on which they depend, and critics argue that forcing people to <b>volunteer</b> is <b>counterproductive</b>, breeding <b>resentment</b> rather than generosity. There is also a risk that poorly organised schemes become <b>tokenistic</b>. These objections, however, argue for careful design rather than rejection: a flexible programme, requiring a few hours a week and offering a choice of placements, would preserve the benefits while minimising the burden.","In conclusion, I believe a thoughtfully designed scheme of <b>community service</b> would enrich young people's lives and strengthen communities, provided that it respects their educational and financial needs."]}],"type":"Opinion (Agree / Disagree)","q":"Some people think that all young people should be required to do unpaid community service, such as helping in hospitals or cleaning public spaces, for a period of time. To what extent do you agree or disagree?"},{"n":28,"title":"Globalisation and cultural identity","cat":"Globalisation & Culture","groups":[{"name":"Reasons to Agree","bn":"একমত হওয়ার কারণ","items":[{"en":"Global brands and fast-food chains now look the same in almost every city.","bn":"বৈশ্বিক ব্র্যান্ড ও ফাস্ট ফুড চেইন এখন প্রায় প্রতিটি শহরে একই রকম দেখায়।"},{"en":"Many young people prefer Western fashion, music and films to local culture.","bn":"অনেক তরুণ স্থানীয় সংস্কৃতির চেয়ে পশ্চিমা ফ্যাশন, সংগীত ও চলচ্চিত্র পছন্দ করে।"},{"en":"Traditional crafts struggle to compete with cheap mass-produced goods.","bn":"ঐতিহ্যবাহী কারুশিল্প সস্তা ব্যাপক উৎপাদিত পণ্যের সঙ্গে প্রতিযোগিতায় হিমশিম খায়।"},{"en":"Minority and indigenous languages are disappearing at a rapid rate.","bn":"সংখ্যালঘু ও আদিবাসী ভাষা দ্রুত হারিয়ে যাচ্ছে।"},{"en":"Some traditional festivals and customs are losing their original meaning.","bn":"কিছু ঐতিহ্যবাহী উৎসব ও রীতি তাদের মূল অর্থ হারাচ্ছে।"}]},{"name":"Reasons to Disagree","bn":"দ্বিমত পোষণের কারণ","items":[{"en":"Core values such as family ties, religion and hospitality remain strong.","bn":"পারিবারিক বন্ধন, ধর্ম ও আতিথেয়তার মতো মূল মূল্যবোধ এখনো শক্তিশালী।"},{"en":"National festivals such as Pohela Boishakh are more popular than ever.","bn":"পহেলা বৈশাখের মতো জাতীয় উৎসব আগের যেকোনো সময়ের চেয়ে বেশি জনপ্রিয়।"},{"en":"The internet allows local music, food and films to reach a global audience.","bn":"ইন্টারনেট স্থানীয় সংগীত, খাবার ও চলচ্চিত্রকে বৈশ্বিক দর্শকের কাছে পৌঁছাতে দেয়।"},{"en":"Cultures often mix old and new traditions rather than disappearing.","bn":"সংস্কৃতি প্রায়ই হারিয়ে না গিয়ে পুরনো ও নতুন ঐতিহ্য মিশিয়ে নেয়।"},{"en":"Non-Western cultures, such as Korean culture, now influence the rest of the world.","bn":"কোরীয় সংস্কৃতির মতো অ-পশ্চিমা সংস্কৃতি এখন বাকি বিশ্বকে প্রভাবিত করছে।"}]},{"name":"Evaluation: My Answer","bn":"মূল্যায়ন — আমার উত্তর","items":[{"en":"I partly agree that globalisation threatens cultural identity, but I believe most cultures are adapting rather than disappearing.","bn":"আমি আংশিক একমত যে বিশ্বায়ন সাংস্কৃতিক পরিচয়কে হুমকিতে ফেলছে, তবে বিশ্বাস করি বেশিরভাগ সংস্কৃতি হারিয়ে না গিয়ে খাপ খাইয়ে নিচ্ছে।"},{"en":"I strongly agree that globalisation is weakening local cultures, especially among young people in cities.","bn":"আমি দৃঢ়ভাবে একমত যে বিশ্বায়ন স্থানীয় সংস্কৃতিকে দুর্বল করছে, বিশেষ করে শহরের তরুণদের মধ্যে।"}]}],"vocab":[["globalisation","বিশ্বায়ন"],["cultural identity","সাংস্কৃতিক পরিচয়"],["traditions","ঐতিহ্য"],["multinational companies","বহুজাতিক কোম্পানি"],["Western culture","পশ্চিমা সংস্কৃতি"],["homogeneous","একরূপ / একরকম"],["heritage","ঐতিহ্য"],["festivals","উৎসব"],["language","ভাষা"],["values","মূল্যবোধ"],["fusion","মিশ্রণ"],["social media","সামাজিক মাধ্যম"],["diversity","বৈচিত্র্য"],["preserve","সংরক্ষণ করা"]],"phrases":[["fast-food chains","ফাস্ট ফুড চেইন"],["follow global trends","বৈশ্বিক প্রবণতা অনুসরণ করা"],["lose touch with their roots","নিজের শিকড় থেকে বিচ্ছিন্ন হওয়া"],["a blend of old and new","পুরনো ও নতুনের মিশ্রণ"],["reach a global audience","বৈশ্বিক দর্শকের কাছে পৌঁছানো"],["on the surface","বাহ্যিকভাবে"],["deeply rooted","গভীরভাবে প্রোথিত"],["take pride in","গর্ব করা"],["under threat","হুমকির মুখে"],["pass down to the next generation","পরের প্রজন্মের কাছে পৌঁছে দেওয়া"]],"sents":[{"en":"Fast-food chains and global brands can now be found in almost every city.","bn":"ফাস্ট ফুড চেইন ও বৈশ্বিক ব্র্যান্ড এখন প্রায় প্রতিটি শহরে পাওয়া যায়।"},{"en":"Many young people follow global trends in fashion and music.","bn":"অনেক তরুণ ফ্যাশন ও সংগীতে বৈশ্বিক প্রবণতা অনুসরণ করে।"},{"en":"Some worry that young people are losing touch with their roots.","bn":"কেউ কেউ চিন্তিত যে তরুণরা নিজের শিকড় থেকে বিচ্ছিন্ন হচ্ছে।"},{"en":"Traditional crafts and local languages are under threat in some places.","bn":"কিছু জায়গায় ঐতিহ্যবাহী কারুশিল্প ও স্থানীয় ভাষা হুমকির মুখে।"},{"en":"However, cultural values such as family ties and hospitality are deeply rooted.","bn":"তবে পারিবারিক বন্ধন ও আতিথেয়তার মতো সাংস্কৃতিক মূল্যবোধ গভীরভাবে প্রোথিত।"},{"en":"In Bangladesh, festivals such as Pohela Boishakh are more popular than ever.","bn":"বাংলাদেশে পহেলা বৈশাখের মতো উৎসব আগের যেকোনো সময়ের চেয়ে বেশি জনপ্রিয়।"},{"en":"Social media allows local music and food to reach a global audience.","bn":"সামাজিক মাধ্যম স্থানীয় সংগীত ও খাবারকে বৈশ্বিক দর্শকের কাছে পৌঁছাতে দেয়।"},{"en":"Many cultures create a blend of old and new rather than losing their identity.","bn":"অনেক সংস্কৃতি পরিচয় না হারিয়ে পুরনো ও নতুনের মিশ্রণ তৈরি করে।"}],"xvocab":[["cultural homogenisation","সাংস্কৃতিক একরূপীকরণ"],["soft power","নরম শক্তি (সাংস্কৃতিক প্রভাব)"],["hybrid","মিশ্র"],["indigenous","আদিবাসী / দেশীয়"],["commercialisation","বাণিজ্যিকীকরণ"],["cultural exchange","সাংস্কৃতিক বিনিময়"],["resilient","সহনশীল"],["superficial","বাহ্যিক / অগভীর"]],"xsents":[{"en":"Critics warn of cultural homogenisation driven by Hollywood and global brands.","bn":"সমালোচকরা হলিউড ও বৈশ্বিক ব্র্যান্ডচালিত সাংস্কৃতিক একরূপীকরণের বিষয়ে সতর্ক করেন।"},{"en":"The global success of K-pop shows that cultural exchange works in both directions.","bn":"কে-পপের বৈশ্বিক সাফল্য দেখায় সাংস্কৃতিক বিনিময় দুই দিকেই কাজ করে।"},{"en":"Many indigenous languages are disappearing faster than ever.","bn":"অনেক আদিবাসী ভাষা আগের চেয়ে দ্রুত হারিয়ে যাচ্ছে।"},{"en":"Cultures are often more resilient than people expect.","bn":"সংস্কৃতি প্রায়ই মানুষের প্রত্যাশার চেয়ে বেশি সহনশীল।"}],"essays":[{"label":"BASIC ESSAY (BAND 5–6)","words":253,"paras":["Some people think that because of <b>globalisation</b>, countries are losing their culture, because people everywhere wear the same clothes, eat the same food and watch the same films. <b>I partly agree that globalisation threatens cultural identity, but I believe most cultures are adapting rather than disappearing.</b>","It is true that <b>globalisation</b> has changed many cultures. Today, we can find fast-food restaurants like KFC and Pizza Hut in every big city, including Dhaka. Many young people wear jeans and T-shirts instead of traditional clothes, and they watch Hollywood films and listen to English songs. Some traditional crafts and local <b>languages</b> are also disappearing because young people are not interested in them. So, in some ways, cultures are becoming more similar.","However, I do not think countries are losing their identity completely. Firstly, the most important parts of culture, like <b>language</b>, religion, family <b>values</b> and <b>festivals</b>, are still strong. For example, in Bangladesh, millions of people still celebrate Pohela Boishakh and Eid in traditional ways, and many young people wear panjabis and saris on these days. Secondly, <b>globalisation</b> can also help local cultures. Through the internet, people from other countries can learn about our food, music and films. Thirdly, many cultures mix old and new, for example by creating new types of food or music.","In conclusion, <b>globalisation</b> has made some parts of life more similar around the world. However, I believe that countries are not losing their <b>cultural identity</b>, because the most important <b>traditions</b> are still strong, and cultures are changing rather than disappearing."]},{"label":"ADVANCED ESSAY (BAND 7)","words":262,"paras":["It is often claimed that <b>globalisation</b> is erasing national cultures, as people around the world increasingly share the same fashion, food and entertainment. <b>I partly agree that globalisation threatens cultural identity, but I believe most cultures are adapting rather than disappearing.</b>","There is certainly some truth in this claim. <b>Fast-food chains</b> and global brands can now be found in almost every city, and many young people <b>follow global trends</b> in fashion and music rather than local <b>traditions</b>. In Dhaka, for instance, shopping malls are full of international brands, while traditional handloom products struggle to compete. More seriously, some traditional crafts and minority <b>languages</b> are genuinely <b>under threat</b>, and there is a risk that young people are <b>losing touch with their roots</b>.","However, I believe these changes are largely <b>on the surface</b>. The deeper elements of culture, such as <b>language</b>, religion, family ties and hospitality, remain <b>deeply rooted</b> and have changed far less. In Bangladesh, <b>festivals</b> such as Pohela Boishakh are arguably more popular than ever, and young people who wear jeans every day proudly wear traditional clothes on special occasions. Furthermore, <b>globalisation</b> is not a one-way process. <b>Social media</b> allows local music, food and films to <b>reach a global audience</b>; the worldwide popularity of Korean culture shows that non-Western cultures can influence the rest of the world. Many cultures also create <b>a blend of old and new</b>, such as <b>fusion</b> cuisine or modern versions of folk songs.","In conclusion, while <b>globalisation</b> has made everyday life more similar across countries and threatens some <b>traditions</b>, I believe <b>cultural identity</b> is evolving rather than disappearing."]},{"label":"BAND 9 ESSAY","words":338,"paras":["It is frequently argued that <b>globalisation</b> is steadily eroding national cultures, producing a world in which people dress, eat and entertain themselves in increasingly similar ways. <b>I partly agree that globalisation threatens cultural identity, but I believe most cultures are adapting rather than disappearing.</b>","The concern is not unfounded. The spread of <b>multinational companies</b> has made the same brands, <b>fast-food chains</b> and entertainment ubiquitous; from Dhaka to Nairobi, shopping centres display almost identical storefronts, and young people often <b>follow global trends</b> in fashion and music rather than local <b>traditions</b>. Critics describe this as <b>cultural homogenisation</b>, driven largely by the economic and <b>soft power</b> of Western, and particularly American, industries. The consequences can be serious at the margins: traditional crafts struggle to compete with mass-produced goods, and many <b>indigenous</b> <b>languages</b> are disappearing faster than ever, taking with them unique bodies of knowledge.","Nevertheless, I believe this picture overstates the case, because it confuses the surface of culture with its substance. Clothing and diet may converge, but the deeper elements of identity, such as <b>language</b>, religious practice, family structures and social <b>values</b>, are far more <b>deeply rooted</b> and have proved remarkably <b>resilient</b>. In Bangladesh, the Bengali New Year celebrations have grown in scale and enthusiasm over recent decades, and even young people immersed in global pop culture <b>take pride in</b> their <b>language</b> and <b>heritage</b>. Moreover, <b>globalisation</b> is increasingly a two-way process. Digital platforms allow local music, cuisine and cinema to <b>reach a global audience</b>, and the international success of Korean popular culture demonstrates that <b>cultural exchange</b> no longer flows only from West to East. What frequently emerges is not the replacement of one culture by another but a <b>hybrid</b>, <b>a blend of old and new</b>, as seen in <b>fusion</b> cuisine or folk melodies reinterpreted by contemporary artists.","In conclusion, <b>globalisation</b> undoubtedly threatens certain vulnerable <b>traditions</b> and deserves careful attention. Overall, however, I believe national cultures are evolving rather than vanishing, and that <b>globalisation</b> can, if managed wisely, help to <b>preserve</b> and promote cultural <b>diversity</b> as much as it endangers it."]}],"type":"Opinion (Agree / Disagree)","q":"Some people say that globalisation is causing countries to lose their cultural identity, as people everywhere wear the same clothes, eat the same food and watch the same films. To what extent do you agree or disagree?"},{"n":29,"title":"English as a global language","cat":"Globalisation & Culture","groups":[{"name":"Positive Effects","bn":"ইতিবাচক প্রভাব","items":[{"en":"English allows people from different countries to communicate easily.","bn":"ইংরেজি বিভিন্ন দেশের মানুষকে সহজে যোগাযোগ করতে দেয়।"},{"en":"Most scientific research and online information is available in English.","bn":"বেশিরভাগ বৈজ্ঞানিক গবেষণা ও অনলাইন তথ্য ইংরেজিতে পাওয়া যায়।"},{"en":"Good English improves job prospects and access to international companies.","bn":"ভালো ইংরেজি চাকরির সম্ভাবনা ও আন্তর্জাতিক প্রতিষ্ঠানে প্রবেশাধিকার বাড়ায়।"},{"en":"English makes it possible to study at universities abroad.","bn":"ইংরেজি বিদেশের বিশ্ববিদ্যালয়ে পড়াশোনা সম্ভব করে।"},{"en":"A shared language supports international trade, tourism and diplomacy.","bn":"একটি অভিন্ন ভাষা আন্তর্জাতিক বাণিজ্য, পর্যটন ও কূটনীতিকে সহায়তা করে।"}]},{"name":"Negative Effects","bn":"নেতিবাচক প্রভাব","items":[{"en":"When English replaces local languages, people may lose part of their cultural identity.","bn":"ইংরেজি স্থানীয় ভাষাকে প্রতিস্থাপন করলে মানুষ সাংস্কৃতিক পরিচয়ের একটি অংশ হারাতে পারে।"},{"en":"Many small languages are dying out, along with their stories and knowledge.","bn":"অনেক ছোট ভাষা তাদের গল্প ও জ্ঞানসহ বিলুপ্ত হয়ে যাচ্ছে।"},{"en":"Children usually learn difficult subjects best in their mother tongue.","bn":"শিশুরা সাধারণত কঠিন বিষয় মাতৃভাষায় সবচেয়ে ভালো শেখে।"},{"en":"English-medium education is often available only to wealthier families.","bn":"ইংরেজি মাধ্যম শিক্ষা প্রায়ই শুধু ধনী পরিবারের জন্য সহজলভ্য।"},{"en":"Local literature and traditions may be neglected by younger generations.","bn":"স্থানীয় সাহিত্য ও ঐতিহ্য তরুণ প্রজন্মের কাছে অবহেলিত হতে পারে।"}]},{"name":"Evaluation: Positive or Negative?","bn":"মূল্যায়ন — ইতিবাচক নাকি নেতিবাচক?","items":[{"en":"I believe the spread of English is positive for international communication, but it becomes negative when it replaces local languages.","bn":"আমি মনে করি ইংরেজির প্রসার আন্তর্জাতিক যোগাযোগের জন্য ইতিবাচক, তবে এটি স্থানীয় ভাষাকে প্রতিস্থাপন করলে নেতিবাচক হয়ে যায়।"},{"en":"In my view, English as a global language is a largely positive development, as long as local languages are also protected.","bn":"আমার মতে, বৈশ্বিক ভাষা হিসেবে ইংরেজি মূলত একটি ইতিবাচক পরিবর্তন, যদি স্থানীয় ভাষাগুলোও সুরক্ষিত থাকে।"}]}],"vocab":[["global language","বৈশ্বিক ভাষা"],["mother tongue","মাতৃভাষা"],["communication","যোগাযোগ"],["international business","আন্তর্জাতিক ব্যবসা"],["career opportunities","পেশাগত সুযোগ"],["cultural heritage","সাংস্কৃতিক ঐতিহ্য"],["literature","সাহিত্য"],["bilingual","দ্বিভাষিক"],["medium of instruction","শিক্ষার মাধ্যম"],["identity","পরিচয়"],["endangered languages","বিপন্ন ভাষা"],["academic research","একাডেমিক গবেষণা"],["inequality","বৈষম্য"],["fluent","সাবলীল"]],"phrases":[["a common language","অভিন্ন ভাষা"],["break down barriers","বাধা ভেঙে দেওয়া"],["access to knowledge","জ্ঞানে প্রবেশাধিকার"],["study abroad","বিদেশে পড়াশোনা করা"],["lose part of their identity","পরিচয়ের একটি অংশ হারানো"],["die out","বিলুপ্ত হয়ে যাওয়া"],["in addition to","এর পাশাপাশি"],["think and express themselves","চিন্তা ও নিজেকে প্রকাশ করা"],["a privileged minority","সুবিধাপ্রাপ্ত সংখ্যালঘু"],["the best of both worlds","দুদিকেরই সুবিধা"]],"sents":[{"en":"English provides a common language for people from different countries.","bn":"ইংরেজি বিভিন্ন দেশের মানুষের জন্য একটি অভিন্ন ভাষা দেয়।"},{"en":"It helps to break down barriers in business, science and travel.","bn":"এটি ব্যবসা, বিজ্ঞান ও ভ্রমণে বাধা ভেঙে দিতে সাহায্য করে।"},{"en":"Most academic research is published in English, so it gives access to knowledge.","bn":"বেশিরভাগ একাডেমিক গবেষণা ইংরেজিতে প্রকাশিত হয়, তাই এটি জ্ঞানে প্রবেশাধিকার দেয়।"},{"en":"Good English skills improve career opportunities and allow students to study abroad.","bn":"ভালো ইংরেজি দক্ষতা পেশাগত সুযোগ বাড়ায় এবং শিক্ষার্থীদের বিদেশে পড়তে দেয়।"},{"en":"However, when English replaces the mother tongue, people may lose part of their identity.","bn":"তবে ইংরেজি মাতৃভাষাকে প্রতিস্থাপন করলে মানুষ পরিচয়ের একটি অংশ হারাতে পারে।"},{"en":"Many small languages are dying out every year.","bn":"প্রতি বছর অনেক ছোট ভাষা বিলুপ্ত হয়ে যাচ্ছে।"},{"en":"Children usually learn best in their mother tongue.","bn":"শিশুরা সাধারণত মাতৃভাষায় সবচেয়ে ভালো শেখে।"},{"en":"English should be learned in addition to the mother tongue, not instead of it.","bn":"ইংরেজি মাতৃভাষার বদলে নয়, পাশাপাশি শেখা উচিত।"}],"xvocab":[["lingua franca","যোগাযোগের অভিন্ন ভাষা"],["linguistic diversity","ভাষাগত বৈচিত্র্য"],["English-medium schools","ইংরেজি মাধ্যম স্কুল"],["Language Movement","ভাষা আন্দোলন"],["elitism","অভিজাততন্ত্র"],["competitive advantage","প্রতিযোগিতামূলক সুবিধা"],["oral traditions","মৌখিক ঐতিহ্য"],["multilingual","বহুভাষিক"]],"xsents":[{"en":"English has become the lingua franca of the modern world.","bn":"ইংরেজি আধুনিক বিশ্বের যোগাযোগের অভিন্ন ভাষা হয়ে উঠেছে।"},{"en":"Bangladesh's Language Movement shows how closely language is linked to identity.","bn":"বাংলাদেশের ভাষা আন্দোলন দেখায় ভাষা পরিচয়ের সঙ্গে কতটা ঘনিষ্ঠভাবে যুক্ত।"},{"en":"English-medium education can create a form of elitism.","bn":"ইংরেজি মাধ্যম শিক্ষা এক ধরনের অভিজাততন্ত্র তৈরি করতে পারে।"},{"en":"Protecting linguistic diversity preserves human knowledge.","bn":"ভাষাগত বৈচিত্র্য রক্ষা মানুষের জ্ঞান সংরক্ষণ করে।"}],"essays":[{"label":"BASIC ESSAY (BAND 5–6)","words":256,"paras":["Today, English is used all over the world, and in some countries it is replacing local languages in schools and business. <b>I believe the spread of English is positive for international communication, but it becomes negative when it replaces local languages.</b>","There are some clear advantages of English as a <b>global language</b>. Firstly, people from different countries can communicate easily. For example, a businessman from Bangladesh can talk to customers in Japan or Germany in English. Secondly, most books, websites and scientific research are in English, so people who know English can learn more. Thirdly, English helps people to get better jobs and to study in other countries. Many Bangladeshi students learn English and take the IELTS test so that they can <b>study abroad</b>.","However, there are also disadvantages when English replaces local languages. Firstly, language is an important part of culture and <b>identity</b>. If children only use English, they may forget their <b>mother tongue</b> and their traditions, songs and <b>literature</b>. In Bangladesh, people gave their lives for the Bangla language in 1952, so our language is very important to us. Secondly, children learn better in their own language. If they study difficult subjects in English, they may not understand them well. Thirdly, only rich people can go to good <b>English-medium schools</b>, so this can make society more unequal.","In conclusion, English is very useful for <b>communication</b>, education and jobs. However, I think people should learn English <b>in addition to</b> their <b>mother tongue</b>, not instead of it, so they can enjoy <b>the best of both worlds</b>."]},{"label":"ADVANCED ESSAY (BAND 7)","words":275,"paras":["English has become the dominant international language, and in some countries it is replacing local languages in classrooms and workplaces. <b>I believe the spread of English is positive for international communication, but it becomes negative when it replaces local languages.</b>","On the positive side, English provides <b>a common language</b> for people from different countries, which helps to <b>break down barriers</b> in business, diplomacy and tourism. It also offers <b>access to knowledge</b>, since most <b>academic research</b> and a large proportion of online content are published in English. For individuals, good English skills significantly improve <b>career opportunities</b> and make it possible to <b>study abroad</b>; many young Bangladeshis, for instance, see English as the key to international scholarships and jobs.","However, when English begins to replace the <b>mother tongue</b> rather than complement it, the effects are largely negative. Language is closely tied to <b>identity</b>, and people who lose their native language may <b>lose part of their identity</b>, including their connection to their <b>literature</b> and traditions. This is particularly significant in Bangladesh, where the <b>Language Movement</b> of 1952 made the Bangla language a symbol of national pride. Furthermore, many small languages are dying out every year, and with them unique cultural knowledge disappears. There are also educational concerns: children usually learn best in their <b>mother tongue</b>, so studying complex subjects in a second language may hold them back. Finally, English-medium education is often available only to wealthier families, which can deepen <b>inequality</b>.","In conclusion, English as a <b>global language</b> is a valuable tool. However, it should be learned <b>in addition to</b> the <b>mother tongue</b>, not instead of it, so that people gain international opportunities without losing their cultural <b>identity</b>."]},{"label":"BAND 9 ESSAY","words":351,"paras":["English has established itself as the principal language of international <b>communication</b>, and in a growing number of countries it is displacing local languages in education and commerce. <b>I believe the spread of English is positive for international communication, but it becomes negative when it replaces local languages.</b>","The benefits of a shared <b>global language</b> are substantial. As the <b>lingua franca</b> of business, science, aviation and diplomacy, English provides <b>a common language</b> that enables people from vastly different backgrounds to cooperate, helping to <b>break down barriers</b> that once impeded trade and scholarship. It also opens <b>access to knowledge</b>: the overwhelming majority of <b>academic research</b> and a large share of online content are produced in English. For individuals, particularly in developing countries, proficiency can be transformative, significantly expanding <b>career opportunities</b> and making it possible to <b>study abroad</b>. It is no coincidence that tens of thousands of young Bangladeshis sit English proficiency tests every year in pursuit of international education and employment.","The picture changes, however, when English ceases to be an additional language and begins to replace the <b>mother tongue</b>. Language is inseparable from <b>identity</b>; it carries a community's <b>literature</b>, humour, <b>oral traditions</b> and ways of seeing the world, and those who abandon their native language may <b>lose part of their identity</b> in the process. For Bangladesh, a nation whose very origins lie in the <b>Language Movement</b> of 1952, the idea that Bangla might be sidelined in its own universities and offices is deeply troubling. Globally, the consequences are already visible: <b>linguistic diversity</b> is declining rapidly, with minority languages dying out and taking unique knowledge with them. There are practical drawbacks too. Research consistently shows that children learn most effectively in their <b>mother tongue</b>, and English-medium education, often accessible only to wealthier families, risks creating a form of linguistic <b>elitism</b> that entrenches <b>inequality</b>.","In conclusion, the rise of English as a <b>global language</b> is beneficial insofar as it enables international <b>communication</b> and opportunity. It becomes harmful only when it displaces local languages, which is why societies should aim to be <b>multilingual</b>, learning English <b>in addition to</b>, rather than instead of, their <b>mother tongue</b>."]}],"type":"Positive or negative development","q":"English is increasingly used as a global language, and in some countries it is replacing local languages in education and business. Is this a positive or negative development?"},{"n":30,"title":"Should museums be free?","cat":"Globalisation & Culture","groups":[{"name":"Reasons to Agree","bn":"একমত হওয়ার কারণ","items":[{"en":"Free entry allows everyone, rich or poor, to learn about their history and culture.","bn":"বিনামূল্যে প্রবেশ ধনী-গরিব সবাইকে নিজেদের ইতিহাস ও সংস্কৃতি সম্পর্কে জানতে দেয়।"},{"en":"Museums have great educational value for students and adults alike.","bn":"জাদুঘরের শিক্ষার্থী ও প্রাপ্তবয়স্ক সবার জন্য বিশাল শিক্ষামূলক মূল্য আছে।"},{"en":"Removing fees greatly increases the number of visitors.","bn":"ফি তুলে দিলে দর্শনার্থীর সংখ্যা ব্যাপকভাবে বাড়ে।"},{"en":"Cultural heritage belongs to the whole nation, not only to those who can pay.","bn":"সাংস্কৃতিক ঐতিহ্য পুরো জাতির, শুধু যারা টাকা দিতে পারে তাদের নয়।"},{"en":"Free museums make school trips more affordable for poorer schools.","bn":"বিনামূল্যের জাদুঘর দরিদ্র স্কুলগুলোর জন্য শিক্ষাসফর সাশ্রয়ী করে।"}]},{"name":"Reasons to Disagree","bn":"দ্বিমত পোষণের কারণ","items":[{"en":"Museums need money to maintain buildings and protect valuable collections.","bn":"জাদুঘরের ভবন রক্ষণাবেক্ষণ ও মূল্যবান সংগ্রহ সুরক্ষায় অর্থ প্রয়োজন।"},{"en":"Entrance fees reduce the burden on taxpayers.","bn":"প্রবেশ মূল্য করদাতাদের ওপর বোঝা কমায়।"},{"en":"Foreign tourists can easily afford to pay and contribute to local culture.","bn":"বিদেশি পর্যটকরা সহজেই টাকা দিতে ও স্থানীয় সংস্কৃতিতে অবদান রাখতে পারেন।"},{"en":"Fees help to control crowds and protect fragile exhibits.","bn":"ফি ভিড় নিয়ন্ত্রণ ও ভঙ্গুর প্রদর্শনী সুরক্ষায় সাহায্য করে।"},{"en":"People may value an experience more when they pay for it.","bn":"মানুষ কোনো অভিজ্ঞতার জন্য টাকা দিলে তা বেশি মূল্যবান মনে করতে পারে।"}]},{"name":"Evaluation: My Answer","bn":"মূল্যায়ন — আমার উত্তর","items":[{"en":"I strongly agree that museums should be free, because culture and history should be accessible to everyone, not only those who can afford to pay.","bn":"আমি দৃঢ়ভাবে একমত যে জাদুঘর বিনামূল্যে হওয়া উচিত, কারণ সংস্কৃতি ও ইতিহাস শুধু যারা টাকা দিতে পারে তাদের জন্য নয়, সবার জন্য সহজলভ্য হওয়া উচিত।"},{"en":"I largely agree that museums should be free for local citizens, although charging foreign tourists would be reasonable.","bn":"আমি মূলত একমত যে স্থানীয় নাগরিকদের জন্য জাদুঘর বিনামূল্যে হওয়া উচিত, যদিও বিদেশি পর্যটকদের কাছ থেকে ফি নেওয়া যুক্তিসংগত।"}]}],"vocab":[["museums","জাদুঘর"],["art galleries","চিত্রশালা"],["entrance fee","প্রবেশ মূল্য"],["accessible","সহজলভ্য"],["cultural heritage","সাংস্কৃতিক ঐতিহ্য"],["exhibitions","প্রদর্শনী"],["maintenance","রক্ষণাবেক্ষণ"],["public funding","সরকারি অর্থায়ন"],["donations","অনুদান"],["visitors","দর্শনার্থী"],["tourists","পর্যটক"],["educational","শিক্ষামূলক"],["low-income families","নিম্ন আয়ের পরিবার"],["collections","সংগ্রহ"]],"phrases":[["open to everyone","সবার জন্য উন্মুক্ত"],["regardless of income","আয় নির্বিশেষে"],["learn about their history","নিজেদের ইতিহাস সম্পর্কে জানা"],["a sense of national pride","জাতীয় গর্ববোধ"],["school trips","স্কুলের শিক্ষাসফর"],["cover the costs","খরচ বহন করা"],["run museums","জাদুঘর পরিচালনা করা"],["visitor numbers","দর্শনার্থীর সংখ্যা"],["pay for special exhibitions","বিশেষ প্রদর্শনীর জন্য টাকা দেওয়া"],["a public good","জনকল্যাণমূলক সম্পদ"]],"sents":[{"en":"Free museums are open to everyone, regardless of income.","bn":"বিনামূল্যের জাদুঘর আয় নির্বিশেষে সবার জন্য উন্মুক্ত।"},{"en":"Museums help people learn about their history and culture.","bn":"জাদুঘর মানুষকে নিজেদের ইতিহাস ও সংস্কৃতি সম্পর্কে জানতে সাহায্য করে।"},{"en":"They can create a sense of national pride.","bn":"এগুলো জাতীয় গর্ববোধ তৈরি করতে পারে।"},{"en":"Entrance fees prevent many low-income families from visiting.","bn":"প্রবেশ মূল্য অনেক নিম্ন আয়ের পরিবারকে যেতে বাধা দেয়।"},{"en":"When the UK made national museums free, visitor numbers rose sharply.","bn":"যুক্তরাজ্য জাতীয় জাদুঘর বিনামূল্যে করার পর দর্শনার্থীর সংখ্যা তীব্রভাবে বেড়েছিল।"},{"en":"However, it costs a lot of money to run museums and protect valuable collections.","bn":"তবে জাদুঘর পরিচালনা ও মূল্যবান সংগ্রহ সুরক্ষায় অনেক টাকা লাগে।"},{"en":"Visitors could pay for special exhibitions while general entry remains free.","bn":"সাধারণ প্রবেশ বিনামূল্যে রেখে দর্শনার্থীরা বিশেষ প্রদর্শনীর জন্য টাকা দিতে পারেন।"},{"en":"Donations and cafés can help cover the costs.","bn":"অনুদান ও ক্যাফে খরচ বহনে সাহায্য করতে পারে।"}],"xvocab":[["cultural enrichment","সাংস্কৃতিক সমৃদ্ধি"],["lifelong learning","আজীবন শিক্ষা"],["conservation","সংরক্ষণ"],["elitist","অভিজাতকেন্দ্রিক"],["underfunded","অর্থসংকটে থাকা"],["tiered pricing","স্তরভিত্তিক মূল্য নির্ধারণ"],["civic space","নাগরিক পরিসর"],["Liberation War Museum","মুক্তিযুদ্ধ জাদুঘর"]],"xsents":[{"en":"Charging high fees can make museums seem elitist.","bn":"উচ্চ ফি নিলে জাদুঘরকে অভিজাতকেন্দ্রিক মনে হতে পারে।"},{"en":"Many museums in developing countries are seriously underfunded.","bn":"উন্নয়নশীল দেশের অনেক জাদুঘর গুরুতর অর্থসংকটে।"},{"en":"Tiered pricing allows tourists to pay more while locals enter cheaply.","bn":"স্তরভিত্তিক মূল্য নির্ধারণ পর্যটকদের বেশি দিতে এবং স্থানীয়দের কম খরচে প্রবেশ করতে দেয়।"},{"en":"A visit to the Liberation War Museum teaches young people about 1971.","bn":"মুক্তিযুদ্ধ জাদুঘর পরিদর্শন তরুণদের ১৯৭১ সম্পর্কে শেখায়।"}],"essays":[{"label":"BASIC ESSAY (BAND 5–6)","words":263,"paras":["Some people think <b>museums</b> and <b>art galleries</b> should be free for everyone, while others think <b>visitors</b> should pay. <b>I strongly agree that museums should be free, because culture and history should be accessible to everyone, not only those who can afford to pay.</b>","The first reason is that <b>museums</b> are very <b>educational</b>. In a museum, people can learn about the history, art and science of their country and the world. For example, when students visit the <b>Liberation War Museum</b> in Dhaka, they learn about 1971 in a way that is more interesting than a textbook. If <b>museums</b> are free, more schools and families can visit them, and people will know more about their culture.","The second reason is fairness. If <b>museums</b> are expensive, poor people cannot visit them, especially large families with children. Only rich people will enjoy culture and history. However, culture belongs to everyone, so everyone should be able to see it. For example, when the UK made its national <b>museums</b> free, many more people started to visit them.","Some people say that <b>museums</b> need money to take care of old objects, pay staff and keep the buildings clean. This is true. However, the government can pay for <b>museums</b> with taxes, and <b>museums</b> can also earn money in other ways. For instance, they can have a café or a shop, ask <b>visitors</b> for <b>donations</b>, or charge money for special <b>exhibitions</b>.","In conclusion, I believe <b>museums</b> should be free for everyone. They are important for education, and free entry means that everyone, rich or poor, can <b>learn about their history</b> and culture."]},{"label":"ADVANCED ESSAY (BAND 7)","words":274,"paras":["There is disagreement about whether <b>museums</b> and galleries should charge <b>visitors</b> or offer free admission. <b>I strongly agree that museums should be free, because culture and history should be accessible to everyone, not only those who can afford to pay.</b>","The main reason for my view is the <b>educational</b> value of <b>museums</b>. They help people <b>learn about their history</b>, science and art in a direct and memorable way, and they support <b>lifelong learning</b> for people of all ages. In Bangladesh, for example, a visit to the <b>Liberation War Museum</b> can teach young people about 1971 far more powerfully than a textbook. Free entry also encourages schools to organise more <b>school trips</b>, which benefits students who might otherwise never visit a museum.","Secondly, free <b>museums</b> are fairer. Entrance fees prevent many <b>low-income families</b> from visiting, which means that <b>cultural heritage</b>, which belongs to the whole nation, is enjoyed mainly by the wealthy. Evidence suggests that removing fees has a significant effect: when the UK made national <b>museums</b> free, <b>visitor numbers</b> rose sharply, particularly among groups who had rarely visited before.","Admittedly, it costs a lot of money to <b>run museums</b> and protect valuable <b>collections</b>, and critics argue that <b>visitors</b> should contribute. However, there are other ways to <b>cover the costs</b>. <b>Museums</b> can receive <b>public funding</b>, as they are <b>a public good</b>, and they can raise additional inco
