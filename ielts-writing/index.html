nage their time and avoid <b>distractions</b>. In the future, <b>online learning</b> will become even more popular."]},{"label":"ADVANCED ESSAY (BAND 7)","words":277,"paras":["In recent years, a growing number of students have chosen to take their courses online instead of attending lectures in person. <b>I believe the advantages of online study, particularly its flexibility and accessibility, clearly outweigh the disadvantages.</b>","Admittedly, <b>online learning</b> has some significant drawbacks. Firstly, it requires a high level of <b>self-discipline</b>, since at home it is easy to <b>lose focus</b> because of <b>distractions</b> such as social media. Secondly, the <b>lack of social interaction</b> can leave students feeling isolated, and they miss the chance to develop teamwork and communication skills through <b>face-to-face</b> contact. Finally, students without a reliable <b>internet connection</b> can easily <b>fall behind</b>, which may widen the gap between rich and poor learners. However, many universities now offer <b>blended learning</b>, which reduces some of these problems.","Nevertheless, the benefits are more substantial. The most important is <b>flexibility</b>: <b>online learning</b> allows students to <b>study at their own pace</b>, and working adults can fit their studies around their jobs and families. This makes <b>lifelong learning</b> possible for millions of people who could never attend full-time classes. This is especially valuable for women with young children, who often cannot attend classes on campus. Another major advantage is <b>accessibility</b>. Students in <b>remote areas</b> can now take <b>a world-class course</b> <b>from the comfort of their own home</b>, and they <b>save time and money</b> on travel and accommodation. In a country like Bangladesh, where the best universities are concentrated in a few cities, this is a genuine opportunity for rural students.","In conclusion, although <b>online learning</b> demands <b>self-discipline</b> and reduces personal contact, I am convinced that its <b>flexibility</b> and <b>accessibility</b> make it a largely positive development, and these benefits outweigh its drawbacks."]},{"label":"BAND 9 ESSAY","words":322,"paras":["The past decade has seen a marked shift from traditional classroom instruction towards courses delivered online, a trend dramatically accelerated by the pandemic. <b>I believe the advantages of online study, particularly its flexibility and accessibility, clearly outweigh the disadvantages.</b>","It would be naive to dismiss the drawbacks. Studying remotely demands considerable <b>self-discipline</b>; without the structure of a timetable, <b>procrastination</b> becomes a genuine risk, and at home it is all too easy to <b>lose focus</b> amid the <b>distractions</b> of social media. The <b>lack of social interaction</b> is equally problematic, as students may feel isolated and miss opportunities to develop <b>soft skills</b> such as teamwork and public speaking, which are cultivated far more naturally <b>face-to-face</b>. There is also the <b>digital divide</b>: learners without a reliable <b>internet connection</b> or a suitable device can quickly <b>fall behind</b>, and certain disciplines, such as medicine or engineering, still require <b>laboratory work</b> and <b>hands-on experience</b> that cannot be replicated on a screen.","These concerns, however, are outweighed by two compelling benefits. The first is <b>flexibility</b>. Online courses allow students to <b>study at their own pace</b>, revisiting difficult material as often as necessary, and they enable working adults and parents to fit their studies around existing commitments. In doing so, they make <b>lifelong learning</b> a practical reality rather than an aspiration. The second, and arguably more significant, benefit is <b>accessibility</b>. A student in a remote village can now take <b>a world-class course</b> <b>from the comfort of their own home</b>, saving both time and money on travel and accommodation. In this sense, online platforms have done more to <b>democratise education</b> than any policy in recent memory, particularly in countries where elite institutions are concentrated in a handful of cities.","In conclusion, while <b>online learning</b> requires self-<b>motivation</b> and cannot fully replace practical instruction, its capacity to widen access and accommodate diverse lifestyles means that, on balance, its advantages clearly outweigh its disadvantages, especially where <b>blended learning</b> combines the strengths of both approaches."]}],"type":"Advantages and disadvantages","q":"More and more students are now studying online rather than attending classes in person. Do the advantages of this development outweigh the disadvantages?"},{"n":4,"title":"Taking a gap year before university","cat":"Education","groups":[{"name":"Advantages","bn":"সুবিধা","items":[{"en":"A gap year gives young people a much-needed rest after many years of exam pressure.","bn":"গ্যাপ ইয়ার বছরের পর বছর পরীক্ষার চাপের পর তরুণদের অত্যন্ত প্রয়োজনীয় বিশ্রাম দেয়।"},{"en":"Working for a year builds independence and allows students to save money for university.","bn":"এক বছর কাজ করা স্বনির্ভরতা গড়ে তোলে এবং শিক্ষার্থীদের বিশ্ববিদ্যালয়ের জন্য টাকা জমাতে দেয়।"},{"en":"Travelling helps young people broaden their horizons and understand other cultures.","bn":"ভ্রমণ তরুণদের দৃষ্টিভঙ্গি প্রসারিত করতে ও অন্য সংস্কৃতি বুঝতে সাহায্য করে।"},{"en":"Many students use the year to decide what they really want to study.","bn":"অনেক শিক্ষার্থী বছরটি ব্যবহার করে তারা আসলে কী পড়তে চায় তা ঠিক করতে।"},{"en":"Work experience and volunteering can make a CV more attractive to future employers.","bn":"কাজের অভিজ্ঞতা ও স্বেচ্ছাসেবা জীবনবৃত্তান্তকে ভবিষ্যৎ নিয়োগকর্তাদের কাছে আরও আকর্ষণীয় করতে পারে।"}]},{"name":"Disadvantages","bn":"অসুবিধা","items":[{"en":"Some students lose the habit of studying and find it hard to return to academic work.","bn":"কিছু শিক্ষার্থী পড়ার অভ্যাস হারিয়ে ফেলে এবং একাডেমিক কাজে ফিরতে কষ্ট পায়।"},{"en":"Without a clear plan, the year can easily be wasted.","bn":"স্পষ্ট পরিকল্পনা ছাড়া বছরটি সহজেই নষ্ট হতে পারে।"},{"en":"Students who take a gap year graduate and start working one year later than their peers.","bn":"যারা গ্যাপ ইয়ার নেয় তারা সমবয়সীদের চেয়ে এক বছর পরে স্নাতক হয় ও কাজ শুরু করে।"},{"en":"Travelling abroad is expensive and is realistic only for wealthier families.","bn":"বিদেশ ভ্রমণ ব্যয়বহুল এবং কেবল ধনী পরিবারের পক্ষেই বাস্তবসম্মত।"},{"en":"Some young people become comfortable earning money and never return to education.","bn":"কিছু তরুণ টাকা আয়ে অভ্যস্ত হয়ে আর কখনো শিক্ষায় ফেরে না।"}]},{"name":"Evaluation: Which Side Is Stronger?","bn":"মূল্যায়ন — কোন দিক বেশি গুরুত্বপূর্ণ?","items":[{"en":"I believe a well-planned gap year offers more advantages than disadvantages for most young people.","bn":"আমি মনে করি ভালোভাবে পরিকল্পিত একটি গ্যাপ ইয়ার বেশিরভাগ তরুণের জন্য অসুবিধার চেয়ে বেশি সুবিধা দেয়।"},{"en":"Taking a year off can help students mature and gain experience, but it can also delay their education and career.","bn":"এক বছরের বিরতি শিক্ষার্থীদের পরিণত হতে ও অভিজ্ঞতা অর্জনে সাহায্য করতে পারে, তবে এটি তাদের পড়াশোনা ও ক্যারিয়ারও পিছিয়ে দিতে পারে।"}]}],"vocab":[["gap year","বিরতির বছর (গ্যাপ ইয়ার)"],["maturity","পরিপক্বতা"],["independence","স্বনির্ভরতা"],["work experience","কাজের অভিজ্ঞতা"],["volunteering","স্বেচ্ছাসেবা"],["career goals","পেশাগত লক্ষ্য"],["study habits","পড়ার অভ্যাস"],["momentum","গতি"],["burnout","মানসিক অবসাদ"],["expense","ব্যয়"],["peers","সমবয়সীরা"],["financially","আর্থিকভাবে"],["CV","জীবনবৃত্তান্ত"],["unproductive","অনুৎপাদনশীল"]],"phrases":[["broaden their horizons","দৃষ্টিভঙ্গি প্রসারিত করা"],["take a break from studying","পড়াশোনা থেকে বিরতি নেওয়া"],["gain real-world experience","বাস্তব অভিজ্ঞতা অর্জন করা"],["find out what they really want","তারা আসলে কী চায় তা খুঁজে বের করা"],["save money for university","বিশ্ববিদ্যালয়ের জন্য টাকা জমানো"],["lose the habit of studying","পড়ার অভ্যাস হারিয়ে ফেলা"],["waste the year","বছরটি নষ্ট করা"],["fall a year behind","এক বছর পিছিয়ে পড়া"],["stand out to employers","নিয়োগকর্তাদের নজরে আলাদা হওয়া"],["step outside their comfort zone","স্বস্তির গণ্ডির বাইরে যাওয়া"]],"sents":[{"en":"A gap year allows young people to take a break from studying after years of exam pressure.","bn":"গ্যাপ ইয়ার বছরের পর বছর পরীক্ষার চাপের পর তরুণদের পড়াশোনা থেকে বিরতি নিতে দেয়।"},{"en":"Travelling abroad can broaden their horizons and teach them about other cultures.","bn":"বিদেশ ভ্রমণ তাদের দৃষ্টিভঙ্গি প্রসারিত করতে এবং অন্য সংস্কৃতি সম্পর্কে শেখাতে পারে।"},{"en":"Working for a year helps students gain real-world experience and save money for university.","bn":"এক বছর কাজ করা শিক্ষার্থীদের বাস্তব অভিজ্ঞতা অর্জন ও বিশ্ববিদ্যালয়ের জন্য টাকা জমাতে সাহায্য করে।"},{"en":"Many students use the year to find out what they really want to study.","bn":"অনেক শিক্ষার্থী বছরটি ব্যবহার করে তারা আসলে কী পড়তে চায় তা খুঁজে বের করতে।"},{"en":"Volunteering or work experience can help a CV stand out to employers.","bn":"স্বেচ্ছাসেবা বা কাজের অভিজ্ঞতা জীবনবৃত্তান্তকে নিয়োগকর্তাদের নজরে আলাদা করতে পারে।"},{"en":"On the other hand, some students lose the habit of studying during the year off.","bn":"অন্যদিকে, কিছু শিক্ষার্থী বিরতির বছরে পড়ার অভ্যাস হারিয়ে ফেলে।"},{"en":"Without a clear plan, young people may simply waste the year.","bn":"স্পষ্ট পরিকল্পনা ছাড়া তরুণরা হয়তো বছরটি নষ্ট করবে।"},{"en":"Students who take a gap year will fall a year behind their peers.","bn":"যারা গ্যাপ ইয়ার নেয় তারা সমবয়সীদের চেয়ে এক বছর পিছিয়ে পড়বে।"}],"xvocab":[["self-reliance","আত্মনির্ভরতা"],["rejuvenated","নবউদ্যমী"],["purposeful","উদ্দেশ্যপূর্ণ"],["privileged","সুবিধাপ্রাপ্ত"],["drift","উদ্দেশ্যহীনভাবে ভেসে বেড়ানো"],["drop-out rate","ঝরে পড়ার হার"],["structured programme","সুসংগঠিত কর্মসূচি"],["interpersonal skills","আন্তঃব্যক্তিক দক্ষতা"]],"xsents":[{"en":"Students who start university with clear goals are less likely to drop out.","bn":"স্পষ্ট লক্ষ্য নিয়ে বিশ্ববিদ্যালয় শুরু করা শিক্ষার্থীদের ঝরে পড়ার সম্ভাবনা কম।"},{"en":"Many return to education feeling rejuvenated and focused.","bn":"অনেকে নবউদ্যমী ও মনোযোগী হয়ে শিক্ষায় ফিরে আসে।"},{"en":"International travel is often only possible for privileged families.","bn":"আন্তর্জাতিক ভ্রমণ প্রায়ই শুধু সুবিধাপ্রাপ্ত পরিবারের পক্ষেই সম্ভব।"},{"en":"Without a structured programme, some young people simply drift.","bn":"সুসংগঠিত কর্মসূচি ছাড়া কিছু তরুণ উদ্দেশ্যহীনভাবে ভেসে বেড়ায়।"}],"essays":[{"label":"BASIC ESSAY (BAND 5–6)","words":261,"paras":["In some countries, young people take one year off after school and before university. They use this year to work or travel. <b>Taking a year off can help students mature and gain experience, but it can also delay their education and career.</b>","There are several advantages of a <b>gap year</b>. Firstly, students can <b>take a break from studying</b>. After many years of exams, they are often tired, so a break can help them feel fresh. Secondly, they can <b>gain real-world experience</b>. For example, if they work in a shop or an office, they learn how to talk to customers and how to manage money. They can also <b>save money for university</b>. They can also learn to be responsible, because they have to wake up early and work every day. Thirdly, travelling can <b>broaden their horizons</b>, because they see new places and meet people from other cultures.","However, there are also some disadvantages. The first problem is that some students <b>lose the habit of studying</b>. When they go back to university, it is difficult for them to concentrate. Another problem is that they will be one year behind their friends. This means they start working one year later. Also, travelling is very expensive, so many families cannot pay for it. Finally, some students do not have a plan, so they just <b>waste the year</b> at home.","In conclusion, a <b>gap year</b> has both advantages and disadvantages. It can help young people become more mature and experienced, but it can also be a waste of time if they do not plan it well."]},{"label":"ADVANCED ESSAY (BAND 7)","words":272,"paras":["In several countries, school leavers are encouraged to spend a year working or travelling before they begin university. <b>Taking a year off can help students mature and gain experience, but it can also delay their education and career.</b>","The benefits of a <b>gap year</b> can be considerable. After years of exam pressure, it allows young people to <b>take a break from studying</b> and return to education with renewed energy. More importantly, it can build <b>independence</b>. Students who work for a year <b>gain real-world experience</b>, learn to manage their own money and often <b>save money for university</b>, while those who travel can <b>broaden their horizons</b> by experiencing different cultures. In addition, many students use this time to <b>find out what they really want</b> to study, which means they are less likely to choose the wrong course. <b>Volunteering</b> or <b>work experience</b> can also help a CV <b>stand out to employers</b> later on.","On the other hand, there are clear drawbacks. The most serious is that some students <b>lose the habit of studying</b>, and find it difficult to readjust to academic work. Furthermore, without a clear plan, young people may simply <b>waste the year</b>, spending most of it at home or on their phones. There is also a financial issue: travelling abroad is expensive and is realistically only an option for wealthier families. Finally, students who take a <b>gap year</b> <b>fall a year behind</b> their <b>peers</b>, which may delay their entry into the job market.","In conclusion, a <b>gap year</b> can be a valuable opportunity for personal growth, but its success depends largely on how carefully it is planned and how productively it is used."]},{"label":"BAND 9 ESSAY","words":330,"paras":["In a number of countries it has become customary for school leavers to take a year out, either to work or to travel, before embarking on a university degree. Taking a year off can help students mature and gain experience, but it can also delay their education and career, and its value depends largely on how purposefully it is spent.","The most frequently cited advantage is personal growth. Having spent over a decade in formal education, many teenagers are close to <b>burnout</b> by the time they finish school, and a year away allows them to <b>take a break from studying</b> and return <b>rejuvenated</b>. More significantly, a year spent working fosters <b>independence</b> and <b>self-reliance</b>: young people <b>gain real-world experience</b>, develop <b>interpersonal skills</b> through dealing with colleagues and customers, and in many cases <b>save money for university</b>, reducing their future debt. Travel, meanwhile, can <b>broaden their horizons</b> and encourage them to <b>step outside their comfort zone</b>. Perhaps the most underrated benefit, though, is clarity. Many students use the year to <b>find out what they really want</b> to study, and those who begin university with clear goals are demonstrably less likely to change courses or drop out.","Nevertheless, the drawbacks are real. A prolonged break can cause students to <b>lose the habit of studying</b>, making the transition back to lectures and essays surprisingly difficult. Without a <b>structured programme</b> or a clear plan, some young people simply <b>drift</b>, and what was intended as a formative experience becomes an <b>unproductive</b> year at home. There is also an issue of equity: the celebrated image of the <b>gap year</b> spent backpacking across continents is realistically available only to <b>privileged</b> families. Finally, those who defer their studies will <b>fall a year behind</b> their <b>peers</b>, entering the workforce later and potentially earning less over their lifetimes.","In conclusion, a <b>gap year</b> can be a genuinely transformative experience, fostering <b>maturity</b> and direction, but only if it is carefully planned; left unstructured, it risks becoming little more than a costly delay."]}],"type":"Advantages and disadvantages","q":"In some countries, young people are encouraged to take a year off between finishing school and starting university to work or travel. Discuss the advantages and disadvantages of this."},{"n":5,"title":"Teachers versus technology in the classroom","cat":"Education","groups":[{"name":"Reasons to Agree","bn":"একমত হওয়ার কারণ","items":[{"en":"Students can now find information on almost any topic online in seconds.","bn":"শিক্ষার্থীরা এখন কয়েক সেকেন্ডে প্রায় যেকোনো বিষয়ের তথ্য অনলাইনে পেতে পারে।"},{"en":"AI tutors can give each student personalised lessons and instant feedback.","bn":"AI শিক্ষক প্রত্যেক শিক্ষার্থীকে ব্যক্তিগতকৃত পাঠ ও তাৎক্ষণিক মতামত দিতে পারে।"},{"en":"Educational apps allow children to learn at their own pace without waiting for the class.","bn":"শিক্ষামূলক অ্যাপ শিশুদের পুরো ক্লাসের জন্য অপেক্ষা না করে নিজের গতিতে শিখতে দেয়।"},{"en":"Technology can deliver lessons to millions of students at a much lower cost.","bn":"প্রযুক্তি অনেক কম খরচে লাখ লাখ শিক্ষার্থীর কাছে পাঠ পৌঁছে দিতে পারে।"},{"en":"Routine tasks such as marking tests can already be done automatically.","bn":"পরীক্ষার খাতা দেখার মতো নিয়মিত কাজ ইতোমধ্যে স্বয়ংক্রিয়ভাবে করা যায়।"}]},{"name":"Reasons to Disagree","bn":"দ্বিমত পোষণের কারণ","items":[{"en":"Most children need a teacher to motivate them and keep them focused.","bn":"বেশিরভাগ শিশুর অনুপ্রাণিত ও মনোযোগী রাখতে একজন শিক্ষক প্রয়োজন।"},{"en":"Teachers can recognise when a student is struggling and offer emotional support.","bn":"শিক্ষকরা বুঝতে পারেন কখন কোনো শিক্ষার্থী সমস্যায় আছে এবং মানসিক সহায়তা দিতে পারেন।"},{"en":"Teachers act as role models who teach values such as honesty and respect.","bn":"শিক্ষকরা আদর্শ ব্যক্তি হিসেবে সততা ও শ্রদ্ধার মতো মূল্যবোধ শেখান।"},{"en":"Classrooms help children develop social skills through interaction with others.","bn":"শ্রেণিকক্ষ অন্যদের সঙ্গে মিথস্ক্রিয়ার মাধ্যমে শিশুদের সামাজিক দক্ষতা গড়ে তুলতে সাহায্য করে।"},{"en":"Many families, especially in poorer areas, cannot afford the devices needed for technology-based learning.","bn":"অনেক পরিবার, বিশেষত দরিদ্র এলাকায়, প্রযুক্তিনির্ভর শিক্ষার যন্ত্রপাতির খরচ বহন করতে পারে না।"}]},{"name":"Evaluation: My Answer","bn":"মূল্যায়ন — আমার উত্তর","items":[{"en":"I completely disagree with this view, because teachers provide guidance, motivation and human connection that technology cannot replace.","bn":"আমি এই মতের সঙ্গে সম্পূর্ণ একমত নই, কারণ শিক্ষকরা এমন দিকনির্দেশনা, অনুপ্রেরণা ও মানবিক সংযোগ দেন যা প্রযুক্তি প্রতিস্থাপন করতে পারে না।"},{"en":"Although technology will change the role of teachers, I strongly disagree that it will make them unnecessary.","bn":"যদিও প্রযুক্তি শিক্ষকদের ভূমিকা বদলে দেবে, আমি একেবারেই একমত নই যে এটি তাদের অপ্রয়োজনীয় করে তুলবে।"}]}],"vocab":[["artificial intelligence","কৃত্রিম বুদ্ধিমত্তা"],["educational apps","শিক্ষামূলক অ্যাপ"],["personalised learning","ব্যক্তিগতকৃত শিক্ষা"],["guidance","দিকনির্দেশনা"],["motivation","অনুপ্রেরণা"],["role model","আদর্শ ব্যক্তি"],["discipline","শৃঙ্খলা"],["emotional support","মানসিক সহায়তা"],["facilitator","সহায়ক / সঞ্চালক"],["supervision","তত্ত্বাবধান"],["interaction","মিথস্ক্রিয়া"],["replace","প্রতিস্থাপন করা"],["tool","সরঞ্জাম / হাতিয়ার"],["values","মূল্যবোধ"]],"phrases":[["take the place of","... এর জায়গা নেওয়া"],["at the click of a button","এক ক্লিকেই"],["learn at their own pace","নিজের গতিতে শেখা"],["keep students on track","শিক্ষার্থীদের সঠিক পথে রাখা"],["a human connection","মানবিক সংযোগ"],["spot when a student is struggling","কোনো শিক্ষার্থী সমস্যায় পড়লে তা বুঝতে পারা"],["play a vital role","গুরুত্বপূর্ণ ভূমিকা পালন করা"],["support rather than replace","প্রতিস্থাপন নয়, সহায়তা করা"],["develop social skills","সামাজিক দক্ষতা গড়ে তোলা"],["the role of teachers","শিক্ষকদের ভূমিকা"]],"sents":[{"en":"Today, students can find information on almost any topic at the click of a button.","bn":"আজ শিক্ষার্থীরা এক ক্লিকেই প্রায় যেকোনো বিষয়ের তথ্য পেতে পারে।"},{"en":"Educational apps allow children to learn at their own pace.","bn":"শিক্ষামূলক অ্যাপ শিশুদের নিজের গতিতে শিখতে দেয়।"},{"en":"Artificial intelligence can provide personalised learning and instant feedback.","bn":"কৃত্রিম বুদ্ধিমত্তা ব্যক্তিগতকৃত শিক্ষা ও তাৎক্ষণিক মতামত দিতে পারে।"},{"en":"However, information is not the same as education.","bn":"তবে তথ্য আর শিক্ষা এক জিনিস নয়।"},{"en":"A good teacher can spot when a student is struggling and offer emotional support.","bn":"একজন ভালো শিক্ষক বুঝতে পারেন কখন কোনো শিক্ষার্থী সমস্যায় পড়ছে এবং মানসিক সহায়তা দেন।"},{"en":"Teachers keep students on track and maintain discipline in the classroom.","bn":"শিক্ষকরা শিক্ষার্থীদের সঠিক পথে রাখেন এবং শ্রেণিকক্ষে শৃঙ্খলা বজায় রাখেন।"},{"en":"For many children, a teacher is also an important role model.","bn":"অনেক শিশুর কাছে শিক্ষক একজন গুরুত্বপূর্ণ আদর্শ ব্যক্তিও।"},{"en":"Technology should support rather than replace teachers.","bn":"প্রযুক্তির উচিত শিক্ষকদের প্রতিস্থাপন নয়, সহায়তা করা।"}],"xvocab":[["indispensable","অপরিহার্য"],["empathy","সহমর্মিতা"],["adaptive software","অভিযোজিত সফটওয়্যার"],["self-motivated","স্বপ্রণোদিত"],["holistic development","সর্বাঙ্গীণ বিকাশ"],["screen time","পর্দায় কাটানো সময়"],["mentor","পরামর্শদাতা"],["automate","স্বয়ংক্রিয় করা"]],"xsents":[{"en":"Adaptive software can automate routine tasks such as marking quizzes.","bn":"অভিযোজিত সফটওয়্যার কুইজ মূল্যায়নের মতো নিয়মিত কাজ স্বয়ংক্রিয় করতে পারে।"},{"en":"Few children are self-motivated enough to learn without guidance.","bn":"খুব কম শিশুই দিকনির্দেশনা ছাড়া শেখার মতো স্বপ্রণোদিত।"},{"en":"No machine can show genuine empathy.","bn":"কোনো যন্ত্রই প্রকৃত সহমর্মিতা দেখাতে পারে না।"},{"en":"Schools are responsible for students' holistic development, not just their knowledge.","bn":"স্কুল শুধু জ্ঞান নয়, শিক্ষার্থীদের সর্বাঙ্গীণ বিকাশের জন্য দায়ী।"}],"essays":[{"label":"BASIC ESSAY (BAND 5–6)","words":261,"paras":["Nowadays, technology is developing very fast, and some people think that we will not need teachers in the future. <b>I completely disagree with this view, because teachers provide guidance, motivation and human connection that technology cannot replace.</b>","It is true that technology is very useful for learning. Students can find information about any topic on the internet very quickly. There are also many <b>educational apps</b> that help children <b>learn at their own pace</b>. For example, my younger brother uses an app to practise maths every day. Also, <b>artificial intelligence</b> can check students' answers and give feedback immediately.","However, technology cannot do everything that a teacher does. Firstly, children need someone to guide and motivate them. Most children will play games instead of studying if there is no teacher. A teacher <b>keeps students on track</b> and makes sure they work hard. Secondly, teachers can see when a student has a problem. If a student is sad or confused, the teacher can talk to him and help him. A computer cannot understand feelings. Also, many students need a teacher to explain difficult ideas in different ways until they understand. Thirdly, teachers are role models. They teach children good <b>values</b> like honesty and respect. Finally, teachers also help students learn to work in groups and make friends. In poor areas, many children also do not have computers at home.","In conclusion, technology is a helpful <b>tool</b> for education, but it cannot <b>take the place of</b> teachers. I believe teachers will always be needed in the classroom, and technology should support them, not <b>replace</b> them."]},{"label":"ADVANCED ESSAY (BAND 7)","words":281,"paras":["With rapid advances in technology, some people predict that teachers will soon disappear from the classroom. <b>Although technology will change the role of teachers, I strongly disagree that it will make them unnecessary.</b>","Admittedly, technology has transformed education. Today, students can find information on almost any topic <b>at the click of a button</b>, and <b>educational apps</b> allow children to <b>learn at their own pace</b>. <b>Artificial intelligence</b> can also provide <b>personalised learning</b> and instant feedback, which a single teacher with forty students cannot always offer. In this sense, technology can take over some routine tasks, such as marking simple tests.","However, information is not the same as education, and there are several things teachers do that machines cannot. Firstly, most children need <b>guidance</b> and <b>motivation</b>. Without a teacher to <b>keep students on track</b>, many would simply get distracted by games and social media. Secondly, a good teacher can <b>spot when a student is struggling</b>, either academically or emotionally, and offer support. For example, a teacher may notice that a normally cheerful child has become quiet and discover a problem at home. No software can show this kind of care. Finally, teachers <b>play a vital role</b> in helping children <b>develop social skills</b> and <b>values</b> such as respect and cooperation, and for many children a teacher is an important <b>role model</b>. Moreover, many families in poorer areas cannot afford devices, so schools and teachers remain essential for them.","In conclusion, technology is a powerful <b>tool</b> that can make learning more effective, but it should <b>support rather than replace</b> teachers. In fact, teachers can use technology to make their lessons even better. The human connection between teachers and students will always be essential in education."]},{"label":"BAND 9 ESSAY","words":303,"paras":["It is sometimes claimed that, as educational technology becomes ever more sophisticated, the human teacher will become obsolete. <b>Although technology will change the role of teachers, I strongly disagree that it will make them unnecessary.</b>","There is no denying that technology has reshaped learning. Students can now access information on virtually any subject <b>at the click of a button</b>, and <b>educational apps</b> allow them to <b>learn at their own pace</b>, revisiting difficult concepts as often as they need. <b>Adaptive software</b> powered by <b>artificial intelligence</b> can go further still, offering <b>personalised learning</b> and instant feedback, and <b>automating</b> routine tasks such as marking quizzes. In overcrowded classrooms, where one teacher may be responsible for fifty pupils, these <b>tools</b> are genuinely valuable.","Nevertheless, to conclude that teachers can therefore be <b>replaced</b> is to confuse access to information with education itself. Firstly, very few children are <b>self-motivated</b> enough to learn without <b>guidance</b>; it is the teacher who <b>keeps students on track</b>, sets expectations and maintains <b>discipline</b>, without which even the best software would be largely ignored in favour of entertainment. Secondly, teaching is fundamentally a human relationship. An experienced teacher can <b>spot when a student is struggling</b>, whether with a mathematical concept or with difficulties at home, and respond with <b>empathy</b> and <b>emotional support</b> in a way no algorithm can. Finally, schools exist not only to transmit knowledge but to promote <b>holistic development</b>: children learn cooperation, respect and resilience through <b>interaction</b> with others, and for many of them a teacher is a <b>role model</b> and <b>mentor</b> whose influence lasts a lifetime.","In conclusion, technology will undoubtedly play an increasingly important part in education, but its proper place is to <b>support rather than replace</b> teachers. The role of the teacher may evolve from lecturer to <b>facilitator</b>, yet the human connection at the heart of learning will remain <b>indispensable</b>."]}],"type":"Opinion (Agree / Disagree)","q":"Some people think that with the development of technology, teachers will no longer be needed in the classroom. To what extent do you agree or disagree?"},{"n":6,"title":"Artificial intelligence and jobs","cat":"Technology & AI","groups":[{"name":"Reasons Supporting the First View","bn":"প্রথম মতের পক্ষে কারণ","items":[{"en":"Throughout history, new technology has created more jobs than it has destroyed.","bn":"ইতিহাস জুড়ে নতুন প্রযুক্তি যত চাকরি ধ্বংস করেছে তার চেয়ে বেশি তৈরি করেছে।"},{"en":"AI is creating entirely new roles, such as data scientists and AI trainers.","bn":"AI ডেটা বিজ্ঞানী ও AI প্রশিক্ষকের মতো সম্পূর্ণ নতুন পদ তৈরি করছে।"},{"en":"Higher productivity allows businesses to grow and hire more staff.","bn":"উচ্চ উৎপাদনশীলতা ব্যবসাকে বড় হতে ও আরও কর্মী নিয়োগ করতে দেয়।"},{"en":"In most workplaces, AI will support employees rather than replace them.","bn":"বেশিরভাগ কর্মক্ষেত্রে AI কর্মীদের প্রতিস্থাপন না করে সহায়তা করবে।"},{"en":"By taking over routine work, AI frees people to focus on creative and human tasks.","bn":"নিয়মিত কাজ গ্রহণ করে AI মানুষকে সৃজনশীল ও মানবিক কাজে মনোযোগ দেওয়ার সুযোগ দেয়।"}]},{"name":"Reasons Supporting the Second View","bn":"দ্বিতীয় মতের পক্ষে কারণ","items":[{"en":"AI can perform repetitive tasks faster and more cheaply than human workers.","bn":"AI মানব কর্মীদের চেয়ে দ্রুত ও কম খরচে পুনরাবৃত্তিমূলক কাজ করতে পারে।"},{"en":"Jobs in customer service, data entry and translation are already being replaced.","bn":"গ্রাহকসেবা, ডেটা এন্ট্রি ও অনুবাদের চাকরি ইতোমধ্যে প্রতিস্থাপিত হচ্ছে।"},{"en":"Unlike earlier machines, AI threatens office jobs as well as manual work.","bn":"আগের যন্ত্রের বিপরীতে AI কায়িক শ্রমের পাশাপাশি অফিসের চাকরিকেও হুমকিতে ফেলছে।"},{"en":"The speed of change may leave workers little time to retrain.","bn":"পরিবর্তনের গতি কর্মীদের পুনঃপ্রশিক্ষণের জন্য সামান্যই সময় দিতে পারে।"},{"en":"Older workers may find it especially difficult to learn new digital skills.","bn":"বয়স্ক কর্মীদের নতুন ডিজিটাল দক্ষতা শেখা বিশেষভাবে কঠিন মনে হতে পারে।"}]},{"name":"Evaluation: My Opinion","bn":"মূল্যায়ন — আমার মতামত","items":[{"en":"Although artificial intelligence will certainly replace some jobs, I believe it will create more new opportunities than it destroys in the long run.","bn":"যদিও কৃত্রিম বুদ্ধিমত্তা অবশ্যই কিছু চাকরি প্রতিস্থাপন করবে, আমি বিশ্বাস করি দীর্ঘমেয়াদে এটি যত চাকরি ধ্বংস করবে তার চেয়ে বেশি নতুন সুযোগ তৈরি করবে।"},{"en":"While both views have some truth, I side with those who believe AI will create more jobs than it eliminates.","bn":"দুটি মতেই কিছু সত্য আছে, তবে আমি তাদের পক্ষে যারা মনে করেন AI যত চাকরি কমাবে তার চেয়ে বেশি চাকরি তৈরি করবে।"}]}],"vocab":[["artificial intelligence","কৃত্রিম বুদ্ধিমত্তা"],["automation","স্বয়ংক্রিয়করণ"],["unemployment","বেকারত্ব"],["repetitive tasks","পুনরাবৃত্তিমূলক কাজ"],["retrain","পুনঃপ্রশিক্ষণ দেওয়া"],["productivity","উৎপাদনশীলতা"],["industry","শিল্প"],["customer service","গ্রাহকসেবা"],["data analysis","তথ্য বিশ্লেষণ"],["innovation","উদ্ভাবন"],["workforce","কর্মশক্তি"],["obsolete","অপ্রচলিত"],["transition","রূপান্তর"],["inequality","বৈষম্য"]],"phrases":[["replace human workers","মানব কর্মীদের প্রতিস্থাপন করা"],["create new roles","নতুন পদ তৈরি করা"],["lose their jobs","চাকরি হারানো"],["in the long run","দীর্ঘমেয়াদে"],["history has shown that","ইতিহাস দেখিয়েছে যে"],["adapt to change","পরিবর্তনের সঙ্গে খাপ খাওয়ানো"],["learn new skills","নতুন দক্ষতা শেখা"],["at an unprecedented speed","নজিরবিহীন গতিতে"],["the pace of change","পরিবর্তনের গতি"],["left behind","পিছিয়ে পড়া"]],"sents":[{"en":"Artificial intelligence can already perform many repetitive tasks faster than humans.","bn":"কৃত্রিম বুদ্ধিমত্তা এখনই অনেক পুনরাবৃত্তিমূলক কাজ মানুষের চেয়ে দ্রুত করতে পারে।"},{"en":"Jobs in customer service and data entry are at risk of becoming obsolete.","bn":"গ্রাহকসেবা ও ডেটা এন্ট্রির চাকরি অপ্রচলিত হয়ে যাওয়ার ঝুঁকিতে আছে।"},{"en":"History has shown that new technology usually creates new roles.","bn":"ইতিহাস দেখিয়েছে যে নতুন প্রযুক্তি সাধারণত নতুন পদ তৈরি করে।"},{"en":"For example, the computer created millions of jobs that did not exist before.","bn":"উদাহরণস্বরূপ, কম্পিউটার লাখ লাখ চাকরি তৈরি করেছে যা আগে ছিল না।"},{"en":"AI will increase productivity and encourage innovation.","bn":"AI উৎপাদনশীলতা বাড়াবে এবং উদ্ভাবনকে উৎসাহিত করবে।"},{"en":"However, the pace of change today is much faster than in the past.","bn":"তবে আজকের পরিবর্তনের গতি অতীতের চেয়ে অনেক দ্রুত।"},{"en":"Older workers may find it difficult to learn new skills.","bn":"বয়স্ক কর্মীদের নতুন দক্ষতা শেখা কঠিন মনে হতে পারে।"},{"en":"Governments must help workers retrain so that no one is left behind.","bn":"সরকারকে কর্মীদের পুনঃপ্রশিক্ষণে সাহায্য করতে হবে যাতে কেউ পিছিয়ে না পড়ে।"}],"xvocab":[["displacement","কর্মচ্যুতি"],["upskilling","দক্ষতা বৃদ্ধি"],["white-collar","অফিসভিত্তিক শিক্ষিত পেশা"],["disruption","ব্যাঘাত / ভাঙন"],["prompt engineer","প্রম্পট প্রকৌশলী"],["safety net","নিরাপত্তা বেষ্টনী"],["complement","পরিপূরক হওয়া"],["widen the gap","ব্যবধান বাড়ানো"]],"xsents":[{"en":"Unlike earlier machines, AI threatens white-collar jobs as well as manual work.","bn":"আগের যন্ত্রের বিপরীতে, AI কায়িক শ্রমের পাশাপাশি অফিসভিত্তিক চাকরিকেও হুমকিতে ফেলছে।"},{"en":"Entirely new professions, such as prompt engineer, have already appeared.","bn":"প্রম্পট প্রকৌশলীর মতো সম্পূর্ণ নতুন পেশা ইতোমধ্যে দেখা দিয়েছে।"},{"en":"In many cases, AI will complement workers rather than replace them.","bn":"অনেক ক্ষেত্রে AI কর্মীদের প্রতিস্থাপন না করে পরিপূরক হবে।"},{"en":"Without a strong safety net, automation could widen the gap between rich and poor.","bn":"শক্তিশালী নিরাপত্তা বেষ্টনী ছাড়া স্বয়ংক্রিয়করণ ধনী-দরিদ্রের ব্যবধান বাড়াতে পারে।"}],"essays":[{"label":"BASIC ESSAY (BAND 5–6)","words":263,"paras":["Some people think <b>artificial intelligence</b> will create many new jobs, but other people think it will cause a lot of <b>unemployment</b>. <b>While both views have some truth, I side with those who believe AI will create more jobs than it eliminates.</b>","On the one hand, AI can do many jobs that people do today. For example, computers can answer customer questions, translate documents and check data very quickly. This means that many workers in offices, banks and call centres may <b>lose their jobs</b>. Some older workers will find it hard to <b>learn new skills</b>, so they may not find another job easily. This is a serious problem, and some people are very worried about it.","On the other hand, I believe AI will also create many new jobs. <b>History has shown that</b> new technology usually creates new work. For example, when computers became popular, many people were afraid, but later millions of new jobs appeared, such as programmers and web designers. In the same way, AI will need people to build it, control it and repair it. Also, AI can do boring and <b>repetitive tasks</b>, so humans can do more interesting and creative work. Companies will become more productive, and they can hire more people.","In my opinion, the government should help people to <b>learn new skills</b>, so they can find the new jobs. Schools should also teach computer skills to young people.","In conclusion, AI will take away some jobs, but I believe it will create more jobs <b>in the long run</b>, if people are ready to learn and <b>adapt to change</b>."]},{"label":"ADVANCED ESSAY (BAND 7)","words":275,"paras":["There is considerable debate about whether <b>artificial intelligence</b> will generate more employment than it eliminates or whether it will cause widespread joblessness. <b>While both views have some truth, I side with those who believe AI will create more jobs than it eliminates.</b>","Those who fear mass <b>unemployment</b> have a valid point. AI can already perform many <b>repetitive tasks</b> faster and more cheaply than humans, and jobs in <b>customer service</b>, data entry and even translation are at risk of becoming <b>obsolete</b>. Moreover, <b>the pace of change</b> today is much faster than during previous technological revolutions, so workers may have little time to adapt. Older employees, in particular, may find it difficult to <b>learn new skills</b>, and if they <b>lose their jobs</b>, they could struggle to find new ones.","However, I find the optimistic view more convincing. <b>History has shown that</b> new technology usually <b>creates new roles</b>, even if it destroys old ones. For example, the personal computer made many typists unemployed, but it also created millions of jobs in software, IT support and digital marketing that did not exist before. Similarly, AI is already generating demand for data scientists, AI trainers and cybersecurity experts. In addition, by increasing <b>productivity</b>, AI will help businesses grow, which in turn will lead them to hire more staff. In many cases, AI will <b>complement</b> workers rather than replace them, taking over routine work so that people can focus on creative and interpersonal tasks.","In conclusion, although AI will certainly cause some job losses, I believe it will create more opportunities than it destroys <b>in the long run</b>, provided that governments help workers <b>retrain</b> so that no one is <b>left behind</b>."]},{"label":"BAND 9 ESSAY","words":318,"paras":["The rapid advance of <b>artificial intelligence</b> has provoked sharply divided predictions: some foresee a wave of new employment, while others warn of mass redundancy. While both views have some truth, I side with those who believe AI will create more jobs than it eliminates, although the <b>transition</b> will be far from painless.","The pessimistic case deserves serious consideration. Unlike earlier generations of machinery, which mainly replaced manual labour, AI threatens <b>white-collar</b> jobs as well: <b>customer service</b> agents, paralegals, translators and junior analysts are all performing tasks that software can increasingly handle faster and at a fraction of the cost. Furthermore, <b>the pace of change</b> is arguably unprecedented. Whereas the industrial revolution unfolded over generations, AI tools are being adopted within months, leaving little time for workers to adapt. Those in mid-career, often with families to support, may find it particularly difficult to <b>learn new skills</b>, and without a strong <b>safety net</b>, such <b>displacement</b> could <b>widen the gap</b> between rich and poor.","Nevertheless, the historical evidence points in a more encouraging direction. Every major technological shift, from mechanised farming to the personal computer, was accompanied by fears of permanent <b>unemployment</b>, yet each ultimately created more roles than it destroyed. The internet alone gave rise to entire <b>industries</b>, from app development to e-commerce logistics. AI is already following this pattern, generating demand for data scientists, AI ethicists and even entirely new professions such as <b>prompt engineer</b>. Moreover, by raising <b>productivity</b>, AI allows businesses to expand and hire, and in most workplaces it is likely to <b>complement</b> rather than <b>replace human workers</b>, automating routine tasks while freeing people to focus on judgement, creativity and human interaction.","In conclusion, I believe that AI will, <b>in the long run</b>, be a net creator of employment. However, this outcome is not automatic; it depends on governments and employers investing heavily in <b>upskilling</b> so that workers can make the <b>transition</b> rather than being <b>left behind</b>."]}],"type":"Discuss both views and give your opinion","q":"Some people believe that artificial intelligence will create more jobs than it destroys, while others think it will lead to mass unemployment. Discuss both views and give your own opinion."},{"n":7,"title":"Children and smartphones","cat":"Technology & AI","groups":[{"name":"Question 1: Reasons","bn":"প্রশ্ন ১ — কারণ","items":[{"en":"Parents give children phones so that they can contact them at any time for safety.","bn":"নিরাপত্তার জন্য যেকোনো সময় যোগাযোগ করতে বাবা-মা সন্তানদের ফোন দেন।"},{"en":"Smartphones have become cheap enough for most families to afford.","bn":"স্মার্টফোন এখন বেশিরভাগ পরিবারের সামর্থ্যের মধ্যে যথেষ্ট সস্তা হয়েছে।"},{"en":"Children want phones because their friends have them and they do not want to feel left out.","bn":"শিশুরা ফোন চায় কারণ তাদের বন্ধুদের আছে এবং তারা বাদ পড়া বোধ করতে চায় না।"},{"en":"Busy parents sometimes use phones to keep children quiet and entertained.","bn":"ব্যস্ত বাবা-মা কখনো কখনো শিশুদের শান্ত ও ব্যস্ত রাখতে ফোন ব্যবহার করেন।"},{"en":"Schools increasingly use online platforms, so children need a device for homework.","bn":"স্কুলগুলো ক্রমশ অনলাইন প্ল্যাটফর্ম ব্যবহার করছে, তাই শিশুদের বাড়ির কাজের জন্য যন্ত্র দরকার।"}]},{"name":"Question 2: Positive and Negative Points","bn":"প্রশ্ন ২ — ইতিবাচক ও নেতিবাচক দিক","items":[{"en":"On the positive side, phones allow children to learn through educational apps and videos.","bn":"ইতিবাচক দিকে, ফোন শিশুদের শিক্ষামূলক অ্যাপ ও ভিডিওর মাধ্যমে শিখতে দেয়।"},{"en":"However, too much screen time reduces physical activity and harms children's health.","bn":"তবে অতিরিক্ত পর্দার সময় শারীরিক কার্যকলাপ কমায় এবং শিশুদের স্বাস্থ্যের ক্ষতি করে।"},{"en":"Heavy phone use damages children's sleep and concentration at school.","bn":"অতিরিক্ত ফোন ব্যবহার শিশুদের ঘুম ও স্কুলে মনোযোগের ক্ষতি করে।"},{"en":"Children may be exposed to harmful content, cyberbullying and online strangers.","bn":"শিশুরা ক্ষতিকর বিষয়বস্তু, অনলাইন হয়রানি ও অপরিচিতদের সংস্পর্শে আসতে পারে।"},{"en":"Spending hours on screens can weaken children's face-to-face social skills.","bn":"পর্দায় ঘণ্টার পর ঘণ্টা কাটানো শিশুদের মুখোমুখি সামাজিক দক্ষতা দুর্বল করতে পারে।"}]},{"name":"Evaluation: My Answer","bn":"মূল্যায়ন — আমার উত্তর","items":[{"en":"This trend is mainly driven by parents' concern for safety and the pressure to keep up with other children, and I believe it is a largely negative development.","bn":"এই প্রবণতা মূলত নিরাপত্তা নিয়ে বাবা-মায়ের উদ্বেগ এবং অন্য শিশুদের সমান থাকার চাপ থেকে আসছে, এবং আমি মনে করি এটি মূলত নেতিবাচক প্রবণতা।"},{"en":"This is happening because smartphones have become cheaper and parents are busier, and in my view it is a mostly negative development.","bn":"স্মার্টফোন সস্তা হয়েছে এবং বাবা-মায়েরা বেশি ব্যস্ত, তাই এমনটা ঘটছে; আমার মতে এটি মূলত একটি নেতিবাচক পরিবর্তন।"}]}],"vocab":[["smartphone","স্মার্টফোন"],["screen time","পর্দায় কাটানো সময়"],["addiction","আসক্তি"],["peer pressure","সমবয়সীদের চাপ"],["safety","নিরাপত্তা"],["concentration","মনোযোগ"],["physical activity","শারীরিক কার্যকলাপ"],["cyberbullying","অনলাইন হয়রানি"],["inappropriate content","অনুপযুক্ত বিষয়বস্তু"],["social skills","সামাজিক দক্ষতা"],["parental control","অভিভাবকীয় নিয়ন্ত্রণ"],["affordable","সাশ্রয়ী"],["sleep","ঘুম"],["educational","শিক্ষামূলক"]],"phrases":[["keep in touch with","... এর সঙ্গে যোগাযোগ রাখা"],["keep children quiet","শিশুদের শান্ত রাখা"],["fit in with their friends","বন্ধুদের সঙ্গে মানিয়ে চলা"],["glued to their screens","পর্দায় আঠার মতো লেগে থাকা"],["at a young age","অল্প বয়সে"],["harm their development","তাদের বিকাশে ক্ষতি করা"],["spend less time outdoors","বাইরে কম সময় কাটানো"],["set clear limits","স্পষ্ট সীমা নির্ধারণ করা"],["expose children to","শিশুদের ... এর সংস্পর্শে আনা"],["do more harm than good","উপকারের চেয়ে বেশি ক্ষতি করা"]],"sents":[{"en":"Many parents give their children a phone so that they can keep in touch with them.","bn":"অনেক বাবা-মা সন্তানদের ফোন দেন যাতে তাদের সঙ্গে যোগাযোগ রাখতে পারেন।"},{"en":"Busy parents sometimes use smartphones to keep children quiet.","bn":"ব্যস্ত বাবা-মা কখনো কখনো শিশুদের শান্ত রাখতে স্মার্টফোন ব্যবহার করেন।"},{"en":"Children also want a phone to fit in with their friends.","bn":"শিশুরাও বন্ধুদের সঙ্গে মানিয়ে চলতে ফোন চায়।"},{"en":"Smartphones have become much more affordable in recent years.","bn":"সাম্প্রতিক বছরগুলোতে স্মার্টফোন অনেক বেশি সাশ্রয়ী হয়েছে।"},{"en":"Children who are glued to their screens spend less time outdoors.","bn":"যে শিশুরা পর্দায় আঠার মতো লেগে থাকে তারা বাইরে কম সময় কাটায়।"},{"en":"Too much screen time can damage children's concentration and sleep.","bn":"অতিরিক্ত পর্দার সময় শিশুদের মনোযোগ ও ঘুমের ক্ষতি করতে পারে।"},{"en":"The internet can expose children to inappropriate content and cyberbullying.","bn":"ইন্টারনেট শিশুদের অনুপযুক্ত বিষয়বস্তু ও অনলাইন হয়রানির সংস্পর্শে আনতে পারে।"},{"en":"If parents set clear limits, phones can be a useful educational tool.","bn":"বাবা-মা স্পষ্ট সীমা নির্ধারণ করলে ফোন একটি উপযোগী শিক্ষামূলক হাতিয়ার হতে পারে।"}],"xvocab":[["developmental","বিকাশগত"],["sedentary","নিষ্ক্রিয় / বসে থাকার"],["instant gratification","তাৎক্ষণিক তৃপ্তি"],["digital pacifier","শিশু শান্ত রাখার ডিজিটাল উপায়"],["attention span","মনোযোগের স্থায়িত্ব"],["vulnerable","ঝুঁকিপূর্ণ / অসহায়"],["predators","অনলাইনে শিশুদের শিকারি অপরাধী"],["supervised","তত্ত্বাবধানে থাকা"]],"xsents":[{"en":"For some parents, the phone has become a digital pacifier.","bn":"কিছু বাবা-মায়ের কাছে ফোন শিশু শান্ত রাখার ডিজিটাল উপায় হয়ে উঠেছে।"},{"en":"Short videos train children to expect instant gratification.","bn":"ছোট ভিডিও শিশুদের তাৎক্ষণিক তৃপ্তি প্রত্যাশা করতে শেখায়।"},{"en":"Young children are especially vulnerable to online predators.","bn":"ছোট শিশুরা অনলাইন অপরাধীদের কাছে বিশেষভাবে ঝুঁকিপূর্ণ।"},{"en":"A sedentary childhood can lead to health problems later in life.","bn":"নিষ্ক্রিয় শৈশব পরবর্তী জীবনে স্বাস্থ্য সমস্যার কারণ হতে পারে।"}],"essays":[{"label":"BASIC ESSAY (BAND 5–6)","words":264,"paras":["Nowadays, many children have a <b>smartphone</b> when they are very young. <b>This is happening because smartphones have become cheaper and parents are busier, and in my view it is a mostly negative development.</b>","There are several reasons why young children have phones. Firstly, <b>smartphones</b> are cheaper than before, so many families can buy one. Secondly, parents want to <b>keep in touch with</b> their children. If the child is at school or with friends, the parents can call them. Thirdly, many parents are very busy with work, so they give children a phone to keep them quiet. Finally, children want a phone because their friends have one.","I think this is a negative development for three reasons. First, children spend too much time on their phones. They play games and watch videos instead of playing outside, so they do not get enough exercise. Second, too much <b>screen time</b> is bad for their <b>sleep</b> and <b>concentration</b>. Many children use phones late at night, and then they are tired at school. Third, the internet can be dangerous. Children can see bad content or talk to strangers, and some children are bullied online. It is true that phones can help children learn, for example with <b>educational</b> apps, but young children usually use them for games. Some doctors say that children under ten should not have their own phone.","In conclusion, children have <b>smartphones</b> because phones are cheap and parents are busy. I think this is a negative development, because it can harm children's health and <b>safety</b>. Parents should wait until children are older before giving them a phone."]},{"label":"ADVANCED ESSAY (BAND 7)","words":271,"paras":["It is now common for children to receive their own <b>smartphone</b> at a surprisingly young age. <b>This trend is mainly driven by parents' concern for safety and the pressure to keep up with other children, and I believe it is a largely negative development.</b>","There are several reasons for this trend. The most important is <b>safety</b>: many parents feel reassured if they can <b>keep in touch with</b> their children at all times, especially in large cities. In addition, <b>smartphones</b> have become much more <b>affordable</b> in recent years, so even lower-income families can buy one. <b>Peer pressure</b> also plays a role, since children want a phone to <b>fit in with their friends</b>. Finally, some busy parents use <b>smartphones</b> to <b>keep children quiet</b>, for example during long journeys or while they are working.","Despite these understandable reasons, I think the effects are mostly harmful. Firstly, children who are <b>glued to their screens</b> <b>spend less time outdoors</b>, which reduces their <b>physical activity</b> and can lead to health problems. Secondly, excessive <b>screen time</b> can damage children's <b>concentration</b> and <b>sleep</b>; teachers increasingly report pupils who struggle to focus in class. Thirdly, the internet can <b>expose children to</b> <b>inappropriate content</b> and <b>cyberbullying</b>, and young children are not mature enough to deal with these dangers. Admittedly, phones can be a useful <b>educational</b> tool if parents <b>set clear limits</b>, but in practice many young children use them mainly for games and short videos.","In conclusion, children are given <b>smartphones</b> mainly for <b>safety</b>, convenience and social reasons. However, I believe this is a largely negative development, and parents should delay giving children their own phone or supervise its use carefully."]},{"label":"BAND 9 ESSAY","words":336,"paras":["Children are acquiring <b>smartphones</b> at ever younger ages, and in many cities it is now unremarkable to see a seven-year-old with a device of their own. <b>This trend is mainly driven by parents' concern for safety and the pressure to keep up with other children, and I believe it is a largely negative development.</b>","Several factors explain this shift. Chief among them is parental anxiety: in large, crowded cities, a phone allows parents to <b>keep in touch with</b> their children and track their whereabouts, which many find deeply reassuring. Economic factors have also played a part, as <b>smartphones</b> have become far more <b>affordable</b>, placing them within reach of most families. Social pressure operates at two levels: children want a phone to <b>fit in with their friends</b>, while parents may worry that their child will be excluded if they are the only one without a device. Less admirably, some overstretched parents use the phone as a <b>digital pacifier</b> to <b>keep children quiet</b> in restaurants or while they work.","However understandable these motives are, I believe the consequences are predominantly harmful. Most obviously, children who are <b>glued to their screens</b> <b>spend less time outdoors</b>, and a <b>sedentary</b> childhood is closely linked to obesity and poor physical health in later life. There are <b>developmental</b> concerns as well: excessive <b>screen time</b> disrupts <b>sleep</b>, while the endless stream of short videos trains young minds to expect <b>instant gratification</b>, shortening their <b>attention span</b> and making sustained <b>concentration</b> in the classroom increasingly difficult. Most seriously, unrestricted internet access can <b>expose children to</b> <b>inappropriate content</b>, <b>cyberbullying</b> and even online <b>predators</b>, dangers that young children are simply not equipped to recognise. Admittedly, a <b>supervised</b> device with carefully chosen <b>educational</b> apps can support learning, but this is rarely how young children actually use their phones.","In conclusion, while the desire for <b>safety</b> and connection is understandable, giving <b>smartphones</b> to very young children <b>does more harm than good</b>. Parents would be wiser to delay ownership and, when the time comes, to <b>set clear limits</b> on its use."]}],"type":"Two-part question","q":"Many children now own a smartphone from a very young age. Why is this happening? Is this a positive or negative development?"},{"n":8,"title":"Social media: connecting or isolating people?","cat":"Technology & AI","groups":[{"name":"Positive Effects","bn":"ইতিবাচক প্রভাব","items":[{"en":"Social media allows people to stay in touch with friends and family across long distances.","bn":"সামাজিক মাধ্যম মানুষকে দীর্ঘ দূরত্ব সত্ত্বেও বন্ধু ও পরিবারের সঙ্গে যোগাযোগ রাখতে দেয়।"},{"en":"Migrant workers can see and talk to their children every day through free video calls.","bn":"প্রবাসী শ্রমিকরা বিনামূল্যের ভিডিও কলে প্রতিদিন সন্তানদের দেখতে ও কথা বলতে পারেন।"},{"en":"News and photos can be shared instantly, helping families feel connected.","bn":"খবর ও ছবি তাৎক্ষণিকভাবে ভাগ করা যায়, যা পরিবারকে সংযুক্ত বোধ করতে সাহায্য করে।"},{"en":"Elderly people living alone can use messaging apps to reduce loneliness.","bn":"একা থাকা বয়স্করা একাকীত্ব কমাতে মেসেজিং অ্যাপ ব্যবহার করতে পারেন।"},{"en":"Social media helps people reconnect with old friends they had lost contact with.","bn":"সামাজিক মাধ্যম হারিয়ে যাওয়া পুরনো বন্ধুদের সঙ্গে আবার যোগাযোগ করতে সাহায্য করে।"}]},{"name":"Negative Effects","bn":"নেতিবাচক প্রভাব","items":[{"en":"Online messages lack tone and body language, which often causes misunderstandings.","bn":"অনলাইন বার্তায় কণ্ঠস্বর ও শারীরিক ভাষা থাকে না, যা প্রায়ই ভুল বোঝাবুঝি সৃষ্টি করে।"},{"en":"Many people have hundreds of online friends but few close relationships.","bn":"অনেকের শত শত অনলাইন বন্ধু থাকলেও ঘনিষ্ঠ সম্পর্ক কম।"},{"en":"Constant comparison with others' perfect posts can damage self-esteem.","bn":"অন্যদের নিখুঁত পোস্টের সঙ্গে অবিরাম তুলনা আত্মসম্মানের ক্ষতি করতে পারে।"},{"en":"Families often sit together but pay attention to their phones instead of each other.","bn":"পরিবারগুলো প্রায়ই একসঙ্গে বসে থাকলেও একে অপরের বদলে ফোনে মনোযোগ দেয়।"},{"en":"Brief likes and comments cannot replace the emotional support of real conversation.","bn":"সংক্ষিপ্ত লাইক ও মন্তব্য প্রকৃত কথোপকথনের মানসিক সহায়তার বিকল্প হতে পারে না।"}]},{"name":"Evaluation: Positive or Negative?","bn":"মূল্যায়ন — ইতিবাচক নাকি নেতিবাচক?","items":[{"en":"Although social media makes it easier to stay in contact, I believe relying on it as the main form of communication is a negative development.","bn":"যদিও সামাজিক মাধ্যম যোগাযোগ রাখা সহজ করে, আমি মনে করি এটিকে প্রধান যোগাযোগমাধ্যম হিসেবে নির্ভর করা একটি নেতিবাচক প্রবণতা।"},{"en":"This trend has both benefits and drawbacks, but overall I consider it a negative development because relationships are becoming more superficial.","bn":"এই প্রবণতার সুবিধা ও অসুবিধা দুটোই আছে, তবে সামগ্রিকভাবে আমি এটিকে নেতিবাচক মনে করি, কারণ সম্পর্কগুলো আরও অগভীর হয়ে যাচ্ছে।"}]}],"vocab":[["social media","সামাজিক মাধ্যম"],["communication","যোগাযোগ"],["face-to-face","মুখোমুখি"],["relationships","সম্পর্ক"],["superficial","অগভীর"],["loneliness","একাকীত্ব"],["misunderstanding","ভুল বোঝাবুঝি"],["instant","তাৎক্ষণিক"],["video call","ভিডিও কল"],["migrant workers","প্রবাসী শ্রমিক"],["privacy","গোপনীয়তা"],["comparison","তুলনা"],["body language","শারীরিক ভাষা"],["meaningful","অর্থবহ"]],"phrases":[["stay in touch","যোগাযোগ রাখা"],["across long distances","দীর্ঘ দূরত্ব জুড়ে"],["at any time of day","দিনের যেকোনো সময়"],["replace real conversations","প্রকৃত কথোপকথনের বিকল্প হওয়া"],["a sense of connection","সংযোগের অনুভূতি"],["share news and photos","খবর ও ছবি ভাগ করা"],["hundreds of online friends","শত শত অনলাইন বন্ধু"],["feel more isolated","আরও বিচ্ছিন্ন বোধ করা"],["the quality of relationships","সম্পর্কের মান"],["a perfect version of their lives","তাদের জীবনের নিখুঁত রূপ"]],"sents":[{"en":"Social media allows people to stay in touch across long distances.","bn":"সামাজিক মাধ্যম মানুষকে দীর্ঘ দূরত্ব সত্ত্বেও যোগাযোগ রাখতে দেয়।"},{"en":"Migrant workers can see their children every day through video calls.","bn":"প্রবাসী শ্রমিকরা ভিডিও কলের মাধ্যমে প্রতিদিন সন্তানদের দেখতে পারেন।"},{"en":"Families can share news and photos instantly.","bn":"পরিবারগুলো তাৎক্ষণিকভাবে খবর ও ছবি ভাগ করতে পারে।"},{"en":"However, online messages cannot replace real conversations.","bn":"তবে অনলাইন বার্তা প্রকৃত কথোপকথনের বিকল্প হতে পারে না।"},{"en":"Without body language, messages can easily lead to misunderstandings.","bn":"শারীরিক ভাষা ছাড়া বার্তা সহজেই ভুল বোঝাবুঝির কারণ হতে পারে।"},{"en":"Some people have hundreds of online friends but still feel lonely.","bn":"কিছু মানুষের শত শত অনলাইন বন্ধু থাকলেও তারা একাকীত্ব অনুভব করে।"},{"en":"People often post a perfect version of their lives, which encourages comparison.","bn":"মানুষ প্রায়ই তাদের জীবনের নিখুঁত রূপ পোস্ট করে, যা তুলনাকে উৎসাহিত করে।"},{"en":"The quality of relationships matters more than the number of contacts.","bn":"যোগাযোগের সংখ্যার চেয়ে সম্পর্কের মান বেশি গুরুত্বপূর্ণ।"}],"xvocab":[["curated","বাছাই করে সাজানো"],["intimacy","ঘনিষ্ঠতা"],["lifeline","জীবনরেখা / একমাত্র ভরসা"],["fragmented","খণ্ডিত"],["nuance","সূক্ষ্মতা"],["diaspora","প্রবাসী সম্প্রদায়"],["emotional wellbeing","মানসিক সুস্থতা"],["complement","পরিপূরক হওয়া"]],"xsents":[{"en":"For elderly people living alone, video calls can be a lifeline.","bn":"একা থাকা বয়স্কদের জন্য ভিডিও কল একমাত্র ভরসা হতে পারে।"},{"en":"Text messages often lose the nuance of spoken conversation.","bn":"লিখিত বার্তা প্রায়ই মৌখিক কথোপকথনের সূক্ষ্মতা হারায়।"},{"en":"Curated online profiles can harm users' emotional wellbeing.","bn":"বাছাই করে সাজানো অনলাইন প্রোফাইল ব্যবহারকারীদের মানসিক সুস্থতার ক্ষতি করতে পারে।"},{"en":"Social media works best when it complements, rather than replaces, meeting in person.","bn":"সামাজিক মাধ্যম সবচেয়ে ভালো কাজ করে যখন এটি সরাসরি দেখা করার বিকল্প নয়, পরিপূরক হয়।"}],"essays":[{"label":"BASIC ESSAY (BAND 5–6)","words":253,"paras":["Today, many people use <b>social media</b> as the main way to talk to their friends and family. <b>This trend has both benefits and drawbacks, but overall I consider it a negative development because relationships are becoming more superficial.</b>","Of course, <b>social media</b> has some good points. It is very easy and cheap to use. People can <b>stay in touch</b> with friends and family who live far away. For example, many Bangladeshi workers live in the Middle East, and they can talk to their children every day by <b>video call</b>. People can also share photos and news quickly, so they feel connected.","However, I think the bad points are more important. Firstly, messages on <b>social media</b> are not the same as real conversations. When we talk <b>face-to-face</b>, we can see the other person's face and hear their voice, so we understand their feelings better. Online, it is easy to misunderstand a message. Secondly, many people have hundreds of friends online, but they do not have close friends in real life, so they feel lonely. Thirdly, people usually post only happy photos. Other people compare their lives with these photos and feel sad. Also, families sometimes sit together in the same room but everyone looks at their phone, so they do not talk to each other.","In conclusion, <b>social media</b> helps people keep in touch, especially over long distances. However, I believe it is mainly a negative development, because it makes <b>relationships</b> less deep. People should use it less and meet each other more often."]},{"label":"ADVANCED ESSAY (BAND 7)","words":267,"paras":["In recent years, <b>social media</b> has replaced phone calls and personal visits as the principal means of <b>communication</b> for many people. <b>This trend has both benefits and drawbacks, but overall I consider it a negative development because relationships are becoming more superficial.</b>","There is no doubt that <b>social media</b> has made <b>communication</b> easier. It allows people to <b>stay in touch</b> <b>across long distances</b> at almost no cost. For example, millions of Bangladeshi <b>migrant workers</b> can see their children every day through video calls, which would have been impossible a generation ago. Families and friends can also <b>share news and photos</b> instantly, which gives them <b>a sense of connection</b> even when they are far apart.","However, when <b>social media</b> becomes the main form of <b>communication</b>, <b>the quality of relationships</b> tends to suffer. Firstly, online messages cannot <b>replace real conversations</b>. Without <b>body language</b> and tone of voice, messages can easily lead to <b>misunderstandings</b>, and it is difficult to offer real comfort to a friend through a text. Secondly, although some people have <b>hundreds of online friends</b>, many of them still feel lonely, because these connections are often shallow. Thirdly, people usually post <b>a perfect version of their lives</b>, which encourages <b>comparison</b> and can make others feel inadequate. Even at family gatherings, it is now common to see everyone looking at their phones rather than talking to each other.","In conclusion, while <b>social media</b> is a valuable tool for keeping in touch, I believe that relying on it as the main way to communicate is a negative development. It should be used to <b>complement</b> <b>face-to-face</b> contact, not to replace it."]},{"label":"BAND 9 ESSAY","words":324,"paras":["Over the past decade, <b>social media</b> platforms have overtaken phone calls and personal visits as the primary means by which many people communicate with those closest to them. <b>This trend has both benefits and drawbacks, but overall I consider it a negative development because relationships are becoming more superficial.</b>","The advantages of <b>social media</b> should not be underestimated. It has made it possible to <b>stay in touch</b> <b>across long distances</b> instantly and at virtually no cost, which has transformed life for dispersed families. For the millions of South Asian <b>migrant workers</b> in the Gulf, for instance, daily video calls with their children have replaced letters that once took weeks to arrive. Similarly, for elderly people living alone, messaging apps can be a <b>lifeline</b>, and the ability to <b>share news and photos</b> in real time helps to maintain <b>a sense of connection</b> with a scattered <b>diaspora</b>.","Nevertheless, when these platforms become the main channel of <b>communication</b> rather than a supplement to it, the depth of <b>relationships</b> tends to erode. Written messages lose the <b>nuance</b> of spoken conversation: without <b>body language</b> or tone of voice, remarks are easily misread, and <b>misunderstandings</b> that would be resolved in seconds <b>face-to-face</b> can fester for days. Moreover, the sheer volume of contacts can create an illusion of closeness. It is a striking paradox that people with <b>hundreds of online friends</b> often report feeling lonelier than ever, since a stream of likes and brief comments offers little genuine <b>intimacy</b>. The <b>curated</b> nature of online profiles compounds the problem, as users present <b>a perfect version of their lives</b>, encouraging constant <b>comparison</b> that undermines <b>emotional wellbeing</b>. Tellingly, it is now common to see families gathered around a table, each member absorbed in a screen.","In conclusion, <b>social media</b> is an invaluable tool for bridging distance, but its growing dominance as the main form of <b>communication</b> is, on balance, a negative development. It works best when it <b>complements</b>, rather than replaces, meeting in person."]}],"type":"Positive or negative development","q":"Social media platforms have become the main way many people communicate with friends and family. Is this a positive or negative development?"},{"n":9,"title":"Online shopping and traditional shops","cat":"Technology & AI","groups":[{"name":"Advantages","bn":"সুবিধা","items":[{"en":"Online shopping is convenient because people can buy almost anything at any time from home.","bn":"অনলাইন কেনাকাটা সুবিধাজনক কারণ মানুষ বাড়ি থেকে যেকোনো সময় প্রায় যেকোনো কিছু কিনতে পারে।"},{"en":"Customers save time by avoiding traffic, crowds and queues.","bn":"ক্রেতারা যানজট, ভিড় ও লাইন এড়িয়ে সময় বাঁচান।"},{"en":"Shoppers can easily compare prices and read reviews before buying.","bn":"ক্রেতারা কেনার আগে সহজেই দাম তুলনা ও রিভিউ পড়তে পারেন।"},{"en":"Online stores offer a far wider range of products than local shops.","bn":"অনলাইন দোকান স্থানীয় দোকানের চেয়ে অনেক বিস্তৃত পণ্যের সমাহার দেয়।"},{"en":"People in rural areas can buy goods that are not available in their local markets.","bn":"গ্রামাঞ্চলের মানুষ স্থানীয় বাজারে পাওয়া যায় না এমন পণ্য কিনতে পারেন।"}]},{"name":"Disadvantages","bn":"অসুবিধা","items":[{"en":"Customers cannot see or try products before buying, and items may not match the description.","bn":"ক্রেতারা কেনার আগে পণ্য দেখতে বা পরখ করতে পারেন না, এবং পণ্য বর্ণনার সঙ্গে না-ও মিলতে পারে।"},{"en":"Online fraud and fake sellers are a growing problem.","bn":"অনলাইন প্রতারণা ও ভুয়া বিক্রেতা একটি ক্রমবর্ধমান সমস্যা।"},{"en":"Many small local shops cannot compete and are forced to close.","bn":"অনেক ছোট স্থানীয় দোকান প্রতিযোগিতা করতে না পেরে বন্ধ হতে বাধ্য হয়।"},{"en":"Individual deliveries create large amounts of packaging waste and traffic.","bn":"আলাদা আলাদা ডেলিভারি প্রচুর মোড়ক বর্জ্য ও যানজট তৈরি করে।"},{"en":"Easy one-click payment encourages people to buy things they do not need.","bn":"এক ক্লিকে সহজ পেমেন্ট মানুষকে অপ্রয়োজনীয় জিনিস কিনতে উৎসাহিত করে।"}]},{"name":"Evaluation: Which Side Is Stronger?","bn":"মূল্যায়ন — কোন দিক বেশি গুরুত্বপূর্ণ?","items":[{"en":"Online shopping offers great convenience and choice, but it also harms local businesses and increases packaging waste.","bn":"অনলাইন কেনাকাটা দারুণ সুবিধা ও বৈচিত্র্য দেয়, তবে এটি স্থানীয় ব্যবসার ক্ষতি করে এবং প্যাকেজিং বর্জ্য বাড়ায়।"},{"en":"In my view, the advantages of online shopping for consumers outweigh its disadvantages.","bn":"আমার মতে, ক্রেতাদের জন্য অনলাইন কেনাকাটার সুবিধাগুলো অসুবিধার চেয়ে বেশি।"}]}],"vocab":[["e-commerce","ই-কমার্স"],["convenience","সুবিধা"],["consumers","ভোক্তারা"],["home delivery","বাড়িতে সরবরাহ"],["compare prices","দাম তুলনা করা"],["discount","ছাড়"],["fraud","প্রতারণা"],["reviews","পর্যালোচনা / রিভিউ"],["local businesses","স্থানীয় ব্যবসা"],["packaging","মোড়ক"],["returns","পণ্য ফেরত"],["high street","প্রধান বিপণি সড়ক"],["counterfeit","নকল"],["employment","কর্মসংস্থান"]],"phrases":[["at the click of a button","এক ক্লিকেই"],["from the comfort of their home","বাড়িতে আরামে বসে"],["a wider range of products","আরও বিস্তৃত পণ্যের সমাহার"],["avoid traffic and crowds","যানজট ও ভিড় এড়ানো"],["go out of business","ব্যবসা বন্ধ হয়ে যাওয়া"],["try before you buy","কেনার আগে পরখ করা"],["not as described","বর্ণনা অনুযায়ী নয়"],["a significant amount of waste","উল্লেখযোগ্য পরিমাণ বর্জ্য"],["24 hours a day","দিনে ২৪ ঘণ্টা"],["the heart of the community","সম্প্রদায়ের প্রাণকেন্দ্র"]],"sents":[{"en":"Online shopping allows people to buy almost anything at the click of a button.","bn":"অনলাইন কেনাকাটা মানুষকে এক ক্লিকেই প্রায় যেকোনো কিছু কিনতে দেয়।"},{"en":"Customers can shop from the comfort of their home and avoid traffic and crowds.","bn":"ক্রেতারা বাড়িতে বসে কেনাকাটা করতে এবং যানজট ও ভিড় এড়াতে পারেন।"},{"en":"It is easy to compare prices and read reviews before buying.","bn":"কেনার আগে দাম তুলনা করা ও রিভিউ পড়া সহজ।"},{"en":"Online stores usually offer a wider range of products than local shops.","bn":"অনলাইন দোকান সাধারণত স্থানীয় দোকানের চেয়ে বিস্তৃত পণ্যের সমাহার দেয়।"},{"en":"However, customers cannot try before they buy.","bn":"তবে ক্রেতারা কেনার আগে পরখ করতে পারেন না।"},{"en":"Sometimes the product that arrives is not as described.","bn":"কখনো কখনো যে পণ্য আসে তা বর্ণনা অনুযায়ী হয় না।"},{"en":"Many small shops have gone out of business because of online competition.","bn":"অনলাইন প্রতিযোগিতার কারণে অনেক ছোট দোকান বন্ধ হয়ে গেছে।"},{"en":"Home delivery also produces a significant amount of packaging waste.","bn":"বাড়িতে সরবরাহ উল্লেখযোগ্য পরিমাণ মোড়ক বর্জ্যও তৈরি করে।"}],"xvocab":[["brick-and-mortar","সরাসরি দোকান"],["logistics","সরবরাহ ব্যবস্থাপনা"],["impulse buying","হুটহাট কেনা"],["carbon emissions","কার্বন নিঃসরণ"],["scam","প্রতারণা"],["social hub","সামাজিক মিলনকেন্দ্র"],["delivery riders","ডেলিভারি কর্মী"],["rural consumers","গ্রামীণ ভোক্তা"]],"xsents":[{"en":"E-commerce has created thousands of jobs for delivery riders.","bn":"ই-কমার্স ডেলিভারি কর্মীদের জন্য হাজার হাজার চাকরি তৈরি করেছে।"},{"en":"One-click payment encourages impulse buying.","bn":"এক ক্লিকে পেমেন্ট হুটহাট কেনাকাটাকে উৎসাহিত করে।"},{"en":"Rural consumers can now access products once available only in cities.","bn":"গ্রামীণ ভোক্তারা এখন একসময় শুধু শহরে পাওয়া পণ্য পেতে পারেন।"},{"en":"Local markets are not only places to buy things but also social hubs.","bn":"স্থানীয় বাজার শুধু কেনার জায়গা নয়, সামাজিক মিলনকেন্দ্রও।"}],"essays":[{"label":"BASIC ESSAY (BAND 5–6)","words":266,"paras":["Nowadays, many people buy things on the internet instead of going to shops. <b>Online shopping offers great convenience and choice, but it also harms local businesses and increases packaging waste.</b>","There are many advantages of online shopping. The first advantage is <b>convenience</b>. People can buy things at any time from their home, so they do not need to go out in traffic. This saves a lot of time, especially in busy cities like Dhaka. The second advantage is choice. Online shops have many more products than normal shops, and people can <b>compare prices</b> easily and find the cheapest one. They can also read <b>reviews</b> from other customers before they buy something. It is also useful for people who live in villages, because they can buy things that are not sold in local shops.","However, there are also some disadvantages. Firstly, people cannot see or touch the product before buying. Sometimes the product is different from the picture, or it is broken, and it can be difficult to return it. Some websites are not honest and cheat customers. Secondly, many small local shops lose customers and have to close, so some shopkeepers lose their jobs. Thirdly, online shopping creates a lot of waste, because every product comes in plastic and boxes. Also, some people buy too many things online because it is so easy.","In conclusion, online shopping is very convenient and gives people more choice and lower prices. However, it also has disadvantages, such as poor quality products, problems for local shops and more waste. People should shop carefully and sometimes support their local shops too."]},{"label":"ADVANCED ESSAY (BAND 7)","words":271,"paras":["In recent years, there has been a dramatic shift from shopping in traditional stores to buying goods online. <b>Online shopping offers great convenience and choice, but it also harms local businesses and increases packaging waste.</b>","The main advantage of online shopping is <b>convenience</b>. Customers can buy almost anything <b>at the click of a button</b>, <b>24 hours a day</b>, and shop <b>from the comfort of their home</b> rather than battling traffic and crowds. This is particularly valuable for working people and those with limited mobility. Another benefit is choice and price. Online stores usually offer a much wider range of products than local shops, and <b>consumers</b> can easily <b>compare prices</b> and read <b>reviews</b> before making a decision. Furthermore, <b>e-commerce</b> has given <b>rural consumers</b> access to products that were once available only in big cities, and it has created many jobs for <b>delivery riders</b>.","On the other hand, there are several drawbacks. Firstly, customers cannot try before they buy, and sometimes the product that arrives is <b>not as described</b>, or is even <b>counterfeit</b>. <b>Returns</b> can be slow and complicated, and online <b>fraud</b> remains a serious problem. Secondly, the growth of <b>e-commerce</b> has hit traditional retailers hard, and many small shops have <b>gone out of business</b>, damaging local communities. Finally, <b>home delivery</b> produces a significant amount of <b>packaging</b> waste, as well as extra traffic from delivery vehicles, which is harmful to the environment.","In conclusion, online shopping offers clear benefits in terms of <b>convenience</b>, choice and price, but it also creates problems for <b>consumers</b>, <b>local businesses</b> and the environment. Shoppers and governments therefore need to find a balance between the two ways of shopping."]},{"label":"BAND 9 ESSAY","words":342,"paras":["The past decade has witnessed a remarkable migration of consumer spending from traditional shops to online platforms, a trend that shows no sign of slowing. <b>Online shopping offers great convenience and choice, but it also harms local businesses and increases packaging waste.</b>","For <b>consumers</b>, the appeal is obvious. The foremost advantage is <b>convenience</b>: goods of almost every kind can be ordered <b>at the click of a button</b>, <b>24 hours a day</b>, from the comfort of home, sparing shoppers the time and stress of traffic and crowds. This is especially significant in congested cities such as Dhaka, and for elderly or disabled people for whom a trip to the market can be genuinely difficult. The second major benefit is choice. Online marketplaces offer a far wider range of products than any physical shop, and the ability to <b>compare prices</b> and read <b>reviews</b> instantly has shifted power towards <b>consumers</b>. <b>E-commerce</b> has also narrowed the gap between town and countryside, giving <b>rural consumers</b> access to goods once confined to big cities, while creating thousands of jobs in <b>logistics</b> for warehouse staff and <b>delivery riders</b>.","These gains, however, come at a cost. Shoppers cannot try before they buy, and it is not uncommon for items to arrive damaged, <b>not as described</b> or even <b>counterfeit</b>, while online <b>scams</b> remain a persistent threat. At a community level, the rise of <b>e-commerce</b> has hollowed out many high streets; small, family-run shops often cannot compete on price and have <b>gone out of business</b>, taking with them not only livelihoods but also informal social hubs where neighbours met. Environmentally, the model is wasteful: individually wrapped deliveries generate a significant amount of <b>packaging</b> waste, and the fleets of vans and motorbikes add to congestion and <b>carbon emissions</b>. Moreover, frictionless one-click payment tends to encourage <b>impulse buying</b> and overconsumption.","In conclusion, online shopping has brought undeniable benefits in <b>convenience</b>, choice and access, yet it has also weakened <b>local businesses</b> and created environmental problems. The challenge for policymakers is to preserve these benefits while supporting <b>brick-and-mortar</b> retailers and reducing the waste the system produces."]}],"type":"Advantages and disadvantages","q":"More and more people are shopping online rather than in traditional shops. What are the advantages and disadvantages of this trend?"},{"n":10,"title":"Who should tackle climate change: individuals or governments?","cat":"Environment","groups":[{"name":"Reasons Supporting the First View","bn":"প্রথম মতের পক্ষে কারণ","items":[{"en":"Governments can pass laws that reduce pollution across the whole country at once.","bn":"সরকার এমন আইন পাস করতে পারে যা একসঙ্গে সারা দেশে দূষণ কমায়।"},{"en":"A small number of large companies produce a large share of global emissions.","bn":"অল্প কিছু বড় কোম্পানি বৈশ্বিক নিঃসরণের বড় অংশ তৈরি করে।"},{"en":"Only governments can afford large projects such as metro systems and solar power plants.","bn":"মেট্রো ব্যবস্থা ও সৌরবিদ্যুৎকেন্দ্রের মতো বড় প্রকল্পের ব্যয় কেবল সরকারই বহন করতে পারে।"},{"en":"Taxes and regulations change the behaviour of businesses far more than personal choices.","bn":"কর ও বিধিনিষেধ ব্যক্তিগত পছন্দের চেয়ে ব্যবসার আচরণ অনেক বেশি বদলায়।"},{"en":"The actions of one person are tiny compared with the scale of industrial pollution.","bn":"শিল্প দূষণের মাত্রার তুলনায় একজন মানুষের কাজ অতি সামান্য।"}]},{"name":"Reasons Supporting the Second View","bn":"দ্বিতীয় মতের পক্ষে কারণ","items":[{"en":"When millions of people change their daily habits, the combined effect is significant.","bn":"লাখ লাখ মানুষ দৈনন্দিন অভ্যাস বদলালে সম্মিলিত প্রভাব উল্লেখযোগ্য হয়।"},{"en":"Consumers can force companies to change by choosing environmentally friendly products.","bn":"ভোক্তারা পরিবেশবান্ধব পণ্য বেছে নিয়ে কোম্পানিগুলোকে বদলাতে বাধ্য করতে পারে।"},{"en":"Citizens can pressure governments through voting, protests and campaigns.","bn":"নাগরিকরা ভোট, প্রতিবাদ ও প্রচারণার মাধ্যমে সরকারের ওপর চাপ সৃষ্টি করতে পারে।"},{"en":"Simple actions such as using public transport and saving energy reduce emissions directly.","bn":"গণপরিবহন ব্যবহার ও বিদ্যুৎ সাশ্রয়ের মতো সহজ কাজ সরাসরি নিঃসরণ কমায়।"},{"en":"People who live sustainably set an example for their children and communities.","bn":"যারা টেকসইভাবে জীবনযাপন করেন তারা সন্তান ও সম্প্রদায়ের জন্য দৃষ্টান্ত স্থাপন করেন।"}]},{"name":"Evaluation: My Opinion","bn":"মূল্যায়ন — আমার মতামত","items":[{"en":"Although governments and large companies have the greatest power, I believe individuals also have an important role to play in protecting the environment.","bn":"যদিও সরকার ও বড় কোম্পানিগুলোর সবচেয়ে বেশি ক্ষমতা আছে, আমি বিশ্বাস করি পরিবেশ রক্ষায় ব্যক্তিরও গুরুত্বপূর্ণ ভূমিকা আছে।"},{"en":"In my view, real change depends mainly on governments and corporations, but individual actions still matter.","bn":"আমার মতে, প্রকৃত পরিবর্তন মূলত সরকার ও বড় প্রতিষ্ঠানের ওপর নির্ভর করে, তবে ব্যক্তিগত উদ্যোগও গুরুত্বপূর্ণ।"}]}],"vocab":[["climate change","জলবায়ু পরিবর্তন"],["carbon emissions","কার্বন নিঃসরণ"],["renewable energy","নবায়নযোগ্য জ্বালানি"],["fossil fuels","জীবাশ্ম জ্বালানি"],["regulations","নিয়মকানুন"],["corporations","কর্পোরেশন / বৃহৎ প্রতিষ্ঠান"],["recycle","পুনর্চক্রায়ন করা"],["public transport","গণপরিবহন"],["consumer demand","ভোক্তা চাহিদা"],["pollution","দূষণ"],["legislation","আইনপ্রণয়ন"],["sustainable","টেকসই"],["collective","সম্মিলিত"],["awareness","সচেতনতা"]],"phrases":[["make a real difference","প্রকৃত পরিবর্তন আনা"],["a drop in the ocean","সমুদ্রে এক ফোঁটা (নগণ্য)"],["take the lead","নেতৃত্ব দেওয়া"],["reduce their carbon footprint","কার্বন নিঃসরণের পরিমাণ কমানো"],["small changes add up","ছোট পরিবর্তন মিলে বড় হয়"],["put pressure on","চাপ সৃষ্টি করা"],["on a large scale","বৃহৎ পরিসরে"],["set an example","দৃষ্টান্ত স্থাপন করা"],["vote with their wallets","কেনাকাটার মাধ্যমে অবস্থান জানানো"],["work together","একসঙ্গে কাজ করা"]],"sents":[{"en":"Governments can pass laws that reduce pollution on a large scale.","bn":"সরকার বৃহৎ পরিসরে দূষণ কমায় এমন আইন পাস করতে পারে।"},{"en":"A small number of large companies are responsible for a large share of carbon emissions.","bn":"অল্প কিছু বড় কোম্পানি কার্বন নিঃসরণের বড় অংশের জন্য দায়ী।"},{"en":"Some people feel that one person's actions are just a drop in the ocean.","bn":"কেউ কেউ মনে করেন একজন মানুষের কাজ সমুদ্রে এক ফোঁটা মাত্র।"},{"en":"However, when millions of people change their habits, small changes add up.","bn":"তবে লাখ লাখ মানুষ অভ্যাস বদলালে ছোট পরিবর্তন মিলে বড় হয়।"},{"en":"Individuals can reduce their carbon footprint by using public transport.","bn":"ব্যক্তিরা গণপরিবহন ব্যবহার করে কার্বন নিঃসরণের পরিমাণ কমাতে পারে।"},{"en":"Consumers can vote with their wallets by choosing sustainable products.","bn":"ভোক্তারা টেকসই পণ্য বেছে নিয়ে কেনাকাটার মাধ্যমে অবস্থান জানাতে পারেন।"},{"en":"Citizens can also put pressure on politicians to take action.","bn":"নাগরিকরা পদক্ষেপ নিতে রাজনীতিবিদদের ওপর চাপও সৃষ্টি করতে পারেন।"},{"en":"The best results come when governments, businesses and individuals work together.","bn":"সরকার, ব্যবসা ও ব্যক্তি একসঙ্গে কাজ করলেই সেরা ফল আসে।"}],"xvocab":[["carbon tax","কার্বন কর"],["shift the blame","দোষ অন্যের ঘাড়ে চাপানো"],["grassroots movement","তৃণমূল আন্দোলন"],["incentivise","প্রণোদনা দেওয়া"],["accountability","জবাবদিহি"],["behavioural change","আচরণগত পরিবর্তন"],["systemic","ব্যবস্থাগত"],["complacency","আত্মতুষ্টি"]],"xsents":[{"en":"A carbon tax can incentivise companies to cut emissions.","bn":"কার্বন কর কোম্পানিগুলোকে নিঃসরণ কমাতে প্রণোদনা দিতে পারে।"},{"en":"Grassroots movements have often forced governments to act.","bn":"তৃণমূল আন্দোলন প্রায়ই সরকারকে পদক্ষেপ নিতে বাধ্য করেছে।"},{"en":"Blaming corporations alone can lead to c
