],["health education","স্বাস্থ্যশিক্ষা"],["clean water","বিশুদ্ধ পানি"],["sanitation","পয়ঃনিষ্কাশন"],["screening","রোগ শনাক্তকরণ পরীক্ষা"],["hospitals","হাসপাতাল"],["surgery","অস্ত্রোপচার"],["chronic diseases","দীর্ঘস্থায়ী রোগ"],["emergency","জরুরি অবস্থা"],["cost-effective","সাশ্রয়ী / ব্যয়-কার্যকর"],["medical equipment","চিকিৎসা সরঞ্জাম"],["lifestyle","জীবনধারা"]],"phrases":[["prevention is better than cure","প্রতিকারের চেয়ে প্রতিরোধ ভালো"],["in the long run","দীর্ঘমেয়াদে"],["save lives","জীবন বাঁচানো"],["a moral duty","নৈতিক কর্তব্য"],["people who are already sick","যারা ইতোমধ্যে অসুস্থ"],["catch diseases early","রোগ প্রাথমিক পর্যায়ে শনাক্ত করা"],["reduce the burden on hospitals","হাসপাতালের ওপর চাপ কমানো"],["the results take years to appear","ফলাফল দেখা দিতে বছর লাগে"],["turn people away","মানুষকে ফিরিয়ে দেওয়া"],["strike a balance","ভারসাম্য বজায় রাখা"]],"sents":[{"en":"As the saying goes, prevention is better than cure.","bn":"কথায় আছে, প্রতিকারের চেয়ে প্রতিরোধ ভালো।"},{"en":"Vaccination programmes have saved millions of lives.","bn":"টিকাদান কর্মসূচি লাখ লাখ জীবন বাঁচিয়েছে।"},{"en":"Clean water and sanitation prevent many deadly diseases.","bn":"বিশুদ্ধ পানি ও পয়ঃনিষ্কাশন অনেক প্রাণঘাতী রোগ প্রতিরোধ করে।"},{"en":"Regular screening can catch diseases early, when they are easier to treat.","bn":"নিয়মিত পরীক্ষা রোগ প্রাথমিক পর্যায়ে শনাক্ত করতে পারে, যখন চিকিৎসা সহজ।"},{"en":"Preventing illness reduces the burden on hospitals.","bn":"রোগ প্রতিরোধ হাসপাতালের ওপর চাপ কমায়।"},{"en":"However, governments have a moral duty to care for people who are already sick.","bn":"তবে যারা ইতোমধ্যে অসুস্থ তাদের সেবা করা সরকারের নৈতিক কর্তব্য।"},{"en":"The results of prevention campaigns often take years to appear.","bn":"প্রতিরোধ কর্মসূচির ফলাফল দেখা দিতে প্রায়ই বছর লাগে।"},{"en":"Hospitals should never have to turn people away because of a lack of funds.","bn":"অর্থের অভাবে হাসপাতালকে কখনো মানুষকে ফিরিয়ে দিতে হওয়া উচিত নয়।"}],"xvocab":[["public health campaign","জনস্বাস্থ্য প্রচারণা"],["immunisation","টিকাদান"],["primary healthcare","প্রাথমিক স্বাস্থ্যসেবা"],["overstretched","অতিরিক্ত চাপগ্রস্ত"],["politically unattractive","রাজনৈতিকভাবে অনাকর্ষণীয়"],["community clinics","কমিউনিটি ক্লিনিক"],["waterborne diseases","পানিবাহিত রোগ"],["return on investment","বিনিয়োগের প্রতিদান"]],"xsents":[{"en":"Bangladesh's community clinics have improved primary healthcare in rural areas.","bn":"বাংলাদেশের কমিউনিটি ক্লিনিক গ্রামাঞ্চলে প্রাথমিক স্বাস্থ্যসেবা উন্নত করেছে।"},{"en":"Oral rehydration saline dramatically reduced deaths from waterborne diseases.","bn":"খাবার স্যালাইন পানিবাহিত রোগে মৃত্যু নাটকীয়ভাবে কমিয়েছে।"},{"en":"Prevention is politically unattractive because its successes are invisible.","bn":"প্রতিরোধ রাজনৈতিকভাবে অনাকর্ষণীয় কারণ এর সাফল্য চোখে পড়ে না।"},{"en":"Many hospitals are already overstretched and underfunded.","bn":"অনেক হাসপাতাল ইতোমধ্যে অতিরিক্ত চাপগ্রস্ত ও অর্থসংকটে।"}],"essays":[{"label":"BASIC ESSAY (BAND 5–6)","words":270,"paras":["Some people think the government should spend more money to stop people from getting sick, but others think it is more important to spend money on treating sick people. <b>Although treating the sick is essential, I believe governments should prioritise preventing illness, as it saves both lives and money in the long run.</b>","On the one hand, <b>treatment</b> is very important. When people are sick, they need doctors, medicine and <b>hospitals</b> immediately. The government has a duty to help people who are already ill. If <b>hospitals</b> do not have enough money, sick people may not get <b>treatment</b> and some may die. In many countries, <b>hospitals</b> are very crowded, and they need more doctors and equipment.","On the other hand, I believe preventing illness is more important. As the saying goes, <b>prevention is better than cure</b>. If the government gives people vaccines, <b>clean water</b> and <b>health education</b>, fewer people will get sick. For example, vaccines have stopped many dangerous diseases in Bangladesh, and saline has saved many children from diarrhoea. Also, preventing disease is usually much cheaper than treating it. For example, teaching people to eat healthily and exercise costs less than heart <b>surgery</b>. If fewer people are sick, <b>hospitals</b> will be less busy, so doctors can give better care to patients who really need it.","In my opinion, the government should spend money on both, but it should spend more on <b>prevention</b> than it does now.","In conclusion, <b>treatment</b> is necessary for sick people today, but <b>prevention</b> can stop people from getting sick in the future. I believe <b>prevention</b> should be the main priority, because it <b>saves lives</b> and money."]},{"label":"ADVANCED ESSAY (BAND 7)","words":283,"paras":["There is debate about whether public health budgets should focus on preventing disease or on treating those who are already ill. <b>Although treating the sick is essential, I believe governments should prioritise preventing illness, as it saves both lives and money in the long run.</b>","Those who favour <b>treatment</b> argue that governments have <b>a moral duty</b> to care for <b>people who are already sick</b>. When someone has cancer or needs <b>emergency</b> <b>surgery</b>, they require immediate help, and it would be unacceptable for a hospital to <b>turn people away</b> because money had been spent on long-term campaigns. Moreover, in many countries <b>hospitals</b> are already overcrowded and short of doctors and <b>medical equipment</b>, so additional funding is urgently needed. Supporters of this view also point out that the results of <b>prevention</b> campaigns often take years to appear.","However, I find the case for <b>prevention</b> more convincing. Firstly, <b>prevention</b> is usually far more <b>cost-effective</b>. <b>Vaccination</b> programmes, <b>clean water</b> and <b>sanitation</b> cost relatively little, yet they have saved millions of lives. Bangladesh provides a clear example: <b>immunisation</b> campaigns and the promotion of oral saline have dramatically reduced child deaths at a fraction of the cost of hospital <b>treatment</b>. Secondly, the growth of <b>chronic diseases</b> such as diabetes and heart disease, which are closely linked to <b>lifestyle</b>, means that <b>health education</b> and regular <b>screening</b> can prevent illness or <b>catch diseases early</b>, when they are easier and cheaper to treat. As a result, <b>prevention</b> would also <b>reduce the burden on hospitals</b>, allowing them to focus on patients who genuinely need care.","In conclusion, while adequate funding for <b>treatment</b> remains essential, I believe <b>prevention</b> is the wiser long-term investment, because it protects people's health before problems become serious and costly."]},{"label":"BAND 9 ESSAY","words":334,"paras":["Governments with finite health budgets must decide how to divide resources between preventing disease and treating those who are already unwell. <b>Although treating the sick is essential, I believe governments should prioritise preventing illness, as it saves both lives and money in the long run.</b>","The argument for concentrating on <b>treatment</b> carries considerable moral weight. People suffering from cancer, heart attacks or serious injuries need immediate care, and a government that allowed <b>hospitals</b> to <b>turn people away</b> in order to fund advertising campaigns would rightly be condemned. In many countries, <b>hospitals</b> are already <b>overstretched</b>, facing shortages of doctors, beds and equipment, and advocates of this view argue that these urgent needs must take precedence. They also note, fairly, that the benefits of <b>prevention</b> take years to appear, whereas the need for <b>treatment</b> is immediate and visible.","Nevertheless, I am persuaded that <b>prevention</b> should receive greater priority. The most compelling reason is cost-effectiveness. Measures such as <b>immunisation</b>, <b>clean water</b> and <b>sanitation</b> are relatively inexpensive, yet they have arguably saved more lives than any surgical breakthrough. Bangladesh is a striking illustration: nationwide <b>immunisation</b> drives, the promotion of oral rehydration saline to combat <b>waterborne diseases</b> and a network of <b>community clinics</b> delivering <b>primary healthcare</b> have transformed child survival rates at a fraction of the cost of hospital-based care. Furthermore, as chronic, <b>lifestyle</b>-related conditions such as diabetes and heart disease become the leading causes of death, <b>health education</b> and routine <b>screening</b> grow ever more valuable, enabling doctors to <b>catch diseases early</b>, when <b>treatment</b> is simpler and cheaper. Every illness prevented also <b>reduces the burden on hospitals</b>, freeing resources for those who genuinely need acute care. The difficulty is that <b>prevention</b> is <b>politically unattractive</b>, since its successes, diseases that never occur, are invisible, and this is precisely why it tends to be underfunded.","In conclusion, adequate funding for <b>treatment</b> must always be maintained, but the greater <b>return on investment</b> lies in <b>prevention</b>. Governments that shift resources towards stopping illness before it starts will ultimately save both lives and money."]}],"type":"Discuss both views and give your opinion","q":"Some people think that governments should spend more money on preventing illness, while others believe it is more important to spend money on treating people who are already sick. Discuss both views and give your opinion."},{"n":18,"title":"Working from home","cat":"Work & Employment","groups":[{"name":"Advantages","bn":"সুবিধা","items":[{"en":"Employees save the time and money they would spend commuting every day.","bn":"কর্মীরা প্রতিদিন যাতায়াতে যে সময় ও অর্থ ব্যয় করতেন তা বাঁচান।"},{"en":"Flexible hours allow parents to spend more time with their children.","bn":"নমনীয় কর্মঘণ্টা বাবা-মাকে সন্তানদের সঙ্গে বেশি সময় কাটাতে দেয়।"},{"en":"Many people concentrate better at home without office distractions.","bn":"অনেকে অফিসের বিক্ষেপ ছাড়া বাড়িতে বেশি মনোযোগ দিতে পারেন।"},{"en":"Companies can reduce costs by renting smaller offices.","bn":"কোম্পানিগুলো ছোট অফিস ভাড়া নিয়ে খরচ কমাতে পারে।"},{"en":"Fewer commuters means less traffic and lower carbon emissions.","bn":"কম যাত্রী মানে কম যানজট ও কম কার্বন নিঃসরণ।"}]},{"name":"Disadvantages","bn":"অসুবিধা","items":[{"en":"The line between work and personal life becomes blurred, and people often work longer hours.","bn":"কাজ ও ব্যক্তিজীবনের সীমারেখা অস্পষ্ট হয়ে যায়, এবং মানুষ প্রায়ই বেশি সময় কাজ করেন।"},{"en":"Working alone at home can lead to loneliness and isolation.","bn":"বাড়িতে একা কাজ করা একাকীত্ব ও বিচ্ছিন্নতার কারণ হতে পারে।"},{"en":"Teamwork and creative discussion are harder without face-to-face contact.","bn":"মুখোমুখি যোগাযোগ ছাড়া দলগত কাজ ও সৃজনশীল আলোচনা কঠিন।"},{"en":"Junior employees lose the chance to learn from experienced colleagues.","bn":"নবীন কর্মীরা অভিজ্ঞ সহকর্মীদের কাছ থেকে শেখার সুযোগ হারান।"},{"en":"Small or noisy homes make it difficult to work productively.","bn":"ছোট বা কোলাহলপূর্ণ বাড়িতে দক্ষতার সঙ্গে কাজ করা কঠিন।"}]},{"name":"Evaluation: Which Side Is Stronger?","bn":"মূল্যায়ন — কোন দিক বেশি গুরুত্বপূর্ণ?","items":[{"en":"I believe the advantages of working from home, particularly flexibility and saved commuting time, outweigh its disadvantages.","bn":"আমি মনে করি বাড়ি থেকে কাজ করার সুবিধা, বিশেষত নমনীয়তা ও যাতায়াতের সময় সাশ্রয়, এর অসুবিধার চেয়ে বেশি।"},{"en":"Overall, I think the advantages outweigh the disadvantages, especially when companies adopt a hybrid model.","bn":"সামগ্রিকভাবে, আমার মনে হয় সুবিধাগুলো অসুবিধার চেয়ে বেশি, বিশেষ করে যখন প্রতিষ্ঠানগুলো হাইব্রিড মডেল গ্রহণ করে।"}]}],"vocab":[["remote work","দূরবর্তী কাজ"],["commute","যাতায়াত"],["flexibility","নমনীয়তা"],["productivity","উৎপাদনশীলতা"],["work-life balance","কর্ম-জীবনের ভারসাম্য"],["isolation","বিচ্ছিন্নতা"],["collaboration","সহযোগিতা"],["distractions","মনোযোগ বিক্ষেপ"],["office space","অফিসের জায়গা"],["colleagues","সহকর্মী"],["boundaries","সীমারেখা"],["supervision","তত্ত্বাবধান"],["hybrid model","মিশ্র পদ্ধতি"],["overtime","অতিরিক্ত সময়"]],"phrases":[["save time and money","সময় ও অর্থ বাঁচানো"],["stuck in traffic","যানজটে আটকে থাকা"],["spend more time with their families","পরিবারের সঙ্গে বেশি সময় কাটানো"],["blur the line between","... এর মধ্যকার সীমারেখা অস্পষ্ট করা"],["feel cut off","বিচ্ছিন্ন বোধ করা"],["a sense of team spirit","দলগত মনোভাবের অনুভূতি"],["work longer hours","দীর্ঘ সময় কাজ করা"],["reduce overheads","পরিচালন ব্যয় কমানো"],["learn from experienced colleagues","অভিজ্ঞ সহকর্মীদের কাছ থেকে শেখা"],["the best of both worlds","দুদিকেরই সুবিধা"]],"sents":[{"en":"Working from home saves employees the time and money they would spend commuting.","bn":"বাড়ি থেকে কাজ কর্মীদের যাতায়াতের সময় ও অর্থ বাঁচায়।"},{"en":"In Dhaka, many workers spend two or three hours a day stuck in traffic.","bn":"ঢাকায় অনেক কর্মী দিনে দুই-তিন ঘণ্টা যানজটে আটকে থাকেন।"},{"en":"Remote work allows parents to spend more time with their families.","bn":"দূরবর্তী কাজ বাবা-মাকে পরিবারের সঙ্গে বেশি সময় কাটাতে দেয়।"},{"en":"Companies can reduce overheads by renting less office space.","bn":"কোম্পানিগুলো কম অফিসের জায়গা ভাড়া নিয়ে পরিচালন ব্যয় কমাতে পারে।"},{"en":"However, working from home can blur the line between work and personal life.","bn":"তবে বাড়ি থেকে কাজ কাজ ও ব্যক্তিজীবনের মধ্যকার সীমারেখা অস্পষ্ট করতে পারে।"},{"en":"Some employees feel cut off from their colleagues.","bn":"কিছু কর্মী সহকর্মীদের থেকে বিচ্ছিন্ন বোধ করেন।"},{"en":"Young employees miss the chance to learn from experienced colleagues.","bn":"তরুণ কর্মীরা অভিজ্ঞ সহকর্মীদের কাছ থেকে শেখার সুযোগ হারায়।"},{"en":"A hybrid model gives workers the best of both worlds.","bn":"মিশ্র পদ্ধতি কর্মীদের দুদিকেরই সুবিধা দেয়।"}],"xvocab":[["burnout","মানসিক অবসাদ"],["talent pool","প্রতিভাবান কর্মীর ভান্ডার"],["face time","সরাসরি সাক্ষাৎ"],["spontaneous","স্বতঃস্ফূর্ত"],["mentoring","পরামর্শদান"],["carbon emissions","কার্বন নিঃসরণ"],["always-on culture","সারাক্ষণ কাজে যুক্ত থাকার সংস্কৃতি"],["autonomy","স্বাধীনভাবে কাজ করার ক্ষমতা"]],"xsents":[{"en":"Remote hiring gives companies access to a wider talent pool.","bn":"দূরবর্তী নিয়োগ কোম্পানিগুলোকে বিস্তৃত প্রতিভার ভান্ডারে প্রবেশাধিকার দেয়।"},{"en":"An always-on culture can lead to burnout.","bn":"সারাক্ষণ কাজে যুক্ত থাকার সংস্কৃতি মানসিক অবসাদের কারণ হতে পারে।"},{"en":"Many creative ideas come from spontaneous conversations in the office.","bn":"অনেক সৃজনশীল ধারণা অফিসের স্বতঃস্ফূর্ত আলাপ থেকে আসে।"},{"en":"Fewer commuters means lower carbon emissions.","bn":"কম যাত্রী মানে কম কার্বন নিঃসরণ।"}],"essays":[{"label":"BASIC ESSAY (BAND 5–6)","words":251,"paras":["Since the pandemic, many companies let their workers work from home. <b>Overall, I think the advantages outweigh the disadvantages, especially when companies adopt a hybrid model.</b>","Working from home has some disadvantages. Firstly, some people feel lonely because they do not see their <b>colleagues</b> every day. Secondly, it can be difficult to separate work and home life. Some people work late at night because their office is in their home. Thirdly, young workers cannot learn easily from experienced <b>colleagues</b>, because they do not sit together. Also, some homes are small and noisy, so it is hard to concentrate.","However, the advantages are more important. The biggest advantage is that workers do not need to travel to the office. In cities like Dhaka, people spend two or three hours every day in traffic jams. If they work from home, they <b>save time and money</b>, and they are less tired. Another advantage is <b>flexibility</b>. Workers can plan their day, so parents can spend more time with their children. Companies also save money because they need smaller offices. Finally, fewer cars on the road means less pollution.","I think the best solution is a <b>hybrid model</b>. Workers can work at home for some days and go to the office for other days, so they can meet their team and also enjoy <b>flexibility</b>.","In conclusion, working from home has some problems, such as loneliness and working too much. However, I believe the advantages, like saving time, <b>flexibility</b> and less pollution, are greater than the disadvantages."]},{"label":"ADVANCED ESSAY (BAND 7)","words":271,"paras":["Since the pandemic, a growing number of companies have allowed staff to work remotely for all or part of the week. <b>Overall, I think the advantages outweigh the disadvantages, especially when companies adopt a hybrid model.</b>","Admittedly, working from home has certain drawbacks. It can <b>blur the line between</b> work and personal life, and many employees find themselves answering emails late at night, which increases stress. In addition, some workers <b>feel cut off</b> from their <b>colleagues</b>, and the lack of face-to-face contact can weaken team spirit and <b>collaboration</b>. Young employees, in particular, miss the chance to <b>learn from experienced colleagues</b> simply by observing them. Finally, not everyone has a quiet space at home, and household <b>distractions</b> can reduce <b>productivity</b>.","Nevertheless, the benefits are more significant. The most obvious is that employees save the time and money they would spend <b>commuting</b>. In a city like Dhaka, where many workers spend two or three hours a day <b>stuck in traffic</b>, this can transform people's quality of life. <b>Remote work</b> also offers <b>flexibility</b>, allowing parents to <b>spend more time with their families</b> and improving <b>work-life balance</b>. From the employer's perspective, companies can <b>reduce overheads</b> by renting less <b>office space</b>, and they can hire talented people who live far away. There is also an environmental benefit, since fewer commuters means less pollution.","Many of the disadvantages can be reduced through a <b>hybrid model</b>, in which employees spend some days in the office for teamwork and training, and others at home.","In conclusion, while <b>remote work</b> presents challenges, I believe its advantages outweigh the disadvantages, particularly when it is combined with regular time in the office."]},{"label":"BAND 9 ESSAY","words":340,"paras":["The pandemic triggered a dramatic shift towards <b>remote work</b>, and many organisations have since chosen to let employees continue working from home for at least part of the week. <b>Overall, I think the advantages outweigh the disadvantages, especially when companies adopt a hybrid model.</b>","The drawbacks are real and should not be dismissed. Perhaps the most widely reported is that home working tends to <b>blur the line between</b> work and personal life; without a physical boundary, an <b>always-on culture</b> can develop in which employees answer messages late into the evening, increasing the risk of <b>burnout</b>. <b>Isolation</b> is another concern, as workers who rarely see <b>colleagues</b> may <b>feel cut off</b> and disengaged, and the <b>spontaneous</b> conversations that often spark new ideas are much harder to replicate online. This is particularly damaging for junior staff, who traditionally <b>learn from experienced colleagues</b> through observation and informal <b>mentoring</b>. Moreover, cramped or noisy homes can make concentration difficult.","These problems, however, are outweighed by substantial benefits. For employees, the elimination of the daily <b>commute</b> is transformative, especially in congested cities such as Dhaka, where it is not unusual to spend three hours a day <b>stuck in traffic</b>; that time can instead be devoted to rest, exercise or family. The <b>flexibility</b> of <b>remote work</b> also improves <b>work-life balance</b>, enabling parents to be present for their children and giving workers greater <b>autonomy</b> over how they organise their day. Employers benefit too: they can <b>reduce overheads</b> on expensive <b>office space</b> and recruit from a far wider <b>talent pool</b>, no longer limited to candidates who live within <b>commuting</b> distance. At a societal level, fewer journeys translate into lower <b>carbon emissions</b> and less congestion.","Crucially, most of the disadvantages can be mitigated through a <b>hybrid model</b>, in which in-person days are reserved for <b>collaboration</b>, training and team building, while focused individual work is done at home.","In conclusion, although <b>remote work</b> poses genuine challenges, particularly for teamwork and wellbeing, its advantages for employees, employers and the environment are, on balance, greater, especially when home and office working are thoughtfully combined."]}],"type":"Advantages and disadvantages","q":"Since the pandemic, many companies allow their employees to work from home. Do the advantages of this development outweigh the disadvantages?"},{"n":19,"title":"Job satisfaction or a high salary?","cat":"Work & Employment","groups":[{"name":"Reasons Supporting the First View","bn":"প্রথম মতের পক্ষে কারণ","items":[{"en":"People spend most of their waking hours at work, so enjoying their job affects their whole life.","bn":"মানুষ জেগে থাকার বেশিরভাগ সময় কাজে কাটায়, তাই কাজ উপভোগ করা পুরো জীবনকে প্রভাবিত করে।"},{"en":"Unhappy workers are more likely to suffer from stress and burnout.","bn":"অসন্তুষ্ট কর্মীরা মানসিক চাপ ও অবসাদে ভোগার সম্ভাবনা বেশি।"},{"en":"Satisfied employees are more motivated and productive, which often leads to promotion.","bn":"সন্তুষ্ট কর্মীরা বেশি অনুপ্রাণিত ও উৎপাদনশীল হন, যা প্রায়ই পদোন্নতির দিকে নিয়ে যায়।"},{"en":"Once basic needs are met, extra money adds little to happiness.","bn":"মৌলিক চাহিদা পূরণ হলে বাড়তি টাকা সুখে সামান্যই যোগ করে।"},{"en":"Meaningful work gives people a sense of purpose and pride.","bn":"অর্থবহ কাজ মানুষকে উদ্দেশ্যবোধ ও গর্ব দেয়।"}]},{"name":"Reasons Supporting the Second View","bn":"দ্বিতীয় মতের পক্ষে কারণ","items":[{"en":"A high salary provides financial security for the future.","bn":"উচ্চ বেতন ভবিষ্যতের জন্য আর্থিক নিরাপত্তা দেয়।"},{"en":"People who support families often cannot afford to choose a job just because they enjoy it.","bn":"যারা পরিবারের ভরণপোষণ করেন তারা প্রায়ই শুধু ভালো লাগে বলে চাকরি বেছে নিতে পারেন না।"},{"en":"The rising cost of living makes a good income essential.","bn":"জীবনযাত্রার ক্রমবর্ধমান ব্যয় ভালো আয়কে অপরিহার্য করে তোলে।"},{"en":"Money allows people to afford good housing, healthcare and education.","bn":"টাকা মানুষকে ভালো আবাসন, স্বাস্থ্যসেবা ও শিক্ষার খরচ বহন করতে দেয়।"},{"en":"A well-paid job can fund hobbies and interests outside work.","bn":"ভালো বেতনের চাকরি কাজের বাইরের শখ ও আগ্রহের খরচ জোগাতে পারে।"}]},{"name":"Evaluation: My Opinion","bn":"মূল্যায়ন — আমার মতামত","items":[{"en":"Although a good salary is important, I believe job satisfaction matters more in the long run.","bn":"যদিও ভালো বেতন গুরুত্বপূর্ণ, আমি বিশ্বাস করি দীর্ঘমেয়াদে কাজের তৃপ্তি বেশি গুরুত্বপূর্ণ।"},{"en":"In my opinion, salary should be the main priority at the start of a career, but job satisfaction becomes more important later.","bn":"আমার মতে, ক্যারিয়ারের শুরুতে বেতনই প্রধান অগ্রাধিকার হওয়া উচিত, তবে পরে কাজের সন্তুষ্টি বেশি গুরুত্বপূর্ণ হয়ে ওঠে।"}]}],"vocab":[["job satisfaction","কাজে তৃপ্তি"],["salary","বেতন"],["financial security","আর্থিক নিরাপত্তা"],["motivation","অনুপ্রেরণা"],["fulfilment","পরিতৃপ্তি"],["stress","মানসিক চাপ"],["burnout","মানসিক অবসাদ"],["cost of living","জীবনযাত্রার ব্যয়"],["dependants","নির্ভরশীল পরিবার-সদস্য"],["passion","প্রবল আগ্রহ"],["career","পেশাজীবন"],["productivity","উৎপাদনশীলতা"],["mental health","মানসিক স্বাস্থ্য"],["working environment","কর্মপরিবেশ"]],"phrases":[["make ends meet","কোনোমতে সংসার চালানো"],["support a family","পরিবারের ভরণপোষণ করা"],["money can't buy happiness","টাকা দিয়ে সুখ কেনা যায় না"],["dread going to work","কাজে যেতে ভয়/অনিচ্ছা লাগা"],["a sense of purpose","উদ্দেশ্যবোধ"],["once basic needs are met","মৌলিক চাহিদা পূরণ হলে"],["in the long run","দীর্ঘমেয়াদে"],["a luxury that not everyone can afford","এমন বিলাসিতা যা সবাই সামর্থ্য করতে পারে না"],["climb the career ladder","পেশায় ধাপে ধাপে ওপরে ওঠা"],["spend most of our waking hours at work","জেগে থাকার বেশিরভাগ সময় কাজে কাটানো"]],"sents":[{"en":"A high salary provides financial security and a comfortable lifestyle.","bn":"উচ্চ বেতন আর্থিক নিরাপত্তা ও আরামদায়ক জীবনযাপন দেয়।"},{"en":"With the rising cost of living, many people struggle to make ends meet.","bn":"জীবনযাত্রার ক্রমবর্ধমান ব্যয়ে অনেকে কোনোমতে সংসার চালাতে হিমশিম খান।"},{"en":"People who have to support a family often cannot choose a job just because they enjoy it.","bn":"যাদের পরিবারের ভরণপোষণ করতে হয় তারা প্রায়ই শুধু ভালো লাগে বলে চাকরি বেছে নিতে পারেন না।"},{"en":"We spend most of our waking hours at work, so enjoying our job is important.","bn":"আমরা জেগে থাকার বেশিরভাগ সময় কাজে কাটাই, তাই কাজ উপভোগ করা গুরুত্বপূর্ণ।"},{"en":"People who dread going to work often suffer from stress and burnout.","bn":"যারা কাজে যেতে অনিচ্ছুক থাকেন তারা প্রায়ই মানসিক চাপ ও অবসাদে ভোগেন।"},{"en":"Satisfied employees tend to be more motivated and productive.","bn":"সন্তুষ্ট কর্মীরা সাধারণত বেশি অনুপ্রাণিত ও উৎপাদনশীল হন।"},{"en":"As the saying goes, money can't buy happiness.","bn":"কথায় আছে, টাকা দিয়ে সুখ কেনা যায় না।"},{"en":"Once basic needs are met, extra money adds little to people's happiness.","bn":"মৌলিক চাহিদা পূরণ হলে বাড়তি টাকা মানুষের সুখে সামান্যই যোগ করে।"}],"xvocab":[["intrinsic motivation","অন্তর্নিহিত অনুপ্রেরণা"],["materialistic","বস্তুবাদী"],["diminishing returns","ক্রমহ্রাসমান প্রতিদান"],["meaningful work","অর্থবহ কাজ"],["disillusioned","মোহভঙ্গ হওয়া"],["well-being","সুস্থতা"],["job-hopping","ঘন ঘন চাকরি বদল"],["trade-off","বিনিময় / আপস"]],"xsents":[{"en":"Research suggests that money has diminishing returns on happiness.","bn":"গবেষণা বলে টাকার সুখের ওপর ক্রমহ্রাসমান প্রতিদান আছে।"},{"en":"Intrinsic motivation lasts longer than financial rewards.","bn":"অন্তর্নিহিত অনুপ্রেরণা আর্থিক পুরস্কারের চেয়ে দীর্ঘস্থায়ী।"},{"en":"Many well-paid professionals become disillusioned with their careers.","bn":"অনেক উচ্চ বেতনের পেশাজীবী তাদের পেশার প্রতি মোহভঙ্গ হন।"},{"en":"Choosing a career always involves a trade-off between money and meaning.","bn":"পেশা নির্বাচনে সবসময় অর্থ ও অর্থবহতার মধ্যে একটি আপস থাকে।"}],"essays":[{"label":"BASIC ESSAY (BAND 5–6)","words":263,"paras":["Some people think that enjoying a job is more important than a high <b>salary</b>, but others think that <b>salary</b> is the most important thing. <b>Although a good salary is important, I believe job satisfaction matters more in the long run.</b>","On the one hand, <b>salary</b> is very important. Everybody needs money to pay for food, rent, education and healthcare. In many countries, including Bangladesh, prices are increasing every year, so many people find it difficult to <b>make ends meet</b>. People who have to <b>support a family</b>, such as parents or children, often need to choose the job with the highest <b>salary</b>, even if they do not enjoy it. A good <b>salary</b> also gives people security for the future.","On the other hand, I think <b>job satisfaction</b> is more important. We spend most of our day at work, so if we hate our job, we will be unhappy for most of our life. People who do not like their job often feel <b>stressed</b> and tired, and this can cause health problems. In contrast, people who enjoy their job are more motivated and work harder. They feel that their work has a purpose. For example, many teachers and nurses do not earn a lot of money, but they feel happy because they help people. Also, a person who loves his job may become very good at it, and later he can earn more money.","In conclusion, a good <b>salary</b> is necessary, but money cannot buy happiness. I believe that <b>job satisfaction</b> is more important, because it makes people happier and healthier <b>in the long run</b>."]},{"label":"ADVANCED ESSAY (BAND 7)","words":269,"paras":["When choosing a <b>career</b>, some people prioritise enjoyment and personal <b>fulfilment</b>, whereas others consider <b>salary</b> to be the deciding factor. <b>Although a good salary is important, I believe job satisfaction matters more in the long run.</b>","Those who prioritise <b>salary</b> make a practical argument. A high <b>salary</b> provides <b>financial security</b>, allowing people to afford good housing, healthcare and education for their children. With the rising <b>cost of living</b>, many people struggle to <b>make ends meet</b>, and for someone who has to <b>support a family</b>, choosing a job simply because it is enjoyable may be <b>a luxury that not everyone can afford</b>. From this perspective, satisfaction is secondary to meeting one's responsibilities.","However, I find the argument for <b>job satisfaction</b> more persuasive. Firstly, we <b>spend most of our waking hours at work</b>, so a job we dislike can make our whole life miserable. People who <b>dread going to work</b> every day often suffer from <b>stress</b> and <b>burnout</b>, which can damage both their mental and physical health. Secondly, satisfied employees tend to be more motivated and productive, and as a result they are often more successful over time, which can lead to higher earnings anyway. Finally, research suggests that <b>once basic needs are met</b>, extra money adds relatively little to people's happiness, while <b>a sense of purpose</b>, supportive colleagues and a positive <b>working environment</b> make a much greater difference. As the saying goes, <b>money can't buy happiness</b>.","In conclusion, while an adequate <b>salary</b> is essential, I believe that <b>job satisfaction</b> is more important <b>in the long run</b>, because it has a greater impact on people's wellbeing and, ultimately, on their success."]},{"label":"BAND 9 ESSAY","words":331,"paras":["When deciding on a <b>career</b>, people tend to fall into two camps: those who seek <b>fulfilment</b> and enjoyment, and those for whom pay is paramount. Although a good <b>salary</b> is important, I believe <b>job satisfaction</b> matters more <b>in the long run</b>, once a reasonable standard of living has been secured.","The case for prioritising <b>salary</b> is grounded in economic reality. A generous income brings <b>financial security</b>, enabling people to afford decent housing, quality healthcare and education for their children, and to save for retirement. For millions of people, particularly in countries where the <b>cost of living</b> is rising faster than wages, the struggle to <b>make ends meet</b> leaves little room for idealism; someone who has to <b>support a family</b>, including elderly parents, may regard choosing a job for personal enjoyment as <b>a luxury that not everyone can afford</b>. It would be both unrealistic and somewhat privileged to dismiss this perspective.","Nevertheless, I am persuaded that, beyond a certain threshold, <b>job satisfaction</b> becomes the more important consideration. Since we <b>spend most of our waking hours at work</b>, a job that we find tedious or stressful inevitably affects our overall quality of life; those who <b>dread going to work</b> are more prone to <b>stress</b>, <b>burnout</b> and associated health problems. Moreover, research on wellbeing consistently indicates that money yields <b>diminishing returns</b>: <b>once basic needs are met</b>, additional income contributes relatively little to happiness, whereas <b>meaningful work</b>, autonomy and supportive colleagues have a lasting effect. There is also a practical dimension. <b>Intrinsic motivation</b> tends to be more durable than financial incentives, so people who find their work fulfilling are generally more committed and productive, which frequently results in promotion and higher earnings <b>in the long run</b>. By contrast, many highly paid professionals become <b>disillusioned</b> and eventually abandon lucrative <b>careers</b> in search of purpose.","In conclusion, a <b>salary</b> sufficient to provide security is undoubtedly essential. Beyond that point, however, I believe <b>job satisfaction</b> matters far more, both for individual wellbeing and, paradoxically, for long-term <b>career</b> success."]}],"type":"Discuss both views and give your opinion","q":"Some people think that job satisfaction is more important than a high salary when choosing a job. Others believe that salary is the most important factor. Discuss both views and give your own opinion."},{"n":20,"title":"A four-day working week","cat":"Work & Employment","groups":[{"name":"Reasons to Agree","bn":"একমত হওয়ার কারণ","items":[{"en":"An extra day off improves workers' mental and physical health.","bn":"একটি বাড়তি ছুটির দিন কর্মীদের মানসিক ও শারীরিক স্বাস্থ্য উন্নত করে।"},{"en":"Trials in several countries show that productivity stays the same or even rises.","bn":"কয়েকটি দেশের পরীক্ষামূলক প্রয়োগ দেখায় উৎপাদনশীলতা একই থাকে বা এমনকি বাড়ে।"},{"en":"Well-rested employees make fewer mistakes and take fewer sick days.","bn":"ভালোভাবে বিশ্রাম পাওয়া কর্মীরা কম ভুল করেন এবং অসুস্থতার ছুটি কম নেন।"},{"en":"A shorter week helps companies attract and keep talented staff.","bn":"ছোট কর্মসপ্তাহ কোম্পানিগুলোকে দক্ষ কর্মী আকর্ষণ ও ধরে রাখতে সাহায্য করে।"},{"en":"Parents can share childcare responsibilities more equally.","bn":"বাবা-মা শিশু দেখাশোনার দায়িত্ব আরও সমানভাবে ভাগ করতে পারেন।"}]},{"name":"Reasons to Disagree","bn":"দ্বিমত পোষণের কারণ","items":[{"en":"Hospitals, transport and emergency services must operate every day.","bn":"হাসপাতাল, পরিবহন ও জরুরি সেবা প্রতিদিন চালু রাখতে হয়।"},{"en":"Longer working days could increase tiredness and stress.","bn":"দীর্ঘ কর্মদিবস ক্লান্তি ও চাপ বাড়াতে পারে।"},{"en":"Small businesses may not be able to afford extra staff to cover the missing day.","bn":"ছোট ব্যবসা হারানো দিনটি সামলাতে বাড়তি কর্মীর খরচ বহন করতে না-ও পারে।"},{"en":"Customers may receive a slower service if offices close for an extra day.","bn":"অফিস একদিন বেশি বন্ধ থাকলে গ্রাহকরা ধীর সেবা পেতে পারেন।"},{"en":"In competitive industries, companies may lose business to rivals who work five days.","bn":"প্রতিযোগিতামূলক শিল্পে পাঁচ দিন কাজ করা প্রতিদ্বন্দ্বীদের কাছে কোম্পানিগুলো ব্যবসা হারাতে পারে।"}]},{"name":"Evaluation: My Answer","bn":"মূল্যায়ন — আমার উত্তর","items":[{"en":"I largely agree that a four-day working week would benefit both employees and employers, although it may not suit every industry.","bn":"আমি মূলত একমত যে চার দিনের কর্মসপ্তাহ কর্মী ও নিয়োগকর্তা উভয়ের উপকার করবে, যদিও এটি সব শিল্পের জন্য উপযুক্ত নাও হতে পারে।"},{"en":"I strongly agree with a four-day week, because it improves well-being without reducing productivity.","bn":"আমি চার দিনের কর্মসপ্তাহের সঙ্গে দৃঢ়ভাবে একমত, কারণ এটি উৎপাদনশীলতা না কমিয়েই মানুষের সুস্থতা বাড়ায়।"}]}],"vocab":[["working week","কর্মসপ্তাহ"],["productivity","উৎপাদনশীলতা"],["well-being","সুস্থতা"],["employers","নিয়োগকর্তা"],["employees","কর্মী"],["trial","পরীক্ষামূলক প্রয়োগ"],["absenteeism","অনুপস্থিতি"],["motivation","অনুপ্রেরণা"],["fatigue","ক্লান্তি"],["shift","পালা (কাজের)"],["staffing","কর্মী নিয়োগ / জনবল"],["customer service","গ্রাহকসেবা"],["leisure time","অবসর সময়"],["efficient","দক্ষ"]],"phrases":[["a better work-life balance","কর্ম-জীবনের ভালো ভারসাম্য"],["recharge their batteries","নতুন করে শক্তি সঞ্চয় করা"],["get more done in less time","কম সময়ে বেশি কাজ করা"],["attract and keep talented staff","দক্ষ কর্মী আকর্ষণ ও ধরে রাখা"],["cut down on","কমানো"],["not a one-size-fits-all solution","সবার জন্য একই সমাধান নয়"],["round-the-clock services","চব্বিশ ঘণ্টার সেবা"],["long hours do not mean","দীর্ঘ সময় মানেই নয়"],["take time off sick","অসুস্থতার জন্য ছুটি নেওয়া"],["pay off","সফল হওয়া / লাভজনক হওয়া"]],"sents":[{"en":"A four-day week gives employees a better work-life balance.","bn":"চার দিনের সপ্তাহ কর্মীদের কর্ম-জীবনের ভালো ভারসাম্য দেয়।"},{"en":"An extra day off allows workers to recharge their batteries.","bn":"একটি বাড়তি ছুটির দিন কর্মীদের নতুন করে শক্তি সঞ্চয় করতে দেয়।"},{"en":"Trials in several countries have shown that productivity often stays the same or even rises.","bn":"কয়েকটি দেশের পরীক্ষামূলক প্রয়োগে দেখা গেছে উৎপাদনশীলতা প্রায়ই একই থাকে বা এমনকি বাড়ে।"},{"en":"Well-rested workers get more done in less time.","bn":"ভালোভাবে বিশ্রাম পাওয়া কর্মীরা কম সময়ে বেশি কাজ করেন।"},{"en":"Companies offering a shorter week can attract and keep talented staff.","bn":"ছোট কর্মসপ্তাহ দেওয়া কোম্পানিগুলো দক্ষ কর্মী আকর্ষণ ও ধরে রাখতে পারে।"},{"en":"However, hospitals and public transport need round-the-clock services.","bn":"তবে হাসপাতাল ও গণপরিবহনের চব্বিশ ঘণ্টার সেবা প্রয়োজন।"},{"en":"Working ten-hour days could increase fatigue and stress.","bn":"দিনে দশ ঘণ্টা কাজ ক্লান্তি ও চাপ বাড়াতে পারে।"},{"en":"A four-day week is not a one-size-fits-all solution.","bn":"চার দিনের সপ্তাহ সবার জন্য একই সমাধান নয়।"}],"xvocab":[["presenteeism","উপস্থিত থাকলেও কার্যকরভাবে কাজ না করা"],["output","উৎপাদন / ফলাফল"],["pilot scheme","পরীক্ষামূলক প্রকল্প"],["rota","কাজের পালাক্রম তালিকা"],["morale","মনোবল"],["overheads","পরিচালন ব্যয়"],["gender equality","লিঙ্গ সমতা"],["caring responsibilities","পরিচর্যার দায়িত্ব"]],"xsents":[{"en":"Many hours in the office are lost to presenteeism and unnecessary meetings.","bn":"অফিসের অনেক ঘণ্টা শুধু উপস্থিত থাকা ও অপ্রয়োজনীয় সভায় নষ্ট হয়।"},{"en":"A large pilot scheme in the UK reported higher morale and lower absenteeism.","bn":"যুক্তরাজ্যের একটি বড় পরীক্ষামূলক প্রকল্পে উচ্চ মনোবল ও কম অনুপস্থিতির কথা জানা গেছে।"},{"en":"Hospitals could use a rota so that staff work four days but services run all week.","bn":"হাসপাতাল পালাক্রম তালিকা ব্যবহার করতে পারে যাতে কর্মীরা চার দিন কাজ করেন কিন্তু সেবা সারা সপ্তাহ চলে।"},{"en":"An extra day helps parents share caring responsibilities more equally.","bn":"একটি বাড়তি দিন বাবা-মাকে পরিচর্যার দায়িত্ব আরও সমানভাবে ভাগ করতে সাহায্য করে।"}],"essays":[{"label":"BASIC ESSAY (BAND 5–6)","words":265,"paras":["Some people think that people should work only four days a week instead of five. <b>I largely agree that a four-day working week would benefit both employees and employers, although it may not suit every industry.</b>","The first reason is that workers will be happier and healthier. Many people work very hard and feel tired and stressed. If they have three days off every week, they can rest, spend time with their family and do hobbies. This is good for their mental and physical health. When workers are happy, they are less likely to be sick or leave their jobs.","The second reason is that people can work better when they are not tired. Working for many hours does not mean doing more work. Many workers waste time in long meetings or on their phones. Some companies in countries like the UK tried a four-day week, and they found that workers did the same amount of work in four days. Also, companies can use less electricity and office space, so they save money. A four-day week can also help companies to find and keep good workers.","However, a four-day week is not possible for every job. Hospitals, police and buses must work every day. For these jobs, workers can work four days in turns, so the service continues all week. Also, some small businesses may not be able to afford it.","In conclusion, I mostly agree with a four-day <b>working week</b>. It makes workers healthier and happier, and it does not reduce the amount of work they do, although some jobs need a different plan."]},{"label":"ADVANCED ESSAY (BAND 7)","words":268,"paras":["It has been proposed that the standard <b>working week</b> should be cut to four days, without a significant reduction in total <b>output</b>. <b>I largely agree that a four-day working week would benefit both employees and employers, although it may not suit every industry.</b>","The main advantage is improved <b>well-being</b>. A four-day week gives <b>employees</b> <b>a better work-life balance</b>, and an extra day off allows workers to <b>recharge their batteries</b>, spend time with their families and deal with personal tasks without taking leave. This reduces stress and burnout, which in turn lowers <b>absenteeism</b>. It could also promote <b>gender equality</b>, as parents would find it easier to share <b>caring responsibilities</b>.","Moreover, a shorter week need not harm <b>productivity</b>. <b>Long hours do not mean</b> high <b>output</b>; much time in the office is wasted in unnecessary meetings or simply being present without working efficiently. <b>Trials</b> in several countries, including a large <b>pilot scheme</b> in the UK, have shown that <b>productivity</b> often stays the same or even rises, because well-rested workers <b>get more done in less time</b>. Companies offering a shorter week can also <b>attract and keep talented staff</b>, and they may reduce <b>overheads</b> such as electricity.","Nevertheless, a four-day week is <b>not a one-size-fits-all solution</b>. Hospitals, public transport and emergency services require <b>round-the-clock services</b>, so they would need a <b>rota</b> system in which staff work four days while services continue all week. Small businesses with few <b>employees</b> may also struggle to cover <b>customer service</b>.","In conclusion, I believe a four-day week would benefit most workers and businesses, but it should be introduced flexibly, with arrangements adapted to the needs of different industries."]},{"label":"BAND 9 ESSAY","words":341,"paras":["The idea of reducing the conventional five-day <b>working week</b> to four days has gained considerable momentum in recent years, supported by a growing body of <b>trial</b> evidence. I largely agree that a four-day <b>working week</b> would benefit both <b>employees</b> and <b>employers</b>, although it may not suit every industry and would need to be implemented flexibly.","The most compelling argument concerns <b>well-being</b>. In many economies, long working hours have contributed to rising levels of stress, <b>fatigue</b> and burnout, with significant costs for both individuals and health systems. A four-day week offers <b>employees</b> <b>a better work-life balance</b>: a third day of rest allows people to <b>recharge their batteries</b>, pursue leisure activities and attend to family matters without sacrificing annual leave. It could also advance <b>gender equality</b>, since parents would be better able to share <b>caring responsibilities</b> that still fall disproportionately on women.","Crucially, these gains need not come at the expense of <b>productivity</b>. The assumption that long hours equal high <b>output</b> is increasingly discredited; a great deal of office time is lost to <b>presenteeism</b>, unproductive meetings and digital distractions. Pilot schemes in countries such as the United Kingdom and Iceland found that <b>output</b> was maintained, and in many cases improved, while <b>absenteeism</b> fell and <b>morale</b> rose, suggesting that well-rested staff simply <b>get more done in less time</b>. <b>Employers</b> also stand to benefit in the competition for talent, as a shorter week is a powerful incentive to <b>attract and keep talented staff</b>, and some may reduce <b>overheads</b> such as energy costs.","That said, a four-day week is clearly <b>not a one-size-fits-all solution</b>. Sectors such as healthcare, transport and emergency services must provide <b>round-the-clock services</b>, and here the reform would have to take the form of staggered <b>rotas</b> rather than closures. Small firms with few <b>employees</b> may also find the transition financially difficult without government support.","In conclusion, the evidence suggests that a four-day week can improve <b>employees</b>' lives without harming, and often while enhancing, <b>productivity</b>. Provided it is introduced flexibly, with arrangements adapted to each sector, I believe it would be a worthwhile reform."]}],"type":"Opinion (Agree / Disagree)","q":"Some people believe that the working week should be reduced to four days, with employees working the same number of hours or slightly fewer. To what extent do you agree or disagree?"},{"n":21,"title":"Youth unemployment","cat":"Work & Employment","groups":[{"name":"Causes","bn":"কারণ","items":[{"en":"Many graduates lack the practical skills that employers need.","bn":"অনেক স্নাতকের নিয়োগকর্তাদের প্রয়োজনীয় ব্যবহারিক দক্ষতার অভাব আছে।"},{"en":"University courses often focus on theory rather than job-related skills.","bn":"বিশ্ববিদ্যালয়ের কোর্স প্রায়ই চাকরিসংশ্লিষ্ট দক্ষতার বদলে তত্ত্বে জোর দেয়।"},{"en":"Employers demand experience that young people have no chance to gain.","bn":"নিয়োগকর্তারা এমন অভিজ্ঞতা চান যা অর্জনের সুযোগ তরুণদের নেই।"},{"en":"The number of graduates is growing faster than the number of jobs.","bn":"চাকরির সংখ্যার চেয়ে স্নাতকের সংখ্যা দ্রুত বাড়ছে।"},{"en":"Vocational training is undervalued, so few young people train for technical jobs.","bn":"বৃত্তিমূলক প্রশিক্ষণকে অবমূল্যায়ন করা হয়, তাই কম তরুণ কারিগরি চাকরির প্রশিক্ষণ নেয়।"}]},{"name":"Solutions","bn":"সমাধান","items":[{"en":"Universities should work with employers to teach the skills the job market needs.","bn":"বিশ্ববিদ্যালয়ের উচিত নিয়োগকর্তাদের সঙ্গে কাজ করে চাকরির বাজারের প্রয়োজনীয় দক্ষতা শেখানো।"},{"en":"Internships should be a standard part of every degree.","bn":"ইন্টার্নশিপ প্রতিটি ডিগ্রির নিয়মিত অংশ হওয়া উচিত।"},{"en":"Governments should invest in vocational and technical education.","bn":"সরকারের উচিত বৃত্তিমূলক ও কারিগরি শিক্ষায় বিনিয়োগ করা।"},{"en":"Low-interest loans and training can help young people start their own businesses.","bn":"কম সুদের ঋণ ও প্রশিক্ষণ তরুণদের নিজের ব্যবসা শুরু করতে সাহায্য করতে পারে।"},{"en":"Digital skills training can open freelancing opportunities online.","bn":"ডিজিটাল দক্ষতার প্রশিক্ষণ অনলাইনে ফ্রিল্যান্সিংয়ের সুযোগ খুলে দিতে পারে।"}]},{"name":"Overall Answer","bn":"সার্বিক উত্তর","items":[{"en":"Youth unemployment is mainly caused by a mismatch between education and the needs of employers, and it can be reduced through practical training and better links between universities and industry.","bn":"যুব বেকারত্বের প্রধান কারণ শিক্ষা ও নিয়োগকর্তাদের চাহিদার মধ্যে অসামঞ্জস্য, এবং ব্যবহারিক প্রশিক্ষণ ও বিশ্ববিদ্যালয়-শিল্পের মধ্যে ভালো সংযোগের মাধ্যমে এটি কমানো যায়।"},{"en":"The main causes are a lack of work experience and too few jobs, and the best solutions are internships, vocational training and support for new businesses.","bn":"প্রধান কারণ হলো কাজের অভিজ্ঞতার অভাব ও চাকরির স্বল্পতা, এবং সেরা সমাধান হলো ইন্টার্নশিপ, বৃত্তিমূলক প্রশিক্ষণ ও নতুন ব্যবসার জন্য সহায়তা।"}]}],"vocab":[["youth unemployment","যুব বেকারত্ব"],["graduates","স্নাতক"],["skills gap","দক্ষতার ঘাটতি"],["job market","চাকরির বাজার"],["work experience","কাজের অভিজ্ঞতা"],["internship","ইন্টার্নশিপ"],["vocational training","বৃত্তিমূলক প্রশিক্ষণ"],["entrepreneurship","উদ্যোক্তা হওয়া"],["employers","নিয়োগকর্তা"],["curriculum","পাঠ্যক্রম"],["technical skills","কারিগরি দক্ষতা"],["start-up","নতুন ব্যবসা"],["loans","ঋণ"],["career guidance","পেশাগত নির্দেশনা"]],"phrases":[["do not match the needs of employers","নিয়োগকর্তাদের চাহিদার সঙ্গে মেলে না"],["a vicious circle","দুষ্টচক্র"],["too many graduates chasing too few jobs","অল্প চাকরির পেছনে অতিরিক্ত স্নাতক"],["lack practical skills","ব্যবহারিক দক্ষতার অভাব থাকা"],["gain hands-on experience","হাতে-কলমে অভিজ্ঞতা অর্জন করা"],["set up their own businesses","নিজের ব্যবসা শুরু করা"],["close the skills gap","দক্ষতার ঘাটতি পূরণ করা"],["work closely with","... এর সঙ্গে ঘনিষ্ঠভাবে কাজ করা"],["create more jobs","আরও চাকরি সৃষ্টি করা"],["look down on","তুচ্ছ চোখে দেখা"]],"sents":[{"en":"Many graduates have skills that do not match the needs of employers.","bn":"অনেক স্নাতকের দক্ষতা নিয়োগকর্তাদের চাহিদার সঙ্গে মেলে না।"},{"en":"Universities often focus on theory, so students lack practical skills.","bn":"বিশ্ববিদ্যালয় প্রায়ই তত্ত্বে জোর দেয়, তাই শিক্ষার্থীদের ব্যবহারিক দক্ষতার অভাব থাকে।"},{"en":"Employers want experience, but young people cannot get experience without a job, which is a vicious circle.","bn":"নিয়োগকর্তারা অভিজ্ঞতা চান, কিন্তু চাকরি ছাড়া তরুণরা অভিজ্ঞতা পায় না, যা একটি দুষ্টচক্র।"},{"en":"In some countries, there are too many graduates chasing too few jobs.","bn":"কিছু দেশে অল্প চাকরির পেছনে অতিরিক্ত স্নাতক ছুটছে।"},{"en":"Many families look down on vocational training and technical jobs.","bn":"অনেক পরিবার বৃত্তিমূলক প্রশিক্ষণ ও কারিগরি চাকরিকে তুচ্ছ চোখে দেখে।"},{"en":"Internships allow students to gain hands-on experience before they graduate.","bn":"ইন্টার্নশিপ শিক্ষার্থীদের স্নাতক হওয়ার আগে হাতে-কলমে অভিজ্ঞতা অর্জনের সুযোগ দেয়।"},{"en":"Universities should work closely with industry to close the skills gap.","bn":"দক্ষতার ঘাটতি পূরণে বিশ্ববিদ্যালয়ের উচিত শিল্পখাতের সঙ্গে ঘনিষ্ঠভাবে কাজ করা।"},{"en":"Governments can offer low-interest loans to help young people set up their own businesses.","bn":"সরকার তরুণদের নিজের ব্যবসা শুরু করতে কম সুদে ঋণ দিতে পারে।"}],"xvocab":[["mismatch","অসামঞ্জস্য"],["underemployment","যোগ্যতার চেয়ে নিম্নমানের কাজ"],["government jobs","সরকারি চাকরি"],["apprenticeship","শিক্ষানবিশি"],["freelancing","ফ্রিল্যান্সিং"],["brain drain","মেধা পাচার"],["social unrest","সামাজিক অস্থিরতা"],["employability","চাকরির উপযোগিতা"]],"xsents":[{"en":"In Bangladesh, many graduates spend years preparing for competitive government jobs.","bn":"বাংলাদেশে অনেক স্নাতক প্রতিযোগিতামূলক সরকারি চাকরির প্রস্তুতিতে বছরের পর বছর কাটান।"},{"en":"Underemployment is almost as serious a problem as unemployment.","bn":"যোগ্যতার চেয়ে নিম্নমানের কাজ প্রায় বেকারত্বের মতোই গুরুতর সমস্যা।"},{"en":"Germany's apprenticeship system keeps youth unemployment low.","bn":"জার্মানির শিক্ষানবিশি ব্যবস্থা যুব বেকারত্ব কম রাখে।"},{"en":"Freelancing has given many young Bangladeshis a new source of income.","bn":"ফ্রিল্যান্সিং অনেক তরুণ বাংলাদেশিকে আয়ের নতুন উৎস দিয়েছে।"}],"essays":[{"label":"BASIC ESSAY (BAND 5–6)","words":253,"paras":["In many countries, many young people cannot find a job after they finish school or university. <b>Youth unemployment is mainly caused by a mismatch between education and the needs of employers, and it can be reduced through practical training and better links between universities and industry.</b>","There are several causes of this problem. Firstly, what students learn at university is often different from what companies need. Many universities teach mostly theory, so students do not have practical skills. Secondly, companies want workers with experience, but young people cannot get experience if nobody gives them a job. Thirdly, in some countries, like Bangladesh, there are too many <b>graduates</b> and not enough jobs. Many young people also only want <b>government jobs</b> or office jobs, and they do not want to do technical work.","There are some solutions to this problem. Firstly, universities should work with companies and teach the skills that companies need, such as computer skills and communication. Secondly, students should do <b>internships</b> while they are studying, so they get <b>work experience</b> before they finish. Thirdly, the government should give more support to technical and <b>vocational training</b>, because countries need electricians, mechanics and technicians. Finally, the government can give young people <b>loans</b> to start their own businesses. Online <b>freelancing</b> is also a good option for many young people today.","In conclusion, young people cannot find jobs because their education does not match the <b>job market</b> and they do not have experience. If universities, companies and the government work together, this problem can be reduced."]},{"label":"ADVANCED ESSAY (BAND 7)","words":274,"paras":["In many parts of the world, large numbers of young people remain jobless long after completing their education. <b>Youth unemployment is mainly caused by a mismatch between education and the needs of employers, and it can be reduced through practical training and better links between universities and industry.</b>","The most important cause is the <b>skills gap</b>. Many <b>graduates</b> have qualifications that <b>do not match the needs of employers</b>, because universities often focus on theory and students <b>lack practical skills</b> such as problem-solving, teamwork and technical know-how. A second cause is a lack of <b>work experience</b>: <b>employers</b> prefer experienced candidates, but young people cannot gain experience without a job, which creates <b>a vicious circle</b>. In addition, in countries such as Bangladesh, there are simply <b>too many graduates chasing too few jobs</b>, while many families <b>look down on</b> <b>vocational training</b>, so few young people train for technical careers where workers are actually needed.","Several measures could address these problems. First, universities should <b>work closely with</b> industry to update their curricula and teach the skills <b>employers</b> value, including digital skills. Second, <b>internships</b> and <b>apprenticeships</b> should become a standard part of education, allowing students to <b>gain hands-on experience</b> before they graduate; Germany's <b>apprenticeship</b> system, which keeps <b>youth unemployment</b> low, is a good model. Third, governments should improve the status of <b>vocational training</b> through better funding and public campaigns. Finally, encouraging <b>entrepreneurship</b> through low-interest <b>loans</b> and training would help young people <b>set up their own businesses</b> and create jobs for others.","In conclusion, <b>youth unemployment</b> stems largely from a gap between education and the labour market. Closer cooperation between education, industry and government is the key to solving it."]},{"label":"BAND 9 ESSAY","words":345,"paras":["High levels of unemployment among young people, even those with degrees, have become a serious concern in many countries, carrying risks of wasted talent, <b>brain drain</b> and <b>social unrest</b>. <b>Youth unemployment is mainly caused by a mismatch between education and the needs of employers, and it can be reduced through practical training and better links between universities and industry.</b>","The primary cause is a persistent <b>skills gap</b>. Education systems in many countries remain heavily theoretical, producing <b>graduates</b> who can pass examinations but <b>lack practical skills</b> such as problem-solving, communication and technical competence. Consequently, many <b>graduates</b> find that their qualifications <b>do not match the needs of employers</b> in a rapidly changing economy. This is compounded by <b>a vicious circle</b> in which <b>employers</b> demand experience that young people cannot acquire without first being hired. Structural and cultural factors also play a role. In Bangladesh, for instance, the expansion of higher education has resulted in <b>too many graduates chasing too few jobs</b>, many of them spending years preparing for a small number of competitive <b>government jobs</b>, while <b>vocational training</b> is widely <b>looked down on</b> despite shortages of skilled technicians. The result is not only unemployment but widespread <b>underemployment</b>.","Tackling this problem requires coordinated action. Universities should <b>work closely with</b> industry to redesign curricula around the competencies <b>employers</b> actually need, particularly digital and <b>technical skills</b>. Work-based learning should become the norm rather than the exception: <b>internships</b> and <b>apprenticeships</b> enable students to <b>gain hands-on experience</b> before they graduate, and Germany's dual education system demonstrates how effectively such schemes can keep <b>youth unemployment</b> low. Governments, for their part, should raise the status of vocational education through investment and public campaigns, and promote <b>entrepreneurship</b> by providing low-interest <b>loans</b>, mentoring and simpler regulations for start-ups. The rapid growth of <b>freelancing</b> in Bangladesh shows that, with the right skills, young people can create their own opportunities.","In conclusion, <b>youth unemployment</b> is largely the product of a disconnect between education and the labour market. Bridging that gap through closer cooperation between educators, <b>employers</b> and governments offers the most promising route to improving young people's <b>employability</b>."]}],"type":"Causes and solutions","q":"In many countries, a large number of young people are unable to find jobs after finishing their education. What are the causes of this problem, and what can be done to solve it?"},{"n":22,"title":"Caring for elderly parents","cat":"Society & Family","groups":[{"name":"Reasons Supporting the First View","bn":"প্রথম মতের পক্ষে কারণ","items":[{"en":"Elderly people are usually happier living with their loved ones in a familiar home.","bn":"বয়স্করা সাধারণত পরিচিত বাড়িতে প্রিয়জনদের সঙ্গে বেশি সুখী থাকেন।"},{"en":"Caring for parents is a way of repaying them for raising us.","bn":"বাবা-মায়ের সেবা করা আমাদের লালনপালনের ঋণ শোধ করার একটি উপায়।"},{"en":"Family care strengthens bonds between generations.","bn":"পারিবারিক সেবা প্রজন্মের মধ্যকার বন্ধন শক্তিশালী করে।"},{"en":"Grandparents at home can help raise children and pass on traditions.","bn":"বাড়িতে থাকা দাদা-দাদি শিশু লালনে সাহায্য করতে ও ঐতিহ্য শেখাতে পারেন।"},{"en":"Many residents of care homes feel lonely and abandoned.","bn":"বয়স্ক সেবাকেন্দ্রের অনেক বাসিন্দা একাকী ও পরিত্যক্ত বোধ করেন।"}]},{"name":"Reasons Supporting the Second View","bn":"দ্বিতীয় মতের পক্ষে কারণ","items":[{"en":"Care homes provide round-the-clock professional medical care.","bn":"বয়স্ক সেবাকেন্দ্র চব্বিশ ঘণ্টা পেশাদার চিকিৎসাসেবা দেয়।"},{"en":"Patients with serious conditions such as dementia need trained nurses.","bn":"স্মৃতিভ্রংশের মতো গুরুতর রোগীদের প্রশিক্ষিত সেবিকা প্রয়োজন।"},{"en":"In many families, both adults work full-time and cannot provide constant care.","bn":"অনেক পরিবারে দুজন প্রাপ্তবয়স্কই পূর্ণকালীন কাজ করেন এবং অবিরাম সেবা দিতে পারেন না।"},{"en":"Caring for a sick parent can cause stress and financial hardship for families.","bn":"অসুস্থ বাবা-মায়ের সেবা পরিবারের জন্য চাপ ও আর্থিক কষ্টের কারণ হতে পারে।"},{"en":"Care homes offer companionship and activities with people of the same age.","bn":"সেবাকেন্দ্র সমবয়সীদের সঙ্গে সঙ্গ ও নানা কার্যক্রমের সুযোগ দেয়।"}]},{"name":"Evaluation: My Opinion","bn":"মূল্যায়ন — আমার মতামত","items":[{"en":"Although care homes offer professional support, I believe elderly parents are generally better cared for by their own families at home.","bn":"যদিও বয়স্ক সেবাকেন্দ্র পেশাদার সহায়তা দেয়, আমি বিশ্বাস করি বয়স্ক বাবা-মা সাধারণত নিজের পরিবারের কাছে বাড়িতেই ভালো সেবা পান।"},{"en":"In my opinion, the best choice depends on the health of the elderly person and the situation of the family.","bn":"আমার মতে, সেরা সিদ্ধান্ত নির্ভর করে বয়স্ক মানুষটির স্বাস্থ্য ও পরিবারের পরিস্থিতির ওপর।"}]}],"vocab":[["elderly","বয়স্ক"],["care home","বয়স্ক সেবাকেন্দ্র"],["professional care","পেশাদার সেবা"],["nurses","সেবিকা"],["dementia","স্মৃতিভ্রংশ রোগ"],["loneliness","একাকীত্ব"],["duty","কর্তব্য"],["emotional support","মানসিক সহায়তা"],["nuclear family","একক পরিবার"],["joint family","যৌথ পরিবার"],["burden","বোঝা"],["medical needs","চিকিৎসা চাহিদা"],["companionship","সঙ্গ"],["dignity","মর্যাদা"]],"phrases":[["take care of","দেখাশোনা করা"],["repay their parents","বাবা-মায়ের ঋণ শোধ করা"],["surrounded by loved ones","প্রিয়জনদের মাঝে থাকা"],["round-the-clock care","চব্বিশ ঘণ্টার সেবা"],["both partners work full-time","স্বামী-স্ত্রী দুজনেই পূর্ণকালীন কাজ করেন"],["feel abandoned","পরিত্যক্ত বোধ করা"],["specialist medical care","বিশেষায়িত চিকিৎসাসেবা"],["a sense of belonging","আপনত্বের অনুভূতি"],["put a strain on","... এর ওপর চাপ সৃষ্টি করা"],["in their own home","নিজের বাড়িতে"]],"sents":[{"en":"In many Asian cultures, children are expected to take care of their parents in old age.","bn":"অনেক এশীয় সংস্কৃতিতে সন্তানদের বৃদ্ধ বয়সে বাবা-মায়ের দেখাশোনা করার কথা।"},{"en":"Caring for parents is a way to repay them for raising us.","bn":"বাবা-মায়ের সেবা করা আমাদের লালনপালনের ঋণ শোধ করার একটি উপায়।"},{"en":"Elderly people are usually happier surrounded by loved ones.","bn":"বয়স্করা সাধারণত প্রিয়জনদের মাঝে বেশি সুখী থাকেন।"},{"en":"Some elderly people in care homes feel lonely and abandoned.","bn":"সেবাকেন্দ্রে থাকা কিছু বয়স্ক মানুষ একাকী ও পরিত্যক্ত বোধ করেন।"},{"en":"However, patients with dementia may need round-the-clock care from trained nurses.","bn":"তবে স্মৃতিভ্রংশ রোগীদের প্রশিক্ষিত সেবিকাদের চব্বিশ ঘণ্টার সেবা প্রয়োজন হতে পারে।"},{"en":"In many modern families, both partners work full-time.","bn":"অনেক আধুনিক পরিবারে স্বামী-স্ত্রী দুজনেই পূর্ণকালীন কাজ করেন।"},{"en":"Caring for a sick parent can put a strain on a family's health and finances.","bn":"অসুস্থ বাবা-মায়ের সেবা পরিবারের স্বাস্থ্য ও অর্থের ওপর চাপ সৃষ্টি করতে পারে।"},{"en":"Care homes also give elderly people companionship with people of their own age.","bn":"সেবাকেন্দ্র বয়স্কদের সমবয়সীদের সঙ্গও দেয়।"}],"xvocab":[["filial duty","সন্তানের কর্তব্য"],["caregiver","সেবাদানকারী"],["exhaustion","অবসন্নতা"],["home nursing","বাড়িতে নার্সিং সেবা"],["day-care centre","দিবাযত্ন কেন্দ্র"],["stigma","কলঙ্ক / সামাজিক লজ্জা"],["well-trained staff","সুপ্রশিক্ষিত কর্মী"],["independence","স্বাধীনতা"]],"xsents":[{"en":"In Bangladesh, sending parents to a care home still carries a social stigma.","bn":"বাংলাদেশে বাবা-মাকে সেবাকেন্দ্রে পাঠানোকে এখনো সামাজিক লজ্জার বিষয় মনে করা হয়।"},{"en":"Family caregivers often suffer from exhaustion.","bn":"পারিবারিক সেবাদানকারীরা প্রায়ই অবসন্নতায় ভোগেন।"},{"en":"Home nursing services can help families care for parents at home.","bn":"বাড়িতে নার্সিং সেবা পরিবারকে বাড়িতেই বাবা-মায়ের সেবা করতে সাহায্য করতে পারে।"},{"en":"Day-care centres allow elderly people to socialise while their children work.","bn":"দিবাযত্ন কেন্দ্র সন্তানরা কাজে থাকার সময় বয়স্কদের মেলামেশার সুযোগ দেয়।"}],"essays":[{"label":"BASIC ESSAY (BAND 5–6)","words":271,"paras":["Some people think that adult children should look after their old parents at home, but others think that care homes are better. <b>Although care homes offer professional support, I believe elderly parents are generally better cared for by their own families at home.</b>","On the one hand, care homes have some advantages. They have trained <b>nurses</b> and doctors who can look after old people all day and night. This is important for old people who are very sick, for example people with <b>dementia</b>. Also, in many families today, both the husband and wife work full-time, so they do not have time to care for their parents. In care homes, old people can also make friends with people of the same age.","On the other hand, I believe that living with family is better. Firstly, old people feel happier when they live with their children and grandchildren. They feel loved and they are not lonely. Many old people in care homes feel sad because their family does not visit them often. Secondly, our parents looked after us when we were young, so it is our <b>duty</b> to look after them when they are old. In Bangladesh, this is an important part of our culture. Thirdly, grandparents can help the family, for example by telling stories to the children and teaching them good values.","However, if the parents are very sick, families can get help from <b>nurses</b> who come to the house.","In conclusion, care homes can be useful for very sick old people, but I believe most <b>elderly</b> parents should live with their families, because they will be happier and feel loved."]},{"label":"ADVANCED ESSAY (BAND 7)","words":269,"paras":["There is disagreement about whether <b>elderly</b> people should be looked after by their adult children at home or placed in professionally run care homes. <b>Although care homes offer professional support, I believe elderly parents are generally better cared for by their own families at home.</b>","Those who prefer care homes point to the quality of <b>professional care</b>. <b>Elderly</b> people with serious conditions such as <b>dementia</b> may need <b>round-the-clock care</b> from trained <b>nurses</b>, which ordinary families cannot provide. Moreover, in many modern families <b>both partners work full-time</b>, and caring for a sick parent can <b>put a strain on</b> a family's health and finances. Care homes also offer <b>companionship</b> with people of the same age and organised activities, which can reduce isolation for those whose children live far away.","However, I believe family care is usually the better option. Firstly, <b>elderly</b> people are generally happier <b>surrounded by loved ones</b> in a familiar environment, whereas some residents of care homes feel lonely and abandoned, especially if relatives rarely visit. Secondly, in many cultures, including our own, caring for parents is seen as a way to repay them for raising us, and it strengthens family bonds. Thirdly, grandparents living at home make a valuable contribution to family life, passing on traditions and helping to raise grandchildren.","That said, families do not have to choose between love and professional help. <b>Home nursing</b> services and day-care centres can support families caring for parents with complex needs.","In conclusion, while care homes may be necessary in some cases, I believe <b>elderly</b> parents are generally better off living with their families, ideally with professional support when needed."]},{"label":"BAND 9 ESSAY","words":353,"paras":["Societies are increasingly divided over how best to care for the <b>elderly</b>: some maintain that adult children have a responsibility to look after their parents at home, while others argue that <b>professional care</b> homes offer a superior alternative. Although care homes offer professional support, I believe <b>elderly</b> parents are generally better cared for by their own families at home, ideally with professional assistance.","The case for residential care is not without merit. As life expectancy rises, more <b>elderly</b> people live with complex conditions such as <b>dementia</b> or severe mobility problems, which may require <b>round-the-clock care</b> from <b>well-trained staff</b> that even the most devoted family cannot realistically provide. Social change has added to the pressure: with the decline of the <b>joint family</b> and the rise of households in which <b>both partners work full-time</b>, the <b>burden</b> of caregiving can lead to <b>exhaustion</b>, strained relationships and financial hardship. Care homes may also offer <b>companionship</b>, medical supervision and structured activities, which can be preferable to spending long days alone in an empty flat.","Nevertheless, I believe that, in most circumstances, family care remains preferable. Emotional wellbeing is central to quality of life in old age, and <b>elderly</b> people are generally happier and more secure <b>surrounded by loved ones</b> in a familiar home than in an institutional setting, where many residents report feeling lonely or even abandoned. There is also a moral dimension: in many cultures, including that of Bangladesh, caring for ageing parents is regarded as a <b>filial duty</b> and a means of repaying the sacrifices they made in raising their children. Moreover, the benefits flow in both directions, since grandparents living at home frequently help with childcare and pass on language, values and family history to younger generations.","Importantly, the choice need not be binary. <b>Home nursing</b> services and day-care centres can enable families to meet complex <b>medical needs</b> while preserving the <b>dignity</b> and belonging that home provides.","In conclusion, care homes have a role for those with the most severe needs, but for most <b>elderly</b> people, being cared for by family, supported where necessary by professionals, offers the best combination of love, <b>dignity</b> and security."]}],"type":"Discuss both views and give your opinion","q":"Some people believe that adult children should take care of their elderly parents at home, while others think it is better for elderly people to live in care homes run by professionals. Discuss both views and give your own opinion."},{"n":23,"title":"Moving from the countryside to cities","cat":"Society & Family","groups":[{"name":"Problems","bn":"সমস্যা","items":[{"en":"Cities become overcrowded, and housing becomes scarce and expensive.","bn":"শহর অতিরিক্ত জনবহুল হয়ে পড়ে, এবং আবাসন দুর্লভ ও ব্যয়বহুল হয়ে ওঠে।"},{"en":"Many migrants end up living in slums without clean water or sanitation.","bn":"অনেক অভিবাসী শেষ পর্যন্ত বিশুদ্ধ পানি ও পয়ঃনিষ্কাশনবিহীন বস্তিতে থাকেন।"},{"en":"Roads, hospitals and schools come under enormous pressure.","bn":"রাস্তা, হাসপাতাল ও স্কুলের ওপর বিশাল চাপ পড়ে।"},{"en":"Not everyone finds work, which leads to unemployment and sometimes crime.","bn":"সবাই কাজ পান না, যা বেকারত্ব এবং কখনো কখনো অপরাধের দিকে নিয়ে যায়।"},{"en":"Villages lose their young people, leaving farms short of workers.","bn":"গ্রাম তরুণদের হারায়, ফলে খামারে শ্রমিকের ঘাটতি দেখা দেয়।"}]},{"name":"Solutions","bn":"সমাধান","items":[{"en":"Governments should create jobs in rural areas through agro-industries and small businesses.","bn":"সরকারের উচিত কৃষিভিত্তিক শিল্প ও ছোট ব্যবসার মাধ্যমে গ্রামাঞ্চলে কর্মসংস্থান তৈরি করা।"},{"en":"Better schools, hospitals and roads in villages would reduce the need to move.","bn":"গ্রামে উন্নত স্কুল, হাসপাতাল ও রাস্তা স্থানান্তরের প্রয়োজন কমাবে।"},{"en":"Moving offices and industries to smaller cities would spread development more evenly.","bn":"অফিস ও শিল্প ছোট শহরে সরালে উন্নয়ন আরও সমানভাবে ছড়াবে।"},{"en":"Cities should invest in affordable housing and public transport.","bn":"শহরগুলোর উচিত সাশ্রয়ী আবাসন ও গণপরিবহনে বিনিয়োগ করা।"},{"en":"Rural internet access would allow young people to work online from home.","bn":"গ্রামীণ ইন্টারনেট সুবিধা তরুণদের বাড়ি থেকে অনলাইনে কাজ করতে দেবে।"}]},{"name":"Overall Answer","bn":"সার্বিক উত্তর","items":[{"en":"Rural-urban migration causes overcrowding, pollution and pressure on services in cities, but these problems can be reduced by developing rural areas and planning cities better.","bn":"গ্রাম থেকে শহরে অভিবাসন শহরে অতিরিক্ত জনঘনত্ব, দূষণ ও সেবার ওপর চাপ সৃষ্টি করে, তবে গ্রামাঞ্চলের উন্নয়ন ও শহরের ভালো পরিকল্পনার মাধ্যমে এসব সমস্যা কমানো যায়।"},{"en":"The main problems are overcrowding in cities and the decline of villages, and the best solution is to create jobs and services in rural areas.","bn":"প্রধান সমস্যা হলো শহরে অতিরিক্ত ভিড় ও গ্রামের অবক্ষয়, এবং সেরা সমাধান হলো গ্রামাঞ্চলে কর্মসংস্থান ও সেবা তৈরি করা।"}]}],"vocab":[["rural-urban migration","গ্রাম থেকে শহরে অভিবাসন"],["overcrowding","অতিরিক্ত জনঘনত্ব"],["slums","বস্তি"],["housing","আবাসন"],["infrastructure","অবকাঠামো"],["sanitation","পয়ঃনিষ্কাশন"],["unemployment","বেকারত্ব"],["rural development","গ্রামীণ উন্নয়ন"],["agriculture","কৃষি"],["decentralisation","বিকেন্দ্রীকরণ"],["public services","সরকারি সেবা"],["crime rate","অপরাধের হার"],["labour shortage","শ্রমিক সংকট"],["garment factories","পোশাক কারখানা"]],"phrases":[["in search of better opportunities","ভালো সুযোগের খোঁজে"],["put pressure on","... এর ওপর চাপ সৃষ্টি করা"],["cannot keep up with","... এর সঙ্গে তাল মেলাতে না পারা"],["live in poor conditions","খারাপ পরিবেশে বাস করা"],["be left behind","পিছিয়ে পড়া"],["create jobs in rural areas","গ্রামাঞ্চলে কর্মসংস্থান তৈরি করা"],["improve living standards","জীবনযাত্রার মান উন্নত করা"],["spread development more evenly","উন্নয়ন আরও সমানভাবে ছড়িয়ে দেওয়া"],["affordable housing","সাশ্রয়ী আবাসন"],["access to education and healthcare","শিক্ষা ও স্বাস্থ্যসেবায় প্রবেশাধিকার"]],"sents":[{"en":"Millions of people move to cities in search of better opportunities.","bn":"লাখ লাখ মানুষ ভালো সুযোগের খোঁজে শহরে আসে।"},{"en":"This rapid growth puts pressure on housing, transport and public services.","bn":"এই দ্রুত বৃদ্ধি আবাসন, পরিবহন ও সরকারি সেবার ওপর চাপ সৃষ্টি করে।"},{"en":"City infrastructure cannot keep up with the growing population.","bn":"শহরের অবকাঠামো ক্রমবর্ধমান জনসংখ্যার সঙ্গে তাল মেলাতে পারে না।"},{"en":"Many migrants end up living in poor conditions in slums without proper sanitation.","bn":"অনেক অভিবাসী শেষ পর্যন্ত যথাযথ পয়ঃনিষ্কাশনবিহীন বস্তিতে খারাপ পরিবেশে বাস করে।"},{"en":"Meanwhile, villages are left behind, with a shortage of young workers for agriculture.","bn":"এদিকে গ্রাম পিছিয়ে পড়ে, কৃষির জন্য তরুণ শ্রমিকের সংকট দেখা দেয়।"},{"en":"Governments should create jobs in rural areas so that people do not need to move.","bn":"সরকারের উচিত গ্রামাঞ্চলে কর্মসংস্থান তৈরি করা যাতে মানুষকে স্থানান্তরিত হতে না হয়।"},{"en":"Better access to education and healthcare in villages would improve living standards.","bn":"গ্রামে শিক্ষা ও স্বাস্থ্যসেবায় ভালো প্রবেশাধিকার জীবনযাত্রার মান উন্নত করবে।"},{"en":"Moving offices and factories to smaller cities would spread development more evenly.","bn":"অফিস ও কারখানা ছোট শহরে সরিয়ে নিলে উন্নয়ন আরও সমানভাবে ছড়িয়ে পড়বে।"}],"xvocab":[["megacity","মেগাসিটি"],["urban sprawl","অপরিকল্পিত নগর বিস্তার"],["informal sector","অনানুষ্ঠানিক খাত"],["remittances","প্রবাস/প্রেরিত আয়"],["climate migrants","জলবায়ু অভিবাসী"],["rural broadband","গ্রামীণ ব্রডব্যান্ড"],["economic hub","অর্থনৈতিক কেন্দ্র"],["agro-industry","কৃষিভিত্তিক শিল্প"]],"xsents":[{"en":"Dhaka has become one of the most densely populated megacities in the world.","bn":"ঢাকা বিশ্বের সবচেয়ে ঘনবসতিপূর্ণ মেগাসিটিগুলোর একটিতে পরিণত হয়েছে।"},{"en":"Many new arrivals find work only in the informal sector.","bn":"অনেক নবাগত শুধু অনানুষ্ঠানিক খাতে কাজ পান।"},{"en":"Rising sea levels are creating a new wave of climate migrants.","bn":"সমুদ্রপৃষ্ঠের উচ্চতা বৃদ্ধি জলবায়ু অভিবাসীদের নতুন ঢেউ তৈরি করছে।"},{"en":"Rural broadband could allow young people to work online from their villages.","bn":"গ্রামীণ ব্রডব্যান্ড তরুণদের গ্রাম থেকে অনলাইনে কাজের সুযোগ দিতে পারে।"}],"essays":[{"label":"BASIC ESSAY (BAND 5–6)","words":254,"paras":["In many developing countries, like Bangladesh, a lot of people are moving from villages to cities. <b>Rural-urban migration causes overcrowding, pollution and pressure on services in cities, but these problems can be reduced by developing rural areas and planning cities better.</b>","This migration causes several problems. The first problem is <b>overcrowding</b>. Cities like Dhaka have too many people, so there are not enough houses, schools and hospitals. Many poor people live in <b>slums</b> without clean water or toilets. The second problem is traffic and pollution. More people means more vehicles, so there are traffic jams and the air becomes dirty. The third problem is <b>unemployment</b>. Not everyone can find a job in the city, and some people become involved in crime. Also, villages lose their young people, so there are not enough workers on the farms.","There are some solutions to these problems. Firstly, the government should create more jobs in villages and small towns. For example, it can build factories and help farmers to sell their products. If people can earn money in villages, they will not need to move. Secondly, the government should build better schools, hospitals and roads in rural areas, so people can have a good life there. Thirdly, the government should move some offices and universities from the capital to other cities. Finally, cities should build cheap houses for poor people.","In conclusion, moving from villages to cities causes <b>overcrowding</b>, pollution and <b>unemployment</b>. The government can solve these problems by developing villages and small towns and planning cities better."]},{"label":"ADVANCED ESSAY (BAND 7)","words":262,"paras":["In many developing countries, people are leaving the countryside for cities in unprecedented numbers. <b>Rural-urban migration causes overcrowding, pollution and pressure on services in cities, but these problems can be reduced by developing rural areas and planning cities better.</b>","The most visible problem is <b>overcrowding</b>. City <b>infrastructure</b> <b>cannot keep up with</b> the growing population, so <b>housing</b> becomes scarce and expensive, and many migrants end up <b>living in poor conditions</b> in <b>slums</b> without proper <b>sanitation</b> or clean water. This rapid growth also <b>puts pressure on</b> transport, hospitals and schools, and it leads to severe traffic congestion and air pollution. In addition, cities cannot always create enough jobs for newcomers, which results in <b>unemployment</b>, low wages and, in some cases, higher crime rates. Meanwhile, villages <b>are left behind</b>, suffering from a shortage of young workers for <b>agriculture</b>.","To tackle these problems, governments should address the root cause by making rural areas more attractive. This means <b>creating jobs in rural areas</b>, for instance by supporting agro-industries and small businesses, and improving <b>access to education and healthcare</b> so that people do not feel they must move to the city for a better life. Secondly, <b>decentralisation</b> is essential: moving government offices, universities and factories to smaller cities would <b>spread development more evenly</b> and reduce pressure on the capital. Finally, city authorities must plan for growth by investing in public transport, <b>sanitation</b> and <b>affordable housing</b> for low-income families.","In conclusion, mass migration to cities creates serious problems for both urban and rural areas. However, a combination of <b>rural development</b>, <b>decentralisation</b> and better urban planning could significantly reduce them."]},{"label":"BAND 9 ESSAY","words":336,"paras":["Across the developing world, rural populations are migrating to cities on an enormous scale, drawn by the promise of work and better services. <b>Rural-urban migration causes overcrowding, pollution and pressure on services in cities, but these problems can be reduced by developing rural areas and planning cities better.</b>","The consequences are most acute in the cities themselves. Urban <b>infrastructure</b> simply <b>cannot keep up with</b> such rapid population growth, and the result is a chronic shortage of <b>affordable housing</b>. Many migrants therefore end up <b>living in poor conditions</b> in informal settlements, lacking clean water, proper <b>sanitation</b> and secure tenure; Dhaka, now one of the most densely populated <b>megacities</b> in the world, illustrates this vividly. The influx also <b>puts pressure on</b> transport networks, hospitals and schools, contributing to severe congestion and air pollution. Economically, the formal job market rarely expands quickly enough, so many newcomers are absorbed into the <b>informal sector</b>, where wages are low and conditions precarious. At the same time, the countryside pays a price: villages lose their most energetic young people, leaving an ageing population and labour shortages in <b>agriculture</b>, while climate change is now adding a new wave of <b>climate migrants</b> from flood- and salinity-affected regions.","Addressing these problems requires tackling both ends of the migration chain. The most sustainable solution is to reduce the need to migrate by investing in <b>rural development</b>: <b>creating jobs in rural areas</b> through <b>agro-industry</b> and support for small enterprises, extending <b>rural broadband</b> so that young people can work online, and improving <b>access to education and healthcare</b>. Secondly, a deliberate policy of <b>decentralisation</b>, relocating government institutions, universities and industrial zones to secondary cities, would <b>spread development more evenly</b> and create alternative economic hubs. Finally, since some
