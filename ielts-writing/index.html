 {k:'Your opinion / thesis',bn:'মতামত',idx:{A1:1,A2:1,B1:1,B2:2,C1:2,C2:2}},
 {k:'Topic sentence',bn:'মূল বাক্য',idx:{A1:2,A2:2,B1:2,B2:3,C1:3,C2:3}},
 {k:'Example',bn:'উদাহরণ',idx:{A1:3,A2:3,B1:3,B2:4,C1:4,C2:4}},
 {k:'Turn to the other side',bn:'অন্য দিক',idx:{A1:4,A2:5,B1:5,B2:7,C1:8,C2:8}},
 {k:'Final opinion',bn:'শেষ মতামত',idx:{A1:6,A2:8,B1:9,B2:12,C1:14,C2:14}}
];
const FUNCS=[['context','Background','var(--f-context)'],['position','Opinion / thesis','var(--f-position)'],['topic','Topic sentence','var(--f-topic)'],['support','Explain / support','var(--f-support)'],['example','Example','var(--f-example)'],['restate','Restate & close','var(--f-restate)']];
const FPOS=['context','position','topic','support','example','topic','support','example','restate','restate'];
const STAGES=[
 {id:'sentence',t:'Sentence',bn:'বাক্য গঠন'},
 {id:'paragraph',t:'Paragraph',bn:'অনুচ্ছেদ'},
 {id:'blocks',t:'Building blocks',bn:'শব্দ ও বাক্যাংশ'},
 {id:'essay',t:'Essay',bn:'পূর্ণ রচনা'},
 {id:'models',t:'Model answers',bn:'নমুনা উত্তর'},
 {id:'practice',t:'Practice lab',bn:'অনুশীলন'}
];

const S={
  stage:store.get('stage','sentence'), lv:store.get('lv','B1'), grow:store.get('grow',0),
  ex:'main', sel:0, type:0, topic:store.get('topic',1), band:store.get('band',1),
  hl:true, side:false, rate:store.get('rate',0.95), mmode:store.get('mmode','topics'), lvEssay:0, bn:store.get('bn',true)
};
if(!LV.includes(S.lv))S.lv='B1';
const h=location.hash.replace('#','');
if(STAGES.some(s=>s.id===h))S.stage=h;

function levelPicker(){
  return `<div class="levels" role="group" aria-label="CEFR level">${LV.map(l=>`<button class="lvbtn" data-lv="${l}" aria-pressed="${S.lv===l}"><b>${l}</b><span>${LVMETA[l].band}</span></button>`).join('')}</div>`;
}
function pattern(p){
  return esc(p).split(/(\[[^\]]+\])/).map(part=>{
    if(/^\[.*\]$/.test(part))return `<span class="slot">${part.slice(1,-1)}</span>`;
    return part.replace(/\s\+\s|^\+\s|\s\+$/g,m=>'<i class="plus">+</i>');
  }).join('');
}
function bnSplit(txt){ // "English sentence. বাংলা" -> [en,bn]
  const i=txt.search(/[ঀ-৿]/); if(i<0)return [txt,''];
  return [txt.slice(0,i).trim(),txt.slice(i).trim()];
}

/* ---------- STAGE 1: SENTENCE ---------- */
function stageSentence(){
  const L=DATA.ladder.find(x=>x.lv===S.lv);
  const g=GROW[S.grow];

function renderPart(p,i){
  const pc=PCOL[Math.min(i,3)];
  let html='',label='';
  const items=[];
  p.lines.forEach(line=>{
    if(/:$/.test(line)&&line.length<30){label=line.slice(0,-1);return}
    items.push([label,line]);
  });
  let cur=null;const out=[];
  items.forEach(([lab,line])=>{if(!cur||cur.lab!==lab){cur={lab,lines:[]};out.push(cur)}cur.lines.push(line)});
  html=out.map(o=>{
    const isStruct=/structure/i.test(o.lab);
    const body=o.lines.map(l=>isStruct?`<div class="pat">${pattern(l)}</div>`:`<p class="it">${esc(l)}${say(l.replace(/^\d+\.\s*/,''))}</p>`).join('');
    return `${o.lab?`<span class="eyebrow">${esc(o.lab)}</span>`:''}${o.lines.length>1&&!isStruct?`<div style="display:grid;gap:8px">${body}</div>`:body}`;
  }).join('');
  return `<div class="card block"><div class="paralabel"><span class="dot" style="background:${pc[1]}"></span>${esc(p.h)}</div>${html}</div>`;
}

}

let timerId=null,remain=2400;
function fmt(s){return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
function bindPad(){
  const ta=$('#draft');if(!ta)return;
  const upd=()=>{const w=wc(ta.value);const p=ta.value.split(/\n\s*\n/).filter(x=>x.trim()).length;
    const wp=$('#wcPill');wp.textContent=w+' words';wp.className='pill '+(w>=250?'ok':w>0?'low':'');
    const pp=$('#parPill');pp.textContent=p+' paragraph'+(p===1?'':'s');pp.className='pill '+(p===4?'ok':'');
    store.set('draft',ta.value)};
  ta.addEventListener('input',upd);upd();
  const tb=$('#timerBtn'),tp=$('#timer');
  if(timerId){tp.hidden=false;tp.textContent=fmt(remain);tb.textContent='Stop'}
  tb.onclick=()=>{
    if(timerId){clearInterval(timerId);timerId=null;remain=2400;tb.textContent='Start 40:00';tp.hidden=true;return}
    remain=2400;tp.hidden=false;tp.textContent=fmt(remain);tb.textContent='Stop';
    timerId=setInterval(()=>{remain--;const el=$('#timer');if(el)el.textContent=fmt(Math.max(0,remain));if(remain<=0){clearInterval(timerId);timerId=null;const b2=$('#timerBtn');if(b2)b2.textContent='Start 40:00';if(el)el.textContent='Time’s up'}},1000);
  };
}

const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const PR={tab:store.get('pr','ai'),para:1,ord:{key:''},jobs:{key:''},gaps:{key:''},cards:{key:''},confirmPad:false};
const ACTS=[
  ['ai','AI examiner','Write it, get your band + fixes','AI মূল্যায়ন'],
  ['build','Essay builder','Pick your answer and points','রচনার কাঠামো তৈরি'],
  ['order','Order the sentences','Rebuild a paragraph','বাক্য সাজাও'],
  ['jobs','Name the job','What does this sentence do?','বাক্যের কাজ চেনো'],
  ['gaps','Fill the gaps','Word bank in a model essay','শূন্যস্থান পূরণ'],
  ['cards','Flashcards','Topic words, English ⇄ বাংলা','শব্দ কার্ড']
];
const evalGroup=t=>t.groups.find(g=>/Evaluation/i.test(g.name))||t.groups[t.groups.length-1];
const sideGroups=t=>t.groups.filter(g=>!/Evaluation/i.test(g.name));
const lcFirst=s=>/^(I\b|AI\b|[A-Z]{2})/.test(s)?s:s.charAt(0).toLowerCase()+s.slice(1);
function connectors(name,second){
  if(/disagree|disadvantage|drawback|against|negative|second view/i.test(name)&&second)return ['Admittedly, ','On the other hand, ','In addition, '];
  if(/solution/i.test(name))return ['To address this, ','Another solution is that ','Finally, '];
  if(second)return ['Turning to the other side, ','Moreover, ','In addition, '];
  return ['To begin with, ','Furthermore, ','In addition, '];
}
function builderState(t){
  const B=store.get('bld'+t.n,null);
  return B&&Array.isArray(B.a)?B:{e:0,a:[0,1],b:[0]};
}
function buildParas(t,B){
  const ev=evalGroup(t),sg=sideGroups(t),g1=sg[0],g2=sg[1]||sg[0];
  const e=(ev.items[B.e]||ev.items[0]).en;
  const c1=connectors(g1.name,false),c2=connectors(g2.name,true);
  const A=B.a.map(i=>g1.items[i]).filter(Boolean).map((x,i)=>c1[i]+lcFirst(x.en));
  const Bb=B.b.map(i=>g2.items[i]).filter(Boolean).map((x,i)=>c2[i]+lcFirst(x.en));
  let rest=e.replace(/^(In my (opinion|view),\s*|Overall,\s*)/i,'');
  const concl='In conclusion, '+(/^I\b/.test(rest)?rest:'I believe that '+lcFirst(rest));
  return [
    {h:'Introduction',pre:'Paraphrase the question in your own words.',txt:e},
    {h:'Body paragraph 1',txt:A.join(' ')||'',post:'Add one specific example: “For example, …”'},
    {h:'Body paragraph 2',txt:Bb.join(' ')||'',post:'Explain or give an example, then link back to your answer.'},
    {h:'Conclusion',txt:concl}
  ];
}
function builderText(ps){return ps.map(p=>[p.pre?'['+p.pre+']':'',p.txt,p.post?'['+p.post+']':''].filter(Boolean).join(' ')).join('\n\n')}
function actBuild(){

      <div class="optlist">${g2.items.map((it,i)=>opt(B.b.includes(i),false,`data-bpick="b:${i}"`,it)).join('')}</div>`:''}
    </div>

        <div class="eh"><b>Your essay plan</b><div class="row"><span class="small muted">${words} words so far · aim for 250+</span>${say(ps.map(p=>p.txt).join(' '),'whole','Listen')}</div></div>
        ${ps.map((p,i)=>`<div class="epara"><div class="pl" style="color:${PCOL[i][1]}">${p.h.replace(' paragraph','')}</div><p>${p.pre?`<span class="slotline">${esc(p.pre)}</span> `:''}${p.txt?esc(p.txt):'<span class="slotline">Choose points on the left.</span>'}${p.post?` <span class="slotline">${esc(p.post)}</span>`:''}</p></div>`).join('')}
        <div class="row"><button class="btn" data-bact="copy">Copy text</button><button class="btn primary" data-bact="pad">${PR.confirmPad?'Replace your saved draft? Tap again':'Continue in the writing pad →'}</button></div>
        <p class="small muted">The yellow boxes are your jobs. Replace them with your own sentences. <span class="bn">হলুদ অংশগুলো নিজের ভাষায় লেখো।</span></p>
      </article>
    </div>
  </div>`;
}

function actOrder(){
  const L=DATA.ladder.find(x=>x.lv===S.lv),map=PMAP[S.lv];
  if(!map[PR.para]||map[PR.para].length<2)PR.para=1;
  const idx=map[PR.para],key=S.lv+'|'+PR.para,O=PR.ord;
  if(O.key!==key){O.key=key;let p=shuffle(idx);if(p.join()===idx.join())p=p.reverse();O.pool=p;O.placed=[];O.checked=false}
  const done=O.placed.length===idx.length;
  const right=O.checked?O.placed.filter((x,i)=>x===idx[i]).length:0;
  return `
  <div class="row" style="justify-content:space-between">${levelPicker()}</div>
  <div class="seg" role="group" aria-label="Paragraph">${map.map((ix,i)=>`<button data-opara="${i}" aria-pressed="${PR.para===i}" ${ix.length<2?'disabled title="Only one sentence"':''}>${PCOL[i][0].replace(' paragraph','')}</button>`).join('')}</div>
  <div class="qbox"><span class="qtag">${S.lv} question</span><p class="q">${esc(L.q)}${say(L.q)}</p></div>
  <p class="muted">Tap the sentences in the right order to rebuild the <b>${PCOL[PR.para][0].toLowerCase()}</b>. Tap a placed sentence to send it back. <span class="bn">সঠিক ক্রমে বাক্যগুলোতে ট্যাপ করো।</span></p>
  <div class="grid2">
    <div class="block"><span class="eyebrow">Your paragraph</span>
      <div class="order">${idx.map((_,i)=>{const s=O.placed[i];const cls=s==null?'':' filled'+(O.checked?(s===idx[i]?' ok':' bad'):'');
        return `<div class="oslot${cls}"><span class="on">${i+1}</span>${s==null?'<span class="small muted">…</span>':`<button class="oitem" data-oback="${i}">${O.checked?`<small>${esc(L.sents[s].role)}</small>`:''}${esc(L.sents[s].sample)}</button>`}</div>`}).join('')}</div></div>
    <div class="block"><span class="eyebrow">Sentences to place · ${O.pool.length} left</span>
      <div class="pool">${O.pool.map(s=>`<button class="pchip" data-opick="${s}">${esc(L.sents[s].sample)}</button>`).join('')||`<p class="muted small">All placed. Check your order.</p>`}</div></div>
  </div>
  <div class="scorebar">
    <button class="btn primary" data-oact="check" ${done?'':'disabled style="opacity:.5"'}>Check order</button>
    <button class="btn" data-oact="answer">Show answer</button>
    <button class="btn" data-oact="again">Shuffle again</button>
    ${O.checked?`<span class="big">${right} / ${idx.length}</span>${right===idx.length?'<span class="cheer">Perfect order!</span>':'<span class="muted small">Red rows are in the wrong place.</span>'}`:''}
    ${O.checked&&right===idx.length?say(idx.map(i=>L.sents[i].sample).join(' '),'whole','Listen to the paragraph'):''}
  </div>`;
}

function actJobs(){
  const J=PR.jobs;
  if(J.key!==S.lv){J.key=S.lv;J.list=shuffle(DATA.struct.filter(x=>x.lv===S.lv).flatMap(E=>E.rows.map((r,i)=>({s:r[3],role:r[1],pat:r[2],f:FPOS[i]})).filter(x=>x.f)));J.i=0;J.res=[];J.ans=null}
  const n=J.list.length,score=J.res.filter(Boolean).length;
  if(J.i>=n)return `${levelPicker()}<div class="qcard" style="text-align:center"><span class="eyebrow">${S.lv} · finished</span><div class="tbig">${score}/${n}</div><p class="muted">${score===n?'Every job named correctly.':score>=n*.7?'Strong work. Review the red ones and try again.':'Go back to Stage 2 and tap through the sentences, then try again.'}</p><div class="dots" style="justify-content:center">${J.res.map(r=>`<i class="${r?'ok':'bad'}"></i>`).join('')}</div><div class="row" style="justify-content:center"><button class="btn primary" data-jact="restart">Play again</button></div></div>`;

function gapModel(t,band){
  const gaps=[];
  const paras=t.essays[band].paras.map(p=>p.split(/(<b>.*?<\/b>)/).filter(Boolean).map(seg=>{
    const m=seg.match(/^<b>(.*?)<\/b>$/);if(!m)return {t:seg};
    if(wc(m[1])>5||gaps.length>=12)return {t:m[1]};
    gaps.push(m[1]);return {g:gaps.length-1};
  }));
  return {paras,gaps};
}
function actGaps(){
  const t=DATA.topics.find(x=>x.n===S.topic),band=Math.min(S.band,t.essays.length-1),G=PR.gaps,key=t.n+'|'+band;

  if(G.key!==key){G.key=key;G.fill={};G.act=0;G.checked=false;G.chips=shuffle(M.gaps.map((_,i)=>i))}

  <div class="seg" role="group" aria-label="Essay level">${t.essays.map((e,i)=>`<button data-band="${i}" aria-pressed="${band===i}">${names[i]||e.label}</button>`).join('')}</div>

  <article class="essay"><div class="gtext">${M.paras.map((p,pi)=>`<div class="epara"><div class="pl" style="color:${pi===0?PCOL[0][1]:pi===M.paras.length-1?PCOL[3][1]:(pi%2?PCOL[1][1]:PCOL[2][1])}">${pi===0?'Introduction':pi===M.paras.length-1?'Conclusion':'Body '+pi}</div><p>${p.map(s=>{
      if(s.t!=null)return esc(s.t);

async function kkSpeakBtn(btn,texts,n,onIdx){
  kkCtx();const tok=++KK.tok;
  const done=()=>{if(onIdx)onIdx(-1);if(playingBtn===btn&&tok===KK.tok)stopSpeak()};
  try{
    if(KK.st!=='ready'){btn.classList.add('busy');await kkLoad();if(tok!==KK.tok)return}
    const items=texts.map(t=>kkChunks(t));
    for(let r=0;r<n;r++){
      for(let i=0;i<items.length;i++){
        if(onIdx)onIdx(i);
        const ch=items[i];
        for(let j=0;j<ch.length;j++){
          const p=kkSynth(ch[j]);
          const nx=ch[j+1]||(items[i+1]&&items[i+1][0]);if(nx)kkSynth(nx);
          if(!btn.classList.contains('busy'))btn.classList.add('busy');
          const w=await p;if(tok!==KK.tok)return;btn.classList.remove('busy');
          if(!await kkPlay(w,tok))return;
        }
        if(i<items.length-1&&!await kkSleep(250).then(()=>tok===KK.tok))return;
      }
      if(r<n-1){await kkSleep(600);if(tok!==KK.tok)return}
    }
    done();
  }catch(err){
    btn.classList.remove('busy');
    if(tok!==KK.tok)return;
    console.warn(err);

      playingBtn=null;btn.classList.remove('on');btn.querySelector('svg').outerHTML=ICON_PLAY;speak(btn);return}
    done();
  }
}

  m.innerHTML=`<div class="mbox" role="dialog" aria-label="Jump to"><div class="cmdin">${ic('search')}<input id="cmdq" placeholder="Jump to a stage, question (e.g. traffic), level or tool" autocomplete="off"><span class="kbd">Esc</span></div><div class="cmdlist" id="cmdl" role="listbox"></div></div>`;
  document.body.appendChild(m);const inp=m.querySelector('#cmdq'),ul=m.querySelector('#cmdl');
  const draw=()=>{ul.innerHTML=list.slice(0,60).map((x,i)=>`<button class="citem" role="option" data-ci="${i}" aria-selected="${i===sel}"><span class="k">${esc(x.k)}</span><span>${esc(x.t)}</span></button>`).join('')||'<p class="muted small" style="padding:12px">Nothing matches. Try a topic word such as “health” or “B2”.</p>';const s=ul.querySelector('[aria-selected="true"]');if(s)s.scrollIntoView({block:'nearest'})};
  const run=i=>{const x=list[i];if(!x)return;closeModal();x.f()};
  inp.addEventListener('input',()=>{const q=inp.value.toLowerCase().trim().split(/\s+/);list=items.filter(x=>q.every(w=>(x.k+' '+x.t).toLowerCase().includes(w)));sel=0;draw()});
  inp.addEventListener('keydown',e=>{if(e.key==='ArrowDown'){sel=Math.min(list.length-1,sel+1);draw();e.preventDefault()}if(e.key==='ArrowUp'){sel=Math.max(0,sel-1);draw();e.preventDefault()}if(e.key==='Enter')run(sel)});
  ul.addEventListener('click',e=>{const b=e.target.closest('[data-ci]');if(b)run(+b.dataset.ci)});
  m.addEventListener('click',e=>{if(e.target===m)closeModal()});
  draw();inp.focus();
}
function closeModal(){const m=$('#modal');if(m)m.remove()}
function openHelp(){
  closeModal();const K=[['→ / ←','Next / previous (slide or stage)'],['1 – 6','Go to a stage'],['P','Present mode on / off'],['F','Full screen'],['+ / −','Bigger / smaller text'],['0','Reset text size'],['D','Draw on screen'],['Z / C','Undo / clear drawing'],['A','Read the page aloud (Emma)'],['S','Spotlight'],['[ / ]','Spotlight size'],['L','Laser pointer'],['K','Class timer'],['R','Pick a student'],['T','Light / dark'],['B','Bengali on / off'],['/','Jump to…'],['Esc','Close or exit']];
  const m=document.createElement('div');m.className='modal';m.id='modal';
  m.innerHTML=`<div class="mbox" role="dialog" aria-label="Keyboard shortcuts"><div class="cmdin"><b style="flex:1">Keyboard shortcuts</b><button class="xbtn" id="hx" aria-label="Close">${ic('x')}</button></div><div class="keys">${K.map(k=>`<div><span>${k[1]}</span><span class="kbd">${k[0]}</span></div>`).join('')}</div><p class="small muted" style="padding:0 18px 18px">Tip for teaching: press P, then use the arrow keys or a presentation clicker. Each card on the page becomes one slide, and everything on it stays interactive.</p></div>`;
  document.body.appendChild(m);m.addEventListener('click',e=>{if(e.target===m||e.target.closest('#hx'))closeModal()});
}

/* ---- dock wiring ---- */
dock.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
  ({dRead:readPage,dPresent:()=>setPresent(!P.on),dPrev:()=>slideStep(-1),dNext:()=>slideStep(1),dZout:()=>zoomBy(-.1),dZin:()=>zoomBy(.1),dPen:()=>setInk(!INK.on),dSpot:()=>setSpot(spot.hidden),dLaser:()=>setLaser(laser.hidden),dTimer:openTimer,dClass:()=>openClass(),dSearch:openCmd,dTheme:toggleTheme,dFull:toggleFull,dHelp:openHelp,dHide:()=>{closePop();document.body.classList.add('dockmin');store.set('dockmin',true)}}[b.id]||(()=>{}))()});

/* ---- reveal paragraphs & read-along ---- */
document.addEventListener('click',e=>{if(e.target.closest('.play'))return;const p=e.target.closest('.essay.reveal .epara');if(p)p.classList.add('shown')});
let seqTok=0;
function clearReading(){document.querySelectorAll('.epara.reading').forEach(x=>x.classList.remove('reading'))}
function speakSeq(btn){
  const art=btn.closest('article.essay');if(!art)return false;
  const paras=[...art.querySelectorAll('.epara')].filter(p=>p.querySelector('p'));if(paras.length<2)return false;
  const same=playingBtn===btn;stopSpeak();clearReading();if(same)return true;
  const tok=++seqTok;playingBtn=btn;btn.classList.add('on');btn.querySelector('svg').outerHTML=ICON_STOP;
  if(kkWanted()){kkSpeakBtn(btn,paras.map(p=>p.querySelector('p').textContent.replace(/Tap to reveal/g,'').trim()),1,i=>{clearReading();if(i>=0){const p=paras[i];p.classList.add('reading','shown');p.scrollIntoView({block:'nearest',behavior:'smooth'})}});return true}
  if(!HAS_SS){stopSpeak();return true}
  paras.forEach((p,i)=>{const u=new SpeechSynthesisUtterance(p.querySelector('p').textContent.replace(/Tap to reveal/g,'').trim());
    if(voice)u.voice=voice;u.lang=voice?voice.lang:'en-GB';u.rate=S.rate||0.95;
    u.onstart=()=>{if(tok!==seqTok)return;clearReading();p.classList.add('reading','shown');p.scrollIntoView({block:'nearest',behavior:'smooth'})};
    u.onend=()=>{if(tok!==seqTok)return;if(i===paras.length-1){clearReading();if(playingBtn===btn)stopSpeak()}};
    u.onerror=()=>{if(tok===seqTok)clearReading()};
    speechSynthesis.speak(u)});
  return true;
}

/* ---- keyboard ---- */
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){if($('#modal')){closeModal();return}if(openPop){closePop();return}if(INK.on){setInk(false);return}if(!spot.hidden){setSpot(false);return}if(!laser.hidden){setLaser(false);return}if(P.on){setPresent(false);return}return}
  if($('#modal'))return;
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();openCmd();return}
  if(e.ctrlKey||e.metaKey||e.altKey||typing(e.target))return;
  const k=e.key;
  if(k==='ArrowRight'||k==='PageDown'){e.preventDefault();if(P.on)slideStep(1);else{const i=STAGES.findIndex(s=>s.id===S.stage);if(i<STAGES.length-1)go(STAGES[i+1].id)}return}
  if(k==='ArrowLeft'||k==='PageUp'){e.preventDefault();if(P.on)slideStep(-1);else{const i=STAGES.findIndex(s=>s.id===S.stage);if(i>0)go(STAGES[i-1].id)}return}
  if(/^[1-6]$/.test(k)){go(STAGES[+k-1].id);return}
  const map={a:readPage,p:()=>setPresent(!P.on),f:toggleFull,'+':()=>zoomBy(.1),'=':()=>zoomBy(.1),'-':()=>zoomBy(-.1),'0':()=>{if(P.on){P.z=1.25;store.set('pz',P.z)}else{S.z=1;store.set('z',1)}applyZoom()},d:()=>setInk(!INK.on),s:()=>setSpot(spot.hidden),l:()=>setLaser(laser.hidden),k:openTimer,r:()=>{CL.tab='pick';openClass()},t:toggleTheme,b:()=>{S.bn=!S.bn;applyBn()},'/':openCmd,'?':openHelp,
    z:()=>{if(INK.on){INK.strokes.pop();inkRedraw()}},c:()=>{if(INK.on||INK.strokes.length)inkClear()},'[':()=>{spotR=Math.max(80,spotR-30);spot.style.setProperty('--sr',spotR+'px')},']':()=>{spotR=Math.min(500,spotR+30);spot.style.setProperty('--sr',spotR+'px')}};
  const fn=map[k]||map[k.toLowerCase()];if(fn){e.preventDefault();fn()}
});
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('.flash')){e.preventDefault();e.target.click()}});

applyBn();applyRate();
if(!TTS){document.querySelector('.speed').hidden=true}
render();
})();
</script>
