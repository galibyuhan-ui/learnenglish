me through <b>donations</b>, cafés, gift shops and paid special <b>exhibitions</b>. Some also charge foreign <b>tourists</b> a fee while keeping entry free for citizens.","In conclusion, I firmly believe <b>museums</b> should be free, since this maximises their <b>educational</b> and social benefits and ensures that everyone can access their shared heritage."]},{"label":"BAND 9 ESSAY","words":345,"paras":["Whether <b>museums</b> and <b>art galleries</b> should charge for admission is a question that touches on the purpose of cultural institutions themselves. <b>I strongly agree that museums should be free, because culture and history should be accessible to everyone, not only those who can afford to pay.</b>","The strongest argument concerns education. <b>Museums</b> allow people to <b>learn about their history</b>, science and artistic heritage in a way that no textbook can replicate, offering direct encounters with objects that bring the past to life. They are also important sites of <b>lifelong learning</b>, serving retirees and working adults as well as children. In a country such as Bangladesh, institutions like the <b>Liberation War Museum</b> play a vital role in transmitting national memory to generations born long after 1971, fostering both understanding and <b>a sense of national pride</b>. Free admission maximises this value by encouraging repeat visits and making <b>school trips</b> more affordable for <b>underfunded</b> schools.","A second argument is one of equity. Entrance fees, however modest they may seem to policymakers, are a genuine barrier for <b>low-income families</b>, particularly those with several children. Charging for entry risks turning institutions that preserve a nation's shared <b>cultural heritage</b> into <b>elitist</b> spaces enjoyed disproportionately by the affluent. The experience of the United Kingdom is instructive: after national <b>museums</b> abolished admission charges in 2001, <b>visitor numbers</b> rose dramatically, with notable increases among groups that had previously been underrepresented.","Critics rightly point out that it costs a great deal to <b>run museums</b>, conserve fragile <b>collections</b> and pay specialist staff, and that without fees many institutions would struggle. This concern, however, argues for adequate funding rather than for excluding <b>visitors</b>. As <b>a public good</b>, <b>museums</b> merit <b>public funding</b>, which can be supplemented by <b>donations</b>, corporate sponsorship, cafés and shops, and paid special <b>exhibitions</b>. A system of <b>tiered pricing</b>, under which international <b>tourists</b> pay while citizens enter free, would also be a reasonable compromise.","In conclusion, I am convinced that free admission best serves the <b>educational</b> and civic purpose of <b>museums</b>, ensuring that a nation's history and culture remain genuinely <b>accessible</b> to all its citizens."]}],"type":"Opinion (Agree / Disagree)","q":"Some people think that museums and art galleries should be free for everyone to visit, while others believe visitors should pay an entrance fee. To what extent do you agree that museums should be free?"},{"n":31,"title":"Brain drain","cat":"Globalisation & Culture","groups":[{"name":"Causes","bn":"কারণ","items":[{"en":"Professionals can earn many times more in developed countries.","bn":"পেশাজীবীরা উন্নত দেশে কয়েক গুণ বেশি আয় করতে পারেন।"},{"en":"Developed countries offer better research facilities and working conditions.","bn":"উন্নত দেশগুলো ভালো গবেষণা সুবিধা ও কর্মপরিবেশ দেয়।"},{"en":"In some countries, jobs and promotions depend on connections rather than merit.","bn":"কিছু দেশে চাকরি ও পদোন্নতি মেধার বদলে পরিচিতির ওপর নির্ভর করে।"},{"en":"Political instability and bureaucracy frustrate talented young people.","bn":"রাজনৈতিক অস্থিতিশীলতা ও আমলাতান্ত্রিক জটিলতা মেধাবী তরুণদের হতাশ করে।"},{"en":"Many parents want a safer environment and better education for their children.","bn":"অনেক বাবা-মা সন্তানদের জন্য নিরাপদ পরিবেশ ও ভালো শিক্ষা চান।"}]},{"name":"Solutions","bn":"সমাধান","items":[{"en":"Governments should offer competitive salaries in key professions.","bn":"সরকারের উচিত গুরুত্বপূর্ণ পেশায় প্রতিযোগিতামূলক বেতন দেওয়া।"},{"en":"Investing in modern universities, hospitals and laboratories would keep talent at home.","bn":"আধুনিক বিশ্ববিদ্যালয়, হাসপাতাল ও ল্যাবরেটরিতে বিনিয়োগ মেধাকে দেশে ধরে রাখবে।"},{"en":"Recruitment and promotion must be fair and based on merit.","bn":"নিয়োগ ও পদোন্নতি ন্যায্য ও মেধাভিত্তিক হতে হবে।"},{"en":"Tax breaks and research grants could encourage professionals to return home.","bn":"কর ছাড় ও গবেষণা অনুদান পেশাজীবীদের দেশে ফিরতে উৎসাহিত করতে পারে।"},{"en":"Those living abroad can still contribute through investment and online collaboration.","bn":"প্রবাসীরাও বিনিয়োগ ও অনলাইন সহযোগিতার মাধ্যমে অবদান রাখতে পারেন।"}]},{"name":"Overall Answer","bn":"সার্বিক উত্তর","items":[{"en":"Skilled professionals leave mainly for higher salaries and better working conditions, and governments can encourage them to stay by improving pay, research facilities and quality of life.","bn":"দক্ষ পেশাজীবীরা মূলত উচ্চ বেতন ও ভালো কর্মপরিবেশের জন্য দেশ ছাড়েন, এবং সরকার বেতন, গবেষণা সুবিধা ও জীবনযাত্রার মান উন্নত করে তাদের থাকতে উৎসাহিত করতে পারে।"},{"en":"The main causes of brain drain are low wages and limited opportunities, and the solution is to create rewarding careers at home.","bn":"মেধা পাচারের প্রধান কারণ কম বেতন ও সীমিত সুযোগ, এবং এর সমাধান হলো দেশেই সম্মানজনক ও লাভজনক ক্যারিয়ার তৈরি করা।"}]}],"vocab":[["brain drain","মেধা পাচার"],["emigrate","দেশত্যাগ করা"],["skilled professionals","দক্ষ পেশাজীবী"],["salaries","বেতন"],["working conditions","কর্মপরিবেশ"],["research facilities","গবেষণা সুবিধা"],["corruption","দুর্নীতি"],["nepotism","স্বজনপ্রীতি"],["quality of life","জীবনযাত্রার মান"],["political instability","রাজনৈতিক অস্থিতিশীলতা"],["incentives","প্রণোদনা"],["remittances","প্রবাস আয়"],["doctors","চিকিৎসক"],["engineers","প্রকৌশলী"]],"phrases":[["in search of better opportunities","ভালো সুযোগের খোঁজে"],["earn many times more","কয়েক গুণ বেশি আয় করা"],["career progression","পেশাগত উন্নতি"],["based on merit","মেধার ভিত্তিতে"],["feel undervalued","অবমূল্যায়িত বোধ করা"],["a better future for their children","সন্তানদের জন্য উন্নত ভবিষ্যৎ"],["invest in research","গবেষণায় বিনিয়োগ করা"],["tax breaks","কর ছাড়"],["return home","দেশে ফিরে আসা"],["share their knowledge","তাদের জ্ঞান ভাগ করা"]],"sents":[{"en":"Many doctors and engineers emigrate in search of better opportunities.","bn":"অনেক চিকিৎসক ও প্রকৌশলী ভালো সুযোগের খোঁজে দেশ ছাড়েন।"},{"en":"In developed countries, they can earn many times more than at home.","bn":"উন্নত দেশে তারা দেশের চেয়ে কয়েক গুণ বেশি আয় করতে পারেন।"},{"en":"Scientists often leave because of a lack of research facilities.","bn":"বিজ্ঞানীরা প্রায়ই গবেষণা সুবিধার অভাবে দেশ ছাড়েন।"},{"en":"Some professionals feel undervalued because promotion is not based on merit.","bn":"কিছু পেশাজীবী অবমূল্যায়িত বোধ করেন কারণ পদোন্নতি মেধার ভিত্তিতে হয় না।"},{"en":"Many parents move abroad to give their children a better future.","bn":"অনেক বাবা-মা সন্তানদের উন্নত ভবিষ্যৎ দিতে বিদেশে যান।"},{"en":"Governments should invest in research and offer competitive salaries.","bn":"সরকারের উচিত গবেষণায় বিনিয়োগ করা এবং প্রতিযোগিতামূলক বেতন দেওয়া।"},{"en":"Tax breaks and grants could encourage professionals to return home.","bn":"কর ছাড় ও অনুদান পেশাজীবীদের দেশে ফিরতে উৎসাহিত করতে পারে।"},{"en":"Those who stay abroad can still share their knowledge through online collaboration.","bn":"যারা বিদেশে থাকেন তারাও অনলাইন সহযোগিতার মাধ্যমে জ্ঞান ভাগ করতে পারেন।"}],"xvocab":[["talent drain","প্রতিভা পাচার"],["human capital","মানবসম্পদ"],["bureaucracy","আমলাতান্ত্রিক জটিলতা"],["diaspora","প্রবাসী সম্প্রদায়"],["brain gain","মেধা লাভ (ফিরে আসা)"],["public investment","সরকারি বিনিয়োগ"],["meritocratic","মেধাভিত্তিক"],["return migration","প্রত্যাবর্তন অভিবাসন"]],"xsents":[{"en":"Brain drain means that public investment in education benefits other countries.","bn":"মেধা পাচারের অর্থ হলো শিক্ষায় সরকারি বিনিয়োগ অন্য দেশের উপকারে আসে।"},{"en":"Excessive bureaucracy frustrates many young professionals.","bn":"অতিরিক্ত আমলাতান্ত্রিক জটিলতা অনেক তরুণ পেশাজীবীকে হতাশ করে।"},{"en":"India and China have turned brain drain into brain gain by attracting their diaspora back.","bn":"ভারত ও চীন তাদের প্রবাসীদের ফিরিয়ে এনে মেধা পাচারকে মেধা লাভে পরিণত করেছে।"},{"en":"A meritocratic system gives young people a reason to stay.","bn":"মেধাভিত্তিক ব্যবস্থা তরুণদের থেকে যাওয়ার কারণ দেয়।"}],"essays":[{"label":"BASIC ESSAY (BAND 5–6)","words":256,"paras":["Many educated people from developing countries, like <b>doctors</b> and <b>engineers</b>, go to work in developed countries. <b>Skilled professionals leave mainly for higher salaries and better working conditions, and governments can encourage them to stay by improving pay, research facilities and quality of life.</b>","There are several reasons why educated people leave their countries. The main reason is money. A doctor in the USA or the UK can <b>earn many times more</b> than a doctor in Bangladesh. Secondly, developed countries have better <b>working conditions</b>, such as modern hospitals, good laboratories and more chances to be promoted. Thirdly, in some developing countries, people get jobs because of their connections, not their ability, so talented people feel it is unfair. Finally, many parents want a safe and comfortable life and a good education for their children.","There are some ways to encourage these people to stay. Firstly, the government should pay professionals like <b>doctors</b>, teachers and scientists better <b>salaries</b>. Secondly, it should build modern hospitals, universities and research centres, so people can do good work at home. Thirdly, jobs and promotions should be based on ability, not connections. Finally, the government can give special benefits, such as lower taxes, to people who come back after studying abroad. Also, people who live abroad can still help their country by <b>sharing their knowledge</b> online or starting businesses at home.","In conclusion, educated people leave developing countries because of low <b>salaries</b>, poor facilities and unfair systems. If governments improve these things, more talented people will stay and help their countries to develop."]},{"label":"ADVANCED ESSAY (BAND 7)","words":281,"paras":["A significant number of highly qualified professionals leave developing countries every year to work in wealthier nations, a phenomenon known as <b>brain drain</b>. <b>Skilled professionals leave mainly for higher salaries and better working conditions, and governments can encourage them to stay by improving pay, research facilities and quality of life.</b>","The most obvious reason is financial. In developed countries, professionals such as <b>doctors</b> and <b>engineers</b> can <b>earn many times more</b> than at home, which allows them to support their families and save for the future. However, money is not the only factor. Many scientists leave because of a lack of <b>research facilities</b> and funding, and many professionals <b>feel undervalued</b> in systems where <b>career progression</b> depends on connections rather than being <b>based on merit</b>. Excessive <b>bureaucracy</b> and, in some cases, <b>political instability</b> add to their frustration. Finally, many <b>emigrate</b> to give their children a better future, with access to high-quality education and a safer environment.","Several measures could help reverse this trend. First, governments should offer competitive <b>salaries</b> in key professions such as medicine, teaching and research. Second, they should <b>invest in research</b> by building modern laboratories and hospitals and funding innovation, so that talented people can pursue ambitious careers at home. Third, recruitment and promotion must be transparent and <b>based on merit</b>. Finally, <b>incentives</b> such as <b>tax breaks</b>, research grants and fast-track positions could encourage those who have studied abroad to <b>return home</b>. China and India have attracted many members of their <b>diaspora</b> back in this way.","In conclusion, <b>brain drain</b> results from economic, professional and social factors. By offering fair rewards and real opportunities, developing countries can encourage more of their most talented citizens to build their careers at home."]},{"label":"BAND 9 ESSAY","words":364,"paras":["Developing countries lose a significant proportion of their most highly educated citizens each year to wealthier nations, a phenomenon widely termed <b>brain drain</b>. <b>Skilled professionals leave mainly for higher salaries and better working conditions, and governments can encourage them to stay by improving pay, research facilities and quality of life.</b>","The financial motive is the most obvious. A doctor or software engineer in North America or Western Europe may <b>earn many times more</b> than at home, a difference that can transform a family's prospects. Yet salary alone does not explain the phenomenon. Many researchers <b>emigrate</b> because of a lack of <b>research facilities</b>, funding and access to the latest equipment, which makes ambitious work almost impossible. Institutional problems also play a major part: where <b>career progression</b> depends on personal connections or political loyalty rather than being <b>based on merit</b>, talented individuals understandably <b>feel undervalued</b>, and excessive <b>bureaucracy</b> compounds their frustration. Beyond the workplace, concerns about <b>political instability</b>, pollution and the quality of schools lead many parents to move abroad to secure <b>a better future for their children</b>. The cost to the home country is considerable, since <b>public investment</b> in education ultimately benefits foreign economies, and shortages of <b>doctors</b> and teachers undermine public services.","Reversing this trend requires a comprehensive strategy. Governments should offer competitive <b>salaries</b> in critical professions such as medicine, teaching and scientific research, even if they cannot match Western levels. Equally important is to <b>invest in research</b> infrastructure, including modern universities, laboratories and hospitals, so that professionals can pursue meaningful careers without leaving. Institutional reform is essential as well: transparent, <b>meritocratic</b> recruitment and promotion would give young professionals confidence that effort will be rewarded. Finally, targeted <b>incentives</b>, such as <b>tax breaks</b>, research grants and fast-track appointments, can encourage <b>return migration</b>. China and India have successfully turned <b>brain drain</b> into <b>brain gain</b> by attracting members of their <b>diaspora</b> home, and even those who remain abroad can contribute through investment, <b>remittances</b> and online collaboration.","In conclusion, <b>brain drain</b> stems from a combination of economic, institutional and social factors. By addressing all of them, developing countries can not only retain more of their talent but also transform their <b>diaspora</b> into a source of expertise and investment."]}],"type":"Causes and solutions","q":"Many highly educated people from developing countries move to developed countries to work. What are the reasons for this, and what can be done to encourage them to stay in their home countries?"},{"n":32,"title":"Government funding for the arts","cat":"Government & Media","groups":[{"name":"Reasons to Agree","bn":"একমত হওয়ার কারণ","items":[{"en":"The arts preserve a nation's cultural heritage and identity.","bn":"শিল্পকলা একটি জাতির সাংস্কৃতিক ঐতিহ্য ও পরিচয় সংরক্ষণ করে।"},{"en":"Many traditional art forms cannot survive without public support.","bn":"অনেক ঐতিহ্যবাহী শিল্পরূপ সরকারি সহায়তা ছাড়া টিকে থাকতে পারে না।"},{"en":"Festivals, theatres and museums attract tourists and create jobs.","bn":"উৎসব, থিয়েটার ও জাদুঘর পর্যটক আকর্ষণ করে ও কর্মসংস্থান তৈরি করে।"},{"en":"Art and music improve people's mental well-being and quality of life.","bn":"শিল্প ও সংগীত মানুষের মানসিক সুস্থতা ও জীবনযাত্রার মান উন্নত করে।"},{"en":"Arts funding is only a tiny share of most government budgets.","bn":"শিল্পকলার অর্থায়ন বেশিরভাগ সরকারি বাজেটের খুব সামান্য অংশ।"}]},{"name":"Reasons to Disagree","bn":"দ্বিমত পোষণের কারণ","items":[{"en":"Health and education are basic needs and must come first.","bn":"স্বাস্থ্য ও শিক্ষা মৌলিক চাহিদা এবং এগুলোকে আগে আসতে হবে।"},{"en":"Many hospitals and schools are still underfunded.","bn":"অনেক হাসপাতাল ও স্কুল এখনো অর্থসংকটে।"},{"en":"Popular art can survive through ticket sales and private sponsors.","bn":"জনপ্রিয় শিল্প টিকিট বিক্রি ও বেসরকারি পৃষ্ঠপোষকতার মাধ্যমে টিকে থাকতে পারে।"},{"en":"Taxpayers should not pay for art that only a small group enjoys.","bn":"করদাতাদের এমন শিল্পের খরচ দেওয়া উচিত নয় যা শুধু একটি ছোট গোষ্ঠী উপভোগ করে।"},{"en":"In poorer countries, arts spending can seem like a luxury.","bn":"দরিদ্র দেশে শিল্পকলায় ব্যয় বিলাসিতা মনে হতে পারে।"}]},{"name":"Evaluation: My Answer","bn":"মূল্যায়ন — আমার উত্তর","items":[{"en":"I agree that governments should fund the arts, although public services such as health and education must remain the top priority.","bn":"আমি একমত যে সরকারের শিল্পকলায় অর্থায়ন করা উচিত, যদিও স্বাস্থ্য ও শিক্ষার মতো সরকারি সেবা শীর্ষ অগ্রাধিকার থাকতে হবে।"},{"en":"I strongly agree that funding the arts is a worthwhile investment, because culture brings social and economic benefits.","bn":"আমি দৃঢ়ভাবে একমত যে শিল্পকলায় অর্থায়ন একটি সার্থক বিনিয়োগ, কারণ সংস্কৃতি সামাজিক ও অর্থনৈতিক সুফল আনে।"}]}],"vocab":[["the arts","শিল্পকলা"],["public services","সরকারি সেবা"],["funding","অর্থায়ন"],["cultural heritage","সাংস্কৃতিক ঐতিহ্য"],["artists","শিল্পী"],["tourism","পর্যটন"],["creative industries","সৃজনশীল শিল্প"],["priority","অগ্রাধিকার"],["budget","বাজেট"],["well-being","সুস্থতা"],["national identity","জাতীয় পরিচয়"],["private sponsors","বেসরকারি পৃষ্ঠপোষক"],["commercial","বাণিজ্যিক"],["luxury","বিলাসিতা"]],"phrases":[["a tiny share of the budget","বাজেটের খুব সামান্য অংশ"],["basic needs","মৌলিক চাহিদা"],["bring people together","মানুষকে একত্র করা"],["create jobs","কর্মসংস্থান তৈরি করা"],["survive without support","সহায়তা ছাড়া টিকে থাকা"],["keep traditions alive","ঐতিহ্য টিকিয়ে রাখা"],["attract tourists","পর্যটক আকর্ষণ করা"],["a matter of priorities","অগ্রাধিকারের বিষয়"],["enrich people's lives","মানুষের জীবন সমৃদ্ধ করা"],["not a luxury but a necessity","বিলাসিতা নয়, প্রয়োজন"]],"sents":[{"en":"Health and education are basic needs and must come first.","bn":"স্বাস্থ্য ও শিক্ষা মৌলিক চাহিদা এবং এগুলোকে আগে আসতে হবে।"},{"en":"However, arts funding usually takes up only a tiny share of the budget.","bn":"তবে শিল্পকলার অর্থায়ন সাধারণত বাজেটের খুব সামান্য অংশ নেয়।"},{"en":"The arts help to keep traditions alive and strengthen national identity.","bn":"শিল্পকলা ঐতিহ্য টিকিয়ে রাখতে ও জাতীয় পরিচয় শক্তিশালী করতে সাহায্য করে।"},{"en":"Many traditional art forms cannot survive without support.","bn":"অনেক ঐতিহ্যবাহী শিল্পরূপ সহায়তা ছাড়া টিকে থাকতে পারে না।"},{"en":"Festivals and theatres attract tourists and create jobs.","bn":"উৎসব ও থিয়েটার পর্যটক আকর্ষণ করে এবং কর্মসংস্থান তৈরি করে।"},{"en":"Music and art enrich people's lives and improve their well-being.","bn":"সংগীত ও চিত্রকলা মানুষের জীবন সমৃদ্ধ করে ও সুস্থতা বাড়ায়।"},{"en":"Cultural events bring people together from different backgrounds.","bn":"সাংস্কৃতিক অনুষ্ঠান বিভিন্ন প্রেক্ষাপটের মানুষকে একত্র করে।"},{"en":"Without public funding, only commercial art would survive.","bn":"সরকারি অর্থায়ন ছাড়া শুধু বাণিজ্যিক শিল্পই টিকে থাকত।"}],"xvocab":[["folk art","লোকশিল্প"],["cultural diplomacy","সাংস্কৃতিক কূটনীতি"],["social cohesion","সামাজিক সংহতি"],["therapeutic","প্রশান্তিদায়ক / আরোগ্যদায়ক"],["opportunity cost","সুযোগ ব্যয়"],["grassroots artists","তৃণমূল শিল্পী"],["soft power","নরম শক্তি"],["public-private partnership","সরকারি-বেসরকারি অংশীদারত্ব"]],"xsents":[{"en":"Folk art forms such as jatra are disappearing without support.","bn":"যাত্রার মতো লোকশিল্প সহায়তা ছাড়া হারিয়ে যাচ্ছে।"},{"en":"Every taka spent on the arts has an opportunity cost.","bn":"শিল্পকলায় ব্যয় করা প্রতিটি টাকার একটি সুযোগ ব্যয় আছে।"},{"en":"Culture is a powerful tool of soft power and cultural diplomacy.","bn":"সংস্কৃতি নরম শক্তি ও সাংস্কৃতিক কূটনীতির শক্তিশালী হাতিয়ার।"},{"en":"Public-private partnerships can reduce the cost to taxpayers.","bn":"সরকারি-বেসরকারি অংশীদারত্ব করদাতাদের ব্যয় কমাতে পারে।"}],"essays":[{"label":"BASIC ESSAY (BAND 5–6)","words":261,"paras":["Some people think the government should spend money on <b>the arts</b>, like music, theatre and painting, but others think this money should go to health and education. <b>I agree that governments should fund the arts, although public services such as health and education must remain the top priority.</b>","It is true that health and education are very important. People need good hospitals when they are sick, and children need good schools to have a good future. In developing countries like Bangladesh, many hospitals and schools still do not have enough money. So the government must spend most of its money on these services.","However, I believe <b>the arts</b> also need some support. Firstly, <b>the arts</b> are an important part of our culture and history. Traditional music, dance and crafts show who we are as a nation. Many traditional art forms, like folk music and jatra, are disappearing because they do not make much money. If the government helps <b>artists</b>, these traditions can continue. Secondly, <b>the arts</b> are good for the economy. Festivals, museums and concerts <b>attract tourists</b> and <b>create jobs</b>. Thirdly, art and music make people happy and help them to relax. They also <b>bring people together</b> at cultural events.","Also, the government does not need to spend a lot of money on <b>the arts</b>. A small amount is enough, and private companies can also help.","In conclusion, I believe that health and education should come first, but the government should also spend some money on <b>the arts</b>, because they protect our culture, help the economy and make people's lives better."]},{"label":"ADVANCED ESSAY (BAND 7)","words":268,"paras":["There is debate about whether public money should support <b>the arts</b> or be spent entirely on essential services such as healthcare and education. <b>I agree that governments should fund the arts, although public services such as health and education must remain the top priority.</b>","Those who oppose arts <b>funding</b> have a strong argument. Health and education are <b>basic needs</b>, and in many countries hospitals are overcrowded and schools lack resources. From this perspective, spending money on theatres or galleries while patients wait for treatment seems difficult to justify, and some view <b>the arts</b> as a <b>luxury</b> that should rely on ticket sales and <b>private sponsors</b>.","Nevertheless, I believe <b>the arts</b> deserve public support for several reasons. Firstly, arts <b>funding</b> usually takes up only <b>a tiny share of the budget</b>, so it does not seriously reduce spending on <b>public services</b>. Secondly, <b>the arts</b> play a vital role in preserving <b>cultural heritage</b>. Many traditional art forms, such as folk music or jatra theatre in Bangladesh, cannot <b>survive without support</b> in a market dominated by <b>commercial</b> entertainment. Thirdly, <b>the arts</b> bring economic benefits: festivals and cultural sites <b>attract tourists</b> and <b>create jobs</b> in the <b>creative industries</b>. Finally, art and music <b>enrich people's lives</b>, improve their <b>well-being</b> and <b>bring people together</b> from different backgrounds, which strengthens communities and <b>national identity</b>.","Admittedly, governments must spend wisely, and <b>funding</b> could be shared with <b>private sponsors</b> to reduce the burden on taxpayers.","In conclusion, although health and education should always be prioritised, I believe governments should continue to fund <b>the arts</b>, as the cultural, social and economic benefits are well worth the relatively modest cost."]},{"label":"BAND 9 ESSAY","words":347,"paras":["Governments face constant pressure to justify every item of public expenditure, and <b>funding</b> for music, theatre and the visual arts is often among the first to be questioned. <b>I agree that governments should fund the arts, although public services such as health and education must remain the top priority.</b>","The case against arts <b>funding</b> is understandable. Health and education address <b>basic needs</b>, and in countries where hospitals are overstretched and schools under-resourced, it may appear irresponsible to devote public money to opera houses or galleries. Every taka spent on culture has an <b>opportunity cost</b>, and critics argue that <b>the arts</b>, if valued by the public, should be able to sustain themselves through ticket sales and <b>private sponsors</b> rather than relying on taxpayers.","Nevertheless, I believe this view underestimates both the modest cost and the substantial value of <b>the arts</b>. In most countries, arts <b>funding</b> accounts for only <b>a tiny share of the budget</b>, so redirecting it would make little difference to hospitals or schools, whereas withdrawing it could be devastating for cultural life. Without public support, the market would favour only commercially successful entertainment, and many traditional art forms would simply disappear; in Bangladesh, <b>folk art</b> such as jatra theatre and rural folk music already struggles to survive alongside digital entertainment. <b>The arts</b> also yield tangible economic returns, as festivals, museums and heritage sites <b>attract tourists</b> and sustain employment in the <b>creative industries</b>. Beyond economics, <b>the arts</b> <b>enrich people's lives</b>, have well-documented <b>therapeutic</b> effects on mental <b>well-being</b> and <b>bring people together</b> across social divides, fostering <b>social cohesion</b> and a shared <b>national identity</b>. Internationally, culture is also a valuable source of <b>soft power</b>, shaping how a nation is perceived abroad.","That said, public money should be spent efficiently, and public-private partnerships can help to share the cost, while support should prioritise <b>grassroots artists</b> and heritage rather than only prestigious institutions.","In conclusion, while health and education must remain the foremost <b>priorities</b>, a modest and well-targeted investment in <b>the arts</b> is fully justified. A society that neglects its culture becomes poorer in ways that no <b>budget</b> sheet can measure."]}],"type":"Opinion (Agree / Disagree)","q":"Some people think that governments should spend money on the arts, such as music, theatre and painting, while others believe this money should be spent on public services like health and education. To what extent do you agree that governments should fund the arts?"},{"n":33,"title":"Spending on space exploration","cat":"Government & Media","groups":[{"name":"Reasons to Agree","bn":"একমত হওয়ার কারণ","items":[{"en":"Millions of people still lack food, clean water and healthcare.","bn":"লাখ লাখ মানুষ এখনো খাদ্য, বিশুদ্ধ পানি ও স্বাস্থ্যসেবা থেকে বঞ্চিত।"},{"en":"The money spent on one mission could build many schools and hospitals.","bn":"একটি অভিযানে ব্যয় করা অর্থ দিয়ে অনেক স্কুল ও হাসপাতাল তৈরি করা যেত।"},{"en":"Climate change is an urgent problem that needs funding now.","bn":"জলবায়ু পরিবর্তন একটি জরুরি সমস্যা যার জন্য এখনই অর্থায়ন প্রয়োজন।"},{"en":"Some space missions are mainly about national prestige.","bn":"কিছু মহাকাশ অভিযান মূলত জাতীয় মর্যাদার জন্য।"},{"en":"The practical benefits of exploring distant planets are uncertain.","bn":"দূরবর্তী গ্রহ অনুসন্ধানের ব্যবহারিক সুফল অনিশ্চিত।"}]},{"name":"Reasons to Disagree","bn":"দ্বিমত পোষণের কারণ","items":[{"en":"Satellites are essential for communication, navigation and weather forecasting.","bn":"যোগাযোগ, পথনির্দেশনা ও আবহাওয়ার পূর্বাভাসের জন্য কৃত্রিম উপগ্রহ অপরিহার্য।"},{"en":"Satellite data helps warn people about cyclones and saves lives.","bn":"কৃত্রিম উপগ্রহের তথ্য মানুষকে ঘূর্ণিঝড় সম্পর্কে সতর্ক করে এবং জীবন বাঁচায়।"},{"en":"Space technology helps scientists monitor climate change.","bn":"মহাকাশ প্রযুক্তি বিজ্ঞানীদের জলবায়ু পরিবর্তন পর্যবেক্ষণে সাহায্য করে।"},{"en":"Many everyday technologies were first developed for space programmes.","bn":"দৈনন্দিন অনেক প্রযুক্তি প্রথমে মহাকাশ কর্মসূচির জন্য তৈরি হয়েছিল।"},{"en":"Space exploration inspires young people to study science and engineering.","bn":"মহাকাশ অনুসন্ধান তরুণদের বিজ্ঞান ও প্রকৌশল পড়তে অনুপ্রাণিত করে।"}]},{"name":"Evaluation: My Answer","bn":"মূল্যায়ন — আমার উত্তর","items":[{"en":"I disagree that space exploration is a waste of money, because it brings scientific and practical benefits that help solve problems on Earth.","bn":"আমি একমত নই যে মহাকাশ অনুসন্ধান অর্থের অপচয়, কারণ এটি এমন বৈজ্ঞানিক ও ব্যবহারিক সুবিধা আনে যা পৃথিবীর সমস্যা সমাধানে সাহায্য করে।"},{"en":"I partly agree: problems on Earth should be the priority, but a reasonable level of space research is still worthwhile.","bn":"আমি আংশিক একমত: পৃথিবীর সমস্যাগুলোই অগ্রাধিকার পাওয়া উচিত, তবে যুক্তিসংগত মাত্রায় মহাকাশ গবেষণাও সার্থক।"}]}],"vocab":[["space exploration","মহাকাশ অনুসন্ধান"],["satellites","কৃত্রিম উপগ্রহ"],["weather forecasting","আবহাওয়ার পূর্বাভাস"],["technology","প্রযুক্তি"],["scientific research","বৈজ্ঞানিক গবেষণা"],["poverty","দারিদ্র্য"],["climate change","জলবায়ু পরিবর্তন"],["innovation","উদ্ভাবন"],["budget","বাজেট"],["astronauts","মহাকাশচারী"],["natural disasters","প্রাকৃতিক দুর্যোগ"],["communication","যোগাযোগ"],["inspire","অনুপ্রাণিত করা"],["private companies","বেসরকারি কোম্পানি"]],"phrases":[["problems on Earth","পৃথিবীর সমস্যা"],["a waste of money","অর্থের অপচয়"],["urgent needs","জরুরি প্রয়োজন"],["everyday life","দৈনন্দিন জীবন"],["warn people about cyclones","মানুষকে ঘূর্ণিঝড় সম্পর্কে সতর্ক করা"],["monitor climate change","জলবায়ু পরিবর্তন পর্যবেক্ষণ করা"],["a small fraction of","... এর সামান্য অংশ"],["inspire young people","তরুণদের অনুপ্রাণিত করা"],["in the long term","দীর্ঘমেয়াদে"],["not an either-or choice","হয়-এটা-নয়-ওটা বেছে নেওয়ার বিষয় নয়"]],"sents":[{"en":"Millions of people still live in poverty and lack clean water.","bn":"লাখ লাখ মানুষ এখনো দারিদ্র্যে বাস করে এবং বিশুদ্ধ পানি থেকে বঞ্চিত।"},{"en":"Some argue that sending rockets into space is a waste of money.","bn":"কেউ কেউ বলেন মহাকাশে রকেট পাঠানো অর্থের অপচয়।"},{"en":"However, satellites are essential for weather forecasting and communication.","bn":"তবে আবহাওয়ার পূর্বাভাস ও যোগাযোগের জন্য কৃত্রিম উপগ্রহ অপরিহার্য।"},{"en":"Satellite data helps to warn people about cyclones and floods.","bn":"কৃত্রিম উপগ্রহের তথ্য মানুষকে ঘূর্ণিঝড় ও বন্যা সম্পর্কে সতর্ক করতে সাহায্য করে।"},{"en":"Scientists also use satellites to monitor climate change.","bn":"বিজ্ঞানীরা জলবায়ু পরিবর্তন পর্যবেক্ষণেও কৃত্রিম উপগ্রহ ব্যবহার করেন।"},{"en":"Many technologies used in everyday life were first developed for space programmes.","bn":"দৈনন্দিন জীবনে ব্যবহৃত অনেক প্রযুক্তি প্রথমে মহাকাশ কর্মসূচির জন্য তৈরি হয়েছিল।"},{"en":"Space budgets are only a small fraction of total government spending.","bn":"মহাকাশ বাজেট মোট সরকারি ব্যয়ের সামান্য অংশ মাত্র।"},{"en":"Space missions inspire young people to study science.","bn":"মহাকাশ অভিযান তরুণদের বিজ্ঞান পড়তে অনুপ্রাণিত করে।"}],"xvocab":[["spin-off technologies","উপজাত প্রযুক্তি"],["GPS","জিপিএস / অবস্থান নির্ণয় প্রযুক্তি"],["early warning systems","আগাম সতর্কতা ব্যবস্থা"],["prestige project","মর্যাদার প্রকল্প"],["STEM careers","বিজ্ঞান-প্রযুক্তি পেশা"],["humanitarian crises","মানবিক সংকট"],["Bangabandhu Satellite","বঙ্গবন্ধু স্যাটেলাইট"],["commercialisation","বাণিজ্যিকীকরণ"]],"xsents":[{"en":"GPS and water purification systems are examples of spin-off technologies.","bn":"জিপিএস ও পানি বিশুদ্ধকরণ ব্যবস্থা উপজাত প্রযুক্তির উদাহরণ।"},{"en":"Satellite-based early warning systems have saved thousands of lives in Bangladesh.","bn":"কৃত্রিম উপগ্রহভিত্তিক আগাম সতর্কতা ব্যবস্থা বাংলাদেশে হাজার হাজার জীবন বাঁচিয়েছে।"},{"en":"Some space missions are little more than prestige projects.","bn":"কিছু মহাকাশ অভিযান মর্যাদার প্রকল্পের চেয়ে বেশি কিছু নয়।"},{"en":"The commercialisation of space is reducing the cost for governments.","bn":"মহাকাশের বাণিজ্যিকীকরণ সরকারের ব্যয় কমাচ্ছে।"}],"essays":[{"label":"BASIC ESSAY (BAND 5–6)","words":256,"paras":["Some people think that governments spend too much money on <b>space exploration</b>, and they should use this money to solve <b>problems on Earth</b>. <b>I disagree that space exploration is a waste of money, because it brings scientific and practical benefits that help solve problems on Earth.</b>","It is true that there are many <b>problems on Earth</b>. Many people are poor and hungry, and many children do not go to school. Diseases and <b>climate change</b> are also big problems. So some people think that spending money on rockets is not important.","However, I believe <b>space exploration</b> is useful for people on Earth. Firstly, <b>satellites</b> help us in <b>everyday life</b>. We use them for mobile phones, the internet, TV and maps on our phones. Secondly, <b>satellites</b> help us predict the weather. In Bangladesh, <b>satellites</b> help the government <b>warn people about cyclones</b> and floods, so people can go to safe places. This saves many lives. Thirdly, <b>satellites</b> help scientists study <b>climate change</b> and pollution. Also, many things we use today, like some medical equipment, were first made for space programmes. Finally, <b>space exploration</b> makes young people interested in science and <b>technology</b>.","In addition, governments do not spend very much money on space compared to other things. They can spend money on space and also help poor people at the same time.","In conclusion, I do not agree that <b>space exploration</b> is <b>a waste of money</b>. It gives us useful <b>technology</b>, helps us protect people from disasters and <b>inspires young people</b>, so it helps to solve <b>problems on Earth</b> too."]},{"label":"ADVANCED ESSAY (BAND 7)","words":269,"paras":["It is sometimes argued that the vast sums spent on <b>space exploration</b> would be better used to tackle <b>problems on Earth</b>. <b>I disagree that space exploration is a waste of money, because it brings scientific and practical benefits that help solve problems on Earth.</b>","The argument against space spending is understandable. Millions of people still live in <b>poverty</b>, lack clean water and die from preventable diseases, while <b>climate change</b> threatens entire regions. Compared with these <b>urgent needs</b>, sending <b>astronauts</b> to the Moon or robots to Mars can seem like an expensive luxury.","However, this view overlooks the practical benefits of space research. Firstly, <b>satellites</b> are essential for modern life, supporting <b>communication</b>, navigation and <b>weather forecasting</b>. For a disaster-prone country like Bangladesh, satellite data helps to <b>warn people about cyclones</b> and floods, and improved <b>early warning systems</b> have saved thousands of lives. Secondly, <b>satellites</b> allow scientists to <b>monitor climate change</b>, tracking melting ice, rising sea levels and deforestation, so space research directly helps us understand one of the greatest <b>problems on Earth</b>. Thirdly, many <b>technologies</b> used in <b>everyday life</b>, such as <b>GPS</b>, water purification systems and certain medical devices, were first developed for space programmes. Finally, space missions <b>inspire young people</b> to pursue careers in science and engineering, which benefits the economy <b>in the long term</b>.","Moreover, space <b>budgets</b> are only <b>a small fraction of</b> total government spending, and increasingly <b>private companies</b> share the cost. Therefore, funding <b>space exploration</b> is <b>not an either-or choice</b> with solving earthly problems.","In conclusion, I believe that spending on <b>space exploration</b> is justified, as it produces <b>technology</b> and knowledge that improve life on Earth."]},{"label":"BAND 9 ESSAY","words":349,"paras":["Critics of space programmes frequently argue that governments squander vast sums on exploring distant worlds while pressing <b>problems on Earth</b> remain unsolved. <b>I disagree that space exploration is a waste of money, because it brings scientific and practical benefits that help solve problems on Earth.</b>","The critics' position has undeniable moral force. Hundreds of millions of people continue to live in <b>poverty</b>, without access to clean water, adequate healthcare or education, and the effects of <b>climate change</b> are intensifying. Set against such <b>urgent needs</b>, a single mission to Mars costing billions of dollars can appear to be an indulgence, and some missions are admittedly little more than prestige projects designed to showcase national power.","Nevertheless, this argument rests on a misunderstanding of what space programmes actually deliver. <b>Satellites</b> have become part of the invisible infrastructure of modern life, underpinning telecommunications, navigation and <b>weather forecasting</b>. For a low-lying, cyclone-prone country such as Bangladesh, satellite-based <b>early warning systems</b> are a matter of life and death; the dramatic fall in cyclone fatalities over recent decades owes a great deal to accurate forecasting that would be impossible without space <b>technology</b>. <b>Satellites</b> are equally indispensable for <b>monitoring climate change</b>, providing the data on ice loss, sea-level rise and deforestation on which international climate policy depends. In this sense, space research is not a distraction from Earth's problems but one of our most powerful tools for addressing them. Moreover, space programmes have generated numerous <b>spin-off technologies</b>, from <b>GPS</b> to water purification systems and advances in medical imaging, and they play a unique role in <b>inspiring young people</b> to pursue <b>STEM careers</b>, strengthening the scientific base of entire economies.","It is also worth putting the costs into perspective: space <b>budgets</b> represent only <b>a small fraction of</b> total public expenditure, and the growing <b>commercialisation</b> of space is shifting much of the cost to <b>private companies</b>. Funding exploration is therefore <b>not an either-or choice</b> with tackling <b>poverty</b> or disease.","In conclusion, although governments must prioritise urgent human needs, investment in <b>space exploration</b> is justified, since the knowledge and <b>technology</b> it produces improve, and indeed save, lives on Earth."]}],"type":"Opinion (Agree / Disagree)","q":"Some people believe that governments spend too much money on space exploration and that this money should be used to solve problems on Earth. To what extent do you agree or disagree?"},{"n":34,"title":"Banning advertising aimed at children","cat":"Government & Media","groups":[{"name":"Reasons to Agree","bn":"একমত হওয়ার কারণ","items":[{"en":"Young children cannot understand that adverts are designed to persuade them.","bn":"ছোট শিশুরা বুঝতে পারে না যে বিজ্ঞাপন তাদের প্ররোচিত করার জন্য তৈরি।"},{"en":"Children pressure their parents to buy advertised products.","bn":"শিশুরা বিজ্ঞাপিত পণ্য কিনতে বাবা-মায়ের ওপর চাপ দেয়।"},{"en":"Adverts for snacks and soft drinks encourage unhealthy eating.","bn":"নাশতা ও কোমল পানীয়ের বিজ্ঞাপন অস্বাস্থ্যকর খাদ্যাভ্যাসকে উৎসাহিত করে।"},{"en":"Children from poorer families may feel left out when they cannot have advertised toys.","bn":"দরিদ্র পরিবারের শিশুরা বিজ্ঞাপিত খেলনা না পেল ৌশলে প্রভাবিত করা"],["consumers","ভোক্তা"],["enforce","প্রয়োগ করা"]],"phrases":[["cannot tell the difference between","পার্থক্য বুঝতে না পারা"],["put pressure on their parents","বাবা-মায়ের ওপর চাপ সৃষ্টি করা"],["unhealthy eating habits","অস্বাস্থ্যকর খাদ্যাভ্যাস"],["feel left out","বাদ পড়া বোধ করা"],["take advantage of","সুযোগ নেওয়া"],["at a young age","অল্প বয়সে"],["the responsibility of parents","বাবা-মায়ের দায়িত্ব"],["follow the example of","... এর দৃষ্টান্ত অনুসরণ করা"],["a step in the right direction","সঠিক পথে এক পদক্ষেপ"],["difficult to control online","অনলাইনে নিয়ন্ত্রণ করা কঠিন"]],"sents":[{"en":"Young children often cannot tell the difference between a programme and an advert.","bn":"ছোট শিশুরা প্রায়ই অনুষ্ঠান ও বিজ্ঞাপনের পার্থক্য বুঝতে পারে না।"},{"en":"Advertisers take advantage of children's trust and imagination.","bn":"বিজ্ঞাপনদাতারা শিশুদের বিশ্বাস ও কল্পনার সুযোগ নেয়।"},{"en":"Children put pressure on their parents to buy the products they see.","bn":"শিশুরা যা দেখে সেই পণ্য কিনতে বাবা-মায়ের ওপর চাপ সৃষ্টি করে।"},{"en":"Adverts for snacks and soft drinks encourage unhealthy eating habits.","bn":"নাশতা ও কোমল পানীয়ের বিজ্ঞাপন অস্বাস্থ্যকর খাদ্যাভ্যাসকে উৎসাহিত করে।"},{"en":"Children from poorer families may feel left out if they cannot have what they see.","bn":"দরিদ্র পরিবারের শিশুরা যা দেখে তা না পেলে বাদ পড়া বোধ করতে পারে।"},{"en":"Some argue that controlling what children watch is the responsibility of parents.","bn":"কেউ কেউ বলেন শিশুরা কী দেখে তা নিয়ন্ত্রণ করা বাবা-মায়ের দায়িত্ব।"},{"en":"Advertising on social media and games is difficult to control online.","bn":"সামাজিক মাধ্যম ও গেমের বিজ্ঞাপন অনলাইনে নিয়ন্ত্রণ করা কঠিন।"},{"en":"Countries such as Sweden and Norway already ban TV adverts aimed at young children.","bn":"সুইডেন ও নরওয়ের মতো দেশ ইতোমধ্যে ছোট শিশুদের লক্ষ্য করে টিভি বিজ্ঞাপন নিষিদ্ধ করেছে।"}],"xvocab":[["impressionable","সহজে প্রভাবিত হয় এমন"],["consumer culture","ভোগবাদী সংস্কৃতি"],["loopholes","ফাঁকফোকর"],["product placement","অনুষ্ঠানের ভেতরে পণ্যের প্রচার"],["unboxing videos","পণ্য খোলার ভিডিও"],["self-regulation","স্ব-নিয়ন্ত্রণ"],["exploitative","শোষণমূলক"],["media literacy","গণমাধ্যম সাক্ষরতা"]],"xsents":[{"en":"Unboxing videos are advertisements disguised as entertainment.","bn":"পণ্য খোলার ভিডিও আসলে বিনোদনের ছদ্মবেশে বিজ্ঞাপন।"},{"en":"Industry self-regulation has largely failed to protect children.","bn":"শিল্পখাতের স্ব-নিয়ন্ত্রণ শিশুদের রক্ষায় মূলত ব্যর্থ হয়েছে।"},{"en":"Schools should teach media literacy so that children recognise advertising.","bn":"স্কুলের উচিত গণমাধ্যম সাক্ষরতা শেখানো যাতে শিশুরা বিজ্ঞাপন চিনতে পারে।"},{"en":"Impressionable young viewers are easily drawn into consumer culture.","bn":"সহজে প্রভাবিত হওয়া ছোট দর্শকরা সহজেই ভোগবাদী সংস্কৃতিতে জড়িয়ে পড়ে।"}],"essays":[{"label":"BASIC ESSAY (BAND 5–6)","words":263,"paras":["Some people think that advertisements for children, such as adverts for toys, snacks and games, should be banned. <b>I strongly agree that advertising aimed at children should be banned, because children cannot understand its persuasive purpose.</b>","The first reason is that children are easy to influence. Young children believe what they see on TV or YouTube. They do not understand that adverts are made to sell things. When they see a colourful advert for a toy, they think they must have it. Then they ask their parents again and again, and sometimes they cry until the parents buy it. This makes life difficult for parents, especially poor parents who cannot afford expensive toys. Children who cannot have these toys may feel sad.","The second reason is health. Many adverts for children are for chips, chocolates, soft drinks and fast food. These foods have a lot of sugar and fat. When children see these adverts, they want to eat unhealthy food, and this can cause <b>obesity</b> and other health problems. Also, some online games show adverts that ask children to buy things inside the game.","Some people say that parents should control what children watch, not the government. It is true that parents are important, but they cannot watch their children all the time, especially online. Some countries, like Sweden, have already banned adverts for young children, and this shows that it is possible.","In conclusion, I believe <b>advertising</b> for children should be banned, because it <b>takes advantage of</b> children, puts pressure on parents and encourages unhealthy eating. Children should be protected from this."]},{"label":"ADVANCED ESSAY (BAND 7)","words":273,"paras":["It has been suggested that all <b>advertising</b> targeted at children, whether for toys, snacks or games, should be prohibited. <b>I strongly agree that advertising aimed at children should be banned, because children cannot understand its persuasive purpose.</b>","The main reason for my view is that children are especially <b>vulnerable</b>. Young children often <b>cannot tell the difference between</b> a programme and an advert, and they tend to believe what they are told. Advertisers deliberately <b>take advantage of</b> this trust by using cartoon characters, bright colours and catchy songs. As a result, children <b>put pressure on their parents</b> to buy the products they see, a phenomenon known as <b>pester power</b>. This causes conflict in families and can be particularly hard for low-income parents, whose children may <b>feel left out</b> if they cannot have the latest toy.","Another important reason is health. A large proportion of <b>advertising</b> aimed at children promotes snacks, sweets and soft drinks, which encourage <b>unhealthy eating habits</b> and contribute to rising childhood <b>obesity</b>. In addition, online games increasingly use adverts to encourage <b>in-app purchases</b>, which can lead children to spend money without understanding its value.","Opponents argue that controlling what children watch is <b>the responsibility of parents</b>, and that a ban would be difficult to <b>enforce</b>, especially online. While these points have some validity, parents cannot supervise every screen, and <b>self-regulation</b> by companies has not worked. Countries such as Sweden and Norway already ban TV adverts aimed at young children, which shows that such rules are practical.","In conclusion, I firmly believe that <b>advertising</b> aimed at children should be banned, since it exploits their inexperience, strains family budgets and harms their health."]},{"label":"BAND 9 ESSAY","words":368,"paras":["<b>Advertising</b> directed at children, from toys and sugary snacks to mobile games, has become a pervasive feature of both television and the internet, and there are growing calls for it to be prohibited. <b>I strongly agree that advertising aimed at children should be banned, because children cannot understand its persuasive purpose.</b>","The fundamental problem is that children are uniquely <b>vulnerable</b> <b>consumers</b>. Research suggests that young children often <b>cannot tell the difference between</b> a programme and an advert, and even older children rarely grasp that <b>advertising</b> is designed to <b>manipulate</b> their desires. Advertisers deliberately <b>take advantage of</b> this, deploying cartoon mascots, collectible offers and catchy jingles to target <b>impressionable</b> minds. Such techniques are arguably <b>exploitative</b>, since they are aimed at an audience that lacks the maturity to evaluate them critically. The effects extend into the home through what marketers call <b>pester power</b>: children <b>put pressure on their parents</b> to buy advertised products, causing conflict and placing a particular strain on low-income families, whose children may <b>feel left out</b> and inferior when they cannot own what they see.","The health implications are equally serious. A substantial share of child-targeted <b>advertising</b> promotes calorie-dense snacks, sweets and soft drinks, encouraging <b>unhealthy eating habits</b> at the very age when lifelong preferences are formed, and contributing to the global rise in childhood <b>obesity</b>. Meanwhile, the digital environment has created new forms of marketing, such as <b>unboxing videos</b> by child <b>influencers</b> and games engineered to prompt <b>in-app purchases</b>, which blur the line between entertainment and <b>advertising</b> still further.","Critics object that supervising children's media consumption is <b>the responsibility of parents</b>, and that a ban would be <b>difficult to control online</b>. These concerns are not trivial, but parents cannot realistically monitor every screen, and decades of industry <b>self-regulation</b> have done little to protect children. The experience of Sweden and Norway, which have long banned television <b>advertising</b> aimed at young children, demonstrates that such restrictions are workable, and a ban could be complemented by teaching <b>media literacy</b> in schools.","In conclusion, I am convinced that <b>advertising</b> aimed at children should be banned. Protecting young people from commercial manipulation is a legitimate role for the state, and one that serves both their wellbeing and that of their families."]}],"type":"Opinion (Agree / Disagree)","q":"Advertising aimed at children, such as adverts for toys, snacks and games, should be banned. To what extent do you agree or disagree?"},{"n":35,"title":"Why the news is mostly negative","cat":"Government & Media","groups":[{"name":"Question 1: Reasons","bn":"প্রশ্ন ১ — কারণ","items":[{"en":"Shocking stories attract more viewers, readers and clicks.","bn":"চমকপ্রদ খবর আরও বেশি দর্শক, পাঠক ও ক্লিক আকর্ষণ করে।"},{"en":"More viewers mean more advertising revenue for news companies.","bn":"বেশি দর্শক মানে সংবাদ প্রতিষ্ঠানের জন্য বেশি বিজ্ঞাপন আয়।"},{"en":"Intense competition pushes news outlets to find the most dramatic stories.","bn":"তীব্র প্রতিযোগিতা সংবাদমাধ্যমকে সবচেয়ে নাটকীয় খবর খুঁজতে বাধ্য করে।"},{"en":"People naturally pay more attention to danger than to good news.","bn":"মানুষ স্বাভাবিকভাবে ভালো খবরের চেয়ে বিপদের দিকে বেশি মনোযোগ দেয়।"},{"en":"Social media algorithms promote content that provokes strong emotions.","bn":"সামাজিক মাধ্যমের অ্যালগরিদম তীব্র আবেগ জাগানো বিষয়বস্তুকে প্রাধান্য দেয়।"}]},{"name":"Question 2: Positive and Negative Points","bn":"প্রশ্ন ২ — ইতিবাচক ও নেতিবাচক দিক","items":[{"en":"On the positive side, reporting crime and corruption helps hold governments accountable.","bn":"ইতিবাচক দিকে, অপরাধ ও দুর্নীতির সংবাদ সরকারকে জবাবদিহির আওতায় আনতে সাহায্য করে।"},{"en":"News about disasters helps people prepare and encourages donations.","bn":"দুর্যোগের খবর মানুষকে প্রস্তুত হতে সাহায্য করে এবং দানে উৎসাহিত করে।"},{"en":"However, constant bad news makes people anxious and fearful.","bn":"তবে অবিরাম খারাপ খবর মানুষকে উদ্বিগ্ন ও ভীত করে।"},{"en":"It gives a distorted picture of the world, which is improving in many ways.","bn":"এটি বিশ্বের বিকৃত চিত্র দেয়, যদিও বিশ্ব অনেক দিক থেকে উন্নত হচ্ছে।"},{"en":"People may feel helpless and stop taking an interest in public issues.","bn":"মানুষ অসহায় বোধ করে জনগুরুত্বপূর্ণ বিষয়ে আগ্রহ হারাতে পারে।"}]},{"name":"Evaluation: My Answer","bn":"মূল্যায়ন — আমার উত্তর","items":[{"en":"The media focus on bad news mainly because it attracts more attention and makes more money, and I believe this is a largely negative development.","bn":"গণমাধ্যম মূলত খারাপ খবরে মনোযোগ দেয় কারণ এটি বেশি মনোযোগ আকর্ষণ করে ও বেশি আয় আনে, এবং আমি মনে করি এটি মূলত নেতিবাচক প্রবণতা।"},{"en":"Negative news dominates because people naturally pay more attention to danger, but too much of it harms public mental health.","bn":"নেতিবাচক খবর প্রাধান্য পায় কারণ মানুষ স্বাভাবিকভাবেই বিপদের দিকে বেশি মনোযোগ দেয়, কিন্তু এর আধিক্য জনগণের মানসিক স্বাস্থ্যের ক্ষতি করে।"}]}],"vocab":[["news media","সংবাদমাধ্যম"],["headlines","শিরোনাম"],["audience","দর্শক / পাঠক"],["sensational","চাঞ্চল্যকর"],["ratings","দর্শক-রেটিং"],["advertising revenue","বিজ্ঞাপন আয়"],["competition","প্রতিযোগিতা"],["anxiety","উদ্বেগ"],["pessimism","হতাশাবাদ"],["accountability","জবাবদিহি"],["clickbait","ক্লিক টানার শিরোনাম"],["public awareness","জনসচেতনতা"],["balanced","ভারসাম্যপূর্ণ"],["journalists","সাংবাদিক"]],"phrases":[["bad news sells","খারাপ খবর বেশি বিক্রি হয়"],["grab people's attention","মানুষের মনোযোগ কাড়া"],["attract more viewers","আরও দর্শক আকর্ষণ করা"],["a distorted view of the world","বিশ্বের বিকৃত চিত্র"],["feel helpless","অসহায় বোধ করা"],["keep the public informed","জনগণকে অবহিত রাখা"],["hold governments accountable","সরকারকে জবাবদিহির আওতায় আনা"],["positive stories","ইতিবাচক গল্প"],["the 24-hour news cycle","চব্বিশ ঘণ্টার সংবাদচক্র"],["take its toll on","... এর ওপর ক্ষতিকর প্রভাব ফেলা"]],"sents":[{"en":"As the saying goes, bad news sells.","bn":"কথায় আছে, খারাপ খবর বেশি বিক্রি হয়।"},{"en":"Shocking headlines grab people's attention more than good news.","bn":"চমকপ্রদ শিরোনাম ভালো খবরের চেয়ে বেশি মনোযোগ কাড়ে।"},{"en":"News channels compete to attract more viewers and advertising revenue.","bn":"সংবাদ চ্যানেলগুলো আরও দর্শক ও বিজ্ঞাপন আয় আকর্ষণে প্রতিযোগিতা করে।"},{"en":"Humans naturally pay more attention to danger than to good news.","bn":"মানুষ স্বাভাবিকভাবে ভালো খবরের চেয়ে বিপদের দিকে বেশি মনোযোগ দেয়।"},{"en":"Reporting crime and corruption helps to hold governments accountable.","bn":"অপরাধ ও দুর্নীতির সংবাদ সরকারকে জবাবদিহির আওতায় আনতে সাহায্য করে।"},{"en":"However, constant negative news can give people a distorted view of the world.","bn":"তবে অবিরাম নেতিবাচক খবর মানুষকে বিশ্বের বিকৃত চিত্র দিতে পারে।"},{"en":"Too much bad news can take its toll on people's mental health.","bn":"অতিরিক্ত খারাপ খবর মানুষের মানসিক স্বাস্থ্যের ওপর ক্ষতিকর প্রভাব ফেলতে পারে।"},{"en":"Many people feel helpless after watching the news.","bn":"অনেকে খবর দেখার পর অসহায় বোধ করেন।"}],"xvocab":[["negativity bias","নেতিবাচকতার প্রতি পক্ষপাত"],["doomscrolling","নেতিবাচক খবর অবিরাম স্ক্রল করা"],["compassion fatigue","সহানুভূতির অবসাদ"],["watchdog","প্রহরী (গণমাধ্যমের ভূমিকা)"],["solutions journalism","সমাধানমুখী সাংবাদিকতা"],["engagement","সম্পৃক্ততা"],["algorithm","অ্যালগরিদম"],["cynicism","নৈরাশ্যবাদ / অবিশ্বাস"]],"xsents":[{"en":"Psychologists call our tendency to focus on threats negativity bias.","bn":"মনোবিজ্ঞানীরা হুমকির দিকে মনোযোগ দেওয়ার প্রবণতাকে নেতিবাচকতার পক্ষপাত বলেন।"},{"en":"Social media algorithms reward content that provokes strong emotions.","bn":"সামাজিক মাধ্যমের অ্যালগরিদম তীব্র আবেগ জাগানো বিষয়বস্তুকে প্রাধান্য দেয়।"},{"en":"Constant exposure to tragedy can cause compassion fatigue.","bn":"অবিরাম ট্র্যাজেডির খবর সহানুভূতির অবসাদ সৃষ্টি করতে পারে।"},{"en":"Solutions journalism reports on how problems are being solved.","bn":"সমাধানমুখী সাংবাদিকতা সমস্যা কীভাবে সমাধান হচ্ছে তা নিয়ে সংবাদ করে।"}],"essays":[{"label":"BASIC ESSAY (BAND 5–6)","words":268,"paras":["Newspapers, TV and websites often report bad news, such as crime, accidents and wars. <b>The media focus on bad news mainly because it attracts more attention and makes more money, and I believe this is a largely negative development.</b>","There are several reasons why the news is often negative. Firstly, bad news attracts more people. When people see a shocking headline about a murder or an accident, they want to read it or watch it. More viewers means more money from advertisements for the TV channel or newspaper. Secondly, there are many news channels and websites, so they compete with each other. Each one wants the most exciting story. Thirdly, people naturally pay more attention to danger, because they want to protect themselves and their families.","I think this is mostly a negative development. Firstly, too much bad news makes people feel worried, sad and afraid. Some people feel that the world is very dangerous, even when it is getting safer. Secondly, people start to <b>feel helpless</b>, because they think they cannot change anything. Thirdly, good news, such as new medical discoveries or people helping others, is often ignored, so people do not see the positive things happening in the world.","However, some negative news is important. For example, news about corruption or pollution can make the government solve these problems. So the media should report bad news, but they should also report good news.","In conclusion, the news is often negative because it attracts viewers and money. I believe this is mainly negative, because it makes people anxious and gives them a wrong picture of the world."]},{"label":"ADVANCED ESSAY (BAND 7)","words":269,"paras":["News outlets, whether in print, on television or online, tend to give far more coverage to crime, disasters and conflict than to positive events. <b>The media focus on bad news mainly because it attracts more attention and makes more money, and I believe this is a largely negative development.</b>","The main reason is commercial. As the saying goes, <b>bad news sells</b>: shocking <b>headlines</b> <b>grab people's attention</b> far more effectively than stories about progress, and more viewers or clicks mean greater <b>advertising revenue</b>. <b>Competition</b> has intensified this trend, as hundreds of channels and websites now fight for the same <b>audience</b> in a 24-hour news cycle, and social media <b>algorithms</b> reward <b>sensational</b> content. There is also a psychological explanation: humans naturally pay more attention to danger, a tendency that <b>journalists</b>, consciously or not, exploit.","Admittedly, reporting negative events is essential. Coverage of crime, corruption and environmental damage <b>keeps the public informed</b> and helps to <b>hold governments accountable</b>. However, the current imbalance is, in my view, harmful. Constant exposure to bad news can give people <b>a distorted view of the world</b>, making them believe that things are getting worse when, in many areas such as health and poverty, they are improving. Moreover, too much negative news can <b>take its toll on</b> mental health, causing <b>anxiety</b> and making people <b>feel helpless</b>. It can also breed <b>cynicism</b>, discouraging people from taking part in public life.","In conclusion, negative news dominates mainly because it attracts <b>audiences</b> and profits. While the media must report problems, I believe the excessive focus on bad news is a negative development, and <b>journalists</b> should include more positive and solution-focused stories."]},{"label":"BAND 9 ESSAY","words":354,"paras":["Anyone who follows the news, whether in newspapers, on television or through social media, will notice that crime, disasters and conflict dominate the coverage. <b>The media focus on bad news mainly because it attracts more attention and makes more money, and I believe this is a largely negative development.</b>","The explanation is partly commercial and partly psychological. News organisations depend heavily on <b>advertising revenue</b>, which is tied to <b>audience</b> size, and experience has consistently shown that <b>bad news sells</b>: dramatic, alarming <b>headlines</b> <b>grab people's attention</b> far more effectively than reports of gradual improvement. The fragmentation of the media landscape has intensified this pressure, as countless channels and websites compete within a relentless 24-hour news cycle, while social media <b>algorithms</b>, designed to maximise <b>engagement</b>, systematically amplify content that provokes fear or outrage. Underlying all of this is a well-documented human tendency known as <b>negativity bias</b>; we are evolutionarily inclined to pay more attention to threats than to good news, and the media, in effect, supply what our instincts demand.","It must be acknowledged that reporting negative events serves a vital public function. In its role as a <b>watchdog</b>, the press exposes corruption, abuses of power and environmental harm, <b>keeping the public informed</b> and helping to <b>hold governments accountable</b>. The problem lies not in reporting such events but in the imbalance. A constant diet of tragedy gives <b>audiences</b> <b>a distorted view of the world</b>, leading many to believe that crime, poverty and disease are worsening when, by many measures, they have declined substantially. This skewed perception can <b>take its toll on</b> mental health, fuelling <b>anxiety</b>, and the habit of <b>doomscrolling</b> has been linked to stress and poor sleep. Paradoxically, it may also weaken civic <b>engagement</b>: people who <b>feel helpless</b> in the face of endless crises often respond with <b>cynicism</b> or <b>compassion fatigue</b> rather than action.","In conclusion, negative news dominates because it attracts attention and generates profit. While critical reporting is indispensable, the excessive emphasis on bad news is, on balance, harmful, and approaches such as <b>solutions journalism</b>, which examines how problems are being addressed, would provide a more accurate and constructive picture of the world."]}],"type":"Two-part question","q":"News reports in newspapers, on television and online often focus on negative events such as crime, disasters and conflict. Why do you think this is? Is this a positive or negative development?"},{"n":36,"title":"Celebrities as role models","cat":"Government & Media","groups":[{"name":"Reasons Supporting the First View","bn":"প্রথম মতের পক্ষে কারণ","items":[{"en":"Celebrities have millions of young fans who copy their behaviour.","bn":"তারকাদের লাখ লাখ তরুণ ভক্ত আছে যারা তাদের আচরণ অনুকরণ করে।"},{"en":"Famous people earn huge sums because of their public image.","bn":"বিখ্যাত ব্যক্তিরা তাদের জনসমক্ষে ভাবমূর্তির কারণে বিপুল অর্থ আয় করেন।"},{"en":"Bad behaviour by stars, such as reckless driving, can encourage fans to do the same.","bn":"বেপরোয়া গাড়ি চালানোর মতো তারকাদের খারাপ আচরণ ভক্তদের একই কাজে উৎসাহিত করতে পারে।"},{"en":"Celebrities who support charities inspire young people to help others.","bn":"দাতব্য কাজে সহায়তা করা তারকারা তরুণদের অন্যকে সাহায্য করতে অনুপ্রাণিত করেন।"},{"en":"With great influence comes great responsibility.","bn":"বড় প্রভাবের সঙ্গে বড় দায়িত্ব আসে।"}]},{"name":"Reasons Supporting the Second View","bn":"দ্বিতীয় মতের পক্ষে কারণ","items":[{"en":"Celebrities are ordinary people who make mistakes like everyone else.","bn":"তারকারাও সাধারণ মানুষ যারা সবার মতো ভুল করেন।"},{"en":"They chose careers in sport or entertainment, not as moral leaders.","bn":"তারা খেলা বা বিনোদনে পেশা বেছে নিয়েছেন, নৈতিক নেতা হিসেবে নয়।"},{"en":"Constant media attention on their private lives is unfair and stressful.","bn":"তাদের ব্যক্তিগত জীবনে অবিরাম গণমাধ্যমের মনোযোগ অন্যায্য ও চাপপূর্ণ।"},{"en":"Parents and teachers should be children's main role models.","bn":"বাবা-মা ও শিক্ষকদেরই শিশুদের প্রধান আদর্শ হওয়া উচিত।"},{"en":"Judging celebrities' private lives invades their right to privacy.","bn":"তারকাদের ব্যক্তিগত জীবন বিচার করা তাদের গোপনীয়তার অধিকার লঙ্ঘন করে।"}]},{"name":"Evaluation: My Opinion","bn":"মূল্যায়ন — আমার মতামত","items":[{"en":"Although celebrities deserve some privacy, I believe they have a responsibility to set a good example because of their enormous influence on young people.","bn":"যদিও তারকারা কিছু গোপনীয়তার যোগ্য, আমি বিশ্বাস করি তরুণদের ওপর বিশাল প্রভাবের কারণে তাদের ভালো দৃষ্টান্ত স্থাপনের দায়িত্ব আছে।"},{"en":"In my view, celebrities should behave responsibly in public, but their private lives should not be judged.","bn":"আমার মতে, তারকাদের প্রকাশ্যে দায়িত্বশীল আচরণ করা উচিত, তবে তাদের ব্যক্তিগত জীবন নিয়ে বিচার করা উচিত নয়।"}]}],"vocab":[["celebrities","তারকা"],["role models","আদর্শ ব্যক্তি"],["influence","প্রভাব"],["fans","ভক্ত"],["followers","অনুসারী"],["privacy","গোপনীয়তা"],["scandal","কেলেঙ্কারি"],["behaviour","আচরণ"],["responsibility","দায়িত্ব"],["media attention","গণমাধ্যমের মনোযোগ"],["endorse","প্রচার/সমর্থন করা"],["impressionable","সহজে প্রভাবিত হয় এমন"],["public image","জনসমক্ষে ভাবমূর্তি"],["charity","দাতব্য কাজ"]],"phrases":[["set a good example","ভালো দৃষ্টান্ত স্থাপন করা"],["look up to","শ্রদ্ধার চোখে দেখা"],["in the public eye","জনসমক্ষে"],["with great power comes great responsibility","বড় ক্ষমতার সঙ্গে বড় দায়িত্ব আসে"],["copy their behaviour","তাদের আচরণ অনুকরণ করা"],["make mistakes like anyone else","অন্য সবার মতো ভুল করা"],["be judged unfairly","অন্যায়ভাবে বিচার হওয়া"],["millions of followers","লাখ লাখ অনুসারী"],["use their fame for good","খ্যাতিকে ভালো কাজে ব্যবহার করা"],["their private lives","তাদের ব্যক্তিগত জীবন"]],"sents":[{"en":"Many young people look up to sports stars and singers.","bn":"অনেক তরুণ খেলোয়াড় ও গায়কদের শ্রদ্ধার চোখে দেখে।"},{"en":"Celebrities with millions of followers can influence young people's behaviour.","bn":"লাখ লাখ অনুসারীসহ তারকারা তরুণদের আচরণে প্রভাব ফেলতে পারেন।"},{"en":"Impressionable teenagers often copy their behaviour, both good and bad.","bn":"সহজে প্রভাবিত কিশোররা প্রায়ই তাদের ভালো-মন্দ দুই ধরনের আচরণই অনুকরণ করে।"},{"en":"Celebrities earn a lot of money because of their public image.","bn":"তারকারা তাদের জনসমক্ষে ভাবমূর্তির কারণে অনেক টাকা আয় করেন।"},{"en":"Some stars use their fame for good by supporting charity.","bn":"কিছু তারকা দাতব্য কাজে সহায়তা করে খ্যাতিকে ভালো কাজে ব্যবহার করেন।"},{"en":"However, celebrities make mistakes like anyone else.","bn":"তবে তারকারাও অন্য সবার মতো ভুল করেন।"},{"en":"They did not choose to be role models; they chose to be athletes or actors.","bn":"তারা আদর্শ হতে বেছে নেননি; তারা খেলোয়াড় বা অভিনেতা হতে বেছে নিয়েছেন।"},{"en":"Parents and teachers should be the main role models for children.","bn":"বাবা-মা ও শিক্ষকদেরই শিশুদের প্রধান আদর্শ হওয়া উচিত।"}],"xvocab":[["scrutiny","তীক্ষ্ণ পর্যবেক্ষণ / খুঁটিয়ে দেখা"],["paparazzi","তারকাদের পিছু নেওয়া ফটোগ্রাফার"],["accountability","জবাবদিহি"],["double standard","দ্বৈত মানদণ্ড"],["brand ambassador","ব্র্যান্ড দূত"],["glamorise","আকর্ষণীয় করে দেখানো"],["platform","প্রচারের মাধ্যম / মঞ্চ"],["hypocrisy","ভণ্ডামি"]],"xsents":[{"en":"Celebrities who glamorise smoking or reckless driving can do real harm.","bn":"যে তারকারা ধূমপান বা বেপরোয়া গাড়ি চালানোকে আকর্ষণীয় করে দেখান তারা প্রকৃত ক্ষতি করতে পারেন।"},{"en":"Constant media scrutiny can damage celebrities' mental health.","bn":"গণমাধ্যমের অবিরাম পর্যবেক্ষণ তারকাদের মানসিক স্বাস্থ্যের ক্ষতি করতে পারে।"},{"en":"As brand ambassadors, stars accept a public responsibility.","bn":"ব্র্যান্ড দূত হিসেবে তারকারা একটি জনদায়িত্ব গ্রহণ করেন।"},{"en":"A large platform can be used to raise awareness of important issues.","bn":"বড় প্রচারমঞ্চ গুরুত্বপূর্ণ বিষয়ে সচেতনতা বাড়াতে ব্যবহার করা যায়।"}],"essays":[{"label":"BASIC ESSAY (BAND 5–6)","words":273,"paras":["Some people think that famous people, like sports stars and actors, should be good <b>role models</b> for young people. Other people think that <b>their private lives</b> should not be judged. <b>In my view, celebrities should behave responsibly in public, but their private lives should not be judged.</b>","On the one hand, many people believe <b>celebrities</b> must be good <b>role models</b>. Young people love famous sports stars and singers, and they often copy what they do. If a famous person smokes, uses bad language or drives dangerously, young <b>fans</b> may think this is cool and copy it. Also, <b>celebrities</b> earn a lot of money because many people like them, so they should give something back. Some <b>celebrities</b> help poor people or support good causes, and this encourages their <b>fans</b> to do the same. For example, some cricketers in Bangladesh support <b>charities</b>, and young people respect them for this.","On the other hand, <b>celebrities</b> are normal people, and everyone makes mistakes. A footballer became famous because he plays football well, not because he wanted to be a role model. It is not fair when newspapers and social media follow them all the time and criticise everything they do in <b>their private lives</b>. Also, parents and teachers, not <b>celebrities</b>, should be the main <b>role models</b> for children.","In my opinion, <b>celebrities</b> should be careful about what they do and say in public, especially on social media, because many young people see it. However, <b>their private lives</b> should be respected.","In conclusion, both views are reasonable. I believe <b>celebrities</b> have some <b>responsibility</b> to behave well in public, but they should also have <b>privacy</b> in their personal lives."]},{"label":"ADVANCED ESSAY (BAND 7)","words":290,"paras":["There is disagreement about whether famous people have a duty to <b>set a good example</b> for young people or whether their personal lives should be left alone. <b>In my view, celebrities should behave responsibly in public, but their private lives should not be judged.</b>","Those who believe <b>celebrities</b> should be <b>role models</b> point to their enormous <b>influence</b>. Sports stars and entertainers often have <b>millions of followers</b>, many of them <b>impressionable</b> teenagers who tend to <b>copy their behaviour</b>. When a celebrity <b>glamorises</b> smoking, violence or reckless driving, young <b>fans</b> may imitate it. Moreover, <b>celebrities</b> earn huge sums precisely because of their <b>public image</b>, and many are paid to <b>endorse</b> products, so it seems reasonable to expect them to behave responsibly. Many stars also <b>use their fame for good</b>, supporting <b>charity</b> or raising awareness of social issues, which shows the positive impact they can have.","On the other hand, others argue that <b>celebrities</b> are ordinary people who <b>make mistakes like anyone else</b>. They chose to be athletes, musicians or actors, not moral leaders, and it is unfair that every aspect of <b>their private lives</b> is exposed to constant <b>media attention</b>. Such pressure can seriously damage their mental health. Supporters of this view also argue that children should <b>look up to</b> parents and teachers rather than to people they only know through a screen.","Personally, I believe the answer lies in distinguishing between public and private <b>behaviour</b>. What <b>celebrities</b> say and do in public, especially on social media, reaches millions of young people, so they should be careful. However, <b>their private lives</b> deserve the same respect as anyone else's.","In conclusion, <b>celebrities</b> have a <b>responsibility</b> to behave well in public, but they should not be expected to be perfect in their personal lives."]},{"label":"BAND 9 ESSAY","words":365,"paras":["The question of whether <b>celebrities</b> owe the public exemplary <b>behaviour</b> has become increasingly pressing in an age of social media, when stars can speak directly to millions of <b>fans</b>. <b>In my view, celebrities should behave responsibly in public, but their private lives should not be judged.</b>","The argument that <b>celebrities</b> should be <b>role models</b> rests largely on the scale of their <b>influence</b>. Sports stars, musicians and actors often have <b>millions of followers</b>, many of them <b>impressionable</b> teenagers who <b>look up to</b> them and readily <b>copy their behaviour</b>, both good and bad. When a celebrity <b>glamorises</b> smoking, excessive drinking or reckless driving, the effect on young <b>fans</b> can be real. Furthermore, it is often noted that <b>celebrities</b> derive their wealth from their <b>public image</b>, and many earn considerable sums as brand ambassadors, so it seems reasonable that such privileges should come with obligations; <b>with great power comes great responsibility</b>. The positive potential is also clear: <b>celebrities</b> who <b>use their fame for good</b>, supporting <b>charity</b> or speaking out on issues such as mental health, can inspire far more young people than any official campaign.","Those who oppose this view make an equally compelling case. <b>Celebrities</b> <b>make mistakes like anyone else</b>, and they chose careers as athletes or entertainers, not as moral exemplars. Subjecting every aspect of <b>their private lives</b> to relentless <b>scrutiny</b>, often fuelled by the <b>paparazzi</b> and online gossip, is intrusive and can take a severe toll on their mental health. There is also a certain <b>double standard</b> in demanding perfection from public figures that we would never expect of ourselves. Finally, it can be argued that <b>responsibility</b> for guiding children rests primarily with parents and teachers, not with strangers on a screen.","In my opinion, the most reasonable position distinguishes between public conduct and private life. What <b>celebrities</b> say and do on their public <b>platforms</b>, particularly on social media, reaches vast audiences of young people, and they should exercise corresponding care, especially regarding harmful <b>behaviour</b>. Their personal lives, however, deserve the same <b>privacy</b> that any citizen enjoys.","In conclusion, fame does bring a <b>responsibility</b> to behave well <b>in the public eye</b>, but it should not strip <b>celebrities</b> of the right to be imperfect in private."]}],"type":"Discuss both views and give your opinion","q":"Some people believe that famous people, such as sports stars and entertainers, have a responsibility to be good role models for young people. Others think their private lives should not be judged. Discuss both views and give your own opinion."},{"n":37,"title":"AI tools in education","cat":"Latest Topics (2025–2026)","groups":[{"name":"Reasons Supporting the First View","bn":"প্রথম মতের পক্ষে কারণ","items":[{"en":"AI tools can explain difficult topics clearly and at any time.","bn":"AI টুল কঠিন বিষয় যেকোনো সময় স্পষ্টভাবে ব্যাখ্যা করতে পারে।"},{"en":"Students receive instant, personalised feedback on their work.","bn":"শিক্ষার্থীরা তাদের কাজের ওপর তাৎক্ষণিক, ব্যক্তিগতকৃত মতামত পায়।"},{"en":"AI can support students who cannot afford private tutors.","bn":"AI গৃহশিক্ষকের খরচ বহন করতে পারে না এমন শিক্ষার্থীদের সহায়তা করতে পারে।"},{"en":"Using AI effectively is becoming an essential workplace skill.","bn":"AI কার্যকরভাবে ব্যবহার করা একটি অপরিহার্য কর্মক্ষেত্রের দক্ষতা হয়ে উঠছে।"},{"en":"A ban would be almost impossible to enforce, since AI is available on every phone.","bn":"নিষেধাজ্ঞা প্রয়োগ প্রায় অসম্ভব হবে, কারণ AI প্রতিটি ফোনে পাওয়া যায়।"}]},{"name":"Reasons Supporting the Second View","bn":"দ্বিতীয় মতের পক্ষে কারণ","items":[{"en":"Students can use AI to cheat by submitting work that is not their own.","bn":"শিক্ষার্থীরা নিজের নয় এমন কাজ জমা দিয়ে AI দিয়ে প্রতারণা করতে পারে।"},{"en":"Relying on AI may prevent students from developing critical thinking.","bn":"AI-এর ওপর নির্ভরতা শিক্ষার্থীদের বিশ্লেষণী চিন্তা গড়ে তুলতে বাধা দিতে পারে।"},{"en":"AI sometimes gives incorrect information that students may not notice.","bn":"AI কখনো কখনো ভুল তথ্য দেয় যা শিক্ষার্থীরা খেয়াল না-ও করতে পারে।"},{"en":"Writing skills may weaken if students let AI write for them.","bn":"শিক্ষার্থীরা AI-কে দিয়ে লেখালে লেখার দক্ষতা দুর্বল হতে পারে।"},{"en":"Teachers find it difficult to assess students' real abilities.","bn":"শিক্ষকদের জন্য শিক্ষার্থীদের প্রকৃত সক্ষমতা মূল্যায়ন করা কঠিন হয়ে পড়ে।"}]},{"name":"Evaluation: My Opinion","bn":"মূল্যায়ন — আমার মতামত","items":[{"en":"Although AI tools can be misused for cheating, I believe students should be allowed to use them under clear rules, because they are powerful learning aids.","bn":"যদিও AI টুল প্রতারণায় অপব্যবহৃত হতে পারে, আমি বিশ্বাস করি স্পষ্ট নিয়মের অধীনে শিক্ষার্থীদের এগুলো ব্যবহারের অনুমতি দেওয়া উচিত, কারণ এগুলো শক্তিশালী শিক্ষা-সহায়ক।"},{"en":"In my opinion, banning AI in education is unrealistic; schools should teach students how to use it responsibly.","bn":"আমার মতে, শিক্ষায় AI নিষিদ্ধ করা বাস্তবসম্মত নয়; স্কুলগুলোর উচিত শিক্ষার্থীদের এটি দায়িত্বের সঙ্গে ব্যবহার করতে শেখানো।"}]}],"vocab":[["artificial intelligence","কৃত্রিম বুদ্ধিমত্তা"],["chatbot","চ্যাটবট"],["cheating","প্রতারণা / নকল"],["plagiarism","লেখা চুরি"],["critical thinking","বিশ্লেষণী চিন্তা"],["personalised feedback","ব্যক্তিগতকৃত মতামত"],["assignments","অ্যাসাইনমেন্ট"],["academic integrity","একাডেমিক সততা"],["digital literacy","ডিজিটাল সাক্ষরতা"],["accuracy","নির্ভুলতা"],["assessment","মূল্যায়ন"],["tutor","শিক্ষক / গৃহশিক্ষক"],["dependence","নির্ভরশীলতা"],["guidelines","নির্দেশিকা"]],"phrases":[["do the thinking for them","তাদের হয়ে চিন্তা করা"],["at any time of day","দিনের যেকোনো সময়"],["explain difficult ideas","কঠিন ধারণা ব্যাখ্যা করা"],["submit work that is not their own","নিজের নয় এমন কাজ জমা দেওয়া"],["rely too heavily on","... এর ওপর অতিরিক্ত নির্ভর করা"],["here to stay","স্থায়ীভাবে থাকতে এসেছে"],["prepare students for the future","শিক্ষার্থীদের ভবিষ্যতের জন্য প্রস্তুত করা"],["check the facts","তথ্য যাচাই করা"],["use it responsibly","দায়িত্বশীলভাবে ব্যবহার করা"],["change the way we assess","মূল্যায়নের পদ্ধতি বদলানো"]],"sents":[{"en":"AI chatbots can explain difficult ideas in simple language.","bn":"AI চ্যাটবট কঠিন ধারণা সহজ ভাষায় ব্যাখ্যা করতে পারে।"},{"en":"Students can get personalised feedback at any time of day.","bn":"শিক্ষার্থীরা দিনের যেকোনো সময় ব্যক্তিগতকৃত মতামত পেতে পারে।"},{"en":"For students who cannot afford a private tutor, AI can be a valuable support.","bn":"যেসব শিক্ষার্থী গৃহশিক্ষকের খরচ বহন করতে পারে না, তাদের জন্য AI মূল্যবান সহায়তা হতে পারে।"},{"en":"However, some students use AI to submit work that is not their own.","bn":"তবে কিছু শিক্ষার্থী নিজের নয় এমন কাজ জমা দিতে AI ব্যবহার করে।"},{"en":"If AI does the thinking for them, students will not develop critical thinking.","bn":"AI তাদের হয়ে চিন্তা করলে শিক্ষার্থীরা বিশ্লেষণী চিন্তা গড়ে তুলবে না।"},{"en":"AI tools sometimes give wrong information, so students must check the facts.","bn":"AI টুল কখনো কখনো ভুল তথ্য দেয়, তাই শিক্ষার্থীদের তথ্য যাচাই করতে হবে।"},{"en":"AI is here to stay, so banning it would not prepare students for the future.","bn":"AI স্থায়ীভাবে থাকতে এসেছে, তাই এটি নিষিদ্ধ করলে শিক্ষার্থীরা ভবিষ্যতের জন্য প্রস্তুত হবে না।"},{"en":"Schools may need to change the way they assess students, for example with more oral exams.","bn":"স্কুলকে হয়তো মূল্যায়নের পদ্ধতি বদলাতে হবে, যেমন আরও মৌখিক পরীক্ষা নিয়ে।"}],"xvocab":[["hallucinate","(AI) বানোয়াট তথ্য দেওয়া"],["shortcut","সহজ পথ"],["in-class writing","শ্রেণিকক্ষে লেখা"],["learning aid","শিক্ষা-সহায়ক"],["unenforceable","প্রয়োগ অসম্ভব এমন"],["workplace skills","কর্মক্ষেত্রের দক্ষতা"],["transparency","স্বচ্ছতা"],["intellectual laziness","বুদ্ধিবৃত্তিক অলসতা"]],"xsents":[{"en":"AI chatbots sometimes hallucinate facts and references.","bn":"AI চ্যাটবট কখনো কখনো বানোয়াট তথ্য ও উৎস দেয়।"},{"en":"A total ban would be almost unenforceable, since AI is available on every phone.","bn":"সম্পূর্ণ নিষেধাজ্ঞা প্রায় প্রয়োগ অসম্ভব, কারণ AI প্রতিটি ফোনে পাওয়া যায়।"},{"en":"Using AI effectively is becoming an essential workplace skill.","bn":"AI কার্যকরভাবে ব্যবহার করা একটি অপরিহার্য কর্মক্ষেত্রের দক্ষতা হয়ে উঠছে।"},{"en":"Easy answers can encourage intellectual laziness.","bn":"সহজ উত্তর বুদ্ধিবৃত্তিক অলসতাকে উৎসাহিত করতে পারে।"}],"essays":[{"label":"BASIC ESSAY (BAND 5–6)","words":283,"paras":["Some people think students should be allowed to use AI tools, like <b>chatbots</b>, for their schoolwork, but others think these tools should be banned. <b>Although AI tools can be misused for cheating, I believe students should be allowed to use them under clear rules, because they are powerful learning aids.</b>","On the one hand, there are some good reasons to ban AI. The biggest problem is <b>cheating</b>. Some students ask a <b>chatbot</b> to write their essay or do their homework, and then they give it to the teacher as their own work. These students do not learn anything. Also, if students use AI for everything, they will not learn to think for themselves or solve problems. In addition, AI sometimes gives wrong answers, and students may believe them.","On the other hand, AI can be very helpful for learning. It can explain difficult topics in simple words, and students can ask ques
