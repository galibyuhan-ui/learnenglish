<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>IELTS Writing Task 2 version 1</title>
<meta name="description" content="IELTS Writing Task 2 from sentence to paragraph to essay, with building blocks and model answers — Yuhan IELTS">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&family=Hind+Siliguri:wght@400;600&display=swap">
<style>
:root{
  --bg:#FFFFFF; --surface:#FFFFFF; --sunk:#FBF4F5; --line:#F0E1E3; --line2:#E2C8CC;
  --ink:#1F1416; --ink2:#5A4649; --ink3:#8E7A7D;
  --hero:#FFFFFF; --hero2:#FFFFFF; --hero-ink:#111111; --hero-ink2:#4A4A4A;
  --red:#D11A36; --red-ink:#A8102A; --red-soft:#FDEEF0; --red-line:#F4C4CB;
  --gold:#B23A4E; --gold-ink:#8A1D30; --gold-soft:#FCF1F3; --bn-ink:#A0283C;
  --teal:#157A71; --teal-soft:#E4F3F1;
  --p-intro:#157A71; --p-b1:#2E5CB8; --p-b2:#B26B12; --p-con:#8E3F97;
  --p-intro-bg:#EAF6F4; --p-b1-bg:#EDF2FC; --p-b2-bg:#FCF3E6; --p-con-bg:#F7EEF8;
  --f-context:#0F766E; --f-position:#D9480F; --f-topic:#2E5CB8; --f-support:#8A93A6; --f-example:#C28A12; --f-restate:#8E3F97;
  --bank:#B0142B; --bank-bg:#FDECEF;
  --shadow:0 1px 2px rgba(80,10,20,.04),0 10px 30px -14px rgba(80,10,20,.16);
  --shadow-lg:0 2px 4px rgba(80,10,20,.05),0 18px 40px -18px rgba(80,10,20,.28);
  --r:18px;
  --display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --ui:"Atkinson Hyperlegible",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --read:"Literata",Georgia,"Times New Roman",serif;
  --bn:"Hind Siliguri","Nirmala UI","Noto Sans Bengali",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --bg:#140B0D; --surface:#1D1113; --sunk:#26161A; --line:#3A2227; --line2:#553139;
  --ink:#F6ECEE; --ink2:#D2BDC1; --ink3:#A38A8F;
  --hero:#1D1113; --hero2:#1D1113; --hero-ink:#F6ECEE; --hero-ink2:#D2BDC1;
  --red:#F2586A; --red-ink:#FF8C99; --red-soft:#3A161D; --red-line:#63242F;
  --gold:#F08C9A; --gold-ink:#F7A9B4; --gold-soft:#33171C; --bn-ink:#F4A3AF;
  --teal:#5CC7BC; --teal-soft:#132D2B;
  --p-intro:#5CC7BC; --p-b1:#86A9F0; --p-b2:#E7A85A; --p-con:#D597DA;
  --p-intro-bg:#122A29; --p-b1-bg:#162238; --p-b2-bg:#2D2212; --p-con-bg:#2A1A2D;
  --f-context:#4FD1C5; --f-position:#FB8C4C; --f-topic:#86A9F0; --f-support:#8F99AC; --f-example:#E6B84F; --f-restate:#D597DA;
  --bank:#FF9AA7; --bank-bg:#3F1820;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px -14px rgba(0,0,0,.6);
  --shadow-lg:0 2px 4px rgba(0,0,0,.3),0 18px 40px -18px rgba(0,0,0,.7);
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#140B0D; --surface:#1D1113; --sunk:#26161A; --line:#3A2227; --line2:#553139;
  --ink:#F6ECEE; --ink2:#D2BDC1; --ink3:#A38A8F;
  --hero:#1D1113; --hero2:#1D1113; --hero-ink:#F6ECEE; --hero-ink2:#D2BDC1;
  --red:#F2586A; --red-ink:#FF8C99; --red-soft:#3A161D; --red-line:#63242F;
  --gold:#F08C9A; --gold-ink:#F7A9B4; --gold-soft:#33171C; --bn-ink:#F4A3AF;
  --teal:#5CC7BC; --teal-soft:#132D2B;
  --p-intro:#5CC7BC; --p-b1:#86A9F0; --p-b2:#E7A85A; --p-con:#D597DA;
  --p-intro-bg:#122A29; --p-b1-bg:#162238; --p-b2-bg:#2D2212; --p-con-bg:#2A1A2D;
  --f-context:#4FD1C5; --f-position:#FB8C4C; --f-topic:#86A9F0; --f-support:#8F99AC; --f-example:#E6B84F; --f-restate:#D597DA;
  --bank:#FF9AA7; --bank-bg:#3F1820;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px -14px rgba(0,0,0,.6);
  --shadow-lg:0 2px 4px rgba(0,0,0,.3),0 18px 40px -18px rgba(0,0,0,.7);
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:16px;line-height:1.6;margin:0;-webkit-font-smoothing:antialiased}
.wrap{max-width:1120px;margin:0 auto;padding-inline:24px}
@media (max-width:520px){.wrap{padding-inline:16px}}
h1,h2,h3,h4{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.12;letter-spacing:-.015em}
h2{font-size:clamp(1.8rem,3.6vw,2.6rem);font-weight:800}
h3{font-size:clamp(1.2rem,2vw,1.45rem);font-weight:700}
h4{font-size:1.02rem;font-weight:700;letter-spacing:-.005em}
p{margin:0}
.bn{font-family:var(--bn);color:var(--bn-ink);font-size:.94em;line-height:1.65}
body.no-bn .bn{display:none!important}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2.5px solid var(--red);outline-offset:2px;border-radius:8px}
.eyebrow{font-size:.72rem;text-transform:uppercase;letter-spacing:.12em;color:var(--ink3);font-weight:700}
.muted{color:var(--ink2)}
.small{font-size:.88rem}

/* ---------- hero ---------- */
header.top{background:
  linear-gradient(160deg,var(--hero2),var(--hero));color:var(--hero-ink);padding-bottom:64px;border-top:4px solid var(--red);border-bottom:1px solid var(--line)}
.hero{display:grid;gap:34px;padding-block:22px 0}
.brandrow{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}
.logo{display:inline-flex;flex-direction:column;align-items:center;gap:3px;flex:none;background:#fff;border-radius:14px;padding:8px 10px 6px;border:1px solid var(--line);box-shadow:0 4px 14px -8px rgba(80,10,20,.35)}
.logo .y{background:#D11A36;color:#fff;font-family:var(--display);font-weight:800;font-size:1.25rem;padding:3px 14px 4px;border-radius:9px;line-height:1.1}
.logo .i{font-family:var(--display);font-weight:800;font-size:.74rem;letter-spacing:.34em;padding-left:.34em;color:#131A2B}
.titleblock{display:grid;gap:12px;max-width:760px}
.kicker{font-size:.74rem;letter-spacing:.14em;text-transform:uppercase;color:var(--red-ink);font-weight:700}
.titleblock h1{font-size:clamp(1.6rem,3.4vw,2.3rem);font-weight:800;color:var(--hero-ink);letter-spacing:-.025em}
.titleblock h1 em{font-family:var(--read);font-style:italic;font-weight:600;color:var(--red);letter-spacing:-.01em}
.titleblock p{color:var(--hero-ink2);font-size:1.05rem;max-width:62ch}
.titleblock .bn{color:var(--bn-ink)}
.inlineplay{display:inline-block;width:20px;height:20px;border-radius:50%;background:var(--red);vertical-align:-4px;position:relative}
.inlineplay::after{content:"";position:absolute;left:7.5px;top:5.5px;border-left:7px solid #fff;border-top:4.5px solid transparent;border-bottom:4.5px solid transparent}
.toggles{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.tog{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line2);background:var(--surface);border-radius:999px;padding:6px 14px;font-size:.86rem;font-weight:700}
header .tog,.speed{border:1px solid var(--line2);background:var(--surface);color:var(--hero-ink)}
.tog .sw{width:30px;height:18px;border-radius:9px;background:var(--line2);position:relative;transition:background .2s}
header .tog .sw{background:var(--line2)}
.tog .sw::after{content:"";position:absolute;top:3px;left:3px;width:12px;height:12px;border-radius:50%;background:#fff;transition:transform .2s}
.tog[aria-pressed="true"] .sw{background:var(--red)}
.tog[aria-pressed="true"] .sw::after{transform:translateX(12px)}
.speed{display:inline-flex;align-items:center;gap:2px;border-radius:999px;padding:3px 3px 3px 12px;font-size:.84rem}
.speed .small{color:var(--hero-ink2);margin-right:4px}
.speed button{border:0;background:none;border-radius:999px;padding:4px 11px;font-weight:700;color:var(--hero-ink2)}
.speed button[aria-pressed="true"]{background:var(--red);color:#fff}

/* ---------- stepper ---------- */
nav.steps{position:sticky;top:calc(env(safe-area-inset-top,0px) + 10px);z-index:20;margin-top:-40px}
.steps ol{list-style:none;margin:0;padding:8px;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:4px;background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-radius:20px;box-shadow:var(--shadow-lg);border:1px solid var(--line)}
.steps li{display:flex;min-width:0;position:relative}
.steps button{flex:1;display:flex;align-items:center;gap:8px;border:0;background:none;border-radius:14px;padding:7px 8px;text-align:left;min-width:0;transition:background .2s}
.steps .num{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:.8rem;background:var(--sunk);color:var(--ink3);transition:all .2s}
.steps .lbl{display:flex;flex-direction:column;min-width:0}
.steps .lbl b{font-size:.8rem;white-space:normal;line-height:1.2;overflow-wrap:normal}
.steps .lbl span{font-family:var(--bn);font-size:.68rem;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.steps button:hover{background:var(--sunk)}
.steps button[aria-selected="true"]{background:var(--red-soft)}
.steps button[aria-selected="true"] .num{background:var(--red);color:#fff;box-shadow:0 4px 12px -4px var(--red)}
.steps button[aria-selected="true"] .lbl b{color:var(--red-ink)}
.steps button.done .num{background:var(--teal-soft);color:var(--teal)}
@media (max-width:760px){.steps .lbl span{display:none}.steps button{flex-direction:column;gap:4px;text-align:center;padding:7px 2px}.steps .lbl b{font-size:.62rem;max-width:100%;white-space:normal;line-height:1.15;font-size:.6rem}.arrow{display:none}}

main{padding-block:44px 72px}
section.stage{display:flex;flex-direction:column;gap:40px;animation:rise .35s ease both}
@keyframes rise{from{transform:translateY(6px)}to{transform:none}}
.stagehead{display:grid;gap:10px;max-width:780px;position:relative;padding-left:0}
.stagehead::before{content:attr(data-n);font-family:var(--display);font-weight:800;font-size:clamp(3.6rem,8vw,5.4rem);line-height:.8;color:transparent;-webkit-text-stroke:1.5px var(--red-line);letter-spacing:-.04em}
.stagehead .eyebrow{color:var(--red-ink)}
.stagehead h2{font-size:clamp(1.3rem,2.4vw,1.7rem)}
.stagehead .lead{font-size:1.12rem;color:var(--ink2);max-width:62ch}
.block{display:flex;flex-direction:column;gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:22px;box-shadow:var(--shadow)}
@media (max-width:520px){.card{padding:16px}}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:16px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px}

/* ---------- play button ---------- */
.play{display:inline-grid;place-items:center;vertical-align:middle;width:26px;height:26px;margin-left:8px;border-radius:50%;border:0;background:var(--red-soft);color:var(--red);flex:none;transition:transform .15s,background .15s,color .15s;position:relative;padding:0}
.play svg{width:12px;height:12px;fill:currentColor;margin-left:1px}
.play:hover{transform:scale(1.1);background:var(--red);color:#fff}
.play.on{background:var(--red);color:#fff}
.play.on svg{margin-left:0}
.play.on::after{content:"";position:absolute;inset:-4px;border-radius:50%;border:2px solid var(--red);opacity:.5;animation:ring 1.2s ease-out infinite}
@keyframes ring{from{transform:scale(.85);opacity:.7}to{transform:scale(1.35);opacity:0}}
.play.para{width:24px;height:24px;background:transparent;border:1.5px solid var(--red-line)}
.play.para:hover,.play.para.on{border-color:var(--red)}
.play.whole{width:auto;height:auto;border-radius:999px;padding:6px 14px 6px 11px;gap:6px;grid-auto-flow:column;font-size:.82rem;font-weight:700;margin-left:0;background:var(--red);color:#fff}
.play.whole:hover{transform:none;filter:brightness(1.08)}
.play.whole svg{width:11px;height:11px}
.wtop{display:flex;align-items:center;justify-content:space-between;gap:6px}
.wtop{flex-wrap:wrap;row-gap:4px}
.wtop>b{flex:1 1 120px;min-width:0}
.wtop .sayg{margin-left:auto}
.wtop .play{width:24px;height:24px}

/* level picker */
.levels{display:flex;gap:8px;flex-wrap:wrap}
.lvbtn{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:8px 14px;display:flex;flex-direction:column;align-items:flex-start;line-height:1.2;min-width:82px;box-shadow:var(--shadow);transition:transform .15s,border-color .15s}
.lvbtn:hover{transform:translateY(-1px);border-color:var(--line2)}
.lvbtn b{font-family:var(--display);font-size:1.15rem;font-weight:800}
.lvbtn span{font-size:.72rem;color:var(--ink3)}
.lvbtn[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.lvbtn[aria-pressed="true"] span{color:var(--line2)}
.seg{align-self:flex-start;display:inline-flex;background:var(--sunk);border:1px solid var(--line);border-radius:14px;padding:4px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:7px 14px;font-size:.9rem;border-radius:10px;font-weight:700;color:var(--ink2)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--red-ink);box-shadow:var(--shadow)}

/* question box */
.qbox{border-radius:var(--r);padding:18px 20px;background:linear-gradient(135deg,var(--surface),var(--sunk));border:1px solid var(--line);display:grid;gap:8px;position:relative;overflow:hidden;box-shadow:var(--shadow)}
.qbox::before{content:"“";position:absolute;right:14px;top:-18px;font-family:var(--read);font-size:7rem;color:var(--red);opacity:.09;line-height:1}
.qbox .qtag{font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:var(--red-ink)}
.qbox .q{font-family:var(--read);font-style:italic;font-size:1.1rem;line-height:1.6;max-width:70ch}

/* pattern chips */
.pat{font-size:.96rem;line-height:2.1}
.slot{display:inline-block;background:var(--gold-soft);border:1px dashed color-mix(in srgb,var(--gold) 55%,transparent);border-radius:7px;padding:0 8px;line-height:1.65;font-size:.88em;color:var(--gold-ink);font-weight:700}
.plus{color:var(--ink3);margin:0 4px;font-style:normal}

/* anatomy */
.anatomy{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0;border-radius:14px;overflow:hidden;border:1px solid var(--line)}
.anatomy>div{padding:14px 16px;display:grid;gap:6px;align-content:start;background:var(--surface)}
.anatomy>div+div{border-left:1px solid var(--line)}
.anatomy .k{font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:var(--ink3)}
.anatomy .k b{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--red);color:#fff;font-size:.7rem;margin-right:6px;letter-spacing:0}
@media (max-width:700px){.anatomy{grid-template-columns:1fr}.anatomy>div+div{border-left:0;border-top:1px solid var(--line)}}

/* hero ladder */
.ladder{display:grid;gap:10px}
.lrow{display:grid;grid-template-columns:78px 1fr;gap:14px;align-items:center;padding:14px 16px;border-radius:16px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow)}
.lrow .lv{font-family:var(--display);font-weight:800;font-size:1.5rem;line-height:1}
.lrow .lv small{display:block;font-family:var(--ui);font-weight:400;font-size:.7rem;color:var(--ink3);margin-top:5px;letter-spacing:0}
.lrow .s{font-family:var(--read);font-size:1.05rem;line-height:1.55}
.lrow .meter{display:flex;align-items:center;gap:10px;margin-top:8px}
.lrow .bar{height:5px;border-radius:3px;background:linear-gradient(90deg,var(--red),color-mix(in srgb,var(--red) 55%,var(--gold)))}
.lrow .wc{font-size:.74rem;color:var(--ink3);font-variant-numeric:tabular-nums;white-space:nowrap}

/* sentence cards */
.paragroup{display:grid;gap:10px}
.paralabel{display:flex;align-items:center;gap:8px;font-weight:700;font-size:.92rem}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.scards{display:grid;gap:10px}
.scard{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px 18px;display:grid;grid-template-columns:44px 1fr;gap:14px;box-shadow:var(--shadow)}
.scard .n{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;font-family:var(--display);font-weight:800;color:#fff}
.scard .role{font-weight:700;font-size:1.02rem}
.scard .purpose{color:var(--ink2);font-size:.92rem}
.scard .sample{font-family:var(--read);font-size:1.04rem;background:var(--sunk);border-radius:10px;padding:10px 14px;margin-top:8px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;align-items:baseline;margin:0}
.kv dt{font-size:.7rem;text-transform:uppercase;letter-spacing:.1em;color:var(--ink3);font-weight:700}
.kv dd{margin:0}

ul.clean,ol.clean{margin:0;padding-left:1.15em;display:grid;gap:8px}
ul.clean li::marker{color:var(--red)}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:16px;background:var(--surface);box-shadow:var(--shadow)}
table{border-collapse:collapse;width:100%;font-size:.93rem}
th,td{text-align:left;padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:.7rem;text-transform:uppercase;letter-spacing:.1em;color:var(--ink3);background:var(--sunk)}
tr:last-child td{border-bottom:0}
tbody tr:hover td{background:color-mix(in srgb,var(--sunk) 60%,transparent)}
td i,.it{font-family:var(--read);font-style:italic}
td .play{width:22px;height:22px;margin-left:6px}
td .play svg{width:10px;height:10px}

/* paragraph builder */
.formula{display:flex;flex-wrap:wrap;gap:10px;align-items:stretch}
.fstep{border-radius:14px;padding:12px 14px;background:var(--sunk);display:grid;gap:2px;flex:1;min-width:150px}
.fstep b{font-size:1rem}
.arrow{color:var(--ink3);align-self:center}
.budget{display:flex;height:52px;border-radius:14px;overflow:hidden;gap:3px}
.budget div{display:flex;flex-direction:column;justify-content:center;padding:0 12px;font-size:.78rem;line-height:1.25;color:var(--ink2);min-width:0;overflow:hidden;white-space:nowrap}
.budget b{font-size:.88rem}
.essaybuild{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:820px){.essaybuild{grid-template-columns:1fr}}
.ptext{font-family:var(--read);font-size:1.05rem;line-height:1.85;display:grid;gap:14px}
.ppara{border-radius:16px;padding:14px 18px}
.ppara .ph{font-family:var(--ui);font-size:.7rem;text-transform:uppercase;letter-spacing:.12em;font-weight:700;margin-bottom:4px}
.sent{cursor:pointer;border-radius:4px;box-decoration-break:clone;-webkit-box-decoration-break:clone;border-bottom:3px solid transparent;padding:0 1px;transition:background .15s}
.sent sup{font-family:var(--ui);font-size:.62rem;font-weight:700;margin-right:2px;color:var(--ink3)}
.sent:hover{background:color-mix(in srgb,var(--surface) 70%,transparent)}
.sent.on{background:var(--surface);box-shadow:0 0 0 2px var(--ink)}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:.82rem;color:var(--ink2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:18px;height:3px;border-radius:2px;display:inline-block}
.inspector{position:sticky;top:110px;display:grid;gap:12px}

/* essay */
.shape{display:grid;gap:8px}
.shape .srow{display:grid;grid-template-columns:150px 1fr;gap:14px;align-items:start;padding:14px 16px;border-radius:14px}
@media (max-width:520px){.shape .srow{grid-template-columns:1fr;gap:4px}}
.shape .srow b{font-family:var(--display)}
.chart{display:grid;gap:10px;position:relative;padding-top:30px}
.crow{display:grid;grid-template-columns:44px 1fr;gap:10px;align-items:center;cursor:pointer;border-radius:10px;padding:3px 6px}
.crow:hover{background:var(--sunk)}
.crow.on{background:var(--sunk)}
.crow b{font-family:var(--display);font-weight:800}
.ctrack{position:relative;height:24px}
.cbar{height:100%;border-radius:0 8px 8px 0;background:var(--line2);display:flex;align-items:center;justify-content:flex-end;padding-right:8px;font-size:.78rem;font-weight:700;font-variant-numeric:tabular-nums;color:var(--ink);min-width:38px;transition:background .2s}
.crow.on .cbar{background:linear-gradient(90deg,var(--red),color-mix(in srgb,var(--red) 60%,var(--gold)));color:#fff}
.cline{position:absolute;top:-5px;bottom:-5px;border-left:2px dashed var(--ink3)}
.cline span{position:absolute;top:-22px;left:-30px;font-size:.72rem;font-weight:700;color:var(--ink2);white-space:nowrap}
.types{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-size:.88rem;font-weight:700;box-shadow:var(--shadow);transition:transform .15s}
.chip:hover{transform:translateY(-1px)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip[aria-pressed="true"] .bn{color:#FFD3DA}
.tpl{display:grid;gap:8px}
.tpl .trow{display:grid;grid-template-columns:110px 1fr;gap:12px;padding:12px 14px;border-radius:12px;align-items:baseline}
@media (max-width:520px){.tpl .trow{grid-template-columns:1fr;gap:2px}}
.fix{display:grid;gap:10px}
.fixrow{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:grid;gap:6px;box-shadow:var(--shadow)}
.fixrow .bad{font-family:var(--read);font-style:italic;text-decoration:line-through;text-decoration-color:var(--red);text-decoration-thickness:1.5px;color:var(--ink2)}
.fixrow .good{font-family:var(--read);color:var(--teal);font-weight:600}
.linkbtn{background:none;border:0;color:var(--red-ink);font-weight:700;padding:0;font-size:.86rem;justify-self:start}
.timeline{display:flex;border-radius:14px;overflow:hidden;font-size:.82rem;gap:3px}
.timeline div{padding:10px 12px;line-height:1.3}
.pad textarea{width:100%;min-height:260px;border:1px solid var(--line2);border-radius:14px;padding:16px;font-family:var(--read);font-size:1.02rem;line-height:1.75;background:var(--sunk);color:var(--ink);resize:vertical}
.pad textarea:focus{outline:2px solid var(--red);background:var(--surface)}
.padbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-variant-numeric:tabular-nums}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 12px;font-size:.8rem;font-weight:700;background:var(--sunk)}
.pill.ok{background:var(--teal-soft);color:var(--teal)}
.pill.low{background:var(--red-soft);color:var(--red-ink)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 16px;font-size:.9rem;font-weight:700;box-shadow:var(--shadow);transition:transform .15s}
.btn:hover{transform:translateY(-1px)}
.btn.primary{background:var(--red);color:#fff;border-color:var(--red);box-shadow:0 8px 20px -10px var(--red)}

/* building blocks */
.bankgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.bankcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:grid;gap:12px;align-content:start;box-shadow:var(--shadow)}
.bankcard h4{font-size:.98rem;padding-bottom:10px;border-bottom:1px solid var(--line)}
.bankcard ul{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.bankcard li{display:grid;gap:0}
.bankcard li b{font-weight:700;font-size:.93rem}
.picker{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.picker select{font:inherit;font-weight:700;border:1px solid var(--line);border-radius:12px;padding:9px 12px;background:var(--surface);color:var(--ink);max-width:100%;flex:1;min-width:0;box-shadow:var(--shadow)}
.typebadge{display:inline-block;font-size:.74rem;font-weight:700;border-radius:999px;padding:3px 11px;background:var(--red-soft);color:var(--red-ink)}
.dagroups{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:14px}
.dagroup{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:grid;gap:12px;align-content:start;box-shadow:var(--shadow)}
.dagroup.eval{grid-column:1/-1;background:var(--gold-soft);border-color:color-mix(in srgb,var(--gold) 30%,transparent)}
.dagroup h4{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline}
.dagroup ol{margin:0;padding-left:1.3em;display:grid;gap:12px}
.dagroup li{font-family:var(--read);line-height:1.6}
.dagroup li::marker{font-family:var(--display);font-weight:800;color:var(--red)}
.dagroup li .bn,.exs .bn{display:block;font-family:var(--bn)}
.words{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px}
.word{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:9px 12px;display:grid;line-height:1.35;box-shadow:var(--shadow)}
.word b{font-size:.94rem}
.word .bn{font-size:.85rem}
.exs{margin:0;padding-left:1.3em;display:grid;gap:12px}
.exs li{font-family:var(--read);line-height:1.6}
.exs li::marker{font-family:var(--display);font-weight:800;color:var(--red)}
details.more{border-top:1px solid var(--line);padding-top:12px}
details.more summary{cursor:pointer;font-weight:700;color:var(--red-ink)}
details.card{padding-top:18px}

/* model answers */
.essay{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:28px 30px;display:grid;gap:18px;box-shadow:var(--shadow-lg)}
@media (max-width:520px){.essay{padding:18px}}
.essay .eh{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center;border-bottom:1px solid var(--line);padding-bottom:14px}
.essay .eh b{font-family:var(--display);font-size:1.2rem}
.epara{display:grid;grid-template-columns:112px 1fr;gap:16px}
@media (max-width:600px){.epara{grid-template-columns:1fr;gap:2px}}
.epara .pl{font-size:.7rem;text-transform:uppercase;letter-spacing:.1em;font-weight:700;padding-top:6px}
.epara p{font-family:var(--read);font-size:1.07rem;line-height:1.85;max-width:68ch}
.essay.hl p b{color:var(--bank);background:var(--bank-bg);border-radius:4px;padding:0 3px;font-weight:600}
.essay:not(.hl) p b{font-weight:400}
.side{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.side .essay{padding:18px}
.side .epara{grid-template-columns:1fr;gap:2px}
.side .epara p{font-size:.95rem;line-height:1.7}
@media (max-width:900px){.side{grid-template-columns:1fr}}
.changes{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.changes .card{padding:18px;display:grid;gap:6px;align-content:start}
.changes .card:nth-child(1){border-top:4px solid var(--teal)}
.changes .card:nth-child(2){border-top:4px solid var(--p-b1)}
.changes .card:nth-child(3){border-top:4px solid var(--gold)}
.changes .card b{font-family:var(--display);font-size:1.05rem}
.list{display:grid;gap:8px}
.lcard{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:12px 16px;text-align:left;display:grid;gap:2px;box-shadow:var(--shadow)}
.lcard[aria-pressed="true"]{border-color:var(--red);box-shadow:0 0 0 1px var(--red),var(--shadow)}
.lcard .src{font-size:.68rem;color:var(--ink3);text-transform:uppercase;letter-spacing:.1em;font-weight:700}
.two{display:grid;grid-template-columns:minmax(220px,300px) 1fr;gap:18px;align-items:start}
@media (max-width:820px){.two{grid-template-columns:1fr}}
.nextbar{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:22px}
footer{border-top:1px solid var(--line);padding-block:24px;color:var(--ink3);font-size:.82rem}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ================= Classroom layer ================= */
[hidden]{display:none!important}
main{padding-bottom:130px}
.ico{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
/* dock */
.dock{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:80;display:flex;align-items:center;gap:4px;padding:6px;max-width:calc(100% - 32px);overflow-x:auto;scrollbar-width:none;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow-lg)}
.dock::-webkit-scrollbar{display:none}
.dock .sep{width:1px;align-self:stretch;margin:6px 4px;background:var(--line);flex:none}
.dbtn{position:relative;flex:none;display:inline-flex;align-items:center;gap:7px;border:0;background:none;border-radius:12px;height:40px;min-width:40px;padding:0 10px;justify-content:center;color:var(--ink2);font-size:.84rem;font-weight:700;white-space:nowrap;transition:background .15s,color .15s}
.dbtn:hover{background:var(--sunk);color:var(--ink)}
.dbtn[aria-pressed="true"]{background:var(--red-soft);color:var(--red-ink)}
.dbtn.lead{background:var(--red);color:#fff;padding:0 14px}
.dbtn.lead:hover{filter:brightness(1.07);background:var(--red);color:#fff}
.dbtn.lead[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.zoomv{font-variant-numeric:tabular-nums;font-size:.78rem;font-weight:700;color:var(--ink3);min-width:42px;text-align:center;flex:none}
.slnav{display:none;align-items:center;gap:2px}
body.present .slnav{display:flex}
.slcount{font-variant-numeric:tabular-nums;font-size:.8rem;font-weight:700;color:var(--ink2);min-width:58px;text-align:center;line-height:1.15}
.slcount small{display:block;font-weight:400;color:var(--ink3);font-size:.68rem;max-width:90px;overflow:hidden;text-overflow:ellipsis}
.dockmini{position:fixed;right:16px;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:80;display:none;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:9px 14px;font-weight:700;font-size:.84rem;box-shadow:var(--shadow-lg)}
body.dockmin .dock{display:none}
body.dockmin .dockmini{display:inline-flex}
@media (max-width:640px){.dbtn .lbl{display:none}.dbtn{padding:0 8px}.zoomv{display:none}}

/* popover panels */
.pop{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:85;width:min(440px,calc(100% - 32px));max-height:calc(100% - 120px);overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow-lg);padding:18px;display:grid;gap:14px;animation:popin .18s ease both}
@keyframes popin{from{transform:translate(-50%,8px)}to{transform:translate(-50%,0)}}
.pop .phead{display:flex;justify-content:space-between;align-items:center;gap:10px}
.pop .phead h4{font-size:1.05rem}
.xbtn{border:0;background:var(--sunk);border-radius:10px;width:32px;height:32px;display:grid;place-items:center;color:var(--ink2)}
.tbig{font-family:var(--display);font-weight:800;font-size:clamp(3.4rem,14vw,5rem);line-height:1;text-align:center;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.tbig.warn{color:var(--gold-ink)}.tbig.over{color:var(--red)}
.tprog{height:6px;border-radius:3px;background:var(--sunk);overflow:hidden}
.tprog i{display:block;height:100%;background:var(--red);transition:width .25s linear}
.presets{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.presets button{border:1px solid var(--line);background:var(--sunk);border-radius:10px;padding:6px 11px;font-weight:700;font-size:.84rem;font-variant-numeric:tabular-nums}
.presets button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.pactions{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.tchip{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));right:16px;z-index:78;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:8px 16px 8px 12px;display:inline-flex;align-items:center;gap:8px;font-family:var(--display);font-weight:800;font-size:1.25rem;font-variant-numeric:tabular-nums;box-shadow:var(--shadow-lg)}
.tchip.done{background:var(--red);color:#fff;border-color:var(--red);animation:blink 1s steps(2) infinite}
@keyframes blink{50%{filter:brightness(1.25)}}
.tabs{display:flex;gap:4px;background:var(--sunk);border-radius:12px;padding:4px}
.tabs button{flex:1;border:0;background:none;border-radius:9px;padding:7px;font-weight:700;font-size:.88rem;color:var(--ink2)}
.tabs button[aria-pressed="true"]{background:var(--surface);color:var(--red-ink);box-shadow:var(--shadow)}
.pop textarea,.pop input[type=text],.pop input[type=number]{font:inherit;width:100%;border:1px solid var(--line2);border-radius:12px;padding:10px 12px;background:var(--sunk);color:var(--ink)}
.pop textarea{min-height:110px;resize:vertical;font-size:.92rem}
.pickout{min-height:96px;display:grid;place-items:center;text-align:center;border-radius:16px;background:linear-gradient(135deg,var(--red-soft),var(--gold-soft));font-family:var(--display);font-weight:800;font-size:clamp(1.8rem,7vw,2.6rem);padding:12px;line-height:1.1}
.pickout.spin{color:var(--ink3)}
.pickout small{display:block;font-family:var(--ui);font-weight:400;font-size:.8rem;color:var(--ink3);margin-top:4px}
.chk{display:flex;align-items:center;gap:8px;font-size:.88rem}
.team{display:grid;grid-template-columns:1fr auto auto auto;gap:8px;align-items:center}
.team input{padding:8px 10px!important}
.team .sc{font-family:var(--display);font-weight:800;font-size:1.5rem;min-width:44px;text-align:center;font-variant-numeric:tabular-nums}
.rbtn{border:1px solid var(--line);background:var(--sunk);border-radius:10px;width:36px;height:36px;font-weight:800;font-size:1.1rem}
.rbtn.plus{background:var(--teal-soft);color:var(--teal);border-color:transparent}
.board{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));left:16px;z-index:78;display:flex;gap:6px;flex-wrap:wrap;max-width:calc(100% - 180px)}
.board .bt{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow-lg);padding:6px 8px 6px 12px;display:flex;align-items:center;gap:8px;font-weight:700;font-size:.86rem}
.board .bt b{font-family:var(--display);font-size:1.3rem;font-variant-numeric:tabular-nums;color:var(--red-ink)}
.board .bt button{border:0;background:var(--teal-soft);color:var(--teal);border-radius:8px;width:26px;height:26px;font-weight:800}

/* overlays */
#ink{position:fixed;inset:0;z-index:70;pointer-events:none;touch-action:none}
body.inking #ink{pointer-events:auto;cursor:crosshair}
.inkbar{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:86;display:flex;gap:6px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:6px 8px;box-shadow:var(--shadow-lg);max-width:calc(100% - 32px);overflow-x:auto}
.swatch{width:30px;height:30px;border-radius:50%;border:3px solid var(--surface);box-shadow:0 0 0 1px var(--line2);flex:none;padding:0}
.swatch[aria-pressed="true"]{box-shadow:0 0 0 2px var(--ink)}
.swatch.hl{border-radius:8px;width:34px}
#spot{position:fixed;inset:0;z-index:65;pointer-events:none;background:radial-gradient(circle at var(--sx,50%) var(--sy,50%),transparent 0,transparent var(--sr,170px),rgba(6,10,22,.74) calc(var(--sr,170px) + 40px))}
#laser{position:fixed;left:0;top:0;z-index:90;width:16px;height:16px;margin:-8px 0 0 -8px;border-radius:50%;pointer-events:none;background:radial-gradient(circle,#fff 0 15%,#ff2d45 35%,rgba(255,45,69,.35) 70%,transparent 72%);box-shadow:0 0 18px 6px rgba(255,45,69,.55)}
body.lasering,body.lasering *{cursor:none!important}
.modal{position:fixed;inset:0;z-index:95;background:rgba(8,12,24,.5);backdrop-filter:blur(3px);display:grid;place-items:start center;padding:12vh 16px 16px}
.mbox{width:min(600px,100%);background:var(--surface);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow-lg);overflow:hidden;display:grid;animation:popin2 .16s ease both}
@keyframes popin2{from{transform:translateY(8px)}to{transform:none}}
.cmdin{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.cmdin input{flex:1;border:0;background:none;font:inherit;font-size:1.1rem;color:var(--ink);outline:none;min-width:0}
.cmdlist{max-height:52vh;overflow:auto;padding:6px}
.citem{display:flex;gap:12px;align-items:center;width:100%;border:0;background:none;text-align:left;padding:10px 12px;border-radius:12px}
.citem .k{font-size:.66rem;text-transform:uppercase;letter-spacing:.1em;font-weight:700;color:var(--ink3);width:62px;flex:none}
.citem[aria-selected="true"]{background:var(--red-soft);color:var(--red-ink)}
.kbd{display:inline-block;min-width:24px;text-align:center;border:1px solid var(--line2);border-bottom-width:2px;border-radius:7px;padding:1px 7px;font-size:.8rem;font-weight:700;background:var(--sunk);font-family:var(--ui)}
.keys{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:8px 20px;padding:18px}
.keys div{display:flex;justify-content:space-between;gap:10px;align-items:center;font-size:.92rem}
.toast{position:fixed;left:50%;top:calc(18px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:99;background:var(--ink);color:var(--bg);border-radius:999px;padding:9px 18px;font-weight:700;font-size:.9rem;box-shadow:var(--shadow-lg)}

/* present mode */
body.present header.top,body.present footer{display:none}
body.present nav.steps{margin-top:0;top:8px}
body.present main{padding-top:30px;min-height:100vh}
body.present section.stage{animation:none}
@keyframes slidein{from{transform:translateX(14px)}to{transform:none}}
body.present .stagehead{max-width:900px;padding-top:6vh}
body.present .stagehead h2{font-size:clamp(2.6rem,6vw,4.4rem)}
.pbar{position:fixed;left:0;right:0;top:0;height:3px;z-index:79;background:transparent;pointer-events:none}
.pbar i{display:block;height:100%;background:var(--red);transition:width .3s}

/* reveal & read-along in essays */
.essay.reveal .epara:not(.shown) p{filter:blur(7px);cursor:pointer;user-select:none}
.essay.reveal .epara:not(.shown){position:relative}
.essay.reveal .epara:not(.shown)::after{content:"Tap to reveal";position:absolute;right:8px;top:6px;font-size:.7rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--red-ink);background:var(--red-soft);border-radius:999px;padding:2px 10px;pointer-events:none}
.epara p{transition:filter .35s}
.epara.reading{background:var(--gold-soft);border-radius:12px;box-shadow:0 0 0 8px var(--gold-soft)}

/* ================= Practice lab ================= */
.acts{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.act{border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:12px 14px;text-align:left;display:grid;gap:2px;box-shadow:var(--shadow);transition:transform .15s,border-color .15s}
.act:hover{transform:translateY(-1px)}
.act b{font-family:var(--display);font-size:1.02rem}
.act span{font-size:.8rem;color:var(--ink3)}
.act .bn{font-size:.8rem}
.act[aria-pressed="true"]{border-color:var(--red);box-shadow:0 0 0 1px var(--red),var(--shadow)}
.act[aria-pressed="true"] b{color:var(--red-ink)}
.bgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:20px;align-items:start}
@media (max-width:880px){.bgrid{grid-template-columns:1fr}}
.bgrid .sticky{position:sticky;top:110px}
.stepno{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--red);color:#fff;font-size:.78rem;font-weight:800;margin-right:8px;font-family:var(--display)}
.opt{display:grid;grid-template-columns:22px 1fr;gap:10px;align-items:start;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:11px 14px;font-family:var(--read);font-size:.98rem;line-height:1.55;transition:border-color .15s,background .15s}
.opt:hover{border-color:var(--line2)}
.opt .box{width:20px;height:20px;border-radius:6px;border:2px solid var(--line2);margin-top:3px;display:grid;place-items:center;color:#fff;font-size:.75rem;font-family:var(--ui);font-weight:800}
.opt.radio .box{border-radius:50%}
.opt[aria-pressed="true"]{border-color:var(--red);background:var(--red-soft)}

/* ================= Motion graphics (present mode) ================= */
#mgBg,#mgWipe{display:none}
body.present #mgBg{display:block;position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
body.present main{position:relative;z-index:1}
#mgBg .blob{position:absolute;border-radius:50%;filter:blur(70px)}
#mgBg .b1{width:48vw;height:48vw;left:-12vw;top:-14vw;background:color-mix(in srgb,var(--red) 16%,transparent);animation:mgDrift1 22s ease-in-out infinite alternate}
#mgBg .b2{width:40vw;height:40vw;right:-12vw;bottom:-14vw;background:color-mix(in srgb,var(--red) 12%,transparent);animation:mgDrift2 26s ease-in-out infinite alternate}
#mgBg .b3{width:26vw;height:26vw;left:40vw;top:46vh;background:color-mix(in srgb,var(--gold) 10%,transparent);animation:mgDrift3 30s ease-in-out infinite alternate}
#mgBg .grid{position:absolute;inset:-64px;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:64px 64px;opacity:.45;-webkit-mask-image:radial-gradient(ellipse at 50% 40%,#000 0,transparent 70%);mask-image:radial-gradient(ellipse at 50% 40%,#000 0,transparent 70%);animation:mgGrid 18s linear infinite}
#mgBg .num{position:absolute;right:-3vw;bottom:-9vw;font-family:var(--display);font-weight:800;font-size:40vw;line-height:1;letter-spacing:-.06em;color:transparent;-webkit-text-stroke:2px var(--red-line);opacity:.55}
#mgBg .num.go{animation:mgBgNum 1.6s cubic-bezier(.16,1,.3,1) backwards}
#mgBg .ring{position:absolute;left:-9vw;bottom:-9vw;width:30vw;height:30vw;border-radius:50%;border:1.5px dashed var(--red-line);animation:mgSpin 60s linear infinite}
#mgBg .ring::after{content:"";position:absolute;inset:14%;border-radius:50%;border:1px solid var(--red-line);opacity:.7}
#mgBg .pt{position:absolute;bottom:-40px;width:var(--s);height:var(--s);border:1.5px solid var(--red);opacity:0;border-radius:var(--r,3px);animation:mgRise var(--t) linear infinite;animation-delay:var(--dl)}
@keyframes mgDrift1{to{transform:translate(14vw,10vh) scale(1.15)}}
@keyframes mgDrift2{to{transform:translate(-12vw,-12vh) scale(1.2)}}
@keyframes mgDrift3{to{transform:translate(-18vw,-20vh) scale(.8)}}
@keyframes mgGrid{to{transform:translate(64px,64px)}}
@keyframes mgSpin{to{transform:rotate(360deg)}}
@keyframes mgRise{0%{transform:translateY(0) rotate(0);opacity:0}10%{opacity:.35}90%{opacity:.25}100%{transform:translateY(-110vh) rotate(320deg);opacity:0}}
@keyframes mgBgNum{from{transform:translateY(18%) rotate(-8deg) scale(.9);opacity:0}}

/* wipe between stages */
body.present #mgWipe{display:block;position:fixed;inset:0;z-index:92;pointer-events:none}
#mgWipe i{position:absolute;inset:0;transform:translateX(-101%)}
#mgWipe i:nth-child(1){background:#1F1416}
#mgWipe i:nth-child(2){background:var(--red);display:grid;place-items:center;align-content:center;gap:6px;color:#fff;font-style:normal;text-align:center}
#mgWipe i b{font-family:var(--display);font-weight:800;font-size:clamp(4rem,14vw,9rem);line-height:.9;letter-spacing:-.04em}
#mgWipe i span{font-family:var(--display);font-weight:800;font-size:clamp(1.2rem,3vw,2rem);letter-spacing:.02em}
#mgWipe.go i{animation:mgWipeF 1.15s cubic-bezier(.77,0,.18,1) both}
#mgWipe.go.back i{animation-name:mgWipeB}
#mgWipe.go i:nth-child(2){animation-delay:.07s}
#mgWipe.go i>*{animation:mgLbl 1.15s ease both}
@keyframes mgWipeF{0%{transform:translateX(101%)}42%,58%{transform:translateX(0)}100%{transform:translateX(-101%)}}
@keyframes mgWipeB{0%{transform:translateX(-101%)}42%,58%{transform:translateX(0)}100%{transform:translateX(101%)}}
@keyframes mgLbl{0%,25%{opacity:0;transform:scale(.85);filter:blur(8px)}45%,60%{opacity:1;transform:none;filter:none}80%,100%{opacity:0;transform:scale(1.08)}}

/* slide + staggered elements */
body.present .mg-in{animation:mgSlideF .9s cubic-bezier(.16,1,.3,1) backwards;animation-delay:var(--wd,0s)}
body.present .mg-in.mg-back{animation-name:mgSlideB}
@keyframes mgSlideF{from{transform:translateX(70px) scale(.97);filter:blur(10px);opacity:0}}
@keyframes mgSlideB{from{transform:translateX(-70px) scale(.97);filter:blur(10px);opacity:0}}
body.present .mg-in .mg-item{animation:mgItem .8s cubic-bezier(.16,1,.3,1) backwards;animation-delay:calc(var(--wd,0s) + .18s + var(--i)*55ms)}
@keyframes mgItem{from{transform:translateY(28px) scale(.97);filter:blur(6px);opacity:0}}
body.present .mg-in .mg-bar{transform-origin:left center;animation:mgBar 1.2s cubic-bezier(.16,1,.3,1) backwards;animation-delay:calc(var(--wd,0s) + .55s + var(--i,0)*55ms)}
@keyframes mgBar{from{transform:scaleX(0)}}

/* stage title card */
body.present .stagehead{min-height:66vh;align-content:center}
body.present .stagehead::before{font-size:clamp(6rem,15vw,11rem);-webkit-text-stroke:2px var(--red)}
body.present .mg-in.stagehead::before{animation:mgNum 1.3s cubic-bezier(.16,1,.3,1) backwards;animation-delay:var(--wd,0s)}
body.present .mg-in.stagehead .eyebrow{animation:mgTrack 1.1s cubic-bezier(.16,1,.3,1) backwards;animation-delay:calc(var(--wd,0s) + .15s)}
body.present .stagehead h2{font-size:clamp(2.6rem,6vw,4.6rem)!important}
body.present .mg-in .slot,body.present .mg-in .slotline,body.present .mg-in .typebadge{animation:mgPop .7s cubic-bezier(.34,1.56,.64,1) backwards;animation-delay:calc(var(--wd,0s) + .7s)}
@keyframes mgPop{from{transform:scale(.3);opacity:0}}
body.present .stagehead h2::after{content:"";display:block;width:150px;height:6px;border-radius:3px;margin-top:22px;background:linear-gradient(90deg,var(--red),color-mix(in srgb,var(--red) 40%,transparent))}
body.present .mg-in.stagehead h2::after{transform-origin:left;animation:mgBar 1.1s cubic-bezier(.16,1,.3,1) backwards;animation-delay:calc(var(--wd,0s) + .75s)}
.mgw{display:inline-block;overflow:hidden;vertical-align:bottom;padding-bottom:.1em;margin-bottom:-.1em}
.mgw>span{display:inline-block}
body.present .mg-in .mgw>span{animation:mgWord 1s cubic-bezier(.16,1,.3,1) backwards;animation-delay:calc(var(--wd,0s) + .3s + var(--w)*90ms)}
@keyframes mgNum{from{transform:translateX(-60px) scale(1.25);filter:blur(14px);opacity:0;letter-spacing:.25em}}
@keyframes mgTrack{from{letter-spacing:.7em;opacity:0}}
@keyframes mgWord{from{transform:translateY(115%) rotate(5deg)}}

/* chrome */

<script>const DATA={"topics":[{"n":1,"title":"Free university education for all","cat":"Education","groups":[{"name":"Reasons to Agree","bn":"একমত হওয়ার কারণ","items":[{"en":"Free tuition gives talented students from poor families the same chance to study as wealthy students.","bn":"বিনামূল্যে টিউশন দরিদ্র পরিবারের মেধাবী শিক্ষার্থীদের ধনী শিক্ষার্থীদের মতোই পড়ার সুযোগ দেয়।"},{"en":"Graduates earn higher salaries and pay more tax, so free education largely pays for itself over time.","bn":"স্নাতকরা বেশি বেতন পান ও বেশি কর দেন, তাই বিনামূল্যে শিক্ষা সময়ের সঙ্গে মূলত নিজের খরচ তুলে নেয়।"},{"en":"A highly educated workforce drives innovation and economic growth for the whole country.","bn":"উচ্চশিক্ষিত কর্মশক্তি পুরো দেশের উদ্ভাবন ও অর্থনৈতিক প্রবৃদ্ধি এগিয়ে নেয়।"},{"en":"Without fees, young people can start their careers free from years of student debt.","bn":"ফি না থাকলে তরুণরা বছরের পর বছর শিক্ষাঋণ ছাড়াই পেশাজীবন শুরু করতে পারে।"},{"en":"Free higher education helps families break the cycle of poverty within one generation.","bn":"বিনামূল্যে উচ্চশিক্ষা পরিবারগুলোকে এক প্রজন্মের মধ্যেই দারিদ্র্যের চক্র ভাঙতে সাহায্য করে।"}]},{"name":"Reasons to Disagree","bn":"দ্বিমত পোষণের কারণ","items":[{"en":"Free tuition for everyone would place a heavy financial burden on taxpayers, including those who never attend university.","bn":"সবার জন্য বিনামূল্যে টিউশন করদাতাদের ওপর ভারী আর্থিক বোঝা চাপাবে, যার মধ্যে যারা কখনো বিশ্ববিদ্যালয়ে যান না তারাও আছেন।"},{"en":"Public money might be better spent on primary schools, hospitals and basic services.","bn":"সরকারি অর্থ প্রাথমিক বিদ্যালয়, হাসপাতাল ও মৌলিক সেবায় ব্যয় করা বেশি কার্যকর হতে পারে।"},{"en":"If universities receive less money per student, teaching quality and facilities may decline.","bn":"বিশ্ববিদ্যালয় প্রতি শিক্ষার্থীর জন্য কম অর্থ পেলে পাঠদানের মান ও সুযোগ-সুবিধা কমে যেতে পারে।"},{"en":"Wealthy families who can easily afford fees would benefit from a subsidy they do not need.","bn":"যেসব ধনী পরিবার সহজেই ফি দিতে পারে, তারা এমন ভর্তুকির সুবিধা পাবে যা তাদের প্রয়োজন নেই।"},{"en":"Students who pay for their education may take their studies more seriously.","bn":"যারা নিজেদের শিক্ষার খরচ দেয় তারা পড়াশোনাকে বেশি গুরুত্ব দিতে পারে।"}]},{"name":"Evaluation: My Answer","bn":"মূল্যায়ন — আমার উত্তর","items":[{"en":"I completely agree that university education should be free for everyone, because it gives all talented students an equal chance and benefits society as a whole.","bn":"আমি পুরোপুরি একমত যে বিশ্ববিদ্যালয় শিক্ষা সবার জন্য বিনামূল্যে হওয়া উচিত, কারণ এটি সব মেধাবী শিক্ষার্থীকে সমান সুযোগ দেয় এবং পুরো সমাজকে উপকৃত করে।"},{"en":"I largely agree with this view, although I believe some contribution from wealthier families would be fair.","bn":"আমি এই মতের সঙ্গে মূলত একমত, যদিও আমার মনে হয় ধনী পরিবারগুলোর কিছু অর্থ দেওয়া ন্যায্য হবে।"}]}],"vocab":[["tuition fees","টিউশন ফি"],["equal opportunity","সমান সুযোগ"],["low-income families","নিম্ন আয়ের পরিবার"],["taxpayers","করদাতারা"],["public funding","সরকারি অর্থায়ন"],["student debt","শিক্ষার্থী ঋণ"],["skilled workforce","দক্ষ কর্মশক্তি"],["social mobility","সামাজিক গতিশীলতা"],["investment","বিনিয়োগ"],["burden","বোঝা"],["quality of education","শিক্ষার মান"],["talented","মেধাবী"],["means-tested","আয়ভিত্তিক যাচাইকৃত"],["economic growth","অর্থনৈতিক প্রবৃদ্ধি"]],"phrases":[["regardless of their background","তাদের পারিবারিক অবস্থান নির্বিশেষে"],["a barrier to higher education","উচ্চশিক্ষার পথে বাধা"],["an investment in the future","ভবিষ্যতের জন্য বিনিয়োগ"],["pay for itself in the long run","দীর্ঘমেয়াদে নিজের খরচ নিজেই তুলে নেওয়া"],["place a heavy burden on","... এর ওপর ভারী বোঝা চাপানো"],["be priced out of","দামের কারণে বাদ পড়া"],["reach their full potential","পূর্ণ সম্ভাবনায় পৌঁছানো"],["the country as a whole","পুরো দেশ"],["break the cycle of poverty","দারিদ্র্যের চক্র ভাঙা"],["at the expense of","... এর মূল্যে"]],"sents":[{"en":"High tuition fees are a major barrier to higher education for many young people.","bn":"উচ্চ টিউশন ফি অনেক তরুণের জন্য উচ্চশিক্ষার পথে বড় বাধা।"},{"en":"Talented students from low-income families are often priced out of university.","bn":"নিম্ন আয়ের পরিবারের মেধাবী শিক্ষার্থীরা প্রায়ই দামের কারণে বিশ্ববিদ্যালয় থেকে বাদ পড়ে।"},{"en":"Free education allows every student to reach their full potential, regardless of their background.","bn":"বিনামূল্যে শিক্ষা পারিবারিক অবস্থান নির্বিশেষে প্রত্যেক শিক্ষার্থীকে পূর্ণ সম্ভাবনায় পৌঁছাতে দেয়।"},{"en":"A university degree can help young people break the cycle of poverty.","bn":"একটি বিশ্ববিদ্যালয় ডিগ্রি তরুণদের দারিদ্র্যের চক্র ভাঙতে সাহায্য করতে পারে।"},{"en":"Graduates usually earn more and pay more tax, so free education can pay for itself in the long run.","bn":"স্নাতকরা সাধারণত বেশি আয় করে ও বেশি কর দেয়, তাই বিনামূল্যে শিক্ষা দীর্ঘমেয়াদে নিজের খরচ তুলে নিতে পারে।"},{"en":"A skilled workforce is essential for economic growth.","bn":"অর্থনৈতিক প্রবৃদ্ধির জন্য দক্ষ কর্মশক্তি অপরিহার্য।"},{"en":"However, free tuition for all would place a heavy burden on taxpayers.","bn":"তবে সবার জন্য বিনামূল্যে টিউশন করদাতাদের ওপর ভারী বোঝা চাপাবে।"},{"en":"If funding is limited, universities may cut costs at the expense of quality.","bn":"অর্থায়ন সীমিত হলে বিশ্ববিদ্যালয়গুলো মানের মূল্যে খরচ কমাতে পারে।"}],"xvocab":[["meritocracy","যোগ্যতাভিত্তিক ব্যবস্থা"],["public good","জনকল্যাণমূলক সম্পদ"],["fiscal pressure","রাজস্বের ওপর চাপ"],["human capital","মানবসম্পদ"],["overcrowded lecture halls","জনাকীর্ণ লেকচার হল"],["scholarship scheme","বৃত্তি প্রকল্প"],["level the playing field","সবার জন্য সমান সুযোগ তৈরি করা"],["disproportionately","অসমানুপাতিকভাবে"]],"xsents":[{"en":"Education should be treated as a public good rather than a private product.","bn":"শিক্ষাকে ব্যক্তিগত পণ্য নয়, জনকল্যাণমূলক সম্পদ হিসেবে দেখা উচিত।"},{"en":"Free tuition helps to level the playing field between rich and poor students.","bn":"বিনামূল্যে টিউশন ধনী ও দরিদ্র শিক্ষার্থীদের মধ্যে সমান সুযোগ তৈরি করতে সাহায্য করে।"},{"en":"Countries that invest in human capital tend to be more competitive globally.","bn":"যে দেশগুলো মানবসম্পদে বিনিয়োগ করে তারা বৈশ্বিকভাবে বেশি প্রতিযোগিতামূলক হয়।"},{"en":"Without careful planning, free education can lead to overcrowded lecture halls.","bn":"সতর্ক পরিকল্পনা ছাড়া বিনামূল্যে শিক্ষা জনাকীর্ণ লেকচার হলের কারণ হতে পারে।"}],"essays":[{"label":"BASIC ESSAY (BAND 5–6)","words":257,"paras":["Some people think that university should be free for all students. <b>I completely agree that university education should be free for everyone, because it gives all talented students an equal chance and benefits society as a whole.</b>","Firstly, high <b>tuition fees</b> are a big problem for many families. In my country, many clever students cannot go to university because their parents do not have enough money. If university is free, these students can study and get a good job. This can help them <b>break the cycle of poverty</b>. For example, a poor farmer's son can become a doctor or an engineer if he does not have to pay fees.","Secondly, free university is good for the country. When more people have a degree, the country has a <b>skilled workforce</b>. Educated people get better jobs, earn more money and pay more tax. So the government gets the money back later. Also, a country with many educated people can grow faster. For example, countries like Germany have free universities and strong economies.","Some people say that free university is too expensive for the government. This is true, but I think education is more important than many other things the government spends money on. In addition, the government can ask rich families to pay a little, while poor families pay nothing.","In conclusion, I believe university should be free for all students. It helps poor students to have a better future, and it helps the whole country to develop. The government should see it as <b>an investment in the future</b>."]},{"label":"ADVANCED ESSAY (BAND 7)","words":273,"paras":["It is often argued that higher education should be provided free of charge to all students, whatever their family's financial situation. <b>I completely agree that university education should be free for everyone, because it gives all talented students an equal chance and benefits society as a whole.</b>","The main reason I support free tuition is that it guarantees <b>equal opportunity</b>. At present, high <b>tuition fees</b> are a major barrier to higher education, and <b>talented</b> students from <b>low-income families</b> are often priced out of university entirely. As a result, a young person's future depends more on their parents' income than on their ability. If tuition were free, every student could <b>reach their full potential</b>, <b>regardless of their background</b>, and a degree could help many young people <b>break the cycle of poverty</b>.","Another important reason is that free education is <b>an investment in the future</b> of <b>the country as a whole</b>. A <b>skilled workforce</b> is essential for <b>economic growth</b>, especially in fields such as medicine, engineering and technology. Moreover, graduates usually earn higher salaries and therefore pay more tax, which means that free education can <b>pay for itself in the long run</b>. Countries such as Germany, where university is largely free, show that this model can be successful.","Admittedly, free tuition would <b>place a heavy burden on</b> <b>taxpayers</b>, and universities would need careful funding to maintain standards. One solution would be to fund universities partly through higher taxes on large companies. However, I believe this cost is justified by the long-term benefits.","In conclusion, I firmly believe that university should be free for all, since it creates a fairer society and builds a stronger economy."]},{"label":"BAND 9 ESSAY","words":340,"paras":["There is an ongoing debate about whether university tuition should be funded entirely by the state, so that no student pays fees regardless of their family's means. <b>I completely agree that university education should be free for everyone, because it gives all talented students an equal chance and benefits society as a whole.</b>","First and foremost, free higher education is the most effective way to guarantee genuine <b>equal opportunity</b>. Where high <b>tuition fees</b> exist, they act as <b>a barrier to higher education</b> that falls <b>disproportionately</b> on <b>low-income families</b>; academically gifted students are either priced out of university altogether or deterred by the prospect of years of <b>student debt</b>. Consequently, access to the professions becomes determined by wealth rather than merit, which undermines the very idea of a <b>meritocracy</b>. Abolishing fees would <b>level the playing field</b>, allowing every student to <b>reach their full potential</b> <b>regardless of their background</b> and giving thousands of young people a realistic route to <b>break the cycle of poverty</b>.","Equally important is the fact that education should be regarded as a <b>public good</b> rather than a private product. A highly <b>skilled workforce</b> drives innovation and <b>economic growth</b>, and nations that invest heavily in <b>human capital</b> tend to be more competitive in the global economy. Furthermore, the financial case is stronger than it first appears: graduates typically earn considerably more over their lifetimes and therefore contribute more in tax, so free tuition can, to a large extent, <b>pay for itself in the long run</b>. Germany and the Nordic countries, which offer largely free university education, are clear examples of how this model can coexist with prosperous economies.","Admittedly, removing fees would place considerable <b>fiscal pressure</b> on governments, and without adequate <b>public funding</b> there is a risk of <b>overcrowded lecture halls</b> and declining standards. Nevertheless, this is an argument for funding universities properly, not for charging students.","In conclusion, I am convinced that free university education is not an unaffordable luxury but a sound <b>investment</b> in the future, since it promotes fairness and strengthens the nation as a whole."]}],"type":"Opinion (Agree / Disagree)","q":"Some people believe that university education should be free for all students, regardless of their family's income. To what extent do you agree or disagree?"},{"n":2,"title":"Practical skills versus academic subjects","cat":"Education","groups":[{"name":"Reasons Supporting the First View","bn":"প্রথম মতের পক্ষে কারণ","items":[{"en":"Lessons in managing money would help young people avoid debt and make sensible financial decisions.","bn":"অর্থ ব্যবস্থাপনার পাঠ তরুণদের ঋণ এড়াতে ও বিচক্ষণ আর্থিক সিদ্ধান্ত নিতে সাহায্য করবে।"},{"en":"Practical skills prepare students to live independently after leaving home.","bn":"ব্যবহারিক দক্ষতা শিক্ষার্থীদের বাড়ি ছাড়ার পর স্বনির্ভরভাবে বাঁচতে প্রস্তুত করে।"},{"en":"Many busy working parents no longer have time to teach these skills themselves.","bn":"অনেক ব্যস্ত কর্মজীবী বাবা-মায়ের নিজে এসব দক্ষতা শেখানোর সময় আর নেই।"},{"en":"Hands-on lessons can motivate students who struggle with traditional academic learning.","bn":"হাতে-কলমে পাঠ ঐতিহ্যবাহী একাডেমিক শিক্ষায় সমস্যায় পড়া শিক্ষার্থীদের অনুপ্রাণিত করতে পারে।"},{"en":"A school system that ignores real-life skills fails to prepare young people for adult life.","bn":"যে শিক্ষাব্যবস্থা বাস্তব জীবনের দক্ষতা উপেক্ষা করে তা তরুণদের প্রাপ্তবয়স্ক জীবনের জন্য প্রস্তুত করতে ব্যর্থ হয়।"}]},{"name":"Reasons Supporting the Second View","bn":"দ্বিতীয় মতের পক্ষে কারণ","items":[{"en":"Academic subjects such as mathematics and science build the critical thinking needed for almost every career.","bn":"গণিত ও বিজ্ঞানের মতো একাডেমিক বিষয় প্রায় সব পেশার জন্য প্রয়োজনীয় বিশ্লেষণী চিন্তা গড়ে তোলে।"},{"en":"Strong academic results are essential for entering university and competitive professions.","bn":"বিশ্ববিদ্যালয় ও প্রতিযোগিতামূলক পেশায় প্রবেশের জন্য ভালো একাডেমিক ফলাফল অপরিহার্য।"},{"en":"The school timetable is already full, and adding practical lessons would reduce time for core subjects.","bn":"স্কুলের রুটিন ইতোমধ্যে ভরা, এবং ব্যবহারিক পাঠ যোগ করলে মূল বিষয়ের সময় কমে যাবে।"},{"en":"Skills such as cooking and basic repairs have traditionally been taught by parents at home.","bn":"রান্না ও সাধারণ মেরামতের মতো দক্ষতা ঐতিহ্যগতভাবে বাবা-মা বাড়িতেই শেখাতেন।"},{"en":"Teachers are trained in academic disciplines, not in household skills.","bn":"শিক্ষকরা একাডেমিক বিষয়ে প্রশিক্ষিত, গৃহস্থালি দক্ষতায় নয়।"}]},{"name":"Evaluation: My Opinion","bn":"মূল্যায়ন — আমার মতামত","items":[{"en":"In my opinion, a balanced curriculum that combines academic study with practical skills is the best approach.","bn":"আমার মতে, একাডেমিক পড়াশোনা ও ব্যবহারিক দক্ষতা মিলিয়ে একটি ভারসাম্যপূর্ণ পাঠ্যক্রমই সেরা পদ্ধতি।"},{"en":"While both views have merit, I side with those who want practical skills to be taught alongside academic subjects.","bn":"দুটি মতেরই যুক্তি আছে, তবে আমি তাদের পক্ষে যারা চান একাডেমিক বিষয়ের পাশাপাশি ব্যবহারিক দক্ষতাও শেখানো হোক।"}]}],"vocab":[["curriculum","পাঠ্যক্রম"],["academic subjects","একাডেমিক বিষয়"],["practical skills","ব্যবহারিক দক্ষতা"],["life skills","জীবনদক্ষতা"],["financial literacy","আর্থিক সাক্ষরতা"],["budgeting","বাজেট করা"],["independent","স্বনির্ভর"],["foundation","ভিত্তি"],["critical thinking","বিশ্লেষণী চিন্তা"],["timetable","রুটিন / সময়সূচি"],["exam-oriented","পরীক্ষাকেন্দ্রিক"],["well-rounded","সর্বাঙ্গীণভাবে বিকশিত"],["university entrance","বিশ্ববিদ্যালয়ে ভর্তি"],["responsibility","দায়িত্ব"]],"phrases":[["prepare students for real life","শিক্ষার্থীদের বাস্তব জীবনের জন্য প্রস্তুত করা"],["a solid foundation","শক্ত ভিত্তি"],["fall into debt","ঋণে জড়িয়ে পড়া"],["learn by doing","করে করে শেখা"],["take up valuable time","মূল্যবান সময় নেওয়া"],["the role of parents","বাবা-মায়ের ভূমিকা"],["stand on their own two feet","নিজের পায়ে দাঁড়ানো"],["strike a balance between","... এর মধ্যে ভারসাম্য রাখা"],["in the modern world","আধুনিক বিশ্বে"],["a well-rounded education","সর্বাঙ্গীণ শিক্ষা"]],"sents":[{"en":"Many young adults leave school without knowing how to manage a budget.","bn":"অনেক তরুণ বাজেট পরিচালনা না জেনেই স্কুল শেষ করে।"},{"en":"Lessons in financial literacy could stop young people from falling into debt.","bn":"আর্থিক সাক্ষরতার পাঠ তরুণদের ঋণে জড়িয়ে পড়া থেকে বিরত রাখতে পারে।"},{"en":"Practical lessons help students become independent and stand on their own two feet.","bn":"ব্যবহারিক পাঠ শিক্ষার্থীদের স্বনির্ভর হয়ে নিজের পায়ে দাঁড়াতে সাহায্য করে।"},{"en":"Academic subjects provide a solid foundation for university and professional careers.","bn":"একাডেমিক বিষয়গুলো বিশ্ববিদ্যালয় ও পেশাজীবনের জন্য শক্ত ভিত্তি দেয়।"},{"en":"Subjects such as mathematics and science develop critical thinking.","bn":"গণিত ও বিজ্ঞানের মতো বিষয় বিশ্লেষণী চিন্তা বিকশিত করে।"},{"en":"Some argue that practical skills would take up valuable time in an already crowded timetable.","bn":"কেউ কেউ বলেন ব্যবহারিক দক্ষতা ইতোমধ্যে ভরা রুটিনে মূল্যবান সময় নেবে।"},{"en":"Traditionally, cooking and home repairs were taught by parents.","bn":"ঐতিহ্যগতভাবে রান্না ও ঘরের মেরামত বাবা-মা শেখাতেন।"},{"en":"Schools should strike a balance between academic study and life skills.","bn":"স্কুলের উচিত একাডেমিক পড়াশোনা ও জীবনদক্ষতার মধ্যে ভারসাম্য রাখা."}],"xvocab":[["hands-on","হাতে-কলমে"],["rote learning","মুখস্থ শিক্ষা"],["employability","চাকরির উপযোগিতা"],["self-sufficient","স্বয়ংসম্পূর্ণ"],["compulsory module","বাধ্যতামূলক পাঠ"],["dual-income households","দ্বৈত আয়ের পরিবার"],["transferable skills","অন্য কাজেও ব্যবহারযোগ্য দক্ষতা"],["overloaded curriculum","অতিরিক্ত ভারী পাঠ্যক্রম"]],"xsents":[{"en":"In dual-income households, parents often have little time to teach these skills.","bn":"দ্বৈত আয়ের পরিবারে বাবা-মায়ের এসব দক্ষতা শেখানোর সময় প্রায়ই কম থাকে।"},{"en":"Hands-on lessons can also motivate students who struggle with rote learning.","bn":"হাতে-কলমে পাঠ মুখস্থ শিক্ষায় সমস্যায় পড়া শিক্ষার্থীদেরও অনুপ্রাণিত করতে পারে।"},{"en":"A short compulsory module on personal finance would not overload the curriculum.","bn":"ব্যক্তিগত অর্থব্যবস্থাপনার একটি ছোট বাধ্যতামূলক পাঠ পাঠ্যক্রমকে অতিরিক্ত ভারী করবে না।"},{"en":"Such skills are highly transferable and improve employability.","bn":"এমন দক্ষতা অন্য কাজেও ব্যবহারযোগ্য এবং চাকরির উপযোগিতা বাড়ায়।"}],"essays":[{"label":"BASIC ESSAY (BAND 5–6)","words":261,"paras":["Some people think schools should teach <b>practical skills</b> like cooking and managing money, but other people think schools should only teach <b>academic subjects</b>. <b>In my opinion, a balanced curriculum that combines academic study with practical skills is the best approach.</b>","On the one hand, <b>academic subjects</b> are very important. Subjects like maths, science and English give students <b>a solid foundation</b> for university and a good job. They also help students to think carefully and solve problems. Many parents want their children to get good exam results, so they think schools should focus on these subjects.","On the other hand, <b>practical skills</b> are also very useful. Many young people finish school but they do not know how to cook a meal or make a budget. Some of them spend too much money and <b>fall into debt</b>. If schools teach these skills, students can become <b>independent</b> and look after themselves. Also, some students are not good at <b>academic subjects</b>, but they are good at practical things, so these lessons can make them feel more confident. For example, a student who learns how to fix a bicycle or cook rice can save money in the future. Parents are also often too busy to teach these things.","I think schools can do both. For example, they can have one or two practical lessons every week, and the rest of the time can be for <b>academic subjects</b>.","In conclusion, <b>academic subjects</b> and <b>practical skills</b> are both important. I believe schools should teach both, because this will <b>prepare students for real life</b> and for their future careers."]},{"label":"ADVANCED ESSAY (BAND 7)","words":280,"paras":["There is disagreement about whether schools should spend time teaching <b>practical skills</b> such as cooking and money management or concentrate on traditional <b>academic subjects</b>. <b>While both views have merit, I side with those who want practical skills to be taught alongside academic subjects.</b>","Those who favour an academic focus argue that subjects such as mathematics, science and languages provide <b>a solid foundation</b> for <b>university entrance</b> and professional careers. These subjects also develop <b>critical thinking</b>, which is valuable in almost every job. In addition, supporters of this view point out that the school <b>timetable</b> is already crowded, and that <b>practical skills</b> would <b>take up valuable time</b> that could be spent preparing for important exams. Traditionally, they add, skills like cooking and home repairs were taught by parents rather than teachers.","However, I find the case for <b>practical skills</b> more convincing. Many young adults leave school without knowing how to manage a budget, pay bills or cook a healthy meal, and some of them quickly <b>fall into debt</b>. Lessons in <b>financial literacy</b> could prevent this; for example, a simple lesson on saving money can protect students from expensive loans, while basic cooking and repair skills help students become <b>independent</b> and <b>stand on their own two feet</b>. Furthermore, in many modern families both parents work long hours, so they may not have time to teach these skills at home. Practical lessons also allow students who struggle in academic classes to <b>learn by doing</b> and build their confidence.","In conclusion, although <b>academic subjects</b> must remain the core of education, I believe schools should <b>strike a balance between</b> academic study and <b>life skills</b> in order to <b>prepare students for real life</b> <b>in the modern world</b>."]},{"label":"BAND 9 ESSAY","words":316,"paras":["Opinions are divided over whether schools should devote time to practical competencies, such as cooking, <b>budgeting</b> and basic repairs, or whether they should concentrate on traditional academic disciplines. <b>While both views have merit, I side with those who want practical skills to be taught alongside academic subjects.</b>","Advocates of an academic focus make a reasonable case. Mathematics, the sciences and languages provide <b>a solid foundation</b> for <b>university entrance</b> and for the professions, and they cultivate <b>critical thinking</b> and analytical reasoning that are transferable to almost any career. Proponents also warn that the <b>curriculum</b> is already overloaded, particularly in <b>exam-oriented</b> systems such as those in much of South Asia, and that introducing practical lessons would <b>take up valuable time</b> needed for high-stakes examinations. They further contend that these domestic skills have always been passed on by parents and are therefore not the <b>responsibility</b> of schools.","Nevertheless, I find the arguments for practical education more persuasive. It is striking how many young adults leave school with a detailed knowledge of algebra yet no idea how to draw up a budget, understand a loan or prepare a nutritious meal; unsurprisingly, a significant number <b>fall into debt</b> within a few years of leaving home. A <b>compulsory module</b> in <b>financial literacy</b>, for example, would equip students to avoid such mistakes and to <b>stand on their own two feet</b>. Moreover, the assumption that parents will fill this gap is increasingly unrealistic: in <b>dual-income households</b>, parents often have little time to teach these skills. <b>Hands-on</b> lessons can also re-engage students who are disheartened by <b>rote learning</b>, allowing them to <b>learn by doing</b> and to discover abilities that written examinations rarely reveal.","In conclusion, <b>academic subjects</b> should undoubtedly remain the core of schooling, but <b>a well-rounded education</b> must also prepare young people for the practical demands of adult life. <b>Striking a balance between</b> the two is, in my view, the most sensible way forward."]}],"type":"Discuss both views and give your opinion","q":"Some people think that schools should teach practical skills such as cooking, managing money and repairing things, while others believe schools should focus on academic subjects. Discuss both views and give your own opinion."},{"n":3,"title":"Online learning versus classroom learning","cat":"Education","groups":[{"name":"Advantages","bn":"সুবিধা","items":[{"en":"Online learning allows students to study at their own pace and at any time of day.","bn":"অনলাইন শিক্ষা শিক্ষার্থীদের নিজের গতিতে ও দিনের যেকোনো সময় পড়তে দেয়।"},{"en":"Working adults and parents can fit courses around their jobs and family responsibilities.","bn":"কর্মজীবী প্রাপ্তবয়স্ক ও বাবা-মায়েরা চাকরি ও পারিবারিক দায়িত্বের সঙ্গে কোর্স মানিয়ে নিতে পারেন।"},{"en":"Students in remote areas can access high-quality courses from leading universities.","bn":"প্রত্যন্ত অঞ্চলের শিক্ষার্থীরা শীর্ষ বিশ্ববিদ্যালয়ের মানসম্পন্ন কোর্সে প্রবেশাধিকার পায়।"},{"en":"Studying from home saves money on transport, accommodation and printed materials.","bn":"বাড়িতে পড়াশোনা যাতায়াত, থাকা ও মুদ্রিত উপকরণের খরচ বাঁচায়।"},{"en":"Recorded lectures can be replayed as many times as students need.","bn":"রেকর্ড করা লেকচার শিক্ষার্থীরা যতবার প্রয়োজন ততবার দেখতে পারে।"}]},{"name":"Disadvantages","bn":"অসুবিধা","items":[{"en":"Online study requires strong self-discipline, and many students become distracted at home.","bn":"অনলাইন পড়াশোনায় দৃঢ় আত্মশৃঙ্খলা প্রয়োজন, এবং অনেক শিক্ষার্থী বাড়িতে বিক্ষিপ্ত হয়ে পড়ে।"},{"en":"The lack of face-to-face contact can leave students feeling lonely and isolated.","bn":"মুখোমুখি যোগাযোগের অভাবে শিক্ষার্থীরা একাকী ও বিচ্ছিন্ন বোধ করতে পারে।"},{"en":"Social skills such as teamwork and public speaking are harder to develop through a screen.","bn":"দলগত কাজ ও জনসমক্ষে কথা বলার মতো সামাজিক দক্ষতা পর্দার মাধ্যমে গড়ে তোলা কঠিন।"},{"en":"Students without reliable internet or devices can easily fall behind.","bn":"নির্ভরযোগ্য ইন্টারনেট বা যন্ত্র নেই এমন শিক্ষার্থীরা সহজেই পিছিয়ে পড়তে পারে।"},{"en":"Practical subjects that require laboratories or workshops cannot be taught properly online.","bn":"ল্যাবরেটরি বা কর্মশালা প্রয়োজন এমন ব্যবহারিক বিষয় অনলাইনে ঠিকভাবে শেখানো যায় না।"}]},{"name":"Evaluation: Which Side Is Stronger?","bn":"মূল্যায়ন — কোন দিক বেশি গুরুত্বপূর্ণ?","items":[{"en":"In my view, the advantages of online learning are significant, but the disadvantages, especially the lack of social interaction, outweigh them.","bn":"আমার মতে অনলাইন শিক্ষার সুবিধা উল্লেখযোগ্য, কিন্তু অসুবিধা, বিশেষ করে সামাজিক মেলামেশার অভাব, এর চেয়ে বেশি।"},{"en":"I believe the advantages of online study, particularly its flexibility and accessibility, clearly outweigh the disadvantages.","bn":"আমি মনে করি অনলাইন পড়াশোনার সুবিধাগুলো, বিশেষ করে এর নমনীয়তা ও সহজলভ্যতা, অসুবিধাগুলোর চেয়ে স্পষ্টভাবে বেশি।"}]}],"vocab":[["online learning","অনলাইন শিক্ষা"],["flexibility","নমনীয়তা"],["accessibility","সহজলভ্যতা"],["self-discipline","আত্মশৃঙ্খলা"],["distraction","মনোযোগ বিক্ষেপ"],["face-to-face","মুখোমুখি"],["interaction","মেলামেশা / মিথস্ক্রিয়া"],["motivation","অনুপ্রেরণা"],["remote areas","প্রত্যন্ত অঞ্চল"],["internet connection","ইন্টারনেট সংযোগ"],["affordable","সাশ্রয়ী"],["isolation","বিচ্ছিন্নতা"],["feedback","মতামত / প্রতিক্রিয়া"],["digital divide","ডিজিটাল বিভাজন"]],"phrases":[["study at their own pace","নিজের গতিতে পড়া"],["from the comfort of their own home","নিজের বাড়িতে আরামে বসে"],["save time and money","সময় ও অর্থ বাঁচানো"],["fit studies around","... এর সঙ্গে পড়াশোনা মানিয়ে নেওয়া"],["lack of social interaction","সামাজিক মেলামেশার অভাব"],["lose focus","মনোযোগ হারানো"],["fall behind","পিছিয়ে পড়া"],["a world-class course","বিশ্বমানের কোর্স"],["hands-on experience","হাতে-কলমে অভিজ্ঞতা"],["a sense of community","সম্প্রদায়ের অনুভূতি"]],"sents":[{"en":"Online learning allows students to study at their own pace.","bn":"অনলাইন শিক্ষা শিক্ষার্থীদের নিজের গতিতে পড়তে দেয়।"},{"en":"Working adults can fit their studies around their jobs and families.","bn":"কর্মজীবী প্রাপ্তবয়স্করা চাকরি ও পরিবারের সঙ্গে পড়াশোনা মানিয়ে নিতে পারেন।"},{"en":"Students in remote areas can now take a world-class course from the comfort of their own home.","bn":"প্রত্যন্ত অঞ্চলের শিক্ষার্থীরা এখন নিজের বাড়িতে বসে বিশ্বমানের কোর্স করতে পারে।"},{"en":"Studying online also saves time and money on travel and accommodation.","bn":"অনলাইনে পড়াশোনা যাতায়াত ও থাকার খরচে সময় ও অর্থ বাঁচায়।"},{"en":"However, online study requires a high level of self-discipline.","bn":"তবে অনলাইন পড়াশোনার জন্য উচ্চমাত্রার আত্মশৃঙ্খলা প্রয়োজন।"},{"en":"At home, it is easy to lose focus because of distractions such as social media.","bn":"বাড়িতে সামাজিক মাধ্যমের মতো বিক্ষেপের কারণে মনোযোগ হারানো সহজ।"},{"en":"The lack of social interaction can leave students feeling isolated.","bn":"সামাজিক মেলামেশার অভাবে শিক্ষার্থীরা বিচ্ছিন্ন বোধ করতে পারে।"},{"en":"Students without a reliable internet connection can easily fall behind.","bn":"নির্ভরযোগ্য ইন্টারনেট সংযোগ নেই এমন শিক্ষার্থীরা সহজেই পিছিয়ে পড়তে পারে।"}],"xvocab":[["asynchronous","অসমকালীন"],["lifelong learning","আজীবন শিক্ষা"],["soft skills","ব্যক্তিগত-সামাজিক দক্ষতা"],["procrastination","দীর্ঘসূত্রতা"],["blended learning","মিশ্র শিক্ষা (অনলাইন ও সরাসরি)"],["democratise education","শিক্ষাকে সবার জন্য উন্মুক্ত করা"],["laboratory work","ল্যাবরেটরির কাজ"],["screen fatigue","পর্দাজনিত ক্লান্তি"]],"xsents":[{"en":"Online platforms have helped to democratise education.","bn":"অনলাইন প্ল্যাটফর্ম শিক্ষাকে সবার জন্য উন্মুক্ত করতে সাহায্য করেছে।"},{"en":"Procrastination is a common problem for online learners.","bn":"দীর্ঘসূত্রতা অনলাইন শিক্ষার্থীদের একটি সাধারণ সমস্যা।"},{"en":"Soft skills such as teamwork are hard to develop through a screen.","bn":"দলগত কাজের মতো দক্ষতা পর্দার মাধ্যমে গড়ে তোলা কঠিন।"},{"en":"Many universities now offer blended learning, combining the best of both.","bn":"অনেক বিশ্ববিদ্যালয় এখন উভয়ের সেরাটা মিলিয়ে মিশ্র শিক্ষা দিচ্ছে।"}],"essays":[{"label":"BASIC ESSAY (BAND 5–6)","words":258,"paras":["Nowadays, many students study online instead of going to classes. <b>I believe the advantages of online study, particularly its flexibility and accessibility, clearly outweigh the disadvantages.</b>","There are some disadvantages of <b>online learning</b>. Firstly, students need a lot of <b>self-discipline</b>. At home, it is easy to <b>lose focus</b> because of social media or games. Secondly, students do not meet their classmates and teachers <b>face-to-face</b>, so they can feel lonely. Also, some students do not have a good <b>internet connection</b>, so they cannot join the classes properly. Moreover, it is difficult to do practical subjects like science experiments online.","However, the advantages are more important. The biggest advantage is <b>flexibility</b>. Students can <b>study at their own pace</b> and at any time. For example, people who have a job can study in the evening after work. For instance, my cousin works in a bank and is studying for a master's degree online at night. They can also watch recorded lessons again if they do not understand. Another advantage is that <b>online learning</b> is cheaper. Students do not need to pay for travel or live in a big city. Also, students in villages or <b>remote areas</b> can take good courses from famous universities. This was not possible in the past.","In conclusion, <b>online learning</b> has some problems, like <b>distraction</b> and loneliness. But I think the advantages, such as <b>flexibility</b>, lower cost and access for everyone, are greater than the disadvantages. However, students must learn to ma
